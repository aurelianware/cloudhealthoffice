# Kafka for the hosted HIPAA environment (docs/deploy/GCP-HOSTED-HIPAA.md),
# managed by the Strimzi operator that scripts/deploy-gke.sh installs.
#
# Differs from the demo cluster (deploy/gcp/kafka/kafka-cluster.yaml):
#   - one listener, TLS only, and every client signs in with SCRAM-SHA-512
#     (the KafkaUser below; deploy-gke.sh copies its password into
#     kafka-secret). There is no plaintext listener.
#   - brokers spread across the region's zones (rack awareness)
#   - data on the CMEK-encrypted StorageClass, kept when the cluster is deleted
#   - a five-year cluster CA, so the CA bundle the services trust changes
#     rarely. Strimzi renews it 60 days before expiry; redeploy within that
#     window so the bundle carries the new CA.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: cloudhealthoffice-kafka
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 50Gi
        class: cho-pd-cmek
        deleteClaim: false
        kraftMetadata: shared
  resources:
    requests:
      cpu: 500m
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 4Gi
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: cloudhealthoffice-kafka
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  clusterCa:
    validityDays: 1825
    renewalDays: 60
  clientsCa:
    validityDays: 1825
    renewalDays: 60
  kafka:
    version: 3.9.0
    metadataVersion: 3.9-IV0
    rack:
      topologyKey: topology.kubernetes.io/zone
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: scram-sha-512
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      # Services that publish to a topic not listed in topics.yaml still work.
      auto.create.topics.enable: true
      ssl.enabled.protocols: TLSv1.3,TLSv1.2
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
# The one identity every CHO service uses. The User Operator keeps its
# password in Secret cho-services (namespace kafka).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: cho-services
  namespace: kafka
  labels:
    strimzi.io/cluster: cloudhealthoffice-kafka
spec:
  authentication:
    type: scram-sha-512
