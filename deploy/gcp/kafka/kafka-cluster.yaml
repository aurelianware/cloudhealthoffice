# Kafka for the GKE demo, managed by the Strimzi operator (pinned to 0.45.x by
# scripts/deploy-gke.sh). Three KRaft brokers, so the existing topic manifests
# in infrastructure/kafka/topics.yaml (replicas: 3, min.insync.replicas: 2)
# apply unchanged. Plaintext listener inside the cluster only; no external
# listener. Demo-grade: a production setup would add TLS and authentication,
# or use Google Cloud Managed Service for Apache Kafka.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: cloudhealthoffice-kafka
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        # Standard persistent disk (created by scripts/deploy-gke.sh); keeps
        # Kafka off the SSD quota.
        class: cho-pd-standard
        deleteClaim: true
        kraftMetadata: shared
  resources:
    requests:
      cpu: 200m
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 2Gi
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: cloudhealthoffice-kafka
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.9.0
    metadataVersion: 3.9-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      # Services that publish to a topic not listed in topics.yaml still work.
      auto.create.topics.enable: true
  entityOperator:
    topicOperator: {}
