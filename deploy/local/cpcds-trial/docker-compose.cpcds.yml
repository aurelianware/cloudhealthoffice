# CPCDS trial on a laptop: the services a plan's extracts load into, wired to
# each other, with the daily file drop on and reading ./drops.
#
#   docker compose -f docker-compose.yml -f deploy/local/cpcds-trial/docker-compose.cpcds.yml \
#     --profile core --profile finance --profile fhir up -d
#
# Then follow docs/integration/CPCDS-TRIAL-KIT.md ("On a laptop"). Development
# settings only: services accept scripts/dev-token.sh tokens, documents are
# kept in memory, and nothing here is fit for real member data.

services:
  claims-service:
    environment:
      - Services__EnrollmentImportService=http://enrollment-import-service:8080
      - Services__ProviderService=http://provider-service:8080
      - Services__AuthorizationService=http://authorization-service:8080
      - Services__DocumentService=http://document-service:8080
      - Services__MemberService=http://member-service:8080
      - Services__CoverageService=http://coverage-service:8080
      - Services__BenefitPlanService=http://benefit-plan-service:8080
      # The drop: {Root}/{tenant}/inbound, checked every 30 seconds, a file
      # loaded once it has been still for 10 (a laptop copy, not an SFTP upload).
      - CpcdsDrop__Enabled=true
      - CpcdsDrop__Root=/drops
      - CpcdsDrop__Interval=00:00:30
      - CpcdsDrop__QuietPeriod=00:00:10
      - CpcdsDrop__Archive__Enabled=true
      # Shadow adjudication: on, so each claim file can be re-adjudicated in
      # CHO and compared with the core's answer (portal: Shadow adjudication).
      - Adjudication__Shadow__Enabled=true
    volumes:
      - ${CHO_DROP_DIR:-./drops}:/drops

  enrollment-import-service:
    environment:
      - Services__MemberService=http://member-service:8080
      - Services__SponsorService=http://sponsor-service:8080
      - Services__BenefitPlanService=http://benefit-plan-service:8080
      - Services__CoverageService=http://coverage-service:8080

  # Benefit calculation and the provider check reach these by their own setting
  # names. Without them every shadow claim is held for provider review.
  # AdminWriteEnabled lets scripts/cpcds/sample-setup.sh (and a plan's own setup)
  # apply the standard service categories (lab, imaging, office visit, ...) to the
  # tenant; without them a lab test billed from an office takes the office copay.
  benefit-plan-service:
    environment:
      - Services__ProviderServiceUrl=http://provider-service:8080
      - Services__ProviderVerificationServiceUrl=http://provider-verification-service:8080
      - ServiceCategoryMapping__AdminWriteEnabled=true

  # Screens providers against the OIG exclusion list (LEIE), downloaded from
  # oig.hhs.gov on start and refreshed daily. CHO holds a claim from a provider
  # it cannot screen; shadow adjudication reports those claims as "held for
  # provider screening" and still compares the rest of CHO's answer.
  provider-verification-service:
    build:
      context: .
      dockerfile: src/services/provider-verification-service/Dockerfile
    ports:
      - "5040:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MongoDb__ConnectionString=mongodb://mongo:27017
      - MongoDb__DatabaseName=ProviderVerificationDB
      - ProviderVerification__ExclusionScreening__Leie__Enabled=true
    depends_on:
      mongo:
        condition: service_healthy
    profiles: [core]
