apiVersion: apps/v1
kind: Deployment
metadata:
  name: appeals-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appeals-service
  template:
    metadata:
      labels:
        app: appeals-service
        cho-data-class: synthetic
    spec:
      automountServiceAccountToken: false
      containers:
      - name: appeals-service
        image: cho-contact-local/appeals-service:local
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: contact-workflow-local
        env:
        - name: ASPNETCORE_URLS
          value: http://+:8080
        - name: SecretProvider__Provider
          value: HashiCorpVault
        - name: SecretProvider__HashiCorpVaultAddress
          value: http://local-vault:8200
        - name: SecretProvider__HashiCorpVaultToken
          value: cho-synthetic-local
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 1Gi
        startupProbe:
          tcpSocket:
            port: http
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: appeals-service
spec:
  selector:
    app: appeals-service
  ports:
  - name: http
    port: 8080
    targetPort: http
