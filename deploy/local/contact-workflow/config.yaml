apiVersion: v1
kind: ConfigMap
metadata:
  name: contact-workflow-local
data:
  ASPNETCORE_ENVIRONMENT: Development
  CHO_ALLOW_DEV_ON_DEPLOYED_HOST: 'true'
  SecretProvider__Provider: None
  MongoDb__ConnectionString: mongodb://mongo:27017
  MongoDb__DatabaseName: ContactWorkflowLocal
  Redis__ConnectionString: redis:6379
  Authentication__Mode: LocalDemo
  Services__ContactServiceUrl: http://contact-service:8080
  Services__AppealsServiceUrl: http://appeals-service:8080
  Services__AuthorizationServiceUrl: http://authorization-service:8080
  Services__WorkManagementServiceUrl: http://work-management-service:8080
  Services__ContactService: http://contact-service:8080/api
  Services__AppealsService: http://appeals-service:8080/api
  Services__AuthorizationService: http://authorization-service:8080/api
  Services__WorkManagementService: http://work-management-service:8080/api/v1
  Services__DocumentService: http://document-service:8080
  Services__ClaimsServiceUrl: ''
  WorkManagement__Reconcile__Enabled: 'false'
  Kafka__BootstrapServers: ''
  DocumentStore__Provider: InMemory
  Documents__AllowUnscannedContent: 'false'
  Documents__Scanner__Provider: None
  Observability__OtlpEndpoint: ''
  Observability__EnableConsole: 'false'
  ChoAuth__ServiceToken__Source: LocalKey
