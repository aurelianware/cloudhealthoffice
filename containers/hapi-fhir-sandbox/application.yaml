spring:
  datasource:
    url: jdbc:h2:file:/data/hapi-fhir;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: ""
    driverClassName: org.h2.Driver
  jpa:
    properties:
      hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirH2Dialect
    hibernate:
      ddl-auto: update

hapi:
  fhir:
    fhir_version: R4
    server_address: https://sandbox.cloudhealthoffice.com/fhir/r4
    default_encoding: JSON
    default_pretty_print: true
    allow_multiple_delete: false
    allow_external_references: true
    expunge_enabled: false
    # Read-only sandbox — disable write operations for untrusted callers
    # Note: write is still enabled internally so load-synthea.sh can populate data
    narrative_enabled: false
    cors:
      allow_Credentials: false
      allowed_origin:
        - "*"
    validation:
      requests_enabled: false
      responses_enabled: false
