<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00ffff" opacity="0.6"/>
    </marker>
    <marker id="arrowheadAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ffaa00" opacity="0.6"/>
    </marker>
    <marker id="arrowheadGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00ff88" opacity="0.6"/>
    </marker>
    <marker id="arrowheadGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#808080" opacity="0.6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="#000000"/>

  <!-- Title -->
  <text x="600" y="30" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700"
        fill="#ffffff" text-anchor="middle">Operating Mode Architecture</text>
  <text x="600" y="50" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#b0b0b0"
        text-anchor="middle">Per-engine, per-tenant Augment/Replace toggle</text>

  <!-- ========== LEFT HALF: Augment Mode ========== -->
  <rect x="40" y="65" width="510" height="440" rx="10" fill="rgba(255,170,0,0.02)"
        stroke="rgba(255,170,0,0.3)" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="295" y="90" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700"
        fill="#ffaa00" text-anchor="middle">Augment Mode</text>

  <!-- Incoming Claim (left) -->
  <g transform="translate(295, 125)">
    <rect x="-70" y="-16" width="140" height="32" rx="6" fill="rgba(8,8,8,0.9)" stroke="rgba(0,255,255,0.4)" stroke-width="1"/>
    <text x="0" y="4" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600"
          fill="#ffffff" text-anchor="middle">Incoming Claim</text>
  </g>

  <!-- Fork arrows -->
  <line x1="240" y1="143" x2="170" y2="170" stroke="#00ffff" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="143" x2="420" y2="170" stroke="#808080" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowheadGray)"/>

  <!-- Path A: Cloud Health Office (left side) -->
  <text x="170" y="183" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600"
        fill="#00ffff" text-anchor="middle">CLOUD HEALTH OFFICE</text>
  <g transform="translate(170, 210)">
    <rect x="-60" y="-14" width="120" height="28" rx="5" fill="rgba(0,255,255,0.06)" stroke="rgba(0,255,255,0.2)" stroke-width="1"/>
    <text x="0" y="3" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#00ffff" text-anchor="middle">Claims Scrub</text>
  </g>
  <line x1="170" y1="226" x2="170" y2="238" stroke="#00ffff" stroke-width="1" opacity="0.3" marker-end="url(#arrowhead)"/>
  <g transform="translate(170, 255)">
    <rect x="-60" y="-14" width="120" height="28" rx="5" fill="rgba(0,255,255,0.06)" stroke="rgba(0,255,255,0.2)" stroke-width="1"/>
    <text x="0" y="3" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#00ffff" text-anchor="middle">NCCI Edits</text>
  </g>
  <line x1="170" y1="271" x2="170" y2="283" stroke="#00ffff" stroke-width="1" opacity="0.3" marker-end="url(#arrowhead)"/>
  <g transform="translate(170, 300)">
    <rect x="-60" y="-14" width="120" height="28" rx="5" fill="rgba(0,255,255,0.06)" stroke="rgba(0,255,255,0.2)" stroke-width="1"/>
    <text x="0" y="3" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#00ffff" text-anchor="middle">Price</text>
  </g>
  <line x1="170" y1="316" x2="170" y2="328" stroke="#00ffff" stroke-width="1" opacity="0.3" marker-end="url(#arrowhead)"/>
  <g transform="translate(170, 345)">
    <rect x="-60" y="-14" width="120" height="28" rx="5" fill="rgba(0,255,255,0.06)" stroke="rgba(0,255,255,0.2)" stroke-width="1"/>
    <text x="0" y="3" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#00ffff" text-anchor="middle">Benefits</text>
  </g>

  <!-- Path B: Legacy CAPS (right side) -->
  <text x="420" y="183" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600"
        fill="#808080" text-anchor="middle">LEGACY CAPS</text>
  <g transform="translate(420, 278)">
    <rect x="-65" y="-80" width="130" height="160" rx="5" fill="rgba(128,128,128,0.05)" stroke="rgba(128,128,128,0.2)" stroke-width="1"/>
    <text x="0" y="-10" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#808080" text-anchor="middle">QNXT / Facets</text>
    <text x="0" y="6" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#606060" text-anchor="middle">Processing</text>
  </g>

  <!-- Both paths converge to Compare diamond -->
  <line x1="170" y1="361" x2="170" y2="385" stroke="#ffaa00" stroke-width="1" opacity="0.4"/>
  <line x1="420" y1="360" x2="420" y2="385" stroke="#ffaa00" stroke-width="1" opacity="0.4"/>
  <line x1="170" y1="385" x2="295" y2="410" stroke="#ffaa00" stroke-width="1.5" opacity="0.4"/>
  <line x1="420" y1="385" x2="295" y2="410" stroke="#ffaa00" stroke-width="1.5" opacity="0.4"/>

  <!-- Compare Results diamond -->
  <g transform="translate(295, 420)">
    <rect x="-18" y="-18" width="36" height="36" rx="2" fill="rgba(255,170,0,0.08)" stroke="rgba(255,170,0,0.4)" stroke-width="1" transform="rotate(45)"/>
    <text x="0" y="4" font-family="Segoe UI, system-ui, sans-serif" font-size="8" font-weight="600" fill="#ffaa00" text-anchor="middle">CMP</text>
  </g>

  <!-- Output -->
  <line x1="295" y1="445" x2="295" y2="462" stroke="#ffaa00" stroke-width="1" opacity="0.4" marker-end="url(#arrowheadAmber)"/>
  <text x="295" y="478" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600"
        fill="#ffaa00" text-anchor="middle">Discrepancy Report</text>
  <text x="295" y="493" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#b08000"
        text-anchor="middle">Legacy result is authoritative</text>

  <!-- ========== CENTER: Toggle Switch ========== -->
  <g transform="translate(590, 290)">
    <!-- Toggle track -->
    <rect x="-20" y="-40" width="40" height="80" rx="20" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <!-- Toggle indicator (top=amber/augment, bottom=green/replace) -->
    <circle cx="0" cy="-18" r="10" fill="rgba(255,170,0,0.3)" stroke="#ffaa00" stroke-width="1"/>
    <circle cx="0" cy="18" r="10" fill="rgba(0,255,136,0.3)" stroke="#00ff88" stroke-width="1"/>
    <!-- Label -->
    <text x="0" y="60" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600"
          fill="#ffffff" text-anchor="middle">Toggle per</text>
    <text x="0" y="72" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600"
          fill="#ffffff" text-anchor="middle">engine, per tenant</text>
  </g>

  <!-- ========== RIGHT HALF: Replace Mode ========== -->
  <rect x="650" y="65" width="510" height="440" rx="10" fill="rgba(0,255,136,0.02)"
        stroke="rgba(0,255,136,0.3)" stroke-width="1.5"/>
  <text x="905" y="90" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700"
        fill="#00ff88" text-anchor="middle">Replace Mode</text>

  <!-- Incoming Claim (right) -->
  <g transform="translate(905, 125)">
    <rect x="-70" y="-16" width="140" height="32" rx="6" fill="rgba(8,8,8,0.9)" stroke="rgba(0,255,136,0.4)" stroke-width="1"/>
    <text x="0" y="4" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600"
          fill="#ffffff" text-anchor="middle">Incoming Claim</text>
  </g>
  <line x1="905" y1="143" x2="905" y2="178" stroke="#00ff88" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowheadGreen)"/>

  <!-- Single path: CHO processing -->
  <text x="905" y="192" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600"
        fill="#00ff88" text-anchor="middle">CLOUD HEALTH OFFICE</text>
  <g transform="translate(905, 218)">
    <rect x="-60" y="-14" width="120" height="28" rx="5" fill="rgba(0,255,136,0.06)" stroke="rgba(0,255,136,0.2)" stroke-width="1"/>
    <text x="0" y="3" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#00ff88" text-anchor="middle">Claims Scrub</text>
  </g>
  <line x1="905" y1="234" x2="905" y2="246" stroke="#00ff88" stroke-width="1" opacity="0.3" marker-end="url(#arrowheadGreen)"/>
  <g transform="translate(905, 263)">
    <rect x="-60" y="-14" width="120" height="28" rx="5" fill="rgba(0,255,136,0.06)" stroke="rgba(0,255,136,0.2)" stroke-width="1"/>
    <text x="0" y="3" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#00ff88" text-anchor="middle">NCCI Edits</text>
  </g>
  <line x1="905" y1="279" x2="905" y2="291" stroke="#00ff88" stroke-width="1" opacity="0.3" marker-end="url(#arrowheadGreen)"/>
  <g transform="translate(905, 308)">
    <rect x="-60" y="-14" width="120" height="28" rx="5" fill="rgba(0,255,136,0.06)" stroke="rgba(0,255,136,0.2)" stroke-width="1"/>
    <text x="0" y="3" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#00ff88" text-anchor="middle">Price</text>
  </g>
  <line x1="905" y1="324" x2="905" y2="336" stroke="#00ff88" stroke-width="1" opacity="0.3" marker-end="url(#arrowheadGreen)"/>
  <g transform="translate(905, 353)">
    <rect x="-60" y="-14" width="120" height="28" rx="5" fill="rgba(0,255,136,0.06)" stroke="rgba(0,255,136,0.2)" stroke-width="1"/>
    <text x="0" y="3" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#00ff88" text-anchor="middle">Benefits</text>
  </g>
  <line x1="905" y1="369" x2="905" y2="395" stroke="#00ff88" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowheadGreen)"/>

  <!-- CHO Result -->
  <g transform="translate(905, 418)">
    <rect x="-60" y="-16" width="120" height="32" rx="6" fill="rgba(0,255,136,0.08)" stroke="rgba(0,255,136,0.4)" stroke-width="1"/>
    <text x="0" y="4" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600"
          fill="#00ff88" text-anchor="middle" filter="url(#glow)">CHO Result</text>
  </g>
  <text x="905" y="458" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600"
        fill="#00ff88" text-anchor="middle">CHO result is authoritative</text>

  <!-- Subtitles -->
  <text x="295" y="500" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#b08000"
        text-anchor="middle" font-style="italic">Both systems process. Legacy decides.</text>
  <text x="905" y="500" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#00cc66"
        text-anchor="middle" font-style="italic">CHO processes. CHO decides.</text>

  <!-- ========== BOTTOM: Per-engine status chips ========== -->
  <line x1="40" y1="525" x2="1160" y2="525" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Chip: Benefit Calc: Augment (amber) -->
  <g transform="translate(130, 560)">
    <rect x="-95" y="-14" width="190" height="28" rx="14" fill="rgba(255,170,0,0.08)" stroke="rgba(255,170,0,0.3)" stroke-width="1"/>
    <text x="0" y="4" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#ffaa00" text-anchor="middle">Benefit Calc: Augment</text>
  </g>

  <!-- Chip: NCCI Edits: Replace (green) -->
  <g transform="translate(350, 560)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="rgba(0,255,136,0.08)" stroke="rgba(0,255,136,0.3)" stroke-width="1"/>
    <text x="0" y="4" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#00ff88" text-anchor="middle">NCCI Edits: Replace</text>
  </g>

  <!-- Chip: Fee Schedule: Replace (green) -->
  <g transform="translate(560, 560)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="rgba(0,255,136,0.08)" stroke="rgba(0,255,136,0.3)" stroke-width="1"/>
    <text x="0" y="4" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#00ff88" text-anchor="middle">Fee Schedule: Replace</text>
  </g>

  <!-- Chip: Claims Scrub: Replace (green) -->
  <g transform="translate(780, 560)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="rgba(0,255,136,0.08)" stroke="rgba(0,255,136,0.3)" stroke-width="1"/>
    <text x="0" y="4" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#00ff88" text-anchor="middle">Claims Scrub: Replace</text>
  </g>

  <!-- Chip: Eligibility: Augment (amber) -->
  <g transform="translate(1000, 560)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="rgba(255,170,0,0.08)" stroke="rgba(255,170,0,0.3)" stroke-width="1"/>
    <text x="0" y="4" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#ffaa00" text-anchor="middle">Eligibility: Augment</text>
  </g>
</svg>
