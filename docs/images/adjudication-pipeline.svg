<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="rgba(0,255,255,0.3)"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00ffff" opacity="0.6"/>
    </marker>
    <marker id="arrowheadGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00ff88" opacity="0.6"/>
    </marker>
    <marker id="arrowheadAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ffaa00" opacity="0.6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="#000000"/>

  <!-- Title -->
  <text x="600" y="32" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700"
        fill="#ffffff" text-anchor="middle">Claims Adjudication Pipeline</text>
  <text x="600" y="52" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#b0b0b0"
        text-anchor="middle">Sub-second end-to-end &#x2022; 8 processing stages &#x2022; Augment or Replace</text>

  <!-- Row 1: Steps 1-5 (cyan validation steps) -->
  <!-- Step 1: 837 Ingest -->
  <g transform="translate(130, 105)">
    <rect x="-75" y="-25" width="150" height="50" rx="6" fill="rgba(0,255,255,0.06)" stroke="rgba(0,255,255,0.3)" stroke-width="1"/>
    <text x="0" y="0" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600"
          fill="#00ffff" text-anchor="middle" filter="url(#glow)">837 Ingest</text>
  </g>
  <line x1="207" y1="105" x2="245" y2="105" stroke="#00ffff" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead)"/>

  <!-- Step 2: Schema Validation -->
  <g transform="translate(340, 105)">
    <rect x="-85" y="-25" width="170" height="50" rx="6" fill="rgba(0,255,255,0.06)" stroke="rgba(0,255,255,0.3)" stroke-width="1"/>
    <text x="0" y="-3" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600"
          fill="#00ffff" text-anchor="middle" filter="url(#glow)">Schema Validation</text>
    <rect x="-18" y="8" width="36" height="14" rx="7" fill="rgba(0,255,255,0.1)" stroke="rgba(0,255,255,0.2)" stroke-width="0.5"/>
    <text x="0" y="18" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#00ffff" text-anchor="middle">45ms</text>
  </g>
  <line x1="427" y1="105" x2="465" y2="105" stroke="#00ffff" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead)"/>

  <!-- Step 3: Eligibility Check -->
  <g transform="translate(560, 105)">
    <rect x="-85" y="-25" width="170" height="50" rx="6" fill="rgba(0,255,255,0.06)" stroke="rgba(0,255,255,0.3)" stroke-width="1"/>
    <text x="0" y="-3" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600"
          fill="#00ffff" text-anchor="middle" filter="url(#glow)">Eligibility Check</text>
    <rect x="-22" y="8" width="44" height="14" rx="7" fill="rgba(0,255,255,0.1)" stroke="rgba(0,255,255,0.2)" stroke-width="0.5"/>
    <text x="0" y="18" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#00ffff" text-anchor="middle">120ms</text>
  </g>
  <line x1="647" y1="105" x2="685" y2="105" stroke="#00ffff" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead)"/>

  <!-- Step 4: Claims Scrub -->
  <g transform="translate(780, 105)">
    <rect x="-85" y="-25" width="170" height="50" rx="6" fill="rgba(0,255,255,0.06)" stroke="rgba(0,255,255,0.3)" stroke-width="1"/>
    <text x="0" y="-6" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600"
          fill="#00ffff" text-anchor="middle" filter="url(#glow)">Claims Scrub</text>
    <text x="0" y="6" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#808080" text-anchor="middle">20+ rules</text>
    <rect x="-18" y="12" width="36" height="14" rx="7" fill="rgba(0,255,255,0.1)" stroke="rgba(0,255,255,0.2)" stroke-width="0.5"/>
    <text x="0" y="22" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#00ffff" text-anchor="middle">85ms</text>
  </g>
  <line x1="867" y1="105" x2="905" y2="105" stroke="#00ffff" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead)"/>

  <!-- Step 5: NCCI/MUE Edits -->
  <g transform="translate(1000, 105)">
    <rect x="-85" y="-25" width="170" height="50" rx="6" fill="rgba(0,255,255,0.06)" stroke="rgba(0,255,255,0.3)" stroke-width="1"/>
    <text x="0" y="-3" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600"
          fill="#00ffff" text-anchor="middle" filter="url(#glow)">NCCI/MUE Edits</text>
    <rect x="-18" y="8" width="36" height="14" rx="7" fill="rgba(0,255,255,0.1)" stroke="rgba(0,255,255,0.2)" stroke-width="0.5"/>
    <text x="0" y="18" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#00ffff" text-anchor="middle">85ms</text>
  </g>

  <!-- Connector: Row 1 to Row 2 (down and left) -->
  <polyline points="1000,132 1000,160 130,160 130,185" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowheadGreen)"/>

  <!-- Row 2: Steps 6-9 (green calculation steps) -->
  <!-- Step 6: Fee Schedule Pricing -->
  <g transform="translate(200, 220)">
    <rect x="-100" y="-25" width="200" height="50" rx="6" fill="rgba(0,255,136,0.06)" stroke="rgba(0,255,136,0.3)" stroke-width="1"/>
    <text x="0" y="-3" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600"
          fill="#00ff88" text-anchor="middle" filter="url(#glow)">Fee Schedule Pricing</text>
    <rect x="-22" y="8" width="44" height="14" rx="7" fill="rgba(0,255,136,0.1)" stroke="rgba(0,255,136,0.2)" stroke-width="0.5"/>
    <text x="0" y="18" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#00ff88" text-anchor="middle">210ms</text>
  </g>
  <line x1="302" y1="220" x2="345" y2="220" stroke="#00ff88" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowheadGreen)"/>

  <!-- Step 7: Benefit Calculation -->
  <g transform="translate(490, 220)">
    <rect x="-110" y="-25" width="220" height="50" rx="6" fill="rgba(0,255,136,0.06)" stroke="rgba(0,255,136,0.3)" stroke-width="1"/>
    <text x="0" y="-6" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600"
          fill="#00ff88" text-anchor="middle" filter="url(#glow)">Benefit Calculation</text>
    <text x="0" y="6" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#808080" text-anchor="middle">HDHP &#x2022; COB &#x2022; Accumulators</text>
    <rect x="-22" y="12" width="44" height="14" rx="7" fill="rgba(0,255,136,0.1)" stroke="rgba(0,255,136,0.2)" stroke-width="0.5"/>
    <text x="0" y="22" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#00ff88" text-anchor="middle">165ms</text>
  </g>
  <line x1="602" y1="220" x2="645" y2="220" stroke="#00ff88" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowheadGreen)"/>

  <!-- Step 8: Payment Generation -->
  <g transform="translate(780, 220)">
    <rect x="-100" y="-25" width="200" height="50" rx="6" fill="rgba(0,255,136,0.06)" stroke="rgba(0,255,136,0.3)" stroke-width="1"/>
    <text x="0" y="-3" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600"
          fill="#00ff88" text-anchor="middle" filter="url(#glow)">Payment Generation</text>
    <rect x="-22" y="8" width="44" height="14" rx="7" fill="rgba(0,255,136,0.1)" stroke="rgba(0,255,136,0.2)" stroke-width="0.5"/>
    <text x="0" y="18" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#00ff88" text-anchor="middle">280ms</text>
  </g>
  <line x1="882" y1="220" x2="925" y2="220" stroke="#00ff88" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowheadGreen)"/>

  <!-- Step 9: 835 ERA -->
  <g transform="translate(1020, 220)">
    <rect x="-75" y="-25" width="150" height="50" rx="6" fill="rgba(0,255,136,0.06)" stroke="rgba(0,255,136,0.3)" stroke-width="1"/>
    <text x="0" y="0" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600"
          fill="#00ff88" text-anchor="middle" filter="url(#glow)">835 ERA</text>
  </g>

  <!-- Divider -->
  <line x1="60" y1="290" x2="1140" y2="290" stroke="rgba(255,170,0,0.15)" stroke-width="1"/>

  <!-- Augment Mode Annotation -->
  <text x="600" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600"
        fill="#ffaa00" text-anchor="middle" letter-spacing="1">AUGMENT MODE: PARALLEL-RUN VALIDATION AGAINST YOUR EXISTING SYSTEM</text>

  <!-- Dashed annotation box -->
  <rect x="120" y="340" width="960" height="130" rx="8" fill="rgba(255,170,0,0.03)"
        stroke="rgba(255,170,0,0.3)" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Legacy CAPS Result box -->
  <g transform="translate(330, 405)">
    <rect x="-120" y="-22" width="240" height="44" rx="6" fill="rgba(128,128,128,0.08)" stroke="rgba(128,128,128,0.3)" stroke-width="1"/>
    <text x="0" y="0" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600"
          fill="#808080" text-anchor="middle">Legacy CAPS Result</text>
    <text x="0" y="15" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#606060" text-anchor="middle">QNXT / Facets / HealthEdge</text>
  </g>

  <!-- Arrow: Legacy to Compare -->
  <line x1="452" y1="405" x2="555" y2="405" stroke="#ffaa00" stroke-width="1.5" opacity="0.5" marker-end="url(#arrowheadAmber)"/>

  <!-- Compare & Log box -->
  <g transform="translate(710, 405)">
    <rect x="-130" y="-22" width="260" height="44" rx="6" fill="rgba(255,170,0,0.06)" stroke="rgba(255,170,0,0.3)" stroke-width="1"/>
    <text x="0" y="-2" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600"
          fill="#ffaa00" text-anchor="middle">Compare &amp; Log Discrepancies</text>
    <text x="0" y="14" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#b08000" text-anchor="middle">Legacy result remains authoritative</text>
  </g>

  <!-- Arrow: Compare up to Benefit Calculation -->
  <line x1="710" y1="381" x2="710" y2="340" stroke="#ffaa00" stroke-width="1" opacity="0.3" stroke-dasharray="4,2"/>
  <line x1="710" y1="340" x2="540" y2="340" stroke="#ffaa00" stroke-width="1" opacity="0.3" stroke-dasharray="4,2"/>
  <line x1="540" y1="340" x2="490" y2="270" stroke="#ffaa00" stroke-width="1" opacity="0.3" stroke-dasharray="4,2" marker-end="url(#arrowheadAmber)"/>
</svg>
