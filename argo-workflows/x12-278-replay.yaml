# X12 278 Replay Workflow
# Replaces Azure Logic Apps replay278 endpoint with Kubernetes-native orchestration
#
# HIPAA Transaction: 005010X217 (278) - Health Care Services Review Information
#
# Workflow Steps:
#   1. fetch-from-storage - Retrieve original 278 from Kafka offset or S3
#   2. parse-x12-278 - Re-parse transaction
#   3. call-claims-backend-api - Replay to backend
#   4. publish-result - Publish replay result
#
# Features:
#   - Deterministic replay from Kafka offsets
#   - Idempotency checks
#   - Audit trail for replayed transactions

apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: x12-278-replay
  namespace: cho-workflows
  labels:
    app.kubernetes.io/name: x12-278-replay
    app.kubernetes.io/component: edi-processing
    app.kubernetes.io/part-of: cloudhealthoffice
    hipaa.compliance: "required"
  annotations:
    description: "X12 278 replay workflow for reprocessing transactions - HIPAA compliant"
    workflows.argoproj.io/version: ">= 3.0"
spec:
  entrypoint: replay-278
  serviceAccountName: argo-workflow-sa
  
  # Workflow-level TTL
  ttlStrategy:
    secondsAfterCompletion: 86400
    secondsAfterSuccess: 43200
    secondsAfterFailure: 604800
  
  archiveLogs: true
  activeDeadlineSeconds: 900  # 15 minutes
  
  # Retry strategy
  retryStrategy:
    limit: 2
    retryPolicy: OnFailure
    backoff:
      duration: "30s"
      factor: 2
      maxDuration: "2m"
  
  arguments:
    parameters:
      # Source of replay (S3 blob URL or Kafka offset)
      - name: blob-url
        value: ""
      - name: kafka-topic
        value: "edi-278"
      - name: kafka-partition
        value: "0"
      - name: kafka-offset
        value: ""
      # Optional custom file name
      - name: file-name
        value: ""
      # claims backend API endpoint
      - name: claims-backend-api-endpoint
        value: "https://backend.api.local/claims/process-278"
      # Replay tracking
      - name: replay-id
        value: ""
      - name: replay-reason
        value: "manual_replay"
  
  volumes:
    - name: work-volume
      emptyDir:
        sizeLimit: "512Mi"
    - name: kafka-credentials
      secret:
        secretName: kafka-sasl-secret
    - name: backend-credentials
      secret:
        secretName: claims-backend-api-secret
  
  templates:
    # Main orchestration template
    - name: replay-278
      dag:
        tasks:
          # Step 1: Check idempotency
          - name: check-idempotency
            template: idempotency-check-template
            arguments:
              parameters:
                - name: replay-id
                  value: "{{workflow.parameters.replay-id}}"
                - name: blob-url
                  value: "{{workflow.parameters.blob-url}}"
                - name: kafka-offset
                  value: "{{workflow.parameters.kafka-offset}}"
          
          # Step 2: Fetch original data
          - name: fetch-original
            dependencies: [check-idempotency]
            template: fetch-original-template
            when: "{{tasks.check-idempotency.outputs.parameters.should-replay}} == true"
            arguments:
              parameters:
                - name: blob-url
                  value: "{{workflow.parameters.blob-url}}"
                - name: kafka-topic
                  value: "{{workflow.parameters.kafka-topic}}"
                - name: kafka-partition
                  value: "{{workflow.parameters.kafka-partition}}"
                - name: kafka-offset
                  value: "{{workflow.parameters.kafka-offset}}"
          
          # Step 3: Parse X12 278
          - name: parse-x12-278
            dependencies: [fetch-original]
            when: "{{tasks.check-idempotency.outputs.parameters.should-replay}} == true"
            template: parse-x12-template
            arguments:
              artifacts:
                - name: edi-file
                  from: "{{tasks.fetch-original.outputs.artifacts.edi-content}}"
          
          # Step 4: Extract metadata
          - name: extract-metadata
            dependencies: [parse-x12-278]
            when: "{{tasks.check-idempotency.outputs.parameters.should-replay}} == true"
            template: extract-metadata-template
            arguments:
              artifacts:
                - name: parsed-json
                  from: "{{tasks.parse-x12-278.outputs.artifacts.parsed-output}}"
          
          # Step 5: Call claims backend API (replay)
          - name: call-claims-backend-api
            dependencies: [extract-metadata]
            when: "{{tasks.check-idempotency.outputs.parameters.should-replay}} == true"
            template: claims-backend-api-template
            arguments:
              artifacts:
                - name: metadata
                  from: "{{tasks.extract-metadata.outputs.artifacts.metadata-output}}"
              parameters:
                - name: api-endpoint
                  value: "{{workflow.parameters.claims-backend-api-endpoint}}"
                - name: is-replay
                  value: "true"
          
          # Step 6: Record replay result
          - name: record-replay
            dependencies: [call-claims-backend-api]
            when: "{{tasks.check-idempotency.outputs.parameters.should-replay}} == true"
            template: record-replay-template
            arguments:
              parameters:
                - name: replay-id
                  value: "{{workflow.parameters.replay-id}}"
                - name: blob-url
                  value: "{{workflow.parameters.blob-url}}"
                - name: kafka-offset
                  value: "{{workflow.parameters.kafka-offset}}"
                - name: replay-reason
                  value: "{{workflow.parameters.replay-reason}}"
                - name: api-result
                  value: "{{tasks.call-claims-backend-api.outputs.parameters.api-response}}"

    # Idempotency Check Template
    - name: idempotency-check-template
      inputs:
        parameters:
          - name: replay-id
          - name: blob-url
          - name: kafka-offset
      outputs:
        parameters:
          - name: should-replay
            valueFrom:
              path: /data/output/should-replay
          - name: previous-replay
            valueFrom:
              path: /data/output/previous-replay.json
      container:
        image: python:3.11-slim
        command: ["python", "-c"]
        args:
          - |
            import json
            import os
            import hashlib
            
            os.makedirs('/data/output', exist_ok=True)
            
            # Generate idempotency key
            replay_id = "{{inputs.parameters.replay-id}}"
            blob_url = "{{inputs.parameters.blob-url}}"
            kafka_offset = "{{inputs.parameters.kafka-offset}}"
            
            if not replay_id:
                # Generate from source
                source = f"{blob_url}{kafka_offset}"
                replay_id = hashlib.sha256(source.encode()).hexdigest()[:16]
            
            # In production, check against a distributed cache/DB
            # For now, always allow replay
            should_replay = True
            previous = None
            
            with open('/data/output/should-replay', 'w') as f:
                f.write(str(should_replay).lower())
            
            with open('/data/output/previous-replay.json', 'w') as f:
                json.dump(previous or {}, f)
            
            print(f"Idempotency check: replay_id={replay_id}, should_replay={should_replay}")
        volumeMounts:
          - name: work-volume
            mountPath: /data
        resources:
          requests:
            memory: "64Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "100m"

    # Fetch Original Data Template
    - name: fetch-original-template
      inputs:
        parameters:
          - name: blob-url
          - name: kafka-topic
          - name: kafka-partition
          - name: kafka-offset
      outputs:
        artifacts:
          - name: edi-content
            path: /data/output
      container:
        image: python:3.11-slim
        command: ["python", "-c"]
        args:
          - |
            import json
            import os
            
            os.makedirs('/data/output', exist_ok=True)
            
            blob_url = "{{inputs.parameters.blob-url}}"
            kafka_offset = "{{inputs.parameters.kafka-offset}}"
            
            if blob_url:
                # Validate blob URL to prevent command injection
                import re
                
                # Only allow alphanumeric, hyphens, underscores, forward slashes, and periods
                if not re.match(r'^[a-zA-Z0-9\-_./]+$', blob_url):
                    print(f"Invalid blob URL format: {blob_url}")
                    exit(1)
                
                # Parse S3 URL
                if blob_url.startswith('s3://'):
                    s3_path = blob_url
                else:
                    s3_bucket = os.environ.get('S3_BUCKET', 'hipaa-attachments')
                    s3_path = f"s3://{s3_bucket}/{blob_url}"
                
                # Download file using boto3 for safety (aws cli as fallback)
                try:
                    import boto3
                    s3 = boto3.client('s3')
                    
                    # Parse bucket and key from s3_path
                    path_parts = s3_path.replace('s3://', '').split('/', 1)
                    bucket = path_parts[0]
                    key = path_parts[1] if len(path_parts) > 1 else ''
                    
                    s3.download_file(bucket, key, '/data/output/replay.edi')
                    print(f"Downloaded from S3 using boto3: {s3_path}")
                except ImportError:
                    # Fallback to aws cli
                    import subprocess
                    result = subprocess.run(
                        ['aws', 's3', 'cp', s3_path, '/data/output/replay.edi'],
                        capture_output=True, text=True
                    )
                    
                    if result.returncode != 0:
                        print(f"S3 download failed: {result.stderr}")
                        exit(1)
                    
                    print(f"Downloaded from S3: {s3_path}")
            
            elif kafka_offset:
                # Fetch from Kafka by offset
                # This requires kafka-python and would consume from specific offset
                # For simplicity, this is a placeholder
                print(f"Kafka offset replay: partition={{inputs.parameters.kafka-partition}}, offset={kafka_offset}")
                
                # In production, use KafkaConsumer with seek()
                # For now, write empty placeholder
                with open('/data/output/replay.edi', 'w') as f:
                    f.write('')
            
            else:
                print("Error: Must specify either blob-url or kafka-offset")
                exit(1)
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: s3-credentials-secret
                key: access-key-id
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: s3-credentials-secret
                key: secret-access-key
          - name: S3_BUCKET
            valueFrom:
              configMapKeyRef:
                name: s3-config
                key: bucket
                optional: true
        volumeMounts:
          - name: work-volume
            mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"

    # Parse X12 Template
    - name: parse-x12-template
      inputs:
        artifacts:
          - name: edi-file
            path: /data/input
      outputs:
        artifacts:
          - name: parsed-output
            path: /data/output/parsed.json
      container:
        image: cloudhealthoffice/x12-parser:latest
        args:
          - "/data/input/*.edi"
          - "--output"
          - "/data/output/parsed.json"
          - "--transaction-type"
          - "278"
        volumeMounts:
          - name: work-volume
            mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

    # Extract Metadata Template
    - name: extract-metadata-template
      inputs:
        artifacts:
          - name: parsed-json
            path: /data/input/parsed.json
      outputs:
        artifacts:
          - name: metadata-output
            path: /data/output/metadata.json
      container:
        image: cloudhealthoffice/metadata-extractor:latest
        args:
          - "--input"
          - "/data/input/parsed.json"
          - "--output"
          - "/data/output/metadata.json"
        volumeMounts:
          - name: work-volume
            mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"

    # claims backend API Template
    - name: claims-backend-api-template
      inputs:
        parameters:
          - name: api-endpoint
          - name: is-replay
        artifacts:
          - name: metadata
            path: /data/input/metadata.json
      outputs:
        parameters:
          - name: api-response
            valueFrom:
              path: /data/output/api-response.json
      retryStrategy:
        limit: 4
        retryPolicy: OnError
        backoff:
          duration: "15s"
          factor: 2
          maxDuration: "2m"
      container:
        image: curlimages/curl:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            # Read metadata
            METADATA=$(cat /data/input/metadata.json)
            
            # Extract fields
            CLAIM_NUMBER=$(echo "$METADATA" | jq -r '.service.claim_number // ""')
            MEMBER_ID=$(echo "$METADATA" | jq -r '.member.member_id // ""')
            PROVIDER_NPI=$(echo "$METADATA" | jq -r '.provider.npi // ""')
            
            # Build request payload with replay flag
            REQUEST_BODY=$(cat <<EOF
            {
              "claimNumber": "$CLAIM_NUMBER",
              "memberId": "$MEMBER_ID",
              "providerNpi": "$PROVIDER_NPI",
              "isReplay": {{inputs.parameters.is-replay}},
              "replayedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "workflowId": "{{workflow.name}}"
            }
            EOF
            )
            
            mkdir -p /data/output
            
            # Call claims backend API
            RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST "{{inputs.parameters.api-endpoint}}" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $CLAIMS_BACKEND_API_TOKEN" \
              -H "X-Replay: true" \
              -H "X-Workflow-Id: {{workflow.name}}" \
              -d "$REQUEST_BODY")
            
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -n -1)
            
            # Save response
            echo "{\"httpCode\": $HTTP_CODE, \"body\": $BODY, \"isReplay\": true}" > /data/output/api-response.json
            
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "claims backend API replay call failed with HTTP $HTTP_CODE"
              exit 1
            fi
            
            echo "claims backend API replay successful"
        env:
          - name: CLAIMS_BACKEND_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: claims-backend-api-secret
                key: token
        volumeMounts:
          - name: work-volume
            mountPath: /data
        resources:
          requests:
            memory: "64Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "100m"

    # Record Replay Result Template
    - name: record-replay-template
      inputs:
        parameters:
          - name: replay-id
          - name: blob-url
          - name: kafka-offset
          - name: replay-reason
          - name: api-result
      container:
        image: cloudhealthoffice/kafka-publisher:latest
        args:
          - "--topic"
          - "edi-278-replays"
          - "--message"
          - '{"event": "278_REPLAY_COMPLETED", "replayId": "{{inputs.parameters.replay-id}}", "blobUrl": "{{inputs.parameters.blob-url}}", "kafkaOffset": "{{inputs.parameters.kafka-offset}}", "reason": "{{inputs.parameters.replay-reason}}", "result": {{inputs.parameters.api-result}}, "workflowId": "{{workflow.name}}", "completedAt": "{{workflow.creationTimestamp}}"}'
        env:
          - name: KAFKA_BOOTSTRAP_SERVERS
            valueFrom:
              configMapKeyRef:
                name: kafka-config
                key: bootstrap-servers
          - name: KAFKA_SECURITY_PROTOCOL
            valueFrom:
              configMapKeyRef:
                name: kafka-config
                key: security-protocol
                optional: true
          - name: KAFKA_SASL_MECHANISM
            valueFrom:
              secretKeyRef:
                name: kafka-sasl-secret
                key: mechanism
                optional: true
          - name: KAFKA_SASL_USERNAME
            valueFrom:
              secretKeyRef:
                name: kafka-sasl-secret
                key: username
                optional: true
          - name: KAFKA_SASL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: kafka-sasl-secret
                key: password
                optional: true
        volumeMounts:
          - name: work-volume
            mountPath: /data
        resources:
          requests:
            memory: "64Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "100m"

    # Error Handler
    - name: error-handler
      inputs:
        parameters:
          - name: error-message
      container:
        image: cloudhealthoffice/kafka-publisher:latest
        args:
          - "--topic"
          - "dead-letter-queue"
          - "--message"
          - '{"workflow": "x12-278-replay", "error": "{{inputs.parameters.error-message}}", "timestamp": "{{workflow.creationTimestamp}}"}'
        env:
          - name: KAFKA_BOOTSTRAP_SERVERS
            valueFrom:
              configMapKeyRef:
                name: kafka-config
                key: bootstrap-servers
        resources:
          requests:
            memory: "64Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "100m"

  onExit: exit-handler

  - name: exit-handler
    steps:
      - - name: log-success
          template: log-template
          when: "{{workflow.status}} == Succeeded"
      - - name: handle-failure
          template: error-handler
          when: "{{workflow.status}} != Succeeded"
          arguments:
            parameters:
              - name: error-message
                value: "278 replay workflow failed"

  - name: log-template
    container:
      image: busybox
      command: ["echo"]
      args: ["X12 278 replay workflow completed successfully"]
