# X12 278 Authorization Request Workflow
# Replaces Azure Logic Apps ingest278 workflow with Kubernetes-native orchestration
#
# HIPAA Transaction: 005010X217 (278) - Health Care Services Review Information
#
# Workflow Steps:
#   1. sftp-fetch - Download 278 file from SFTP
#   2. parse-x12-278 - Parse authorization request EDI to JSON
#   3. extract-auth-data - Extract authorization details
#   4. call-claims-backend-api - POST to claims backend backend API
#   5. store-data-lake - Archive transaction to S3/MinIO
#   6. publish-kafka - Publish to 'edi-278' topic
#
# Trading Partners:
#   - Sender: Clearinghouse (030240928)
#   - Receiver: Health Plan ({config.payerId})

apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: x12-278-ingest
  namespace: cho-workflows
  labels:
    app.kubernetes.io/name: x12-278-ingest
    app.kubernetes.io/component: edi-processing
    app.kubernetes.io/part-of: cloudhealthoffice
    hipaa.compliance: "required"
  annotations:
    description: "X12 278 authorization request ingestion workflow - HIPAA compliant"
    workflows.argoproj.io/version: ">= 3.0"
spec:
  entrypoint: ingest-278
  serviceAccountName: argo-workflow-sa
  
  # Workflow-level TTL
  ttlStrategy:
    secondsAfterCompletion: 86400
    secondsAfterSuccess: 43200
    secondsAfterFailure: 604800
  
  archiveLogs: true
  activeDeadlineSeconds: 1800
  
  # Retry strategy
  retryStrategy:
    limit: 3
    retryPolicy: OnFailure
    backoff:
      duration: "30s"
      factor: 2
      maxDuration: "5m"
  
  arguments:
    parameters:
      - name: sftp-host
        value: "sftp.clearinghouse.example.com"
      - name: sftp-folder
        value: "/inbound/278"
      - name: file-pattern
        value: "*.edi"
      - name: s3-bucket
        value: "hipaa-attachments"
      - name: kafka-topic
        value: "edi-278"
      - name: claims-backend-api-endpoint
        value: "https://backend.api.local/claims/process-278"
  
  volumes:
    - name: work-volume
      emptyDir:
        sizeLimit: "1Gi"
    - name: sftp-credentials
      secret:
        secretName: clearinghouse-sftp-secret
    - name: kafka-credentials
      secret:
        secretName: kafka-sasl-secret
    - name: backend-credentials
      secret:
        secretName: claims-backend-api-secret
  
  templates:
    # Main orchestration template
    - name: ingest-278
      dag:
        tasks:
          # Step 1: Fetch files from SFTP
          - name: sftp-fetch
            template: sftp-fetch-template
            arguments:
              parameters:
                - name: sftp-host
                  value: "{{workflow.parameters.sftp-host}}"
                - name: sftp-folder
                  value: "{{workflow.parameters.sftp-folder}}"
                - name: file-pattern
                  value: "{{workflow.parameters.file-pattern}}"
          
          # Step 2: Parse X12 278 files
          - name: parse-x12-278
            dependencies: [sftp-fetch]
            template: parse-x12-template
            arguments:
              artifacts:
                - name: edi-file
                  from: "{{tasks.sftp-fetch.outputs.artifacts.downloaded-files}}"
              parameters:
                - name: transaction-type
                  value: "278"
          
          # Step 3: Extract authorization data
          - name: extract-auth-data
            dependencies: [parse-x12-278]
            template: extract-auth-template
            arguments:
              artifacts:
                - name: parsed-json
                  from: "{{tasks.parse-x12-278.outputs.artifacts.parsed-output}}"
          
          # Step 4: Call claims backend API
          - name: call-claims-backend-api
            dependencies: [extract-auth-data]
            template: claims-backend-api-template
            arguments:
              artifacts:
                - name: auth-data
                  from: "{{tasks.extract-auth-data.outputs.artifacts.auth-output}}"
              parameters:
                - name: api-endpoint
                  value: "{{workflow.parameters.claims-backend-api-endpoint}}"
          
          # Step 5: Store to Data Lake
          - name: store-data-lake
            dependencies: [parse-x12-278]
            template: store-s3-template
            arguments:
              artifacts:
                - name: edi-file
                  from: "{{tasks.sftp-fetch.outputs.artifacts.downloaded-files}}"
              parameters:
                - name: s3-bucket
                  value: "{{workflow.parameters.s3-bucket}}"
                - name: s3-prefix
                  value: "raw/278/{{workflow.creationTimestamp.Y}}/{{workflow.creationTimestamp.m}}/{{workflow.creationTimestamp.d}}"
          
          # Step 6: Publish to Kafka
          - name: publish-kafka
            dependencies: [call-claims-backend-api, store-data-lake]
            template: kafka-publish-template
            arguments:
              artifacts:
                - name: auth-data
                  from: "{{tasks.extract-auth-data.outputs.artifacts.auth-output}}"
              parameters:
                - name: topic
                  value: "{{workflow.parameters.kafka-topic}}"
          
          # Step 7: Cleanup SFTP
          - name: cleanup-sftp
            dependencies: [publish-kafka]
            template: sftp-cleanup-template
            arguments:
              artifacts:
                - name: file-list
                  from: "{{tasks.sftp-fetch.outputs.artifacts.file-manifest}}"
              parameters:
                - name: sftp-host
                  value: "{{workflow.parameters.sftp-host}}"

    # SFTP Fetch Template
    - name: sftp-fetch-template
      inputs:
        parameters:
          - name: sftp-host
          - name: sftp-folder
          - name: file-pattern
      outputs:
        artifacts:
          - name: downloaded-files
            path: /data/output
            archive:
              none: {}
          - name: file-manifest
            path: /data/manifest.json
      container:
        image: cloudhealthoffice/sftp-fetcher:latest
        args:
          - "--host"
          - "{{inputs.parameters.sftp-host}}"
          - "--folder"
          - "{{inputs.parameters.sftp-folder}}"
          - "--pattern"
          - "{{inputs.parameters.file-pattern}}"
          - "--output"
          - "/data/output"
          - "--json"
        env:
          - name: SFTP_USERNAME
            valueFrom:
              secretKeyRef:
                name: clearinghouse-sftp-secret
                key: username
          - name: SFTP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: clearinghouse-sftp-secret
                key: password
                optional: true
          - name: SSH_KEY_PATH
            value: "/secrets/ssh-key"
        volumeMounts:
          - name: work-volume
            mountPath: /data
          - name: sftp-credentials
            mountPath: /secrets
            readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

    # Parse X12 Template
    - name: parse-x12-template
      inputs:
        parameters:
          - name: transaction-type
        artifacts:
          - name: edi-file
            path: /data/input
      outputs:
        artifacts:
          - name: parsed-output
            path: /data/output/parsed.json
      container:
        image: cloudhealthoffice/x12-parser:latest
        args:
          - "/data/input/*.edi"
          - "--output"
          - "/data/output/parsed.json"
          - "--transaction-type"
          - "{{inputs.parameters.transaction-type}}"
        volumeMounts:
          - name: work-volume
            mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

    # Extract Authorization Data Template
    - name: extract-auth-template
      inputs:
        artifacts:
          - name: parsed-json
            path: /data/input/parsed.json
      outputs:
        artifacts:
          - name: auth-output
            path: /data/output/auth-data.json
      container:
        image: cloudhealthoffice/metadata-extractor:latest
        args:
          - "--input"
          - "/data/input/parsed.json"
          - "--output"
          - "/data/output/auth-data.json"
        volumeMounts:
          - name: work-volume
            mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"

    # claims backend API Call Template
    - name: claims-backend-api-template
      inputs:
        parameters:
          - name: api-endpoint
        artifacts:
          - name: auth-data
            path: /data/input/auth-data.json
      outputs:
        parameters:
          - name: api-response
            valueFrom:
              path: /data/output/api-response.json
      retryStrategy:
        limit: 4
        retryPolicy: OnError
        backoff:
          duration: "15s"
          factor: 2
          maxDuration: "2m"
      container:
        image: curlimages/curl:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            # Read auth data and prepare request
            AUTH_DATA=$(cat /data/input/auth-data.json)
            
            # Extract fields for claims backend API
            CLAIM_NUMBER=$(echo "$AUTH_DATA" | jq -r '.service.claim_number // ""')
            MEMBER_ID=$(echo "$AUTH_DATA" | jq -r '.member.member_id // ""')
            PROVIDER_NPI=$(echo "$AUTH_DATA" | jq -r '.provider.npi // ""')
            REVIEW_DECISION=$(echo "$AUTH_DATA" | jq -r '.authorization.review_action_code // ""')
            
            # Build request payload
            REQUEST_BODY=$(cat <<EOF
            {
              "claimNumber": "$CLAIM_NUMBER",
              "memberId": "$MEMBER_ID",
              "providerNpi": "$PROVIDER_NPI",
              "reviewDecision": "$REVIEW_DECISION",
              "processedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }
            EOF
            )
            
            # Call claims backend API
            RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST "{{inputs.parameters.api-endpoint}}" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $CLAIMS_BACKEND_API_TOKEN" \
              -d "$REQUEST_BODY")
            
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -n -1)
            
            # Save response
            echo "{\"httpCode\": $HTTP_CODE, \"body\": $BODY}" > /data/output/api-response.json
            
            # Check for success
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "claims backend API call failed with HTTP $HTTP_CODE"
              exit 1
            fi
            
            echo "claims backend API call successful"
        env:
          - name: CLAIMS_BACKEND_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: claims-backend-api-secret
                key: token
        volumeMounts:
          - name: work-volume
            mountPath: /data
        resources:
          requests:
            memory: "64Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "100m"

    # Store to S3/MinIO Template
    - name: store-s3-template
      inputs:
        parameters:
          - name: s3-bucket
          - name: s3-prefix
        artifacts:
          - name: edi-file
            path: /data/input
      container:
        image: amazon/aws-cli:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            for file in /data/input/*.edi; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                timestamp=$(date +%Y%m%d%H%M%S)
                s3_path="s3://{{inputs.parameters.s3-bucket}}/{{inputs.parameters.s3-prefix}}/${filename%.edi}-${timestamp}.edi"
                aws s3 cp "$file" "$s3_path" --sse AES256
                echo "Uploaded: $s3_path"
              fi
            done
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: s3-credentials-secret
                key: access-key-id
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: s3-credentials-secret
                key: secret-access-key
          - name: AWS_DEFAULT_REGION
            valueFrom:
              configMapKeyRef:
                name: s3-config
                key: region
                optional: true
          - name: AWS_ENDPOINT_URL
            valueFrom:
              configMapKeyRef:
                name: s3-config
                key: endpoint-url
                optional: true
        volumeMounts:
          - name: work-volume
            mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"

    # Kafka Publish Template
    - name: kafka-publish-template
      inputs:
        parameters:
          - name: topic
        artifacts:
          - name: auth-data
            path: /data/input/auth-data.json
      outputs:
        parameters:
          - name: publish-result
            valueFrom:
              path: /data/output/publish-result.json
      container:
        image: cloudhealthoffice/kafka-publisher:latest
        args:
          - "--input"
          - "/data/input/auth-data.json"
          - "--topic"
          - "{{inputs.parameters.topic}}"
          - "--json"
        env:
          - name: KAFKA_BOOTSTRAP_SERVERS
            valueFrom:
              configMapKeyRef:
                name: kafka-config
                key: bootstrap-servers
          - name: KAFKA_SECURITY_PROTOCOL
            valueFrom:
              configMapKeyRef:
                name: kafka-config
                key: security-protocol
                optional: true
          - name: KAFKA_SASL_MECHANISM
            valueFrom:
              secretKeyRef:
                name: kafka-sasl-secret
                key: mechanism
                optional: true
          - name: KAFKA_SASL_USERNAME
            valueFrom:
              secretKeyRef:
                name: kafka-sasl-secret
                key: username
                optional: true
          - name: KAFKA_SASL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: kafka-sasl-secret
                key: password
                optional: true
        volumeMounts:
          - name: work-volume
            mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"

    # SFTP Cleanup Template
    - name: sftp-cleanup-template
      inputs:
        parameters:
          - name: sftp-host
        artifacts:
          - name: file-list
            path: /data/manifest.json
      container:
        image: cloudhealthoffice/sftp-fetcher:latest
        command: ["python", "-c"]
        args:
          - |
            import json
            import os
            import paramiko
            
            with open('/data/manifest.json') as f:
                manifest = json.load(f)
            
            host = "{{inputs.parameters.sftp-host}}"
            username = os.environ.get('SFTP_USERNAME')
            password = os.environ.get('SFTP_PASSWORD')
            
            if manifest.get('files'):
                transport = paramiko.Transport((host, 22))
                transport.connect(username=username, password=password)
                sftp = paramiko.SFTPClient.from_transport(transport)
                
                for file_info in manifest['files']:
                    try:
                        sftp.remove(file_info['path'])
                        print(f"Deleted: {file_info['path']}")
                    except Exception as e:
                        print(f"Failed to delete {file_info['path']}: {e}")
                
                sftp.close()
                transport.close()
        env:
          - name: SFTP_USERNAME
            valueFrom:
              secretKeyRef:
                name: clearinghouse-sftp-secret
                key: username
          - name: SFTP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: clearinghouse-sftp-secret
                key: password
                optional: true
        volumeMounts:
          - name: work-volume
            mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"

    # Error Handler Template (publishes to DLQ)
    - name: error-handler
      inputs:
        parameters:
          - name: error-message
          - name: failed-step
      container:
        image: cloudhealthoffice/kafka-publisher:latest
        args:
          - "--topic"
          - "dead-letter-queue"
          - "--message"
          - '{"workflow": "x12-278-ingest", "failedStep": "{{inputs.parameters.failed-step}}", "error": "{{inputs.parameters.error-message}}", "timestamp": "{{workflow.creationTimestamp}}"}'
        env:
          - name: KAFKA_BOOTSTRAP_SERVERS
            valueFrom:
              configMapKeyRef:
                name: kafka-config
                key: bootstrap-servers
        resources:
          requests:
            memory: "64Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "100m"

  onExit: exit-handler

  - name: exit-handler
    steps:
      - - name: log-completion
          template: log-template
          when: "{{workflow.status}} == Succeeded"
      - - name: handle-failure
          template: error-handler
          when: "{{workflow.status}} != Succeeded"
          arguments:
            parameters:
              - name: error-message
                value: "Workflow failed"
              - name: failed-step
                value: "{{workflow.failures}}"

  - name: log-template
    container:
      image: busybox
      command: ["echo"]
      args: ["X12 278 ingest workflow completed successfully"]
