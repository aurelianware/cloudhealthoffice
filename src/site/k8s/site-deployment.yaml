apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
  namespace: cho-svcs
  labels:
    app: site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: site
  template:
    metadata:
      labels:
        app: site
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: site
        image: ghcr.io/aurelianware/cloudhealthoffice-site:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: site
  namespace: cho-svcs
  labels:
    app: site
spec:
  type: ClusterIP
  selector:
    app: site
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
