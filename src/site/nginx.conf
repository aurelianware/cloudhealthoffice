server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Serve sitemap and other XML files
    location ~* \.xml$ {
        expires 1d;
        try_files $uri =404;
    }


    # Security headers — defined once at server level; location blocks below use
    # expires (not add_header) for cache control so these headers are always inherited.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;


    # Static assets — 1-day cache (assets are not filename-fingerprinted)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1d;
        try_files $uri =404;
    }

    # Redirect /index.html → / (canonical homepage)
    location = /index.html {
        return 301 /;
    }

    # Redirect .html URLs → clean extensionless URLs (301 for SEO)
    location ~* ^/(.+)\.html$ {
        return 301 /$1;
    }

    # Clean URLs: try exact file, then .html extension, then 404
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
