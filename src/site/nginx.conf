server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Serve all other XML files
    location ~* \.xml$ {
        # Other rules
        allow all;
    }


    # Security headers — defined once at server level; location blocks below use
    # expires (not add_header) for cache control so these headers are always inherited.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;


    # Static assets — 1-day cache (assets are not filename-fingerprinted)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1d;
        try_files $uri =404;
    }

    # HTML pages
    location ~* \.html$ {
        expires 1h;
        try_files $uri =404;
    }

    # Default — serve file directly or return 404
    location / {
        try_files $uri $uri/ =404;
    }
}
