<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img"
     aria-labelledby="og-title og-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="og-title">CMS-0057-F and modern payer architecture</title>
  <desc id="og-desc">CloudHealthOffice social preview: CMS-0057-F plus modern payer architecture, covering CRD, DTR, PAS, QNXT, Facets, and HealthEdge.</desc>

  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070a"/>
      <stop offset="0.55" stop-color="#0a0f12"/>
      <stop offset="1" stop-color="#08120f"/>
    </linearGradient>
    <marker id="og-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00ffff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#og-bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#00ffff"/>
  <rect x="0" y="624" width="1200" height="6" fill="#00ff88"/>

  <!-- brand -->
  <g>
    <circle cx="86" cy="80" r="18" fill="none" stroke="#00ff88" stroke-width="3"/>
    <circle cx="86" cy="80" r="6" fill="#00ffff"/>
    <text x="118" y="87" fill="#e6edf3" font-size="24" font-weight="700">CloudHealthOffice</text>
  </g>

  <!-- eyebrow -->
  <text x="80" y="200" fill="#00ff88" font-size="24" font-weight="700" letter-spacing="0.18em">CMS-0057-F &amp; PAYER MODERNIZATION</text>

  <!-- headline -->
  <text x="80" y="272" fill="#ffffff" font-size="66" font-weight="800">CMS-0057-F +</text>
  <text x="80" y="346" fill="#ffffff" font-size="66" font-weight="800">Modern Payer <tspan fill="#00ffff">Architecture</tspan></text>

  <!-- secondary -->
  <text x="80" y="418" fill="#c9d1d9" font-size="30" font-weight="600">CRD &#183; DTR &#183; PAS &#183; QNXT &#183; Facets &#183; HealthEdge</text>

  <!-- mini flow -->
  <g transform="translate(80,470)" font-size="19" font-weight="600">
    <rect x="0" y="0" width="176" height="54" rx="9" fill="#0d1117" stroke="#8b949e" stroke-width="1.4"/>
    <text x="88" y="33" text-anchor="middle" fill="#e6edf3">Provider / EHR</text>
    <line x1="176" y1="27" x2="212" y2="27" stroke="#00ffff" stroke-width="2.5" marker-end="url(#og-arrow)"/>

    <rect x="214" y="0" width="250" height="54" rx="9" fill="#0b1f1a" stroke="#00ff88" stroke-width="1.8"/>
    <text x="339" y="33" text-anchor="middle" fill="#00ff88">CloudHealthOffice</text>
    <line x1="464" y1="27" x2="500" y2="27" stroke="#00ffff" stroke-width="2.5" marker-end="url(#og-arrow)"/>

    <rect x="502" y="0" width="290" height="54" rx="9" fill="#0d1117" stroke="#8b949e" stroke-width="1.4"/>
    <text x="647" y="33" text-anchor="middle" fill="#e6edf3">Existing payer core</text>
  </g>

  <text x="80" y="588" fill="#8b949e" font-size="20">A stable, modern FHIR boundary &#8212; alongside your core, or as the core.</text>
</svg>
