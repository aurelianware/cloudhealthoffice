<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" role="img"
     aria-labelledby="ctf-title ctf-desc" preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="ctf-title">CRD, terminology, and the Prior Authorization Rule Engine</title>
  <desc id="ctf-desc">A provider EHR issues order-select and order-sign hooks to CDS Hooks CRD. CloudHealthOffice extracts codes and calls the terminology service, which translates SNOMED CT through FHIR CodeSystems and ValueSets into CPT, HCPCS, ICD-10-CM and payer concepts. The Prior Authorization Rule Engine then returns one of three outcomes: no authorization required, prior authorization required, or additional documentation required. When documentation is required, the workflow continues to DTR.</desc>

  <defs>
    <marker id="ctf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00ffff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="820" rx="16" fill="#0a0a0a"/>
  <rect x="1" y="1" width="898" height="818" rx="15" fill="none" stroke="#00ffff" stroke-opacity="0.18"/>

  <!-- Provider EHR -->
  <rect x="320" y="26" width="260" height="52" rx="10" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>
  <text x="450" y="58" text-anchor="middle" fill="#e6edf3" font-size="19" font-weight="700">Provider EHR</text>
  <line x1="450" y1="78" x2="450" y2="106" stroke="#00ffff" stroke-width="2" marker-end="url(#ctf-arrow)"/>

  <!-- Order select / order sign -->
  <rect x="290" y="108" width="320" height="50" rx="10" fill="#0d1117" stroke="#00ffff" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="450" y="132" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="600">Order Select &#183; Order Sign</text>
  <text x="450" y="150" text-anchor="middle" fill="#8b949e" font-size="12">draft orders in the clinical workflow</text>
  <line x1="450" y1="158" x2="450" y2="186" stroke="#00ffff" stroke-width="2" marker-end="url(#ctf-arrow)"/>

  <!-- CDS Hooks / CRD -->
  <rect x="300" y="188" width="300" height="52" rx="10" fill="#0d1117" stroke="#00ffff" stroke-width="1.6"/>
  <text x="450" y="212" text-anchor="middle" fill="#00ffff" font-size="17" font-weight="700">CDS Hooks / CRD</text>
  <text x="450" y="230" text-anchor="middle" fill="#8b949e" font-size="12">extract codes from draft orders</text>
  <line x1="450" y1="240" x2="450" y2="268" stroke="#00ffff" stroke-width="2" marker-end="url(#ctf-arrow)"/>

  <!-- Terminology service block -->
  <rect x="150" y="270" width="600" height="176" rx="12" fill="#0b1620" stroke="#00ffff" stroke-width="1.6"/>
  <text x="450" y="298" text-anchor="middle" fill="#00ffff" font-size="17" font-weight="700">CloudHealthOffice Terminology Service</text>
  <text x="450" y="317" text-anchor="middle" fill="#8b949e" font-size="12.5">ConceptMap/$translate &#183; $batch-translate</text>

  <rect x="176" y="332" width="248" height="44" rx="8" fill="#0d1117" stroke="#00ff88" stroke-opacity="0.5"/>
  <text x="300" y="352" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">SNOMED CT input</text>
  <text x="300" y="369" text-anchor="middle" fill="#8b949e" font-size="11.5">FHIR CodeSystems / ValueSets</text>

  <!-- translation arrow -->
  <line x1="424" y1="354" x2="474" y2="354" stroke="#00ff88" stroke-width="2" marker-end="url(#ctf-arrow)"/>
  <text x="449" y="345" text-anchor="middle" fill="#00ff88" font-size="10.5">translate</text>

  <rect x="476" y="332" width="248" height="44" rx="8" fill="#0d1117" stroke="#00ff88" stroke-opacity="0.5"/>
  <text x="600" y="352" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">CPT &#183; HCPCS &#183; ICD-10-CM</text>
  <text x="600" y="369" text-anchor="middle" fill="#8b949e" font-size="11.5">normalized payer concepts</text>

  <text x="450" y="404" text-anchor="middle" fill="#c9d1d9" font-size="12.5">Normalization / translation so every code is evaluated on the same terms</text>
  <text x="450" y="428" text-anchor="middle" fill="#8b949e" font-size="11.5">LOINC and payer-specific code groupings supported where configured</text>

  <line x1="450" y1="446" x2="450" y2="476" stroke="#00ffff" stroke-width="2" marker-end="url(#ctf-arrow)"/>

  <!-- Prior Auth Rule Engine -->
  <rect x="270" y="478" width="360" height="56" rx="10" fill="#0b1f1a" stroke="#00ff88" stroke-width="2"/>
  <text x="450" y="502" text-anchor="middle" fill="#00ff88" font-size="17" font-weight="700">Prior Authorization Rule Engine</text>
  <text x="450" y="521" text-anchor="middle" fill="#c9d1d9" font-size="12.5">payer-specific classifications &amp; rules</text>

  <!-- three outcome branches -->
  <line x1="450" y1="534" x2="450" y2="556" stroke="#00ffff" stroke-width="2"/>
  <line x1="160" y1="556" x2="740" y2="556" stroke="#00ffff" stroke-width="2"/>
  <line x1="160" y1="556" x2="160" y2="580" stroke="#00ffff" stroke-width="2" marker-end="url(#ctf-arrow)"/>
  <line x1="450" y1="556" x2="450" y2="580" stroke="#00ffff" stroke-width="2" marker-end="url(#ctf-arrow)"/>
  <line x1="740" y1="556" x2="740" y2="580" stroke="#00ffff" stroke-width="2" marker-end="url(#ctf-arrow)"/>

  <!-- Outcome 1: no auth -->
  <rect x="60" y="582" width="200" height="64" rx="10" fill="#0d1117" stroke="#00ff88" stroke-width="1.6"/>
  <text x="160" y="608" text-anchor="middle" fill="#00ff88" font-size="14.5" font-weight="700">No authorization</text>
  <text x="160" y="626" text-anchor="middle" fill="#c9d1d9" font-size="13">required</text>

  <!-- Outcome 2: prior auth required -->
  <rect x="350" y="582" width="200" height="64" rx="10" fill="#0d1117" stroke="#f0b429" stroke-width="1.6"/>
  <text x="450" y="608" text-anchor="middle" fill="#f0b429" font-size="14.5" font-weight="700">Prior authorization</text>
  <text x="450" y="626" text-anchor="middle" fill="#c9d1d9" font-size="13">required</text>

  <!-- Outcome 3: documentation required -->
  <rect x="640" y="582" width="200" height="64" rx="10" fill="#0d1117" stroke="#00ffff" stroke-width="1.6"/>
  <text x="740" y="608" text-anchor="middle" fill="#00ffff" font-size="14.5" font-weight="700">Additional</text>
  <text x="740" y="626" text-anchor="middle" fill="#c9d1d9" font-size="13">documentation required</text>

  <!-- doc-required continues to DTR -->
  <line x1="740" y1="646" x2="740" y2="686" stroke="#00ffff" stroke-width="2" marker-end="url(#ctf-arrow)"/>
  <rect x="640" y="688" width="200" height="56" rx="10" fill="#0b1620" stroke="#00ffff" stroke-width="1.8"/>
  <text x="740" y="713" text-anchor="middle" fill="#00ffff" font-size="16" font-weight="700">DTR</text>
  <text x="740" y="731" text-anchor="middle" fill="#8b949e" font-size="12">collect documentation</text>

  <text x="330" y="712" text-anchor="middle" fill="#8b949e" font-size="12.5">CRD returns CDS cards to the</text>
  <text x="330" y="730" text-anchor="middle" fill="#8b949e" font-size="12.5">provider describing what is required.</text>

  <text x="450" y="784" text-anchor="middle" fill="#8b949e" font-size="12">
    Reflects CrdController, CrdService, and the CHO Terminology Service. Rules and classifications are payer-configured.
  </text>
</svg>
