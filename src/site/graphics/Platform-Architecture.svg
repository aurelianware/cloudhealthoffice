<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="50%" style="stop-color:#0d1321"/>
      <stop offset="100%" style="stop-color:#0a0e17"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#111827;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#0d1321;stop-opacity:0.95"/>
    </linearGradient>
    <linearGradient id="statGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="btnCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#00f0ff;stop-opacity:0.04"/>
    </linearGradient>
    <linearGradient id="btnGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0.03"/>
    </linearGradient>
    <linearGradient id="footerBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.08"/>
      <stop offset="50%" style="stop-color:#00f0ff;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0.08"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2744" stroke-width="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->

  <rect width="1100" height="680" fill="url(#bg)"/>
  <rect width="1100" height="680" fill="url(#grid)" opacity="0.25"/>

  <!-- ═══════ PAGE TITLE ═══════ -->

<text x="55" y="50" fill="#00ff88" font-size="28" font-weight="bold" filter="url(#glow)" letter-spacing="1">Architecture</text>
<text x="55" y="80" fill="#94a3b8" font-size="12" letter-spacing="0.5">Cloud Health Office is a cloud-native multi-tenant SaaS platform that processes healthcare EDI transactions for</text>
<text x="55" y="98" fill="#94a3b8" font-size="12" letter-spacing="0.5">unlimited health plans. Configuration-driven, backend-agnostic, and deployable to any Kubernetes cluster.</text>

  <!-- ═══════ MAIN CARD ═══════ -->

  <rect x="55" y="125" width="990" height="470" rx="8" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Card Title -->

<text x="550" y="168" fill="#e2e8f0" font-size="22" text-anchor="middle" font-weight="bold" letter-spacing="1">Cloud Health Office</text>
<text x="550" y="192" fill="#64748b" font-size="11" text-anchor="middle" letter-spacing="1">Kubernetes-Native HIPAA Platform · X12 EDI · FHIR R4 · Prior Auth Automation</text>

  <!-- Cloud Provider Buttons -->

  <rect x="350" y="208" width="110" height="30" rx="4" fill="url(#btnCyan)" stroke="#00f0ff" stroke-width="0.8"/>
  <text x="405" y="228" fill="#00f0ff" font-size="10" text-anchor="middle" font-weight="bold">Azure AKS</text>

  <rect x="478" y="208" width="110" height="30" rx="4" fill="url(#btnCyan)" stroke="#ff9f1c" stroke-width="0.8"/>
  <text x="533" y="228" fill="#ff9f1c" font-size="10" text-anchor="middle" font-weight="bold">AWS EKS</text>

  <rect x="606" y="208" width="110" height="30" rx="4" fill="url(#btnCyan)" stroke="#00f0ff" stroke-width="0.8"/>
  <text x="661" y="228" fill="#00f0ff" font-size="10" text-anchor="middle" font-weight="bold">GCP GKE</text>

  <!-- ═══════ STATS ROW ═══════ -->

  <rect x="90" y="258" width="920" height="65" rx="6" fill="#0a0e17" opacity="0.6" stroke="#1a2744" stroke-width="0.6"/>

  <!-- Stat: Microservices -->

<text x="168" y="288" fill="url(#statGlow)" font-size="26" text-anchor="middle" font-weight="bold" filter="url(#glow)">31</text>
<text x="168" y="308" fill="#4a6a8a" font-size="8" text-anchor="middle" letter-spacing="2">MICROSERVICES</text>

  <!-- Stat: Calc Engines -->

<text x="322" y="288" fill="url(#statGlow)" font-size="26" text-anchor="middle" font-weight="bold" filter="url(#glow)">9</text>
<text x="322" y="308" fill="#4a6a8a" font-size="8" text-anchor="middle" letter-spacing="2">CALC ENGINES</text>

  <!-- Stat: X12 Parsers -->

<text x="476" y="288" fill="url(#statGlow)" font-size="26" text-anchor="middle" font-weight="bold" filter="url(#glow)">6</text>
<text x="476" y="308" fill="#4a6a8a" font-size="8" text-anchor="middle" letter-spacing="2">X12 PARSERS</text>

  <!-- Stat: FHIR R4 APIs -->

<text x="630" y="288" fill="url(#statGlow)" font-size="26" text-anchor="middle" font-weight="bold" filter="url(#glow)">7</text>
<text x="630" y="308" fill="#4a6a8a" font-size="8" text-anchor="middle" letter-spacing="2">FHIR R4 APIs</text>

  <!-- Stat: Argo Workflows -->

<text x="784" y="288" fill="url(#statGlow)" font-size="26" text-anchor="middle" font-weight="bold" filter="url(#glow)">17</text>
<text x="784" y="308" fill="#4a6a8a" font-size="8" text-anchor="middle" letter-spacing="2">ARGO WORKFLOWS</text>

  <!-- Stat: Portal Pages -->

<text x="938" y="288" fill="url(#statGlow)" font-size="26" text-anchor="middle" font-weight="bold" filter="url(#glow)">50</text>
<text x="938" y="308" fill="#4a6a8a" font-size="8" text-anchor="middle" letter-spacing="2">PORTAL PAGES</text>

  <!-- ═══════ ENGINE PILLS — ROW 1 ═══════ -->

  <rect x="100" y="342" width="130" height="28" rx="14" fill="url(#btnCyan)" stroke="#00f0ff" stroke-width="0.7"/>
  <text x="165" y="360" fill="#00f0ff" font-size="9" text-anchor="middle">Benefit Engine</text>

  <rect x="248" y="342" width="145" height="28" rx="14" fill="url(#btnCyan)" stroke="#00f0ff" stroke-width="0.7"/>
  <text x="320" y="360" fill="#00f0ff" font-size="9" text-anchor="middle">Fee Schedule Engine</text>

  <rect x="411" y="342" width="130" height="28" rx="14" fill="url(#btnCyan)" stroke="#00f0ff" stroke-width="0.7"/>
  <text x="476" y="360" fill="#00f0ff" font-size="9" text-anchor="middle">Risk Adjustment</text>

  <rect x="559" y="342" width="110" height="28" rx="14" fill="url(#btnCyan)" stroke="#00f0ff" stroke-width="0.7"/>
  <text x="614" y="360" fill="#00f0ff" font-size="9" text-anchor="middle">COB Engine</text>

  <rect x="687" y="342" width="120" height="28" rx="14" fill="url(#btnCyan)" stroke="#00f0ff" stroke-width="0.7"/>
  <text x="747" y="360" fill="#00f0ff" font-size="9" text-anchor="middle">NCCI Engine</text>

  <rect x="825" y="342" width="130" height="28" rx="14" fill="url(#btnCyan)" stroke="#00f0ff" stroke-width="0.7"/>
  <text x="890" y="360" fill="#00f0ff" font-size="9" text-anchor="middle">Accumulators</text>

  <!-- ENGINE PILLS — ROW 2 -->

  <rect x="100" y="382" width="120" height="28" rx="14" fill="url(#btnCyan)" stroke="#00f0ff" stroke-width="0.7"/>
  <text x="160" y="400" fill="#00f0ff" font-size="9" text-anchor="middle">Claims Scrub</text>

  <rect x="238" y="382" width="140" height="28" rx="14" fill="url(#btnCyan)" stroke="#00f0ff" stroke-width="0.7"/>
  <text x="308" y="400" fill="#00f0ff" font-size="9" text-anchor="middle">Operating Mode</text>

  <rect x="396" y="382" width="145" height="28" rx="14" fill="url(#btnCyan)" stroke="#00f0ff" stroke-width="0.7"/>
  <text x="468" y="400" fill="#00f0ff" font-size="9" text-anchor="middle">Document Store</text>

  <rect x="559" y="382" width="120" height="28" rx="14" fill="url(#btnCyan)" stroke="#00f0ff" stroke-width="0.7"/>
  <text x="619" y="400" fill="#00f0ff" font-size="9" text-anchor="middle">Encounter</text>

  <rect x="697" y="382" width="140" height="28" rx="14" fill="url(#btnCyan)" stroke="#00f0ff" stroke-width="0.7"/>
  <text x="767" y="400" fill="#00f0ff" font-size="9" text-anchor="middle">Terminology</text>

  <!-- ═══════ EDI PARSER PILLS ═══════ -->

  <rect x="100" y="432" width="120" height="28" rx="14" fill="url(#btnGreen)" stroke="#64748b" stroke-width="0.7"/>
  <text x="160" y="450" fill="#94a3b8" font-size="9" text-anchor="middle">837 Claims</text>

  <rect x="238" y="432" width="130" height="28" rx="14" fill="url(#btnGreen)" stroke="#64748b" stroke-width="0.7"/>
  <text x="303" y="450" fill="#94a3b8" font-size="9" text-anchor="middle">835 Remittance</text>

  <rect x="386" y="432" width="145" height="28" rx="14" fill="url(#btnGreen)" stroke="#64748b" stroke-width="0.7"/>
  <text x="458" y="450" fill="#94a3b8" font-size="9" text-anchor="middle">270/271 Eligibility</text>

  <rect x="549" y="432" width="130" height="28" rx="14" fill="url(#btnGreen)" stroke="#64748b" stroke-width="0.7"/>
  <text x="614" y="450" fill="#94a3b8" font-size="9" text-anchor="middle">278 Prior Auth</text>

  <rect x="697" y="432" width="140" height="28" rx="14" fill="url(#btnGreen)" stroke="#64748b" stroke-width="0.7"/>
  <text x="767" y="450" fill="#94a3b8" font-size="9" text-anchor="middle">275 Attachments</text>

  <rect x="855" y="432" width="130" height="28" rx="14" fill="url(#btnGreen)" stroke="#64748b" stroke-width="0.7"/>
  <text x="920" y="450" fill="#94a3b8" font-size="9" text-anchor="middle">834 Enrollment</text>

  <!-- ═══════ FOOTER BAR ═══════ -->

  <rect x="90" y="480" width="920" height="32" rx="4" fill="url(#footerBar)" stroke="#1a2744" stroke-width="0.6"/>
  <text x="550" y="501" fill="#64748b" font-size="9.5" text-anchor="middle" letter-spacing="0.8">Deploy Anywhere · Free for Non-Production · BSL 1.1 License · .NET 8 · Python 3.11 · Node.js 20</text>

  <!-- ═══════ SUMMARY LINE BELOW CARD ═══════ -->

<text x="550" y="555" fill="#4a6a8a" font-size="11" text-anchor="middle" letter-spacing="0.5">Platform overview — 31 microservices, 9 engines, 6 parsers, 7 FHIR APIs, 17 Argo Workflows</text>

  <!-- ═══════ OVERVIEW HEADING ═══════ -->

<text x="55" y="610" fill="#00ff88" font-size="24" font-weight="bold" filter="url(#glow)">Overview</text>

</svg>