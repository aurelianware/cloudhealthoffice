<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif">
  <title id="title">Cloud Health Office — augment-mode platform architecture</title>
  <desc id="desc">Your existing core admin system (QNXT, Facets, HealthEdge, Amisys) stays the system of record. Cloud Health Office reads, augments, and proves alongside it, delivering three adoption layers: Compliance Accelerator, Progressive Modernization, and the full CAPS platform. No rip-and-replace. Validate in parallel, then modernize on your timeline.</desc>

  <defs>
    <linearGradient id="choHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E6FB0"/>
      <stop offset="100%" stop-color="#0FA1B4"/>
    </linearGradient>
    <radialGradient id="lift" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#0FA1B4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0FA1B4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#183a5c" flood-opacity="0.12"/>
    </filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#183a5c" flood-opacity="0.09"/>
    </filter>
    <marker id="arrowR" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#2E6FB0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowL" markerWidth="11" markerHeight="11" refX="3" refY="5" orient="auto">
      <path d="M9 1 L2 5 L9 9" fill="none" stroke="#9DB0C0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <style>
      .eyebrow{fill:#6B7E90;font-size:12px;font-weight:700;letter-spacing:2.4px}
      .h1{fill:#12283D;font-size:24px;font-weight:800;letter-spacing:-0.2px}
      .lgTitle{fill:#ffffff;font-size:16.5px;font-weight:700}
      .lgSub{fill:#5E7183;font-size:11.5px;font-weight:700;letter-spacing:1.3px}
      .cellLabel{fill:#33465A;font-size:13.5px;font-weight:700}
      .choEye{fill:#D7ECF3;font-size:11px;font-weight:700;letter-spacing:2px}
      .choTitle{fill:#ffffff;font-size:22px;font-weight:800}
      .lyTag{fill:#ffffff;font-size:10px;font-weight:700;letter-spacing:2px}
      .lyNum{fill:#ffffff;font-size:46px;font-weight:800}
      .lyTitle{fill:#152A3F;font-size:16.5px;font-weight:800}
      .lySub{fill:#61748A;font-size:12.5px;font-weight:600}
      .chip{fill:#213A54;font-size:12px;font-weight:600}
      .miniChip{fill:#5A6E85;font-size:11px;font-weight:600}
      .flow{fill:#12283D;font-size:16px;font-weight:800;letter-spacing:0.3px}
      .flowStrong{fill:#26405A;font-size:12.5px;font-weight:700}
      .flowMuted{fill:#7488A0;font-size:12px;font-weight:500}
      .supLabel{fill:#26405A;font-size:12.5px;font-weight:700}
      .foot{fill:#3B5069;font-size:15px;font-weight:600}
      .tagRight{fill:#0F8F9F;font-size:10.5px;font-weight:700;letter-spacing:1.6px}
      .ic{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    </style>

    <!-- icon symbols (24x24, stroke=currentColor via color on <use>) -->
    <symbol id="ic-claims" viewBox="0 0 24 24"><g class="ic" stroke="currentColor"><path d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 15h6M9 18h4"/></g></symbol>
    <symbol id="ic-enroll" viewBox="0 0 24 24"><g class="ic" stroke="currentColor"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16.5c.6-1.6 4.9-1.6 6 0"/><path d="M14 10h4M14 13h4"/></g></symbol>
    <symbol id="ic-provider" viewBox="0 0 24 24"><g class="ic" stroke="currentColor"><circle cx="6" cy="7" r="2.4"/><circle cx="18" cy="7" r="2.4"/><circle cx="12" cy="17" r="2.4"/><path d="M7.7 8.6l2.6 6.8M16.3 8.6l-2.6 6.8"/></g></symbol>
    <symbol id="ic-finance" viewBox="0 0 24 24"><g class="ic" stroke="currentColor"><path d="M4 20h16"/><path d="M7 20v-6M12 20V8M17 20v-9"/><path d="M14.5 5.5l2.5-2 2 2.4"/></g></symbol>
    <symbol id="ic-k8s" viewBox="0 0 24 24"><g class="ic" stroke="currentColor"><path d="M12 3l7.5 3.6v8.8L12 21l-7.5-5.6V6.6z"/><circle cx="12" cy="12" r="2.6"/><path d="M12 3v6.4M19.5 6.6l-5.4 3.9M4.5 6.6l5.4 3.9M12 14.6V21M9.9 13.4L5 16.4M14.1 13.4l4.9 3"/></g></symbol>
    <symbol id="ic-source" viewBox="0 0 24 24"><g class="ic" stroke="currentColor"><path d="M9 8l-4 4 4 4M15 8l4 4-4 4M13.5 5l-3 14"/></g></symbol>
    <symbol id="ic-evidence" viewBox="0 0 24 24"><g class="ic" stroke="currentColor"><path d="M12 3l7 3v5.2c0 4.8-3 7.6-7 9.3-4-1.7-7-4.5-7-9.3V6z"/><path d="M9 12l2 2 4-4"/></g></symbol>
    <symbol id="ic-cloud" viewBox="0 0 24 24"><g class="ic" stroke="currentColor"><path d="M7.2 18a4 4 0 0 1-.2-8 5.2 5.2 0 0 1 9.9-1.1A3.7 3.7 0 0 1 17.5 18z"/></g></symbol>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1240" height="760" rx="22" fill="#EFF4F9"/>
  <!-- subtle lift behind the CHO side -->
  <ellipse cx="930" cy="360" rx="430" ry="360" fill="url(#lift)"/>

  <!-- header -->
  <text x="64" y="52" class="eyebrow">CLOUD HEALTH OFFICE&#160;&#160;&#183;&#160;&#160;PLATFORM ARCHITECTURE</text>
  <text x="64" y="86" class="h1">Modernize on top of your system of record</text>
  <g filter="url(#soft2)">
    <rect x="1004" y="50" width="172" height="34" rx="17" fill="#ffffff" stroke="#CFE3E9"/>
  </g>
  <text x="1090" y="72" text-anchor="middle" class="tagRight">AUGMENT&#160;&#183;&#160;DON&#8217;T REPLACE</text>
  <line x1="64" y1="106" x2="1176" y2="106" stroke="#D3DEE9" stroke-width="1"/>

  <!-- ============ LEFT: Existing Core Admin System ============ -->
  <g filter="url(#soft)">
    <rect x="64" y="130" width="368" height="430" rx="18" fill="#E6EBF1" stroke="#CAD5E0"/>
  </g>
  <!-- header strip (top-rounded) -->
  <path d="M64 178 V148 A18 18 0 0 1 82 130 H414 A18 18 0 0 1 432 148 V178 Z" fill="#46586B"/>
  <text x="84" y="159" class="lgTitle">Existing Core Admin System</text>
  <text x="84" y="204" class="lgSub">QNXT&#160;&#160;&#183;&#160;&#160;FACETS&#160;&#160;&#183;&#160;&#160;HEALTHEDGE&#160;&#160;&#183;&#160;&#160;AMISYS</text>

  <!-- 2x2 domain cells -->
  <g>
    <!-- Claims -->
    <g filter="url(#soft2)"><rect x="88" y="224" width="152" height="152" rx="12" fill="#ffffff" stroke="#D9E1EA"/></g>
    <use href="#ic-claims" x="146" y="258" width="36" height="36" style="color:#46586B"/>
    <text x="164" y="342" text-anchor="middle" class="cellLabel">Claims</text>
    <!-- Enrollment -->
    <g filter="url(#soft2)"><rect x="256" y="224" width="152" height="152" rx="12" fill="#ffffff" stroke="#D9E1EA"/></g>
    <use href="#ic-enroll" x="314" y="258" width="36" height="36" style="color:#46586B"/>
    <text x="332" y="342" text-anchor="middle" class="cellLabel">Enrollment</text>
    <!-- Provider -->
    <g filter="url(#soft2)"><rect x="88" y="392" width="152" height="152" rx="12" fill="#ffffff" stroke="#D9E1EA"/></g>
    <use href="#ic-provider" x="146" y="426" width="36" height="36" style="color:#46586B"/>
    <text x="164" y="510" text-anchor="middle" class="cellLabel">Provider</text>
    <!-- Financials -->
    <g filter="url(#soft2)"><rect x="256" y="392" width="152" height="152" rx="12" fill="#ffffff" stroke="#D9E1EA"/></g>
    <use href="#ic-finance" x="314" y="426" width="36" height="36" style="color:#46586B"/>
    <text x="332" y="510" text-anchor="middle" class="cellLabel">Financials</text>
  </g>

  <!-- ============ MIDDLE: Read / Augment / Prove ============ -->
  <text x="546" y="312" text-anchor="middle" class="flow" font-size="15">Read&#160;/&#160;Augment&#160;/&#160;Prove</text>
  <!-- forward augmentation channel -->
  <line x1="452" y1="352" x2="642" y2="352" stroke="#C6D3E0" stroke-width="6" stroke-linecap="round"/>
  <line x1="452" y1="352" x2="640" y2="352" stroke="#2E6FB0" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrowR)"/>
  <!-- three flow nodes -->
  <circle cx="472" cy="352" r="6" fill="#ffffff" stroke="#2E6FB0" stroke-width="2.4"/>
  <circle cx="548" cy="352" r="7" fill="#2E6FB0"/>
  <circle cx="624" cy="352" r="6" fill="#ffffff" stroke="#0FA1B4" stroke-width="2.4"/>
  <!-- subtle read-back / evidence loop -->
  <path d="M636 372 H460" fill="none" stroke="#9DB0C0" stroke-width="1.4" stroke-dasharray="3 5" marker-end="url(#arrowL)"/>
  <!-- caption -->
  <text x="548" y="398" text-anchor="middle" class="flowStrong">No rip-and-replace.</text>
  <text x="548" y="416" text-anchor="middle" class="flowMuted">System of record stays intact.</text>

  <!-- ============ RIGHT: Cloud Health Office ============ -->
  <g filter="url(#soft)">
    <rect x="664" y="130" width="512" height="466" rx="18" fill="#ffffff" stroke="#D3E0EA"/>
  </g>
  <!-- header strip (top-rounded, gradient) -->
  <path d="M664 198 V148 A18 18 0 0 1 682 130 H1158 A18 18 0 0 1 1176 148 V198 Z" fill="url(#choHeader)"/>
  <!-- logo mark -->
  <rect x="684" y="144" width="40" height="40" rx="10" fill="#ffffff" opacity="0.95"/>
  <use href="#ic-cloud" x="691" y="151" width="26" height="26" style="color:#2E6FB0"/>
  <text x="740" y="159" class="choEye">AUGMENTATION PLATFORM</text>
  <text x="740" y="182" class="choTitle">Cloud Health Office</text>

  <!-- Layer 1 -->
  <g>
    <rect x="684" y="210" width="472" height="152" rx="12" fill="#F5FAFB" stroke="#CDE7EC"/>
    <path d="M776 210 H696 A12 12 0 0 0 684 222 V350 A12 12 0 0 0 696 362 H776 Z" fill="#0FA1B4"/>
    <text x="730" y="272" text-anchor="middle" class="lyTag">LAYER</text>
    <text x="730" y="318" text-anchor="middle" class="lyNum">1</text>
    <text x="796" y="242" class="lyTitle">Compliance Accelerator</text>
    <!-- 2x2 capability chips -->
    <g>
      <rect x="796" y="258" width="164" height="32" rx="8" fill="#ffffff" stroke="#D5E6EA"/>
      <circle cx="812" cy="274" r="3.2" fill="#0FA1B4"/>
      <text x="824" y="278" class="chip">FHIR Patient Access</text>
      <rect x="972" y="258" width="164" height="32" rx="8" fill="#ffffff" stroke="#D5E6EA"/>
      <circle cx="988" cy="274" r="3.2" fill="#0FA1B4"/>
      <text x="1000" y="278" class="chip">Prior Auth / PAS</text>
      <rect x="796" y="298" width="164" height="32" rx="8" fill="#ffffff" stroke="#D5E6EA"/>
      <circle cx="812" cy="314" r="3.2" fill="#0FA1B4"/>
      <text x="824" y="318" class="chip">Payer-to-Payer</text>
      <rect x="972" y="298" width="164" height="32" rx="8" fill="#ffffff" stroke="#D5E6EA"/>
      <circle cx="988" cy="314" r="3.2" fill="#0FA1B4"/>
      <text x="1000" y="318" class="chip">Provider Directory</text>
    </g>
  </g>

  <!-- Layer 2 -->
  <g>
    <rect x="684" y="374" width="472" height="96" rx="12" fill="#F3F8FD" stroke="#CFE0F0"/>
    <path d="M776 374 H696 A12 12 0 0 0 684 386 V458 A12 12 0 0 0 696 470 H776 Z" fill="#2E6FB0"/>
    <text x="730" y="410" text-anchor="middle" class="lyTag">LAYER</text>
    <text x="730" y="446" text-anchor="middle" class="lyNum">2</text>
    <text x="796" y="404" class="lyTitle">Progressive Modernization</text>
    <text x="796" y="424" class="lySub">Domain-by-domain services, on your timeline</text>
    <g>
      <rect x="796" y="434" width="70" height="22" rx="7" fill="#ffffff" stroke="#D2DFF0"/>
      <text x="831" y="449" text-anchor="middle" class="miniChip">Members</text>
      <rect x="874" y="434" width="62" height="22" rx="7" fill="#ffffff" stroke="#D2DFF0"/>
      <text x="905" y="449" text-anchor="middle" class="miniChip">Claims</text>
      <rect x="944" y="434" width="70" height="22" rx="7" fill="#ffffff" stroke="#D2DFF0"/>
      <text x="979" y="449" text-anchor="middle" class="miniChip">Provider</text>
      <rect x="1022" y="434" width="68" height="22" rx="7" fill="#ffffff" stroke="#D2DFF0"/>
      <text x="1056" y="449" text-anchor="middle" class="miniChip">Finance</text>
    </g>
  </g>

  <!-- Layer 3 -->
  <g>
    <rect x="684" y="482" width="472" height="96" rx="12" fill="#F2F3FA" stroke="#D3D7EC"/>
    <path d="M776 482 H696 A12 12 0 0 0 684 494 V566 A12 12 0 0 0 696 578 H776 Z" fill="#2A3F7E"/>
    <text x="730" y="518" text-anchor="middle" class="lyTag">LAYER</text>
    <text x="730" y="554" text-anchor="middle" class="lyNum">3</text>
    <text x="796" y="516" class="lyTitle">Full CAPS Platform</text>
    <text x="796" y="537" class="lySub">Complete cloud administration platform</text>
    <rect x="1044" y="500" width="94" height="24" rx="12" fill="#ffffff" stroke="#C7CEE8"/>
    <text x="1091" y="516" text-anchor="middle" class="tagRight" style="fill:#3A4E8E">TARGET STATE</text>
  </g>

  <!-- ============ Supporting capability chips ============ -->
  <g>
    <g filter="url(#soft2)"><rect x="146" y="620" width="190" height="42" rx="21" fill="#ffffff" stroke="#D6E0EA"/></g>
    <use href="#ic-k8s" x="164" y="631" width="20" height="20" style="color:#2E6FB0"/>
    <text x="194" y="646" class="supLabel">Kubernetes-native</text>

    <g filter="url(#soft2)"><rect x="360" y="620" width="190" height="42" rx="21" fill="#ffffff" stroke="#D6E0EA"/></g>
    <use href="#ic-source" x="378" y="631" width="20" height="20" style="color:#2E6FB0"/>
    <text x="408" y="646" class="supLabel">Source-available</text>

    <g filter="url(#soft2)"><rect x="574" y="620" width="175" height="42" rx="21" fill="#ffffff" stroke="#D6E0EA"/></g>
    <use href="#ic-evidence" x="592" y="631" width="20" height="20" style="color:#1F9D74"/>
    <text x="622" y="646" class="supLabel">Evidence-led</text>

    <g filter="url(#soft2)"><rect x="773" y="620" width="320" height="42" rx="21" fill="#ffffff" stroke="#D6E0EA"/></g>
    <use href="#ic-cloud" x="791" y="631" width="20" height="20" style="color:#0FA1B4"/>
    <text x="821" y="646" class="supLabel">Deploy in your cloud&#160;&#160;&#183;&#160;&#160;Azure&#160;/&#160;AWS&#160;/&#160;GCP</text>
  </g>

  <!-- ============ Footer note ============ -->
  <line x1="64" y1="690" x2="1176" y2="690" stroke="#D3DEE9" stroke-width="1"/>
  <text x="620" y="720" text-anchor="middle" class="foot">Validate in parallel&#160;&#160;<tspan fill="#0F8F9F" font-weight="800">&#8594;</tspan>&#160;&#160;modernize on your timeline.</text>
</svg>
