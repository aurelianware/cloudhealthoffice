<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-labelledby="cho-map-title cho-map-desc" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">
<title id="cho-map-title">Where Cloud Health Office plugs into payer infrastructure and the CMS interoperability APIs</title>
<desc id="cho-map-desc">Three columns. On the left, who calls a health plan's APIs: members through apps, the public, in-network providers, other payers, and providers ordering care. In the middle, the five CMS APIs Cloud Health Office serves. Patient Access, required by CMS-9115-F with prior authorization data added by CMS-0057-F, uses US Core, CARIN Blue Button and PDex with a member-bound SMART token and is checked by the US Core and CARIN Blue Button Inferno kits. Provider Directory, required by CMS-9115-F, uses Da Vinci Plan-Net, is public without authentication, and is checked by the Plan-Net kit. Provider Access and Payer-to-Payer, required by CMS-0057-F from January 1, 2027, use FHIR Bulk Data with SMART Backend Services and are checked by the Bulk Data kit. Prior Authorization, required by CMS-0057-F from January 1, 2027, uses Da Vinci CRD, DTR and PAS and is checked by exchanges with the HL7 Da Vinci reference payer. Shared underneath every API: FHIR R4, consent and attribution, audit, and tenant isolation. On the right, the plan's systems: an existing core such as QNXT, Facets or HealthEdge reached through adapters built per engagement, or Cloud Health Office core modules replacing the system of record one domain at a time, plus clinical and utilization management data.</desc>
