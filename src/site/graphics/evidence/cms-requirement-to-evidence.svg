<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 732" role="img" aria-labelledby="cho-ev-title cho-ev-desc" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">
<title id="cho-ev-title">From CMS requirement to evidence: what proves each payer API requirement</title>
<desc id="cho-ev-desc">A table-like flow with four columns: what the rule requires, the API, the standard, and what proves it. Using the ONC API standards from CMS-9115-F and CMS-0057-F applies to every payer API, uses FHIR R4, US Core 3.1.1 or later and SMART App Launch, and is checked by the Inferno US Core kit. Giving members their claims and encounters through apps is the Patient Access API, uses CARIN Blue Button with a member-bound SMART token, and is checked by the Inferno CARIN Blue Button kit. Publishing the provider directory to the public is the Provider Directory API, uses Da Vinci PDex Plan-Net with no authentication, and is checked by the Inferno Plan-Net kit. Letting providers and other payers export member data in bulk is the Provider Access and Payer-to-Payer APIs, due January 1, 2027, uses FHIR Bulk Data and SMART Backend Services, and is checked by the Inferno Bulk Data kit. Electronic prior authorization uses Da Vinci CRD, DTR and PAS and is evidenced by exchanges with the HL7 Da Vinci reference payer and by Cloud Health Office acceptance scenarios. Decision timeframes, denial reasons, metrics, attribution and consent have no interface standard: Cloud Health Office acceptance scenarios cover its behaviour, and no test kit can check them. The kinds of evidence are published separately, never combined into one score, and none is certification.</desc>
