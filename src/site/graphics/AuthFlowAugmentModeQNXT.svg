  <text x="1000" y="383" fill="#00ff88" font-size="9" text-anchor="middle" letter-spacing="2" font-weight="bold">KEY PRINCIPLE</text>
  <line x1="850" y1="393" x2="1150" y2="393" stroke="#00ff88" stroke-width="0.3" opacity="0.3"/>
  <text x="860" y="412" fill="#6ad4a0" font-size="8.5">QNXT never sees a request that</text>
  <text x="860" y="428" fill="#6ad4a0" font-size="8.5">hasn't cleared CHO's provider</text>
  <text x="860" y="444" fill="#6ad4a0" font-size="8.5">integrity + TX compliance gates.</text>

  <!-- PEMS Detail -->

