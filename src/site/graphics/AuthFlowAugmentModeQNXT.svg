  <text x="425" y="214" fill="#4a6a8a" font-size="8" text-anchor="middle">Unified Auth Request Model</text>

  <!-- ═══════ ROW 2: PROVIDER VERIFICATION ═══════ -->

  <line x1="425" y1="230" x2="425" y2="270" stroke="#00f0ff" stroke-width="1.2" marker-end="url(#aCyan)" opacity="0.6"/>

  <rect x="315" y="275" width="220" height="95" rx="3" fill="url(#boxAmber)" stroke="#ff9f1c" stroke-width="1.2"/>
  <text x="425" y="297" fill="#ff9f1c" font-size="10" text-anchor="middle" font-weight="bold" filter="url(#glow)">PROVIDER VERIFICATION</text>
  <text x="425" y="314" fill="#d4a66a" font-size="9" text-anchor="middle">ProviderVerificationService</text>
  <line x1="335" y1="322" x2="515" y2="322" stroke="#ff9f1c" stroke-width="0.4" opacity="0.3"/>
