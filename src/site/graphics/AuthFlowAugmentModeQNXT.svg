  <line x1="450" y1="750" x2="475" y2="785" stroke="#64748b" stroke-width="1" marker-end="url(#aCyan)" opacity="0.5"/>

  <rect x="310" y="790" width="110" height="55" rx="3" fill="url(#boxCyan)" stroke="#00f0ff" stroke-width="0.8"/>
