  <text x="525" y="78" fill="#00f0ff" font-size="9" text-anchor="middle" opacity="0.4" letter-spacing="3">CHO COMPLIANCE LAYER</text>

  <!-- ═══════ ROW 1: DUAL INGRESS ═══════ -->

  <!-- X12 278 via Availity -->

  <rect x="30" y="100" width="210" height="80" rx="3" fill="url(#boxSlate)" stroke="#64748b" stroke-width="1"/>
