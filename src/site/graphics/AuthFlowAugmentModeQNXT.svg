  <text x="135" y="152" fill="#475569" font-size="8" text-anchor="middle">Existing Provider Flow</text>

  <!-- FHIR PAS $submit -->

  <rect x="30" y="200" width="210" height="80" rx="3" fill="url(#boxCyan)" stroke="#00f0ff" stroke-width="1"/>
  <text x="135" y="222" fill="#00f0ff" font-size="10" text-anchor="middle" font-weight="bold" filter="url(#glow)">FHIR PAS $submit</text>
  <text x="135" y="238" fill="#7ab8d4" font-size="9" text-anchor="middle">Da Vinci PAS IG</text>
  <text x="135" y="252" fill="#4a6a8a" font-size="8" text-anchor="middle">CMS-0057-F Mandate</text>

  <!-- Arrows from ingress to CHO Canonical -->

