  <rect x="860" y="258" width="12" height="12" rx="1" fill="url(#boxSlate)" stroke="#64748b" stroke-width="0.8"/>
  <text x="882" y="268" fill="#94a3b8" font-size="9">QNXT System of Record</text>
  <line x1="850" y1="285" x2="1150" y2="285" stroke="#1a2744" stroke-width="0.6"/>
  <text x="860" y="300" fill="#4a6a8a" font-size="8">CHO = Regulatory Brain</text>
  <text x="860" y="314" fill="#4a6a8a" font-size="8">QNXT = Operational Ledger</text>
  <text x="860" y="328" fill="#2a4a6a" font-size="7">ICoreAdminAdapter · Augment Not Replace</text>

