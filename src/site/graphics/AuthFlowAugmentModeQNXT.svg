  <text x="490" y="825" fill="#64748b" font-size="7.5" text-anchor="middle">X12 278 Back</text>
  <text x="490" y="837" fill="#64748b" font-size="7.5" text-anchor="middle">to Availity</text>

  <!-- ═══════ LEGEND ═══════ -->

