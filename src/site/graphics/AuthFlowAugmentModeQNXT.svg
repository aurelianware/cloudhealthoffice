  <text x="425" y="731" fill="#64748b" font-size="8" text-anchor="middle">Claims · Member · Provider</text>
  <text x="425" y="743" fill="#475569" font-size="8" text-anchor="middle">ICoreAdminAdapter Interface</text>

<text x="308" y="710" fill="#64748b" font-size="7" text-anchor="end" opacity="0.5">API / HL7 /</text>
<text x="308" y="722" fill="#64748b" font-size="7" text-anchor="end" opacity="0.5">Stored Proc</text>

