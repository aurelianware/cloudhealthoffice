  <line x1="850" y1="513" x2="1150" y2="513" stroke="#a855f7" stroke-width="0.3" opacity="0.3"/>
  <text x="860" y="531" fill="#c084fc" font-size="8">▸ Active PEMS enrollment status</text>
  <text x="860" y="547" fill="#c084fc" font-size="8">▸ Service area / county match</text>
  <text x="860" y="563" fill="#c084fc" font-size="8">▸ Provider type authorization</text>
  <text x="860" y="579" fill="#c084fc" font-size="8">▸ STAR / STAR+PLUS program eligibility</text>
  <text x="860" y="595" fill="#c084fc" font-size="8">▸ Rendering vs billing NPI check</text>
  <text x="860" y="611" fill="#5a4a7a" font-size="7">HHSC mandate — QNXT has no native gate</text>

  <!-- Dual Ingress Note -->

  <rect x="830" y="640" width="340" height="80" rx="4" fill="#0b1120" opacity="0.85" stroke="#64748b" stroke-width="0.6"/>
  <text x="1000" y="663" fill="#94a3b8" font-size="9" text-anchor="middle" letter-spacing="2" font-weight="bold">DUAL INGRESS</text>
  <line x1="850" y1="673" x2="1150" y2="673" stroke="#64748b" stroke-width="0.3" opacity="0.3"/>
  <text x="860" y="691" fill="#7a8a9a" font-size="8">278 from Availity = today's flow</text>
  <text x="860" y="707" fill="#7a8a9a" font-size="8">FHIR PAS $submit = CMS-0057-F path</text>

  <!-- Footer -->

  <rect x="0" y="880" width="1200" height="40" fill="#0b1120" opacity="0.9"/>
  <line x1="0" y1="880" x2="1200" y2="880" stroke="#1a2744" stroke-width="0.6"/>
  <text x="20" y="904" fill="#2a4a6a" font-size="8" letter-spacing="1">AURELIANWARE, INC. · CLOUD HEALTH OFFICE · CONFIDENTIAL</text>
  <text x="1180" y="904" fill="#2a4a6a" font-size="8" text-anchor="end" letter-spacing="1">v1.0 · APR 2026</text>
</svg>