  <text x="365" y="837" fill="#4a6a8a" font-size="7.5" text-anchor="middle">Da Vinci PAS</text>

  <rect x="435" y="790" width="110" height="55" rx="3" fill="url(#boxSlate)" stroke="#64748b" stroke-width="0.8"/>
