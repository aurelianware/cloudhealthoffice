<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="mt-title mt-desc">
  <title id="mt-title">Multi-tenant request routing</title>
  <desc id="mt-desc">Requests from multiple payers each carry an X-Tenant-ID header into a shared tenant context gateway that handles authentication, rate limiting, configuration routing, and audit logging, then fan out to fully isolated per-tenant lanes for configuration, database partition, message-bus topic, and audit log. One deployment serves every payer with zero shared secrets or configuration.</desc>
  <defs>
    <filter id="mtGlow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="mtA" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7" fill="#00ffff" opacity="0.75"/></marker>
    <marker id="mtB" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7" fill="#00ff88" opacity="0.75"/></marker>
    <marker id="mtC" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7" fill="#ffc800" opacity="0.75"/></marker>
  </defs>

  <rect width="1200" height="560" fill="#000000"/>

  <text x="600" y="46" font-family="Segoe UI, system-ui, sans-serif" font-size="27" font-weight="900" fill="#ffffff" text-anchor="middle">Multi-Tenant Request Routing</text>
  <text x="600" y="72" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#00ffff" text-anchor="middle" opacity="0.85">Single codebase &#183; per-tenant isolation via the X-Tenant-ID header</text>

  <!-- Column headers -->
  <text x="160" y="120" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#b0b0b0" text-anchor="middle" letter-spacing="2">PAYERS</text>
  <text x="595" y="120" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#b0b0b0" text-anchor="middle" letter-spacing="2">SHARED GATEWAY</text>
  <text x="995" y="120" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#b0b0b0" text-anchor="middle" letter-spacing="2">ISOLATED PER-TENANT LANES</text>

  <!-- Arrows: payers -> gateway -->
  <line x1="262" y1="200" x2="468" y2="200" stroke="#00ffff" stroke-width="1.4" opacity="0.6" marker-end="url(#mtA)"/>
  <line x1="262" y1="300" x2="468" y2="300" stroke="#00ff88" stroke-width="1.4" opacity="0.6" marker-end="url(#mtB)"/>
  <line x1="262" y1="400" x2="468" y2="400" stroke="#ffc800" stroke-width="1.4" opacity="0.6" marker-end="url(#mtC)"/>
  <text x="365" y="192" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#00ffff" text-anchor="middle" opacity="0.7">X-Tenant-ID: acme</text>
  <text x="365" y="292" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#00ff88" text-anchor="middle" opacity="0.7">X-Tenant-ID: rivergate</text>
  <text x="365" y="392" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#ffc800" text-anchor="middle" opacity="0.7">X-Tenant-ID: northstar</text>

  <!-- Payer boxes -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <g transform="translate(60,168)">
      <rect width="200" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(0,255,255,0.35)" stroke-width="1"/>
      <rect width="4" height="64" rx="2" fill="#00ffff"/>
      <text x="24" y="28" font-size="15" font-weight="700" fill="#ffffff">Payer A</text>
      <text x="24" y="48" font-size="11.5" fill="#b0b0b0">Medicaid MCO</text>
    </g>
    <g transform="translate(60,268)">
      <rect width="200" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(0,255,136,0.35)" stroke-width="1"/>
      <rect width="4" height="64" rx="2" fill="#00ff88"/>
      <text x="24" y="28" font-size="15" font-weight="700" fill="#ffffff">Payer B</text>
      <text x="24" y="48" font-size="11.5" fill="#b0b0b0">Medicare Advantage</text>
    </g>
    <g transform="translate(60,368)">
      <rect width="200" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,200,0,0.35)" stroke-width="1"/>
      <rect width="4" height="64" rx="2" fill="#ffc800"/>
      <text x="24" y="28" font-size="15" font-weight="700" fill="#ffffff">Payer C</text>
      <text x="24" y="48" font-size="11.5" fill="#b0b0b0">TPA</text>
    </g>
  </g>

  <!-- Gateway -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="470" y="150" width="250" height="300" rx="12" fill="rgba(0,255,255,0.05)" stroke="#00ffff" stroke-width="1.5" filter="url(#mtGlow)"/>
    <text x="595" y="188" font-size="16" font-weight="800" fill="#00ffff" text-anchor="middle">Tenant Context Gateway</text>
    <line x1="500" y1="206" x2="690" y2="206" stroke="rgba(0,255,255,0.2)" stroke-width="1"/>
    <g font-size="13.5" fill="#e6e6e6">
      <circle cx="512" cy="246" r="3" fill="#00ff88"/><text x="528" y="251">Authentication &amp; SMART scopes</text>
      <circle cx="512" cy="288" r="3" fill="#00ff88"/><text x="528" y="293">Rate limiting</text>
      <circle cx="512" cy="330" r="3" fill="#00ff88"/><text x="528" y="335">Configuration routing</text>
      <circle cx="512" cy="372" r="3" fill="#00ff88"/><text x="528" y="377">Audit logging</text>
    </g>
    <text x="595" y="424" font-size="11" fill="#b0b0b0" text-anchor="middle" opacity="0.8">Resolves tenant from header on every request</text>
  </g>

  <!-- Arrows: gateway -> lanes -->
  <line x1="722" y1="200" x2="828" y2="200" stroke="#00ffff" stroke-width="1.4" opacity="0.6" marker-end="url(#mtA)"/>
  <line x1="722" y1="300" x2="828" y2="300" stroke="#00ff88" stroke-width="1.4" opacity="0.6" marker-end="url(#mtB)"/>
  <line x1="722" y1="400" x2="828" y2="400" stroke="#ffc800" stroke-width="1.4" opacity="0.6" marker-end="url(#mtC)"/>

  <!-- Isolated tenant lanes -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <g transform="translate(830,168)">
      <rect width="330" height="64" rx="8" fill="rgba(0,255,255,0.05)" stroke="rgba(0,255,255,0.5)" stroke-width="1"/>
      <text x="12" y="26" font-size="12" font-weight="700" fill="#00ffff">Tenant A lane</text>
      <g font-size="10" fill="#b0b0b0">
        <rect x="12" y="36" width="70" height="18" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/><text x="47" y="49" text-anchor="middle">Config</text>
        <rect x="90" y="36" width="82" height="18" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/><text x="131" y="49" text-anchor="middle">DB partition</text>
        <rect x="180" y="36" width="70" height="18" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/><text x="215" y="49" text-anchor="middle">Bus topic</text>
        <rect x="258" y="36" width="60" height="18" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/><text x="288" y="49" text-anchor="middle">Audit</text>
      </g>
    </g>
    <g transform="translate(830,268)">
      <rect width="330" height="64" rx="8" fill="rgba(0,255,136,0.05)" stroke="rgba(0,255,136,0.5)" stroke-width="1"/>
      <text x="12" y="26" font-size="12" font-weight="700" fill="#00ff88">Tenant B lane</text>
      <g font-size="10" fill="#b0b0b0">
        <rect x="12" y="36" width="70" height="18" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/><text x="47" y="49" text-anchor="middle">Config</text>
        <rect x="90" y="36" width="82" height="18" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/><text x="131" y="49" text-anchor="middle">DB partition</text>
        <rect x="180" y="36" width="70" height="18" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/><text x="215" y="49" text-anchor="middle">Bus topic</text>
        <rect x="258" y="36" width="60" height="18" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/><text x="288" y="49" text-anchor="middle">Audit</text>
      </g>
    </g>
    <g transform="translate(830,368)">
      <rect width="330" height="64" rx="8" fill="rgba(255,200,0,0.05)" stroke="rgba(255,200,0,0.5)" stroke-width="1"/>
      <text x="12" y="26" font-size="12" font-weight="700" fill="#ffc800">Tenant C lane</text>
      <g font-size="10" fill="#b0b0b0">
        <rect x="12" y="36" width="70" height="18" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/><text x="47" y="49" text-anchor="middle">Config</text>
        <rect x="90" y="36" width="82" height="18" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/><text x="131" y="49" text-anchor="middle">DB partition</text>
        <rect x="180" y="36" width="70" height="18" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/><text x="215" y="49" text-anchor="middle">Bus topic</text>
        <rect x="258" y="36" width="60" height="18" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/><text x="288" y="49" text-anchor="middle">Audit</text>
      </g>
    </g>
  </g>

  <!-- Footer note -->
  <rect x="300" y="496" width="600" height="34" rx="17" fill="rgba(0,255,136,0.06)" stroke="rgba(0,255,136,0.25)" stroke-width="1"/>
  <text x="600" y="518" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#00ff88" text-anchor="middle">Onboard a new payer with a config file &#183; no code changes &#183; zero shared secrets</text>
</svg>
