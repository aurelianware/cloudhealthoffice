<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="it-title it-desc">
  <title id="it-title">Infrastructure topology</title>
  <desc id="it-desc">A Kubernetes cluster deployable to AKS, EKS, or GKE. Argo Events triggers (SFTP, webhook, schedule) feed Argo Workflows orchestration, which drives 36 .NET 8 microservices communicating over Azure Service Bus or Kafka, backed by a persistence layer of MongoDB or Cosmos DB, Redis, and Azure Storage Gen2. Cross-cutting rails provide secrets management via Key Vault or HashiCorp Vault and observability via Prometheus, Grafana, and Application Insights with PHI-safe logging.</desc>
  <defs>
    <filter id="itGlow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="itArr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7" fill="#00ffff" opacity="0.75"/></marker>
    <linearGradient id="itCyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00ffff"/><stop offset="1" stop-color="#00ff88"/></linearGradient>
  </defs>

  <rect width="1200" height="600" fill="#000000"/>

  <text x="600" y="44" font-family="Segoe UI, system-ui, sans-serif" font-size="27" font-weight="900" fill="#ffffff" text-anchor="middle">Infrastructure Topology</text>
  <text x="600" y="70" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#00ffff" text-anchor="middle" opacity="0.85">Kubernetes-native &#183; event-driven &#183; multi-cloud</text>

  <!-- Multi-cloud badges -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">
    <rect x="470" y="88" width="76" height="26" rx="13" fill="rgba(0,255,255,0.08)" stroke="rgba(0,255,255,0.35)"/><text x="508" y="105" fill="#00ffff" text-anchor="middle">Azure AKS</text>
    <rect x="562" y="88" width="72" height="26" rx="13" fill="rgba(0,255,255,0.08)" stroke="rgba(0,255,255,0.35)"/><text x="598" y="105" fill="#00ffff" text-anchor="middle">AWS EKS</text>
    <rect x="650" y="88" width="72" height="26" rx="13" fill="rgba(0,255,255,0.08)" stroke="rgba(0,255,255,0.35)"/><text x="686" y="105" fill="#00ffff" text-anchor="middle">GCP GKE</text>
  </g>

  <!-- Cluster frame -->
  <rect x="60" y="132" width="1080" height="446" rx="14" fill="rgba(0,255,255,0.02)" stroke="rgba(0,255,255,0.28)" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="82" y="158" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#b0b0b0" letter-spacing="1.5">KUBERNETES CLUSTER</text>
  <text x="1118" y="158" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#b0b0b0" text-anchor="end" letter-spacing="1.5" opacity="0.7">CROSS-CUTTING &#8594;</text>

  <!-- Main column layers -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <!-- L1 Argo Events -->
    <g transform="translate(95,175)">
      <rect width="735" height="52" rx="9" fill="rgba(0,255,255,0.05)" stroke="rgba(0,255,255,0.4)" stroke-width="1"/>
      <text x="20" y="24" font-size="15" font-weight="700" fill="#00ffff">Argo Events</text>
      <text x="20" y="42" font-size="11.5" fill="#b0b0b0">Event triggers</text>
      <g font-size="11" fill="#e6e6e6">
        <rect x="360" y="15" width="110" height="22" rx="11" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/><text x="415" y="30" text-anchor="middle">SFTP arrival</text>
        <rect x="480" y="15" width="100" height="22" rx="11" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/><text x="530" y="30" text-anchor="middle">Webhook</text>
        <rect x="590" y="15" width="120" height="22" rx="11" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/><text x="650" y="30" text-anchor="middle">Schedule</text>
      </g>
    </g>
    <line x1="462" y1="227" x2="462" y2="249" stroke="#00ffff" stroke-width="1.4" opacity="0.6" marker-end="url(#itArr)"/>

    <!-- L2 Argo Workflows -->
    <g transform="translate(95,251)">
      <rect width="735" height="52" rx="9" fill="rgba(0,255,255,0.05)" stroke="rgba(0,255,255,0.4)" stroke-width="1"/>
      <text x="20" y="24" font-size="15" font-weight="700" fill="#00ffff">Argo Workflows</text>
      <text x="20" y="42" font-size="11.5" fill="#b0b0b0">Kubernetes-native DAG orchestration &#183; 17 workflows</text>
    </g>
    <line x1="462" y1="303" x2="462" y2="327" stroke="#00ffff" stroke-width="1.4" opacity="0.6" marker-end="url(#itArr)"/>

    <!-- L3 Microservices -->
    <g transform="translate(95,329)">
      <rect width="735" height="64" rx="9" fill="rgba(0,255,136,0.05)" stroke="rgba(0,255,136,0.4)" stroke-width="1"/>
      <text x="20" y="26" font-size="15" font-weight="700" fill="#00ff88">36 Microservices</text>
      <text x="20" y="45" font-size="11.5" fill="#b0b0b0">C# / .NET 8 &#183; each owns its domain data</text>
      <g font-size="10.5" fill="#e6e6e6">
        <rect x="300" y="20" width="66" height="22" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/><text x="333" y="35" text-anchor="middle">Claims</text>
        <rect x="374" y="20" width="70" height="22" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/><text x="409" y="35" text-anchor="middle">Member</text>
        <rect x="452" y="20" width="72" height="22" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/><text x="488" y="35" text-anchor="middle">Provider</text>
        <rect x="532" y="20" width="70" height="22" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/><text x="567" y="35" text-anchor="middle">Benefit</text>
        <rect x="610" y="20" width="66" height="22" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/><text x="643" y="35" text-anchor="middle">Pricing</text>
        <rect x="684" y="20" width="40" height="22" rx="6" fill="rgba(0,255,136,0.08)" stroke="rgba(0,255,136,0.3)"/><text x="704" y="35" text-anchor="middle" fill="#00ff88">+31</text>
      </g>
    </g>
    <line x1="462" y1="393" x2="462" y2="417" stroke="#00ffff" stroke-width="1.4" opacity="0.6" marker-end="url(#itArr)"/>

    <!-- L4 Messaging -->
    <g transform="translate(95,419)">
      <rect width="735" height="52" rx="9" fill="rgba(0,255,255,0.05)" stroke="rgba(0,255,255,0.4)" stroke-width="1"/>
      <text x="20" y="24" font-size="15" font-weight="700" fill="#00ffff">Azure Service Bus / Kafka</text>
      <text x="20" y="42" font-size="11.5" fill="#b0b0b0">Async inter-service messaging &#183; per-tenant topics</text>
    </g>
    <line x1="462" y1="471" x2="462" y2="495" stroke="#00ffff" stroke-width="1.4" opacity="0.6" marker-end="url(#itArr)"/>

    <!-- L5 Persistence row -->
    <text x="95" y="490" font-size="11" font-weight="700" fill="#b0b0b0" letter-spacing="1.5" opacity="0.7">PERSISTENCE</text>
    <g font-size="11.5">
      <g transform="translate(95,499)">
        <rect width="234" height="56" rx="9" fill="rgba(255,255,255,0.03)" stroke="rgba(0,255,255,0.3)" stroke-width="1"/>
        <text x="16" y="24" font-weight="700" fill="#ffffff">MongoDB / Cosmos DB</text>
        <text x="16" y="43" font-size="11" fill="#b0b0b0">Tenant-partitioned documents</text>
      </g>
      <g transform="translate(345,499)">
        <rect width="234" height="56" rx="9" fill="rgba(255,255,255,0.03)" stroke="rgba(0,255,255,0.3)" stroke-width="1"/>
        <text x="16" y="24" font-weight="700" fill="#ffffff">Redis</text>
        <text x="16" y="43" font-size="11" fill="#b0b0b0">Accumulators &#183; session cache</text>
      </g>
      <g transform="translate(596,499)">
        <rect width="234" height="56" rx="9" fill="rgba(255,255,255,0.03)" stroke="rgba(0,255,255,0.3)" stroke-width="1"/>
        <text x="16" y="24" font-weight="700" fill="#ffffff">Azure Storage Gen2</text>
        <text x="16" y="43" font-size="11" fill="#b0b0b0">EDI data lake &#183; audit artifacts</text>
      </g>
    </g>
  </g>

  <!-- Cross-cutting right rail -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <g transform="translate(855,175)">
      <rect width="265" height="180" rx="10" fill="rgba(255,200,0,0.04)" stroke="rgba(255,200,0,0.32)" stroke-width="1"/>
      <text x="18" y="30" font-size="14.5" font-weight="700" fill="#ffc800">Secrets</text>
      <line x1="18" y1="42" x2="247" y2="42" stroke="rgba(255,200,0,0.18)"/>
      <g font-size="12" fill="#e6e6e6">
        <text x="18" y="72">Key Vault / HashiCorp Vault</text>
        <text x="18" y="102">Automated rotation</text>
        <text x="18" y="132">Customer-managed keys (BYOK)</text>
      </g>
    </g>
    <g transform="translate(855,375)">
      <rect width="265" height="180" rx="10" fill="rgba(0,255,136,0.04)" stroke="rgba(0,255,136,0.32)" stroke-width="1"/>
      <text x="18" y="30" font-size="14.5" font-weight="700" fill="#00ff88">Observability</text>
      <line x1="18" y1="42" x2="247" y2="42" stroke="rgba(0,255,136,0.18)"/>
      <g font-size="12" fill="#e6e6e6">
        <text x="18" y="72">Prometheus + Grafana</text>
        <text x="18" y="102">Application Insights</text>
        <text x="18" y="132">PHI-safe logging (DCR redaction)</text>
      </g>
    </g>
  </g>
</svg>
