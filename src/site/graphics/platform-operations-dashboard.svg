<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="od-title od-desc" font-family="Segoe UI, system-ui, sans-serif">
  <title id="od-title">Operations dashboard</title>
  <desc id="od-desc">A synthetic operations dashboard showing 14,892 claims processed, an 87.3% auto-adjudication rate, 1.2 second average end-to-end processing time, and $4.2M total plan paid, with an adjudication-outcome breakdown and a recent-claims table.</desc>

  <!-- backdrop -->
  <rect width="1600" height="900" fill="#0a0e16"/>

  <!-- ===== SIDEBAR ===== -->
  <rect x="0" y="0" width="230" height="900" fill="#070a11"/>
  <line x1="230" y1="0" x2="230" y2="900" stroke="rgba(255,255,255,0.06)"/>
  <!-- logo -->
  <rect x="24" y="26" width="30" height="30" rx="8" fill="#22d3ee"/>
  <text x="39" y="47" font-size="17" font-weight="800" fill="#062028" text-anchor="middle">C</text>
  <text x="66" y="46" font-size="15" font-weight="700" fill="#ffffff">Cloud Health Office</text>

  <g font-size="13" fill="rgba(255,255,255,0.6)">
    <text x="24" y="104" font-size="10" font-weight="700" letter-spacing="1.5" fill="rgba(255,255,255,0.3)">OVERVIEW</text>
    <!-- active: Dashboard -->
    <rect x="8" y="116" width="214" height="34" rx="7" fill="rgba(34,211,238,0.08)"/>
    <rect x="8" y="116" width="3" height="34" rx="1.5" fill="#22d3ee"/>
    <text x="30" y="138" fill="#22d3ee" font-weight="600">Dashboard</text>
    <text x="30" y="176" >Analytics</text>

    <text x="24" y="214" font-size="10" font-weight="700" letter-spacing="1.5" fill="rgba(255,255,255,0.3)">CLAIMS</text>
    <text x="30" y="246">Claims</text>
    <text x="30" y="282">Adjudication</text>
    <text x="30" y="318">Work Queues</text>
    <text x="30" y="354">Remittance</text>

    <text x="24" y="394" font-size="10" font-weight="700" letter-spacing="1.5" fill="rgba(255,255,255,0.3)">OPERATIONS</text>
    <text x="30" y="426">Eligibility</text>
    <text x="30" y="462">Prior Authorization</text>
    <text x="30" y="498">Providers</text>

    <text x="24" y="538" font-size="10" font-weight="700" letter-spacing="1.5" fill="rgba(255,255,255,0.3)">FINANCIAL</text>
    <text x="30" y="570">Premium Billing</text>
    <text x="30" y="606">Accounts Receivable</text>
    <text x="30" y="642">Capitation</text>
  </g>
  <text x="24" y="868" font-size="11" fill="rgba(255,255,255,0.28)">v4.2.0 &#183; Sentinel</text>

  <!-- ===== TOP BAR ===== -->
  <line x1="230" y1="64" x2="1600" y2="64" stroke="rgba(255,255,255,0.06)"/>
  <g stroke="rgba(255,255,255,0.55)" stroke-width="1.6"><line x1="262" y1="27" x2="282" y2="27"/><line x1="262" y1="33" x2="282" y2="33"/><line x1="262" y1="39" x2="282" y2="39"/></g>
  <text x="298" y="39" font-size="14" font-weight="700" fill="#ffffff">Cloud Health Office</text>
  <rect x="1420" y="20" width="52" height="24" rx="6" fill="rgba(167,139,250,0.15)" stroke="rgba(167,139,250,0.4)"/>
  <text x="1446" y="36" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="middle">PROD</text>
  <circle cx="1502" cy="32" r="3" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.4"/>
  <path d="M1499 30a3 3 0 0 1 6 0v3l1 2h-8l1-2z" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.4"/>
  <circle cx="1548" cy="32" r="15" fill="#164e63"/>
  <text x="1548" y="37" font-size="12" font-weight="700" fill="#67e8f9" text-anchor="middle">KA</text>

  <!-- ===== MAIN ===== -->
  <text x="262" y="108" font-size="24" font-weight="800" fill="#ffffff">Operations Dashboard</text>
  <text x="262" y="134" font-size="13" fill="rgba(255,255,255,0.45)">Real-time claims processing, adjudication, and plan spend &#183; local demo data</text>

  <!-- KPI cards -->
  <g>
    <!-- Total claims -->
    <rect x="262" y="156" width="311" height="120" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)"/>
    <rect x="262" y="156" width="311" height="3" rx="1.5" fill="#22d3ee"/>
    <text x="286" y="190" font-size="11" font-weight="700" letter-spacing="1" fill="rgba(255,255,255,0.45)">TOTAL CLAIMS</text>
    <text x="286" y="234" font-size="38" font-weight="800" fill="#22d3ee" font-family="'JetBrains Mono', ui-monospace, monospace">14,892</text>
    <text x="286" y="258" font-size="12" fill="rgba(255,255,255,0.4)">Processed with full audit trail</text>
    <!-- Auto-adjudication -->
    <rect x="593" y="156" width="311" height="120" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)"/>
    <rect x="593" y="156" width="311" height="3" rx="1.5" fill="#34d399"/>
    <text x="617" y="190" font-size="11" font-weight="700" letter-spacing="1" fill="rgba(255,255,255,0.45)">AUTO-ADJUDICATION</text>
    <text x="617" y="234" font-size="38" font-weight="800" fill="#34d399" font-family="'JetBrains Mono', ui-monospace, monospace">87.3%</text>
    <text x="617" y="258" font-size="12" fill="rgba(255,255,255,0.4)">Straight-through, no examiner</text>
    <!-- Avg processing -->
    <rect x="924" y="156" width="311" height="120" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)"/>
    <rect x="924" y="156" width="311" height="3" rx="1.5" fill="#e5e7eb"/>
    <text x="948" y="190" font-size="11" font-weight="700" letter-spacing="1" fill="rgba(255,255,255,0.45)">AVG PROCESSING</text>
    <text x="948" y="234" font-size="38" font-weight="800" fill="#e5e7eb" font-family="'JetBrains Mono', ui-monospace, monospace">1.2 sec</text>
    <text x="948" y="258" font-size="12" fill="rgba(255,255,255,0.4)">Eligibility &#8594; adjudication</text>
    <!-- Total plan paid -->
    <rect x="1255" y="156" width="311" height="120" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)"/>
    <rect x="1255" y="156" width="311" height="3" rx="1.5" fill="#fbbf24"/>
    <text x="1279" y="190" font-size="11" font-weight="700" letter-spacing="1" fill="rgba(255,255,255,0.45)">TOTAL PLAN PAID</text>
    <text x="1279" y="234" font-size="38" font-weight="800" fill="#fbbf24" font-family="'JetBrains Mono', ui-monospace, monospace">$4.2M</text>
    <text x="1279" y="258" font-size="12" fill="rgba(255,255,255,0.4)">Across all benefit plans</text>
  </g>

  <!-- Adjudication outcomes -->
  <rect x="262" y="300" width="1304" height="128" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)"/>
  <text x="286" y="332" font-size="14" font-weight="700" fill="#ffffff">Adjudication Outcomes</text>
  <text x="1542" y="332" font-size="12" fill="rgba(255,255,255,0.4)" text-anchor="end">14,892 claims this cycle</text>
  <!-- stacked bar: approved 87.3, pended 8.4, denied 4.3 -->
  <g>
    <rect x="286" y="352" width="1109" height="22" rx="5" fill="#34d399"/>
    <rect x="1397" y="352" width="107" height="22" fill="#fbbf24"/>
    <rect x="1506" y="352" width="56" height="22" rx="5" fill="#f87171"/>
    <!-- rounded ends fix -->
    <rect x="1560" y="352" width="6" height="22" rx="3" fill="#f87171"/>
  </g>
  <g font-size="12.5">
    <circle cx="292" cy="404" r="5" fill="#34d399"/><text x="304" y="409" fill="rgba(255,255,255,0.75)">Approved &#8212; 87.3%</text>
    <circle cx="470" cy="404" r="5" fill="#fbbf24"/><text x="482" y="409" fill="rgba(255,255,255,0.75)">Pended to work queue &#8212; 8.4%</text>
    <circle cx="720" cy="404" r="5" fill="#f87171"/><text x="732" y="409" fill="rgba(255,255,255,0.75)">Denied (valid business reason) &#8212; 4.3%</text>
  </g>

  <!-- Recent claims table -->
  <rect x="262" y="452" width="1304" height="416" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)"/>
  <text x="286" y="486" font-size="14" font-weight="700" fill="#ffffff">Recent Claims</text>
  <!-- header -->
  <g font-size="11" font-weight="700" letter-spacing="0.6" fill="rgba(255,255,255,0.4)">
    <text x="286" y="524">CLAIM ID</text>
    <text x="470" y="524">MEMBER</text>
    <text x="720" y="524">TYPE</text>
    <text x="900" y="524">STATUS</text>
    <text x="1180" y="524">SUBMITTED</text>
    <text x="1542" y="524" text-anchor="end">PLAN PAID</text>
  </g>
  <line x1="286" y1="536" x2="1542" y2="536" stroke="rgba(255,255,255,0.06)"/>

  <g font-size="13" fill="rgba(255,255,255,0.82)" font-family="'JetBrains Mono', ui-monospace, monospace">
    <!-- row 1 -->
    <text x="286" y="566">CLM-4892017</text><text x="470" y="566" font-family="Segoe UI, sans-serif">Alvarez, M.</text><text x="720" y="566" font-family="Segoe UI, sans-serif">837P Professional</text>
    <rect x="900" y="553" width="86" height="20" rx="10" fill="rgba(52,211,153,0.14)"/><text x="943" y="567" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#34d399" text-anchor="middle">Approved</text>
    <text x="1180" y="566" font-family="Segoe UI, sans-serif" fill="rgba(255,255,255,0.55)">10:42:07</text><text x="1542" y="566" text-anchor="end">$1,284.50</text>
    <line x1="286" y1="586" x2="1542" y2="586" stroke="rgba(255,255,255,0.04)"/>
    <!-- row 2 -->
    <text x="286" y="616">CLM-4892016</text><text x="470" y="616" font-family="Segoe UI, sans-serif">Chen, R.</text><text x="720" y="616" font-family="Segoe UI, sans-serif">837I Institutional</text>
    <rect x="900" y="603" width="86" height="20" rx="10" fill="rgba(251,191,36,0.14)"/><text x="943" y="617" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#fbbf24" text-anchor="middle">Pended</text>
    <text x="1180" y="616" font-family="Segoe UI, sans-serif" fill="rgba(255,255,255,0.55)">10:41:58</text><text x="1542" y="616" text-anchor="end">&#8212;</text>
    <line x1="286" y1="636" x2="1542" y2="636" stroke="rgba(255,255,255,0.04)"/>
    <!-- row 3 -->
    <text x="286" y="666">CLM-4892015</text><text x="470" y="666" font-family="Segoe UI, sans-serif">Okafor, D.</text><text x="720" y="666" font-family="Segoe UI, sans-serif">837P Professional</text>
    <rect x="900" y="653" width="86" height="20" rx="10" fill="rgba(52,211,153,0.14)"/><text x="943" y="667" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#34d399" text-anchor="middle">Approved</text>
    <text x="1180" y="666" font-family="Segoe UI, sans-serif" fill="rgba(255,255,255,0.55)">10:41:44</text><text x="1542" y="666" text-anchor="end">$342.00</text>
    <line x1="286" y1="686" x2="1542" y2="686" stroke="rgba(255,255,255,0.04)"/>
    <!-- row 4 -->
    <text x="286" y="716">CLM-4892014</text><text x="470" y="716" font-family="Segoe UI, sans-serif">Nguyen, T.</text><text x="720" y="716" font-family="Segoe UI, sans-serif">837D Dental</text>
    <rect x="900" y="703" width="86" height="20" rx="10" fill="rgba(248,113,113,0.14)"/><text x="943" y="717" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#f87171" text-anchor="middle">Denied</text>
    <text x="1180" y="716" font-family="Segoe UI, sans-serif" fill="rgba(255,255,255,0.55)">10:41:30</text><text x="1542" y="716" text-anchor="end">$0.00</text>
    <line x1="286" y1="736" x2="1542" y2="736" stroke="rgba(255,255,255,0.04)"/>
    <!-- row 5 -->
    <text x="286" y="766">CLM-4892013</text><text x="470" y="766" font-family="Segoe UI, sans-serif">Silva, P.</text><text x="720" y="766" font-family="Segoe UI, sans-serif">837I Institutional</text>
    <rect x="900" y="753" width="86" height="20" rx="10" fill="rgba(52,211,153,0.14)"/><text x="943" y="767" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#34d399" text-anchor="middle">Approved</text>
    <text x="1180" y="766" font-family="Segoe UI, sans-serif" fill="rgba(255,255,255,0.55)">10:41:12</text><text x="1542" y="766" text-anchor="end">$8,910.75</text>
    <line x1="286" y1="786" x2="1542" y2="786" stroke="rgba(255,255,255,0.04)"/>
    <!-- row 6 -->
    <text x="286" y="816">CLM-4892012</text><text x="470" y="816" font-family="Segoe UI, sans-serif">Brooks, J.</text><text x="720" y="816" font-family="Segoe UI, sans-serif">837P Professional</text>
    <rect x="900" y="803" width="86" height="20" rx="10" fill="rgba(52,211,153,0.14)"/><text x="943" y="817" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#34d399" text-anchor="middle">Approved</text>
    <text x="1180" y="816" font-family="Segoe UI, sans-serif" fill="rgba(255,255,255,0.55)">10:40:59</text><text x="1542" y="816" text-anchor="end">$596.20</text>
