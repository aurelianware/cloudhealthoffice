# Workload identity for appeals-service: its user-assigned managed identity, federated to
# system:serviceaccount:cloudhealthoffice:appeals-service-sa. token-service issues this service's
# CHO service tokens to that identity only (ServiceTokens:ServiceClients); the service holds
# no signing key. See docs/security/portal-token-service.md ("Service tokens").
apiVersion: v1
kind: ServiceAccount
metadata:
  name: appeals-service-sa
  namespace: cloudhealthoffice
  annotations:
    azure.workload.identity/client-id: "<APPEALS_SERVICE_MANAGED_IDENTITY_CLIENT_ID>"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: appeals-service-config
  namespace: cloudhealthoffice
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  CosmosDb__DatabaseName: "CloudHealthOffice"
  ClaimsService__BaseUrl: "http://claims-service.cloudhealthoffice"
  AppealEncryption__KeySecretPrefix: "appeal-body-encryption-key"
  AppealEncryption__CurrentKeyVersion: "v1"
  AppealEncryption__AcceptedKeyVersions__0: "v1"
  Kafka__ClientId: "appeals-service"
  AppealMigration__BatchSize: "100"
  # No broker is configured for this manifest yet (kafka-secret's
  # bootstrapServers is empty), so appeal events are marked Skipped instead
  # of piling up in every appeal document's outbox. Audit rows are still
  # written. Set this to "false" BEFORE populating bootstrapServers if the
  # backlog written while Kafka was off must be delivered; leave "false"
  # once a broker is configured. See docs/architecture/appeals-event-outbox.md.
  AppealOutbox__SkipWhenKafkaDisabled: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appeals-service
  namespace: cloudhealthoffice
  labels:
    app: appeals-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appeals-service
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
        app: appeals-service
        tier: backend
    spec:
      serviceAccountName: appeals-service-sa
      containers:
      - name: appeals-service
        image: clouhealthoffice.azurecr.io/cloudhealthoffice-appeals-service:latest
        imagePullPolicy: Always
        envFrom:
        # Source=TokenService, token-service URL and Entra scope (shared by all services).
        - configMapRef:
            name: cho-service-tokens
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ChoAuth__ServiceToken__ClientId
          value: "appeals-service"
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: appeals-service-config
              key: ASPNETCORE_ENVIRONMENT
        - name: CosmosDb__AccountEndpoint
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: endpoint
        - name: CosmosDb__AccountKey
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: key
        - name: CosmosDb__DatabaseName
          valueFrom:
            configMapKeyRef:
              name: appeals-service-config
              key: CosmosDb__DatabaseName
        - name: ClaimsService__BaseUrl
          valueFrom:
            configMapKeyRef:
              name: appeals-service-config
              key: ClaimsService__BaseUrl
        - name: MongoDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: connectionString
        - name: MongoDb__DatabaseName
          value: "CloudHealthOffice"
        # Appeal body encryption — key material is in Key Vault under
        # appeal-body-encryption-key-v1. Must be provisioned BEFORE first
        # deployment; otherwise the readiness check fails and the pod is
        # not rotated into traffic. See rotate-secret.sh.
        - name: AppealEncryption__KeySecretPrefix
          valueFrom:
            configMapKeyRef:
              name: appeals-service-config
              key: AppealEncryption__KeySecretPrefix
        - name: AppealEncryption__CurrentKeyVersion
          valueFrom:
            configMapKeyRef:
              name: appeals-service-config
              key: AppealEncryption__CurrentKeyVersion
        - name: AppealEncryption__AcceptedKeyVersions__0
          valueFrom:
            configMapKeyRef:
              name: appeals-service-config
              key: AppealEncryption__AcceptedKeyVersions__0
        # Kafka — empty BootstrapServers disables publishing (service boots;
        # with AppealOutbox__SkipWhenKafkaDisabled=true events are marked
        # Skipped, otherwise they stay pending until the broker is
        # configured — see docs/architecture/appeals-event-outbox.md).
        # Populate the secret when the broker is ready for
        # appeal.status-changed.v1.
        - name: AppealOutbox__SkipWhenKafkaDisabled
          valueFrom:
            configMapKeyRef:
              name: appeals-service-config
              key: AppealOutbox__SkipWhenKafkaDisabled
        - name: Kafka__BootstrapServers
          valueFrom:
            secretKeyRef:
              name: kafka-secret
              key: bootstrapServers
              optional: true
        - name: Kafka__ClientId
          valueFrom:
            configMapKeyRef:
              name: appeals-service-config
              key: Kafka__ClientId
        - name: AppealMigration__BatchSize
          valueFrom:
            configMapKeyRef:
              name: appeals-service-config
              key: AppealMigration__BatchSize
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: appeals-service
  namespace: cloudhealthoffice
  labels:
    app: appeals-service
spec:
  type: ClusterIP
  selector:
    app: appeals-service
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
