apiVersion: v1
kind: ConfigMap
metadata:
  name: personal-representative-service-config
  namespace: cloudhealthoffice
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  MongoDb__DatabaseName: "cloudhealthoffice"
  PersonalRepEncryption__KeySecretPrefix: "personal-rep-body-encryption-key"
  PersonalRepEncryption__CurrentKeyVersion: "v1"
  PersonalRepEncryption__AcceptedKeyVersions__0: "v1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-representative-service
  namespace: cloudhealthoffice
  labels:
    app: personal-representative-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: personal-representative-service
  template:
    metadata:
      labels:
        app: personal-representative-service
        tier: backend
    spec:
      containers:
      - name: personal-representative-service
        image: clouhealthoffice.azurecr.io/cloudhealthoffice-personal-representative-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: personal-representative-service-config
              key: ASPNETCORE_ENVIRONMENT
        - name: MongoDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: connectionString
        - name: MongoDb__DatabaseName
          valueFrom:
            configMapKeyRef:
              name: personal-representative-service-config
              key: MongoDb__DatabaseName
        - name: PersonalRepEncryption__KeySecretPrefix
          valueFrom:
            configMapKeyRef:
              name: personal-representative-service-config
              key: PersonalRepEncryption__KeySecretPrefix
        - name: PersonalRepEncryption__CurrentKeyVersion
          valueFrom:
            configMapKeyRef:
              name: personal-representative-service-config
              key: PersonalRepEncryption__CurrentKeyVersion
        - name: Kafka__BootstrapServers
          valueFrom:
            secretKeyRef:
              name: kafka-secret
              key: bootstrapServers
              optional: true
        - name: Kafka__SaslUsername
          valueFrom:
            secretKeyRef:
              name: kafka-secret
              key: saslUsername
              optional: true
        - name: Kafka__SaslPassword
          valueFrom:
            secretKeyRef:
              name: kafka-secret
              key: saslPassword
              optional: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: personal-representative-service
  namespace: cloudhealthoffice
  labels:
    app: personal-representative-service
spec:
  type: ClusterIP
  selector:
    app: personal-representative-service
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
