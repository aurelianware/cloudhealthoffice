apiVersion: v1
kind: ConfigMap
metadata:
  name: capitation-service-config
  namespace: cloudhealthoffice
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  CosmosDb__DatabaseName: "CloudHealthOffice"
  CoverageService__BaseUrl: "http://coverage-service.cloudhealthoffice"
  ProviderService__BaseUrl: "http://provider-service.cloudhealthoffice"
  RiskAdjustmentService__BaseUrl: "http://risk-adjustment-service.cloudhealthoffice"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capitation-service
  namespace: cloudhealthoffice
  labels:
    app: capitation-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: capitation-service
  template:
    metadata:
      labels:
        app: capitation-service
        tier: backend
    spec:
      containers:
      - name: capitation-service
        image: clouhealthoffice.azurecr.io/cloudhealthoffice-capitation-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: capitation-service-config
              key: ASPNETCORE_ENVIRONMENT
        - name: MongoDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: connectionString
              optional: true
        - name: CosmosDb__Endpoint
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: endpoint
        - name: CosmosDb__Key
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: key
        - name: CosmosDb__DatabaseName
          valueFrom:
            configMapKeyRef:
              name: capitation-service-config
              key: CosmosDb__DatabaseName
        - name: CoverageService__BaseUrl
          valueFrom:
            configMapKeyRef:
              name: capitation-service-config
              key: CoverageService__BaseUrl
        - name: ProviderService__BaseUrl
          valueFrom:
            configMapKeyRef:
              name: capitation-service-config
              key: ProviderService__BaseUrl
        - name: RiskAdjustmentService__BaseUrl
          valueFrom:
            configMapKeyRef:
              name: capitation-service-config
              key: RiskAdjustmentService__BaseUrl
        - name: Stripe__SecretKey
          valueFrom:
            secretKeyRef:
              name: stripe-api-keys
              key: secret-key
        - name: Stripe__WebhookSecret
          valueFrom:
            secretKeyRef:
              name: stripe-api-keys
              key: webhook-secret
              optional: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: capitation-service
  namespace: cloudhealthoffice
  labels:
    app: capitation-service
spec:
  type: ClusterIP
  selector:
    app: capitation-service
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
