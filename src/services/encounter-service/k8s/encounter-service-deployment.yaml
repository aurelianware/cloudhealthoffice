# Workload identity for encounter-service: its user-assigned managed identity, federated to
# system:serviceaccount:cloudhealthoffice:encounter-service-sa. token-service issues this service's
# CHO service tokens to that identity only (ServiceTokens:ServiceClients); the service holds
# no signing key. See docs/security/portal-token-service.md ("Service tokens").
apiVersion: v1
kind: ServiceAccount
metadata:
  name: encounter-service-sa
  namespace: cloudhealthoffice
  annotations:
    azure.workload.identity/client-id: "<ENCOUNTER_SERVICE_MANAGED_IDENTITY_CLIENT_ID>"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: encounter-service-config
  namespace: cloudhealthoffice
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  MongoDb__DatabaseName: "CloudHealthOffice"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: encounter-service
  namespace: cloudhealthoffice
  labels:
    app: encounter-service
    tier: backend
    component: encounter-processing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: encounter-service
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
        app: encounter-service
        tier: backend
        component: encounter-processing
    spec:
      serviceAccountName: encounter-service-sa
      containers:
      - name: encounter-service
        image: clouhealthoffice.azurecr.io/cloudhealthoffice-encounter-service:latest
        imagePullPolicy: Always
        envFrom:
        # Source=TokenService, token-service URL and Entra scope (shared by all services).
        - configMapRef:
            name: cho-service-tokens
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ChoAuth__ServiceToken__ClientId
          value: "encounter-service"
        - name: MongoDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: connectionString
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: encounter-service-config
              key: ASPNETCORE_ENVIRONMENT
        - name: MongoDb__DatabaseName
          valueFrom:
            configMapKeyRef:
              name: encounter-service-config
              key: MongoDb__DatabaseName
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: encounter-service
  namespace: cloudhealthoffice
  labels:
    app: encounter-service
spec:
  type: ClusterIP
  selector:
    app: encounter-service
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: encounter-service-hpa
  namespace: cloudhealthoffice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: encounter-service
  minReplicas: 1
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
