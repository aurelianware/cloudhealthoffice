apiVersion: v1
kind: ConfigMap
metadata:
  name: provider-contracts-service-config
  namespace: cloudhealthoffice
data:
  ASPNETCORE_ENVIRONMENT: "Production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-contracts-service
  namespace: cloudhealthoffice
  labels:
    app: provider-contracts-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provider-contracts-service
  template:
    metadata:
      labels:
        app: provider-contracts-service
        tier: backend
    spec:
      containers:
      - name: provider-contracts-service
        image: clouhealthoffice.azurecr.io/cloudhealthoffice-provider-contracts-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: provider-contracts-service-config
              key: ASPNETCORE_ENVIRONMENT
        - name: MongoDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: connectionString
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: provider-contracts-service
  namespace: cloudhealthoffice
  labels:
    app: provider-contracts-service
spec:
  type: ClusterIP
  selector:
    app: provider-contracts-service
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
