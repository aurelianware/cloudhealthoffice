# Workload identity for accumulator-service: its user-assigned managed identity, federated to
# system:serviceaccount:cloudhealthoffice:accumulator-service-sa. token-service issues this service's
# CHO service tokens to that identity only (ServiceTokens:ServiceClients); the service holds
# no signing key. See docs/security/portal-token-service.md ("Service tokens").
apiVersion: v1
kind: ServiceAccount
metadata:
  name: accumulator-service-sa
  namespace: cloudhealthoffice
  annotations:
    azure.workload.identity/client-id: "<ACCUMULATOR_SERVICE_MANAGED_IDENTITY_CLIENT_ID>"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: accumulator-service-config
  namespace: cloudhealthoffice
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  MongoDb__DatabaseName: "AccumulatorDB"
  Kafka__ClientId: "accumulator-service"
  Kafka__ClaimFinalized__GroupId: "accumulator-service.claims-finalized"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accumulator-service
  namespace: cloudhealthoffice
  labels:
    app: accumulator-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: accumulator-service
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
        app: accumulator-service
        tier: backend
    spec:
      serviceAccountName: accumulator-service-sa
      containers:
      - name: accumulator-service
        image: clouhealthoffice.azurecr.io/cloudhealthoffice-accumulator-service:latest
        imagePullPolicy: Always
        envFrom:
        # Source=TokenService, token-service URL and Entra scope (shared by all services).
        - configMapRef:
            name: cho-service-tokens
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ChoAuth__ServiceToken__ClientId
          value: "accumulator-service"
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: accumulator-service-config
              key: ASPNETCORE_ENVIRONMENT
        - name: MongoDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: connectionString
        - name: MongoDb__DatabaseName
          valueFrom:
            configMapKeyRef:
              name: accumulator-service-config
              key: MongoDb__DatabaseName
        - name: Kafka__BootstrapServers
          valueFrom:
            secretKeyRef:
              name: kafka-secret
              key: bootstrapServers
              optional: true
        - name: Kafka__SaslUsername
          valueFrom:
            secretKeyRef:
              name: kafka-secret
              key: saslUsername
              optional: true
        - name: Kafka__SaslPassword
          valueFrom:
            secretKeyRef:
              name: kafka-secret
              key: saslPassword
              optional: true
        - name: Kafka__ClientId
          valueFrom:
            configMapKeyRef:
              name: accumulator-service-config
              key: Kafka__ClientId
        - name: Kafka__ClaimFinalized__GroupId
          valueFrom:
            configMapKeyRef:
              name: accumulator-service-config
              key: Kafka__ClaimFinalized__GroupId
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: accumulator-service
  namespace: cloudhealthoffice
  labels:
    app: accumulator-service
spec:
  type: ClusterIP
  selector:
    app: accumulator-service
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
