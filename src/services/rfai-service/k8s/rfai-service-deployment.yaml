# Workload identity for rfai-service: its user-assigned managed identity, federated to
# system:serviceaccount:cloudhealthoffice:rfai-service-sa. token-service issues this service's
# CHO service tokens to that identity only (ServiceTokens:ServiceClients); the service holds
# no signing key. See docs/security/portal-token-service.md ("Service tokens").
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rfai-service-sa
  namespace: cloudhealthoffice
  annotations:
    azure.workload.identity/client-id: "<RFAI_SERVICE_MANAGED_IDENTITY_CLIENT_ID>"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rfai-service-config
  namespace: cloudhealthoffice
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  CosmosDb__DatabaseName: "CloudHealthOffice"
  CosmosDb__RfaiContainer: "RfaiCases"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rfai-service
  namespace: cloudhealthoffice
  labels:
    app: rfai-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rfai-service
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
        app: rfai-service
        tier: backend
    spec:
      serviceAccountName: rfai-service-sa
      containers:
      - name: rfai-service
        image: clouhealthoffice.azurecr.io/cloudhealthoffice-rfai-service:latest
        imagePullPolicy: Always
        envFrom:
        # Source=TokenService, token-service URL and Entra scope (shared by all services).
        - configMapRef:
            name: cho-service-tokens
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ChoAuth__ServiceToken__ClientId
          value: "rfai-service"
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: rfai-service-config
              key: ASPNETCORE_ENVIRONMENT
        - name: MongoDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: connectionString
              optional: true
        - name: CosmosDb__Endpoint
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: endpoint
        - name: CosmosDb__Key
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: key
        - name: CosmosDb__DatabaseName
          valueFrom:
            configMapKeyRef:
              name: rfai-service-config
              key: CosmosDb__DatabaseName
        - name: CosmosDb__RfaiContainer
          valueFrom:
            configMapKeyRef:
              name: rfai-service-config
              key: CosmosDb__RfaiContainer
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: rfai-service
  namespace: cloudhealthoffice
  labels:
    app: rfai-service
spec:
  type: ClusterIP
  selector:
    app: rfai-service
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
