apiVersion: v1
kind: ConfigMap
metadata:
  name: rfai-service-config
  namespace: cloudhealthoffice
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  MongoDb__DatabaseName: "CloudHealthOffice"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rfai-service
  namespace: cloudhealthoffice
  labels:
    app: rfai-service
    tier: backend
    component: rfai-processing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rfai-service
  template:
    metadata:
      labels:
        app: rfai-service
        tier: backend
        component: rfai-processing
    spec:
      containers:
      - name: rfai-service
        image: ghcr.io/aurelianware/cloudhealthoffice-rfai-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: MongoDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: rfai-service-secret
              key: MongoDb__ConnectionString
        - name: MongoDb__DatabaseName
          valueFrom:
            configMapKeyRef:
              name: rfai-service-config
              key: MongoDb__DatabaseName
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: rfai-service-config
              key: ASPNETCORE_ENVIRONMENT
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rfai-service
  namespace: cloudhealthoffice
  labels:
    app: rfai-service
spec:
  type: ClusterIP
  selector:
    app: rfai-service
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rfai-service-hpa
  namespace: cloudhealthoffice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rfai-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
