apiVersion: v1
kind: ConfigMap
metadata:
  name: rfai-service-config
  namespace: cloudhealthoffice
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  CosmosDb__DatabaseName: "CloudHealthOffice"
  CosmosDb__RfaiContainer: "RfaiCases"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rfai-service
  namespace: cloudhealthoffice
  labels:
    app: rfai-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rfai-service
  template:
    metadata:
      labels:
        app: rfai-service
        tier: backend
    spec:
      containers:
      - name: rfai-service
        image: clouhealthoffice.azurecr.io/cloudhealthoffice-rfai-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: rfai-service-config
              key: ASPNETCORE_ENVIRONMENT
        - name: MongoDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: connectionString
              optional: true
        - name: CosmosDb__Endpoint
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: endpoint
        - name: CosmosDb__Key
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: key
        - name: CosmosDb__DatabaseName
          valueFrom:
            configMapKeyRef:
              name: rfai-service-config
              key: CosmosDb__DatabaseName
        - name: CosmosDb__RfaiContainer
          valueFrom:
            configMapKeyRef:
              name: rfai-service-config
              key: CosmosDb__RfaiContainer
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: rfai-service
  namespace: cloudhealthoffice
  labels:
    app: rfai-service
spec:
  type: ClusterIP
  selector:
    app: rfai-service
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
