apiVersion: v1
kind: ConfigMap
metadata:
  name: claims-scrubbing-service-config
  namespace: cloudhealthoffice
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  # Kafka (C# double-underscore config key format)
  Kafka__BootstrapServers: "kafka.cloudhealthoffice:9092"
  Kafka__ClientId: "claims-scrubbing-service"
  Kafka__ConsumerGroupId: "claims-scrubbers"
  Kafka__InboundTopic: "claims.inbound"
  Kafka__CleanClaimsTopic: "claims.clean"
  Kafka__FlaggedClaimsTopic: "claims.flagged"
  Kafka__RejectedClaimsTopic: "claims.rejected"
  # MongoDB
  MongoDb__DatabaseName: "CloudHealthOffice"
  # Storage
  Storage__ContainerName: "claims-archive"
  # Rule engine
  RuleEngine__ParallelExecution: "true"
  RuleEngine__MaxConcurrency: "10"
  RuleEngine__RuleTimeoutMs: "5000"
  RuleEngine__CacheRules: "true"
  RuleEngine__RuleCacheTtlSeconds: "300"
  # Thresholds
  Thresholds__MaxErrorsForRejection: "3"
  Thresholds__MaxWarningsForFlagging: "5"
  Thresholds__FirstPassRateTarget: "95"
  # Feature flags
  Features__DuplicateDetection: "true"
  Features__MedicalNecessityChecks: "true"
  Features__NcciEdits: "true"
  Features__AutoCorrection: "false"
  Features__RealtimeNpiValidation: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-scrubbing-service
  namespace: cloudhealthoffice
  labels:
    app: claims-scrubbing-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-scrubbing-service
  template:
    metadata:
      labels:
        app: claims-scrubbing-service
        tier: backend
    spec:
      containers:
      - name: claims-scrubbing-service
        image: choacrhy6h2vdulfru6.azurecr.io/cloudhealthoffice-claims-scrubbing-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: claims-scrubbing-service-config
        env:
        - name: Kafka__SaslUsername
          valueFrom:
            secretKeyRef:
              name: kafka-secret
              key: saslUsername
              optional: true
        - name: Kafka__SaslPassword
          valueFrom:
            secretKeyRef:
              name: kafka-secret
              key: saslPassword
              optional: true
        - name: MongoDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: connectionString
        - name: Storage__ConnectionString
          valueFrom:
            secretKeyRef:
              name: azure-storage-secret
              key: connectionString
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: claims-scrubbing-service
  namespace: cloudhealthoffice
  labels:
    app: claims-scrubbing-service
spec:
  type: ClusterIP
  selector:
    app: claims-scrubbing-service
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
