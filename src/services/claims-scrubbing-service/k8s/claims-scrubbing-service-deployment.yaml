apiVersion: v1
kind: ConfigMap
metadata:
  name: claims-scrubbing-service-config
  namespace: cloudhealthoffice
data:
  NODE_ENV: "production"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.cloudhealthoffice:9092"
  KAFKA_CLIENT_ID: "claims-scrubbing-service"
  KAFKA_CONSUMER_GROUP: "claims-scrubbers"
  INBOUND_CLAIMS_TOPIC: "claims.inbound"
  CLEAN_CLAIMS_TOPIC: "claims.clean"
  FLAGGED_CLAIMS_TOPIC: "claims.flagged"
  REJECTED_CLAIMS_TOPIC: "claims.rejected"
  MONGODB_DATABASE: "CloudHealthOffice"
  MONGODB_RULES_COLLECTION: "ScrubRules"
  MONGODB_AUDIT_COLLECTION: "ScrubAudit"
  CLAIMS_CONTAINER: "claims-archive"
  PARALLEL_RULES: "true"
  MAX_RULE_CONCURRENCY: "10"
  RULE_TIMEOUT_MS: "5000"
  CACHE_RULES: "true"
  RULE_CACHE_TTL: "300"
  MAX_ERRORS_FOR_REJECTION: "3"
  MAX_WARNINGS_FOR_FLAGGING: "5"
  ENABLE_DUPLICATE_DETECTION: "true"
  ENABLE_MEDICAL_NECESSITY: "true"
  ENABLE_NCCI_EDITS: "true"
  ENABLE_AUTO_CORRECTION: "false"
  ENABLE_REALTIME_NPI: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-scrubbing-service
  namespace: cloudhealthoffice
  labels:
    app: claims-scrubbing-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-scrubbing-service
  template:
    metadata:
      labels:
        app: claims-scrubbing-service
        tier: backend
    spec:
      containers:
      - name: claims-scrubbing-service
        image: choacrhy6h2vdulfru6.azurecr.io/cloudhealthoffice-claims-scrubbing-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: claims-scrubbing-service-config
        env:
        - name: KAFKA_SASL_USERNAME
          valueFrom:
            secretKeyRef:
              name: kafka-secret
              key: saslUsername
              optional: true
        - name: KAFKA_SASL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kafka-secret
              key: saslPassword
              optional: true
        - name: MONGODB_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: connectionString
        - name: STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: azure-storage-secret
              key: connectionString
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /livez
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: claims-scrubbing-service
  namespace: cloudhealthoffice
  labels:
    app: claims-scrubbing-service
spec:
  type: ClusterIP
  selector:
    app: claims-scrubbing-service
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
