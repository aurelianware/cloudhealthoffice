# Workload identity for encounter-submission-service: its user-assigned managed identity, federated to
# system:serviceaccount:cloudhealthoffice:encounter-submission-service-sa. token-service issues this service's
# CHO service tokens to that identity only (ServiceTokens:ServiceClients); the service holds
# no signing key. See docs/security/portal-token-service.md ("Service tokens").
apiVersion: v1
kind: ServiceAccount
metadata:
  name: encounter-submission-service-sa
  namespace: cloudhealthoffice
  annotations:
    azure.workload.identity/client-id: "<ENCOUNTER_SUBMISSION_SERVICE_MANAGED_IDENTITY_CLIENT_ID>"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: encounter-submission-service-config
  namespace: cloudhealthoffice
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  MongoDb__DatabaseName: "CloudHealthOffice"
  Kafka__AdjudicationCompletedTopic: "adjudication-completed"
  Kafka__DeadlineWarningTopic: "encounter-deadline-warning"
  Worker__IntervalHours: "4"
  Worker__DeadlineWarningDays: "7"
  Services__ClaimsService: "http://claims-service.cloudhealthoffice"
  Services__ReferenceDataService: "http://reference-data-service.cloudhealthoffice"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: encounter-submission-service
  namespace: cloudhealthoffice
  labels:
    app: encounter-submission-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: encounter-submission-service
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
        app: encounter-submission-service
        tier: backend
    spec:
      serviceAccountName: encounter-submission-service-sa
      containers:
      - name: encounter-submission-service
        image: clouhealthoffice.azurecr.io/cloudhealthoffice-encounter-submission-service:latest
        imagePullPolicy: Always
        envFrom:
        # Source=TokenService, token-service URL and Entra scope (shared by all services).
        - configMapRef:
            name: cho-service-tokens
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ChoAuth__ServiceToken__ClientId
          value: "encounter-submission-service"
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: encounter-submission-service-config
              key: ASPNETCORE_ENVIRONMENT
        - name: MongoDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: connectionString
        - name: MongoDb__DatabaseName
          value: "CloudHealthOffice"
        - name: AzureStorage__ConnectionString
          valueFrom:
            secretKeyRef:
              name: azure-storage-secret
              key: connectionString
        - name: Kafka__BootstrapServers
          valueFrom:
            secretKeyRef:
              name: kafka-secret
              key: bootstrapServers
        - name: Kafka__AdjudicationCompletedTopic
          valueFrom:
            configMapKeyRef:
              name: encounter-submission-service-config
              key: Kafka__AdjudicationCompletedTopic
        - name: Kafka__DeadlineWarningTopic
          valueFrom:
            configMapKeyRef:
              name: encounter-submission-service-config
              key: Kafka__DeadlineWarningTopic
        - name: Worker__IntervalHours
          valueFrom:
            configMapKeyRef:
              name: encounter-submission-service-config
              key: Worker__IntervalHours
        - name: Worker__DeadlineWarningDays
          valueFrom:
            configMapKeyRef:
              name: encounter-submission-service-config
              key: Worker__DeadlineWarningDays
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: encounter-submission-service
  namespace: cloudhealthoffice
  labels:
    app: encounter-submission-service
spec:
  type: ClusterIP
  selector:
    app: encounter-submission-service
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
