# Workload identity for authorization-service: its user-assigned managed identity, federated to
# system:serviceaccount:cloudhealthoffice:authorization-service-sa. token-service issues this service's
# CHO service tokens to that identity only (ServiceTokens:ServiceClients); the service holds
# no signing key. See docs/security/portal-token-service.md ("Service tokens").
apiVersion: v1
kind: ServiceAccount
metadata:
  name: authorization-service-sa
  namespace: cloudhealthoffice
  annotations:
    azure.workload.identity/client-id: "<AUTHORIZATION_SERVICE_MANAGED_IDENTITY_CLIENT_ID>"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authorization-service-config
  namespace: cloudhealthoffice
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  MongoDb__DatabaseName: "CloudHealthOffice"
  # DHCS APL 26-009 dental prior authorization check (plan setting, coverage, aid codes).
  Services__TenantService: "http://tenant-service.cloudhealthoffice"
  Services__CoverageService: "http://coverage-service.cloudhealthoffice"
  Services__MemberService: "http://member-service.cloudhealthoffice"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authorization-service
  namespace: cloudhealthoffice
  labels:
    app: authorization-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authorization-service
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
        app: authorization-service
        tier: backend
    spec:
      serviceAccountName: authorization-service-sa
      containers:
      - name: authorization-service
        image: clouhealthoffice.azurecr.io/cloudhealthoffice-authorization-service:latest
        imagePullPolicy: Always
        envFrom:
        # Source=TokenService, token-service URL and Entra scope (shared by all services).
        - configMapRef:
            name: cho-service-tokens
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ChoAuth__ServiceToken__ClientId
          value: "authorization-service"
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: authorization-service-config
              key: ASPNETCORE_ENVIRONMENT
        - name: MongoDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: connectionString
        - name: MongoDb__DatabaseName
          valueFrom:
            configMapKeyRef:
              name: authorization-service-config
              key: MongoDb__DatabaseName
        - name: Services__TenantService
          valueFrom:
            configMapKeyRef:
              name: authorization-service-config
              key: Services__TenantService
        - name: Services__CoverageService
          valueFrom:
            configMapKeyRef:
              name: authorization-service-config
              key: Services__CoverageService
        - name: Services__MemberService
          valueFrom:
            configMapKeyRef:
              name: authorization-service-config
              key: Services__MemberService
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: authorization-service
  namespace: cloudhealthoffice
  labels:
    app: authorization-service
spec:
  type: ClusterIP
  selector:
    app: authorization-service
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP