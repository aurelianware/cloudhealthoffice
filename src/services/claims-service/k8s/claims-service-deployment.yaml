# Workload identity for claims-service: its user-assigned managed identity, federated to
# system:serviceaccount:cloudhealthoffice:claims-service-sa. token-service issues this service's
# CHO service tokens to that identity only (ServiceTokens:ServiceClients); the service holds
# no signing key. See docs/security/portal-token-service.md ("Service tokens").
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claims-service-sa
  namespace: cloudhealthoffice
  annotations:
    azure.workload.identity/client-id: "<CLAIMS_SERVICE_MANAGED_IDENTITY_CLIENT_ID>"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: claims-service-config
  namespace: cloudhealthoffice
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  MongoDb__DatabaseName: "CloudHealthOffice"
  Services__BenefitPlanService: "http://benefit-plan-service"
  Services__CoverageService: "http://coverage-service"
  Services__MemberService: "http://member-service"
  Services__ProviderService: "http://provider-service"
  Services__AuthorizationService: "http://authorization-service"
  Services__BenefitPlanServiceTimeoutSeconds: "5"
  ClaimsImport__Raw837MaxConcurrency: "32"
  Messaging__AdjudicationMaxConcurrentCalls: "32"
  Messaging__Backend: "Auto"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-service
  namespace: cloudhealthoffice
  labels:
    app: claims-service
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: claims-service
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
        app: claims-service
        tier: backend
    spec:
      serviceAccountName: claims-service-sa
      containers:
      - name: claims-service
        image: clouhealthoffice.azurecr.io/cloudhealthoffice-claims-service:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        # Source=TokenService, token-service URL and Entra scope (shared by all services).
        - configMapRef:
            name: cho-service-tokens
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ChoAuth__ServiceToken__ClientId
          value: "claims-service"
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: claims-service-config
              key: ASPNETCORE_ENVIRONMENT
        - name: MongoDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: connectionString
        - name: MongoDb__DatabaseName
          valueFrom:
            configMapKeyRef:
              name: claims-service-config
              key: MongoDb__DatabaseName
        - name: Services__BenefitPlanService
          valueFrom:
            configMapKeyRef:
              name: claims-service-config
              key: Services__BenefitPlanService
        - name: Services__CoverageService
          valueFrom:
            configMapKeyRef:
              name: claims-service-config
              key: Services__CoverageService
        - name: Services__MemberService
          valueFrom:
            configMapKeyRef:
              name: claims-service-config
              key: Services__MemberService
        - name: Services__ProviderService
          valueFrom:
            configMapKeyRef:
              name: claims-service-config
              key: Services__ProviderService
        - name: Services__AuthorizationService
          valueFrom:
            configMapKeyRef:
              name: claims-service-config
              key: Services__AuthorizationService
        - name: Services__BenefitPlanServiceTimeoutSeconds
          valueFrom:
            configMapKeyRef:
              name: claims-service-config
              key: Services__BenefitPlanServiceTimeoutSeconds
        - name: ClaimsImport__Raw837MaxConcurrency
          valueFrom:
            configMapKeyRef:
              name: claims-service-config
              key: ClaimsImport__Raw837MaxConcurrency
        - name: Messaging__AdjudicationMaxConcurrentCalls
          valueFrom:
            configMapKeyRef:
              name: claims-service-config
              key: Messaging__AdjudicationMaxConcurrentCalls
        - name: Messaging__Backend
          valueFrom:
            configMapKeyRef:
              name: claims-service-config
              key: Messaging__Backend
        - name: Messaging__ServiceBusConnectionString
          valueFrom:
            secretKeyRef:
              name: servicebus-secret
              key: connectionString
              optional: true
        - name: Redis__ConnectionString
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: connectionString
        resources:
          requests:
            cpu: 1000m
            memory: 256Mi
          limits:
            cpu: 4000m
            memory: 2048Mi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: claims-service
  namespace: cloudhealthoffice
  labels:
    app: claims-service
spec:
  type: ClusterIP
  selector:
    app: claims-service
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
