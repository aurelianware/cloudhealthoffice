apiVersion: v1
kind: ConfigMap
metadata:
  name: pricing-api-config
  namespace: cloudhealthoffice
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  MongoDb__DatabaseName: "cho_pricing"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-api
  namespace: cloudhealthoffice
  labels:
    app: pricing-api
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pricing-api
  template:
    metadata:
      labels:
        app: pricing-api
        tier: backend
    spec:
      containers:
      - name: pricing-api
        image: choacrhy6h2vdulfru6.azurecr.io/cloudhealthoffice-pricing-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: pricing-api-config
              key: ASPNETCORE_ENVIRONMENT
        - name: MongoDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: connectionString
        - name: MongoDb__DatabaseName
          valueFrom:
            configMapKeyRef:
              name: pricing-api-config
              key: MongoDb__DatabaseName
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-api
  namespace: cloudhealthoffice
  labels:
    app: pricing-api
spec:
  type: ClusterIP
  selector:
    app: pricing-api
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pricing-api-ingress
  namespace: cloudhealthoffice
  labels:
    app: pricing-api
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - pricing.cloudhealthoffice.com
    secretName: pricing-api-tls-secret
  rules:
  - host: pricing.cloudhealthoffice.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pricing-api
            port:
              number: 80
