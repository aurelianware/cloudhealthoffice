apiVersion: v1
kind: ConfigMap
metadata:
  name: pricing-api-config
  namespace: cloudhealthoffice
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  MongoDb__DatabaseName: "cho_pricing"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-api
  namespace: cloudhealthoffice
  labels:
    app: pricing-api
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pricing-api
  template:
    metadata:
      labels:
        app: pricing-api
        tier: backend
    spec:
      containers:
      - name: pricing-api
        image: clouhealthoffice.azurecr.io/cloudhealthoffice-pricing-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: pricing-api-config
              key: ASPNETCORE_ENVIRONMENT
        - name: MongoDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: connectionString
        - name: MongoDb__DatabaseName
          valueFrom:
            configMapKeyRef:
              name: pricing-api-config
              key: MongoDb__DatabaseName
        - name: PricingApi__AdminSecret
          valueFrom:
            secretKeyRef:
              name: pricing-api-secret
              key: AdminSecret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-api
  namespace: cloudhealthoffice
  labels:
    app: pricing-api
spec:
  type: ClusterIP
  selector:
    app: pricing-api
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
---
# Ingress — exposes /pricing/* through api.cloudhealthoffice.com
# alongside the FHIR service at /fhir/r4/*.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pricing-api-ingress
  namespace: cloudhealthoffice
  labels:
    app: pricing-api
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: api.cloudhealthoffice.com
    http:
      paths:
      - path: /pricing(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: pricing-api
            port:
              number: 80
