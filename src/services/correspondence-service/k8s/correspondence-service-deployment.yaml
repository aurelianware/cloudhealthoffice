# correspondence-service: letter types, versioned templates and rendered letters
# (docs/architecture/correspondence.md). Letters are stored in document-service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: correspondence-service-config
  namespace: cloudhealthoffice
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  # Template versions are approved by someone other than their author.
  Correspondence__RequireSeparateApprover: "true"
  MongoDb__DatabaseName: "CloudHealthOffice"
  # Rendered letters are stored write-once in the document catalog; this
  # service holds no storage credentials.
  Services__DocumentService: "http://document-service.cloudhealthoffice"
---
apiVersion: v1
kind: Secret
metadata:
  name: correspondence-service-secret
  namespace: cloudhealthoffice
type: Opaque
stringData:
  MongoDb__ConnectionString: "__SET_VIA_KUBERNETES_SECRET_OR_KEY_VAULT__"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: correspondence-service
  namespace: cloudhealthoffice
  labels:
    app: correspondence-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: correspondence-service
  template:
    metadata:
      labels:
        app: correspondence-service
    spec:
      containers:
      - name: correspondence-service
        image: ghcr.io/aurelianware/cloudhealthoffice-correspondence-service:latest
        envFrom:
        # Source=TokenService, token-service URL and Entra scope (shared by all
        # services): this service calls document-service with its own token.
        - configMapRef:
            name: cho-service-tokens
        ports:
        - containerPort: 8080
        env:
        - name: ChoAuth__ServiceToken__ClientId
          value: "correspondence-service"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: correspondence-service-config
              key: ASPNETCORE_ENVIRONMENT
        - name: MongoDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: correspondence-service-secret
              key: MongoDb__ConnectionString
        - name: MongoDb__DatabaseName
          valueFrom:
            configMapKeyRef:
              name: correspondence-service-config
              key: MongoDb__DatabaseName
        - name: Correspondence__RequireSeparateApprover
          valueFrom:
            configMapKeyRef:
              name: correspondence-service-config
              key: Correspondence__RequireSeparateApprover
        - name: Services__DocumentService
          valueFrom:
            configMapKeyRef:
              name: correspondence-service-config
              key: Services__DocumentService
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            # SkiaSharp renders each letter in memory.
            memory: "768Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: correspondence-service
  namespace: cloudhealthoffice
spec:
  selector:
    app: correspondence-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
