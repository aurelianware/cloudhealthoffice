# Workload identity for premium-billing-service: its user-assigned managed identity, federated to
# system:serviceaccount:cloudhealthoffice:premium-billing-service-sa. token-service issues this service's
# CHO service tokens to that identity only (ServiceTokens:ServiceClients); the service holds
# no signing key. See docs/security/portal-token-service.md ("Service tokens").
apiVersion: v1
kind: ServiceAccount
metadata:
  name: premium-billing-service-sa
  namespace: cloudhealthoffice
  annotations:
    azure.workload.identity/client-id: "<PREMIUM_BILLING_SERVICE_MANAGED_IDENTITY_CLIENT_ID>"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: premium-billing-service-config
  namespace: cloudhealthoffice
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  CosmosDb__DatabaseName: "CloudHealthOffice"
  CoverageService__BaseUrl: "http://coverage-service.cloudhealthoffice"
  SponsorService__BaseUrl: "http://sponsor-service.cloudhealthoffice"
  MemberService__BaseUrl: "http://member-service.cloudhealthoffice"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: premium-billing-service
  namespace: cloudhealthoffice
  labels:
    app: premium-billing-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: premium-billing-service
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
        app: premium-billing-service
        tier: backend
    spec:
      serviceAccountName: premium-billing-service-sa
      containers:
      - name: premium-billing-service
        image: clouhealthoffice.azurecr.io/cloudhealthoffice-premium-billing-service:latest
        imagePullPolicy: Always
        envFrom:
        # Source=TokenService, token-service URL and Entra scope (shared by all services).
        - configMapRef:
            name: cho-service-tokens
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ChoAuth__ServiceToken__ClientId
          value: "premium-billing-service"
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: premium-billing-service-config
              key: ASPNETCORE_ENVIRONMENT
        - name: MongoDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: connectionString
              optional: true
        - name: CosmosDb__Endpoint
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: endpoint
        - name: CosmosDb__Key
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: key
        - name: CosmosDb__DatabaseName
          valueFrom:
            configMapKeyRef:
              name: premium-billing-service-config
              key: CosmosDb__DatabaseName
        - name: CoverageService__BaseUrl
          valueFrom:
            configMapKeyRef:
              name: premium-billing-service-config
              key: CoverageService__BaseUrl
        - name: SponsorService__BaseUrl
          valueFrom:
            configMapKeyRef:
              name: premium-billing-service-config
              key: SponsorService__BaseUrl
        - name: MemberService__BaseUrl
          valueFrom:
            configMapKeyRef:
              name: premium-billing-service-config
              key: MemberService__BaseUrl
        - name: Stripe__SecretKey
          valueFrom:
            secretKeyRef:
              name: stripe-api-keys
              key: secret-key
        # optional so a deployment that does not use Stripe ACH (secret-key left
        # empty) starts without it. When secret-key is set, the service refuses
        # to start without webhook-secret (StripeWebhookSecret.EnsureConfigured),
        # and the anonymous webhook rejects every event while it is empty.
        - name: Stripe__WebhookSecret
          valueFrom:
            secretKeyRef:
              name: stripe-api-keys
              key: webhook-secret
              optional: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: premium-billing-service
  namespace: cloudhealthoffice
  labels:
    app: premium-billing-service
spec:
  type: ClusterIP
  selector:
    app: premium-billing-service
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
