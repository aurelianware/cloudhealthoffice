apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-partner-service
  namespace: cloudhealthoffice
  labels:
    app: trading-partner-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-partner-service
  template:
    metadata:
      labels:
        app: trading-partner-service
    spec:
      containers:
      - name: trading-partner-service
        image: ghcr.io/aurelianware/cloudhealthoffice-trading-partner-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: COSMOS_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: endpoint
        - name: COSMOS_KEY
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: key
        - name: COSMOS_DATABASE
          value: "CloudHealthOffice"
        - name: COSMOS_CONTAINER_TRADING_PARTNERS
          value: "TradingPartners"
        - name: AzureAd__ClientId
          value: ""
          valueFrom:
            secretKeyRef:
              name: azure-ad-config
              key: ClientId
        - name: AzureAd__TenantId
          value: ""
          valueFrom:
            secretKeyRef:
              name: azure-ad-config
              key: TenantId
        - name: AzureAd__Audience
          value: ""
          valueFrom:
            secretKeyRef:
              name: azure-ad-config
              key: Audience
        - name: MongoDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: connectionString
        - name: MongoDb__DatabaseName
          value: "cloudhealthoffice"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: trading-partner-service
  namespace: cloudhealthoffice
  labels:
    app: trading-partner-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: trading-partner-service
