# SFTP Sensor - Triggers workflows on SFTP polling events
#
# Listens to: sftp-polling EventSource
# Triggers: x12-275-ingest, x12-276-ingest, x12-278-ingest WorkflowTemplates

apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: sftp-sensor
  namespace: cloudhealthoffice
  labels:
    app.kubernetes.io/name: sftp-sensor
    app.kubernetes.io/component: sensor
    app.kubernetes.io/part-of: cloudhealthoffice
spec:
  template:
    serviceAccountName: argo-events-sa
    container:
      resources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "100m"
  
  dependencies:
    - name: sftp-275-poll
      eventSourceName: sftp-polling
      eventName: sftp-poll-275
    
    - name: sftp-276-poll
      eventSourceName: sftp-polling
      eventName: sftp-poll-276
    
    - name: sftp-278-poll
      eventSourceName: sftp-polling
      eventName: sftp-poll-278
  
  triggers:
    # Trigger X12 275 Ingest Workflow
    - template:
        name: trigger-275-ingest
        conditions: "sftp-275-poll"
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: x12-275-ingest-
                namespace: cloudhealthoffice
              spec:
                workflowTemplateRef:
                  name: x12-275-ingest
                arguments:
                  parameters:
                    - name: sftp-host
                      value: "sftp.clearinghouse.example.com"
                    - name: sftp-folder
                      value: "/inbound/attachments"
                    - name: file-pattern
                      value: "*.edi"
          parameters:
            - src:
                dependencyName: sftp-275-poll
                dataKey: metadata.transaction-type
              dest: spec.arguments.parameters.0.value
      retryStrategy:
        steps: 3
        duration: "30s"
    
    # Trigger X12 276 Ingest Workflow (Claim Status Inquiry)
    - template:
        name: trigger-276-ingest
        conditions: "sftp-276-poll"
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: x12-276-ingest-
                namespace: cloudhealthoffice
              spec:
                workflowTemplateRef:
                  name: x12-276-ingest
                arguments:
                  parameters:
                    - name: tenant-id
                      value: "bcbs-florida"
                    - name: trading-partner-id
                      value: "availity"
                    - name: environment
                      value: "prod"
                    - name: sftp-inbound-folder
                      value: "/inbound/276"
                    - name: file-pattern
                      value: "*.edi"
          parameters:
            - src:
                dependencyName: sftp-276-poll
                dataKey: metadata.transaction-type
              dest: spec.arguments.parameters.0.value
      retryStrategy:
        steps: 3
        duration: "30s"
    
    # Trigger X12 278 Ingest Workflow
    - template:
        name: trigger-278-ingest
        conditions: "sftp-278-poll"
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: x12-278-ingest-
                namespace: cloudhealthoffice
              spec:
                workflowTemplateRef:
                  name: x12-278-ingest
                arguments:
                  parameters:
                    - name: sftp-host
                      value: "sftp.clearinghouse.example.com"
                    - name: sftp-folder
                      value: "/inbound/278"
                    - name: file-pattern
                      value: "*.edi"
          parameters:
            - src:
                dependencyName: sftp-278-poll
                dataKey: metadata.transaction-type
              dest: spec.arguments.parameters.0.value
      retryStrategy:
        steps: 3
        duration: "30s"
