# claims backend API Credentials Secret Template
#
# IMPORTANT: Do not commit actual credentials. This is a template.
# Create the actual secret using kubectl or external secrets operator.
#
# kubectl create secret generic claims-backend-api-secret \
#   --from-literal=token=your-api-token \
#   -n cloudhealthoffice

apiVersion: v1
kind: Secret
metadata:
  name: claims-backend-api-secret
  namespace: cloudhealthoffice
  labels:
    app.kubernetes.io/name: claims-backend-api-secret
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: cloudhealthoffice
    hipaa.compliance: "required"
  annotations:
    description: "API token for claims backend backend integration"
    security.policy: "rotate-90-days"
type: Opaque
stringData:
  # PLACEHOLDER VALUES - REPLACE IN PRODUCTION
  token: "REPLACE_WITH_CLAIMS_BACKEND_API_TOKEN"
