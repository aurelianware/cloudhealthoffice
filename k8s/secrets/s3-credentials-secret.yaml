# S3/MinIO Credentials Secret Template
#
# IMPORTANT: Do not commit actual credentials. This is a template.
# Create the actual secret using kubectl or external secrets operator.
#
# kubectl create secret generic s3-credentials-secret \
#   --from-literal=access-key-id=your-access-key \
#   --from-literal=secret-access-key=your-secret-key \
#   -n cloudhealthoffice

apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials-secret
  namespace: cloudhealthoffice
  labels:
    app.kubernetes.io/name: s3-credentials-secret
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: cloudhealthoffice
    hipaa.compliance: "required"
  annotations:
    description: "AWS S3 or MinIO credentials for data lake storage"
    security.policy: "rotate-90-days"
type: Opaque
stringData:
  # PLACEHOLDER VALUES - REPLACE IN PRODUCTION
  access-key-id: "REPLACE_WITH_ACCESS_KEY_ID"
  secret-access-key: "REPLACE_WITH_SECRET_ACCESS_KEY"
