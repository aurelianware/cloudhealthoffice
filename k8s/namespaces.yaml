---
# Kubernetes Namespaces for Cloud Health Office Microservices
apiVersion: v1
kind: Namespace
metadata:
  name: cho-portal
  labels:
    name: cho-portal
    app: cloudhealthoffice
    component: frontend
---
apiVersion: v1
kind: Namespace
metadata:
  name: cho-svcs
  labels:
    name: cho-svcs
    app: cloudhealthoffice
    component: backend-services
---
# Resource Quotas to prevent runaway costs
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-resources
  namespace: cho-portal
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-resources
  namespace: cho-svcs
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "50"
---
# Network Policies (optional - for production security)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-portal
  namespace: cho-svcs
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: cho-portal
        - namespaceSelector:
            matchLabels:
              name: cho-workflows
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 3002
        - protocol: TCP
          port: 3003
        - protocol: TCP
          port: 3004
        - protocol: TCP
          port: 3005
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8089
