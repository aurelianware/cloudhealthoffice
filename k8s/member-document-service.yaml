apiVersion: v1
kind: ConfigMap
metadata:
  name: member-document-service-config
  namespace: cloudhealthoffice
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  MongoDb__DatabaseName: "cloudhealthoffice"
  BlobStorage__ContainerName: "member-documents"
---
apiVersion: v1
kind: Secret
metadata:
  name: member-document-service-secret
  namespace: cloudhealthoffice
type: Opaque
stringData:
  MongoDb__ConnectionString: "__SET_VIA_KUBERNETES_SECRET_OR_KEY_VAULT__"
  BlobStorage__ConnectionString: "__SET_VIA_KUBERNETES_SECRET_OR_KEY_VAULT__"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-document-service
  namespace: cloudhealthoffice
  labels:
    app: member-document-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: member-document-service
  template:
    metadata:
      labels:
        app: member-document-service
    spec:
      containers:
      - name: member-document-service
        image: ghcr.io/aurelianware/cloudhealthoffice-member-document-service:latest
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: member-document-service-config
              key: ASPNETCORE_ENVIRONMENT
        - name: MongoDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: member-document-service-secret
              key: MongoDb__ConnectionString
        - name: MongoDb__DatabaseName
          valueFrom:
            configMapKeyRef:
              name: member-document-service-config
              key: MongoDb__DatabaseName
        - name: BlobStorage__ContainerName
          valueFrom:
            configMapKeyRef:
              name: member-document-service-config
              key: BlobStorage__ContainerName
        - name: BlobStorage__ConnectionString
          valueFrom:
            secretKeyRef:
              name: member-document-service-secret
              key: BlobStorage__ConnectionString
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: member-document-service
  namespace: cloudhealthoffice
spec:
  selector:
    app: member-document-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
