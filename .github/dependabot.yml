version: 2
updates:
  # ============================================================
  # npm — Root project
  # ============================================================
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 10
    reviewers:
      - "aurelianware"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ============================================================
  # npm — Claims Scrubbing Service
  # ============================================================
  - package-ecosystem: "npm"
    directory: "/src/services/claims-scrubbing-service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 5
    reviewers:
      - "aurelianware"
    labels:
      - "dependencies"
      - "npm"
      - "claims-scrubbing"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      claims-scrubbing-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ============================================================
  # npm — X12 834 Parser container
  # ============================================================
  - package-ecosystem: "npm"
    directory: "/containers/x12-834-parser"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 5
    reviewers:
      - "aurelianware"
    labels:
      - "dependencies"
      - "npm"
      - "containers"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      x12-834-parser-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ============================================================
  # NuGet — .NET Microservices (all under src/services/)
