name: Da Vinci Interoperability

# Proves that Cloud Health Office can exchange standards-conformant requests and
# responses with INDEPENDENT HL7 Da Vinci implementations — not only with
# CHO-owned fixtures.
#
# This is deliberately separate from the CMS-0057-F Acceptance Evidence workflow.
# The two answer different questions and their results are never merged:
#
#   cms0057-acceptance-evidence.yml   Does CHO implement what its own CMS-0057-F
#                                     acceptance specification requires?
#   this workflow                     Can CHO interoperate with an implementation
#                                     it does not own?
#
# An interoperability pass is not CMS certification, and nothing here may change a
# CMS-0057-F scenario status.
#
# Cost control: harness unit tests run on every triggering PR (seconds, no Docker).
# The external scenarios — which pull and start a real third-party container — run
# on PRs that touch the harness or the interop-relevant service surface, on
# workflow_dispatch, and nightly. The Inferno conformance kits are nightly and
# workflow_dispatch only: each one builds a Ruby image from an upstream checkout,
# starts seven CHO services beside it, and validates every returned resource
# against a bundled IG package. That is tens of minutes, and a pull request that
# did not touch the FHIR surface learns nothing from paying for it.
#
# Both br-payer scenarios run in ONE job rather than a matrix leg each. They pin
# the same image, so a single job pulls it once instead of twice; the harness
# still starts and tears down a separate container per scenario, so they remain
# isolated from one another. The evidence writer merges their results into one
# run document.

permissions:
  contents: read

on:
  push:
    branches: ["main"]
    paths:
      - 'interop/**'
      - 'tests/DaVinciInterop.Tests/**'
      - 'scripts/interop/**'
      - 'docs/interop/**'
      - '.github/workflows/davinci-interop.yml'
      - 'src/services/fhir-service/**'          # CRD/DTR/PAS/CDex/P2P FHIR surface
      - 'src/services/authorization-service/**' # prior-auth backend
      - 'src/services/rfai-service/**'          # CDex additional information
      - 'src/services/consent-service/**'       # payer-to-payer consent
      - 'src/services/smart-auth-service/**'    # SMART / OAuth
      - 'src/engines/CloudHealthOffice.PriorAuthRuleEngine/**'
  pull_request:
    branches: ["main"]
    paths:
      - 'interop/**'
      - 'tests/DaVinciInterop.Tests/**'
      - 'scripts/interop/**'
      - 'docs/interop/**'
      - '.github/workflows/davinci-interop.yml'
      - 'src/services/fhir-service/**'
      - 'src/services/authorization-service/**'
      - 'src/services/rfai-service/**'
      - 'src/services/consent-service/**'
      - 'src/services/smart-auth-service/**'
      - 'src/engines/CloudHealthOffice.PriorAuthRuleEngine/**'
  workflow_dispatch:
  schedule:
    # Nightly, so an upstream registry or IG-package change is caught before it
    # surprises a pull request. Pins never move on their own — a nightly failure
    # after an upstream change is a finding to triage, not a signal to auto-bump.
    - cron: '17 6 * * *'

# One group per ref AND trigger. A push to main runs only the harness and
# br-payer jobs, so it must not cancel a workflow_dispatch or nightly run on
# main, which is the only kind that runs the Inferno kits (2026-10-30: two
# dispatched runs were cancelled by merges). A newer run of the same trigger on
# the same ref still replaces the older one.
concurrency:
  group: davinci-interop-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ── Harness unit tests ─────────────────────────────────────────────────────
  # No Docker, no network, no third-party code. Enforces the invariants that make
  # the harness trustworthy: every external target is pinned reproducibly, the
  # compose stack starts exactly those digests, artifacts are redacted, and an
  # unexecuted scenario is reported NotRun rather than omitted.
  harness:
    name: Harness unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Run harness unit tests
        run: |
          dotnet test tests/DaVinciInterop.Tests/DaVinciInterop.Tests.csproj \
            -c Debug --filter "Category=DaVinciInteropUnit" \
            --logger "trx;LogFileName=davinci-interop-harness.trx" \
            --results-directory artifacts/trx

      - name: Upload harness results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: davinci-interop-harness-trx
          path: artifacts/trx
          if-no-files-found: warn

  # ── External scenarios ─────────────────────────────────────────────────────
  # Starts the pinned HL7 Da Vinci burden-reduction payer reference implementation
  # and performs real exchanges against it:
  #   BR-PAS-SUBMIT-001  PAS $submit — a synthetic prior authorization
  #   BR-CRD-001         CRD CDS Hooks — discovery plus order-sign invocations
  #   BR-DTR-001         DTR $questionnaire-package — entered from the payer's own
  #                      CRD determination, following the questionnaire it named
  #
  # Security posture:
  #   * `permissions: contents: read` only — the third-party container never sits
  #     in a job holding a write-scoped token.
  #   * No repository secret is referenced, so none is available to the container.
  #   * No Docker socket is mounted into any external container.
  #   * The external stack runs on its own bridge network with host ports bound to
  #     127.0.0.1, so nothing is reachable off the runner.
  #   * All data sent is synthetic; no VSAC or other licensed terminology
  #     credential is used or required.
  scenarios:
    name: br-payer external scenarios (PAS $submit, CRD, DTR)
    runs-on: ubuntu-latest
    needs: harness
    # A dead external implementation must fail with a diagnostic, not hold a
    # runner. The harness has its own bounded timeouts; this is the outer bound,
    # sized for three scenarios each starting their own container.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Show the pinned external targets under test
        run: |
          python3 - <<'PY'
          import json
          versions = json.load(open('interop/versions.json'))
          print('Pinned external Da Vinci targets:')
          for target in versions['targets']:
              pin = target['pin']
              print(f"  {target['name']:<45} {pin['reference']}")
              if pin.get('sourceCommit'):
                  print(f"  {'':<45} upstream commit {pin['sourceCommit']}")
          PY

      - name: Run the external interoperability scenarios
        id: scenarios
        env:
          CHO_INTEROP_ENVIRONMENT: CI
        # `all` runs every external scenario in one invocation. They serialize
        # (shared Compose project and host ports) and merge into one run document.
        run: ./scripts/interop/run.sh br-payer all

      - name: Job summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          path = 'artifacts/interop/run.json'
          print('## Da Vinci external interoperability')
          if not os.path.exists(path):
              print('\n_No interoperability evidence was produced._')
              raise SystemExit(0)
          run = json.load(open(path))
          s = run['summary']
          print(f"\n{s['passed']} passed / {s['failed']} failed / {s['skipped']} skipped / {s['notRun']} not run\n")
          print('| Scenario | Protocol | Status | Independent implementation | Pinned version |')
          print('| --- | --- | --- | --- | --- |')
          for target in run['targets']:
              for result in target['results']:
                  chain = f" ← {result['linkedFromScenario']}" if result.get('linkedFromScenario') else ''
                  print(f"| {result['scenarioId']}{chain} | {result['protocol']} | {result['status']} "
                        f"| {target['name']} | `{target['version']}` |")
          for result in run['notRunScenarios']:
              print(f"| {result['scenarioId']} | {result['protocol']} | NotRun | {result['target']} | — |")
          if run['findings']:
              print('\n### Interoperability findings\n')
              for finding in run['findings']:
                  print(f"- **{finding['severity']}** `{finding['code']}` — {finding['summary']}")
                  if finding.get('choObserved') or finding.get('externalObserved'):
                      print(f"  - CHO: `{finding.get('choObserved')}`")
                      print(f"  - External: `{finding.get('externalObserved')}`")
          print('\n_Interoperability evidence is independent of CMS-0057-F acceptance evidence and never '
                'changes a CMS-0057-F scenario status._')
          PY

      - name: Upload sanitized interoperability evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: davinci-interop-evidence-${{ github.sha }}
          path: artifacts/interop/
          if-no-files-found: warn

      - name: Confirm the external stack was torn down
        if: always()
        run: |
          # scripts/interop/run.sh cleans up on exit, including after a failure.
          # This is the audit: nothing the harness started may outlive the job.
          LEFTOVER=$(docker ps --filter "label=com.docker.compose.project=cho-interop" --quiet)
          if [ -n "$LEFTOVER" ]; then
            echo "::warning::Interop containers survived the run; removing them."
            docker rm --force $LEFTOVER
          else
            echo "No interop containers remain."
          fi

  # ── Publish the latest interoperability snapshot (main only) ───────────────
  # Mirrors cms0057-acceptance-evidence.yml: a public-safe projection of the run
  # is committed into the site tree so the Evidence Hub renders live status
  # instead of hard-coded prose. `needs: scenarios` means a failed or cancelled
  # run never publishes, and the snapshot on the site keeps naming the run that
  # actually produced it.
  #
  # The committed file touches only src/site/**, which is not in this workflow's
  # paths — so the push deploys via Pages without re-triggering interop.
  #
  # A Failed scenario is still published, deliberately: the projection reports
  # what happened, and hiding a failure would make the snapshot a marketing
  # artifact rather than evidence. The job's own gate is that the scenarios job
  # completed, not that every scenario passed.
  # ── Inferno conformance kits ───────────────────────────────────────────────
  # The direction reverses here. The scenarios job has CHO driving an independent
  # payer and the harness judging the answers; this job has an independent
  # implementation judging CHO:
  #   INFERNO-USCORE-SERVER-001  US Core 3.1.1 — CapabilityStatement, Patient,
  #                              Encounter groups against the seeded interop-cho
  #                              profile (CHO's real services, not the mock)
  #   INFERNO-C4BB-SERVER-001    CARIN BB 2.0.0 financial — CapabilityStatement,
  #                              Patient, Coverage, EOB, Organization,
  #                              Practitioner groups
  #   INFERNO-PLANNET-SERVER-001 Plan-Net (kit generated from 1.1.0) — the whole
  #                              server suite against the public Provider
  #                              Directory, with no token
  #   INFERNO-BULK-SERVER-001    Bulk Data 2.0.0 — SMART Backend Services
  #                              (TLS test omitted), Group and Patient export,
  #                              files downloaded and validated; the kit
  #                              authenticates with SMART Backend Services
  #
  # The kits publish no upstream image, so each is fetched at the tag pinned in
  # interop/versions.json and built locally. The fetch script refuses a checkout
  # whose commit does not match the pin.
  #
  # Scheduled and manual only, and `continue-on-error` — deliberately. An
  # external validator's verdict on CHO is a finding to triage, not a merge gate:
  # a kit release can tighten what it checks overnight, and a red required check
  # on an unrelated pull request would train people to ignore it. The verdict
  # lands in the job summary and the uploaded evidence, where it is read.
  #
  # Same security posture as the scenarios job: `contents: read`, no repository
  # secret, no Docker socket mounted, host ports bound to 127.0.0.1, all data
  # synthetic.
  inferno:
    name: Inferno conformance kits judging CHO (US Core, CARIN BB, Plan-Net, Bulk Data)
    runs-on: ubuntu-latest
    needs: harness
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    # Four kit builds, eight CHO service builds, and four suites that validate
    # every resource they read. The outer bound, not an expectation.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # The interop-cho profile is seeded by scripts/interop/seed-cho.mjs, which
      # takes no dependencies beyond Node itself.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # The job builds every CHO service image and four kit images on one
      # runner. Run 41159022696 ran out of disk extracting the fhir-service
      # base layer ("No space left on device"), so every scenario failed before
      # a kit started. Remove the preinstalled toolchains this job never uses.
      - name: Free disk space for the image builds
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/share/chromium
          docker system prune --all --force >/dev/null
          df -h /

      - name: Fetch the pinned conformance kits
        run: ./scripts/interop/fetch-inferno.sh us-core c4bb plan-net bulk-data

      - name: Run the conformance kits against CHO
        env:
          CHO_INTEROP_ENVIRONMENT: CI
        run: ./scripts/interop/run.sh inferno all

      # Every kit validates through the inferno-validator sidecar, and when it
      # answers with anything but 200 the kits report "Unable to connect to
      # validator" for every validation test, which says nothing about why. The
      # harness saves the validator's log tail with the evidence of a run that
      # did not pass; printing it here puts the reason in the job log, where it
      # can be read without downloading the artifact.
      - name: Show the validator's log
        if: always()
        run: |
          LOG=artifacts/interop/service-logs/inferno-validator.log
          if [ -f "$LOG" ]; then
            echo "::group::inferno-validator (last 200 lines)"
            tail -n 200 "$LOG"
            echo "::endgroup::"
          else
            echo "No validator log was captured (a run that passes keeps none)."
          fi

      - name: Job summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          path = 'artifacts/interop/run.json'
          print('## Inferno conformance kits judging CHO')
          if not os.path.exists(path):
              print('\n_No conformance evidence was produced._')
              raise SystemExit(0)
          run = json.load(open(path))
          s = run['summary']
          print(f"\n{s['passed']} passed / {s['failed']} failed / {s['skipped']} skipped / {s['notRun']} not run\n")
          print('| Scenario | Protocol | Status | Conformance kit | Pinned version |')
          print('| --- | --- | --- | --- | --- |')
          for target in run['targets']:
              for result in target['results']:
                  print(f"| {result['scenarioId']} | {result['protocol']} | {result['status']} "
                        f"| {target['name']} | `{target['version']}` |")
          failures = [f for f in run['findings'] if f['severity'] == 'Error']
          if failures:
              print('\n### What the kits reported as failing\n')
              for finding in failures:
                  print(f"- {finding['summary']}")
          print('\n_An Inferno pass is not CMS certification, and nothing here changes a CMS-0057-F '
                'scenario status on its own._')
          PY

      - name: Upload sanitized conformance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inferno-conformance-evidence-${{ github.sha }}
          path: artifacts/interop/
          if-no-files-found: warn

      - name: Confirm the stack was torn down
        if: always()
        run: |
          LEFTOVER=$(docker ps --filter "label=com.docker.compose.project=cho-interop" --quiet)
          if [ -n "$LEFTOVER" ]; then
            echo "::warning::Interop containers survived the run; removing them."
            docker rm --force $LEFTOVER
          else
            echo "No interop containers remain."
          fi

  # The kits' verdicts go to their own snapshot, published only from a run
  # whose inferno job left evidence. The push-triggered publish above never
  # writes it, so a push cannot replace the last nightly's results with
  # "not run". A manual dispatch on main publishes too, because that is how
  # a fix is confirmed before the next nightly.
  publish-inferno:
    name: Publish latest Inferno conformance evidence
    runs-on: ubuntu-latest
    needs: inferno
    if: >-
      always() && needs.inferno.result != 'skipped' && needs.inferno.result != 'cancelled'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download the conformance evidence
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: inferno-conformance-evidence-${{ github.sha }}
          path: artifacts/interop

      # No run.json means the job died before writing evidence. Publishing then
      # would replace real verdicts with "no run", so the last snapshot stands.
      - name: Check for a run document
        id: evidence
        run: |
          if [ -f artifacts/interop/run.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The inferno job left no run.json; keeping the last published conformance snapshot."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Project the public snapshot
        if: steps.evidence.outputs.present == 'true'
        run: >-
          node scripts/interop/publish-inferno-evidence.mjs --run artifacts/interop/run.json
          --badges artifacts/interop/badges

      - name: Publish the snapshot to ci-evidence
        id: publish
        if: steps.evidence.outputs.present == 'true'
        env:
          IGNORE_FIELD: generatedAtUtc
        run: >-
          bash scripts/ci/publish-evidence.sh "interop: Inferno conformance evidence from ${{ github.sha }}"
          src/site/insights/cms-0057-f/inferno-conformance-public-evidence.json:evidence/inferno-conformance-public-evidence.json
          artifacts/interop/badges/inferno-us-core.json:badges/inferno-us-core.json
          artifacts/interop/badges/inferno-c4bb.json:badges/inferno-c4bb.json
          artifacts/interop/badges/inferno-plan-net.json:badges/inferno-plan-net.json
          artifacts/interop/badges/inferno-bulk-data.json:badges/inferno-bulk-data.json

      - name: Redeploy the site
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-pages.yml --ref main
          gh workflow run deploy-cloudflare-pages.yml --ref main

  publish:
    name: Publish latest interoperability evidence
    runs-on: ubuntu-latest
    needs: scenarios
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download the interoperability evidence
        uses: actions/download-artifact@v8
        with:
          name: davinci-interop-evidence-${{ github.sha }}
          path: artifacts/interop

      - name: Project the public snapshot
        run: node scripts/interop/publish-public-evidence.mjs --run artifacts/interop/run.json

      # main only takes reviewed pull requests: the snapshot goes to the
      # ci-evidence branch, and the site deploys overlay it onto src/site.
      # Publish only when something a reader would care about changed:
      # generatedAtUtc moves every run.
      - name: Publish the snapshot to ci-evidence
        id: publish
        env:
          IGNORE_FIELD: generatedAtUtc
        run: >-
          bash scripts/ci/publish-evidence.sh "interop: Da Vinci evidence from ${{ github.sha }}"
          src/site/insights/cms-0057-f/davinci-interop-public-evidence.json:evidence/davinci-interop-public-evidence.json

      # A push made with GITHUB_TOKEN starts no workflows, so redeploy the
      # site explicitly.
      - name: Redeploy the site
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-pages.yml --ref main
          gh workflow run deploy-cloudflare-pages.yml --ref main
