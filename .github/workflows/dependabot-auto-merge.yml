name: Dependabot Review

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  dependabot-auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-approve patch and minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # main currently permits merging without required CI. `gh pr merge --auto`
      # therefore merged #1415 immediately even though its checks failed.
      # Keep dependency PRs open for exact-head CI verification before merge.
      # Re-enable merging only after required checks are enforced by branch rules.
