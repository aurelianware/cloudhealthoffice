name: Dependency Review

# Fails a pull request that adds or upgrades to a package with a known High or
# Critical vulnerability, or under a strong copyleft licence (GPL/AGPL) that
# CHO's BSL 1.1 distribution can't carry. Covers NuGet, npm and GitHub Actions
# through the dependency graph. Packages already on main are covered by the
# Security Scan workflow (Trivy, NuGet and npm audits).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later
