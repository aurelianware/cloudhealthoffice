name: Deploy API Docs

on:
  push:
    branches: ["main"]
    paths:
      - 'src/api-docs/**'
      - 'api/openapi/**'
      - 'containers/api-docs/**'
      - '.github/workflows/deploy-api-docs.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: api-docs
  ACA_NAME: api-docs
  ACA_ENV: cho-aca-env
  RESOURCE_GROUP: rg-cloudhealthoffice-prod

jobs:
  deploy:
    name: Build & Deploy API Docs to Azure Container Apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          IMAGE_LATEST="${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest"
          docker build -f containers/api-docs/Dockerfile . -t "${IMAGE_TAG}" -t "${IMAGE_LATEST}"
          docker push "${IMAGE_TAG}"
          docker push "${IMAGE_LATEST}"

      - name: Deploy to Azure Container Apps
        run: |
          IMAGE_TAG="${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          az containerapp create \
            --name "${{ env.ACA_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --environment "${{ env.ACA_ENV }}" \
            --image "${IMAGE_TAG}" \
            --ingress external \
            --target-port 80 \
            --min-replicas 1 \
            --max-replicas 3 \
            --cpu 0.25 \
            --memory 0.5Gi \
            --registry-server "${{ vars.ACR_LOGIN_SERVER }}" 2>/dev/null || \
          az containerapp update \
            --name "${{ env.ACA_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${IMAGE_TAG}"

      - name: Bind custom domains
        run: |
          for HOSTNAME in api.cloudhealthoffice.com sandbox.cloudhealthoffice.com; do
            az containerapp hostname bind \
              --name "${{ env.ACA_NAME }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --hostname "${HOSTNAME}" \
              --environment "${{ env.ACA_ENV }}" \
              --validation-method CNAME 2>&1 | grep -v "^WARNING" || true
            echo "✅ ${HOSTNAME} bound"
          done

      - name: Verify health endpoint
        run: |
          echo "Waiting for container app to start..."
          sleep 30
          FQDN=$(az containerapp show \
            --name "${{ env.ACA_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Container App FQDN: ${FQDN}"
          curl -sf "https://${FQDN}/" -o /dev/null && \
            echo "✅ API Docs is healthy" || \
            echo "⚠️  Health check failed — container may still be warming up"
