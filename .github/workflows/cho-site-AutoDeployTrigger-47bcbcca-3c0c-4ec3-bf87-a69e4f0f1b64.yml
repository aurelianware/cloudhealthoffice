name: Trigger auto deployment for cho-site

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/cho-site-AutoDeployTrigger-47bcbcca-3c0c-4ec3-bf87-a69e4f0f1b64.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CHOSITE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CHOSITE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CHOSITE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: choacrhy6h2vdulfru6.azurecr.io
          registryUsername: ${{ secrets.CHOSITE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CHOSITE_REGISTRY_PASSWORD }}
          containerAppName: cho-site
          resourceGroup: rg-cloudhealthoffice-prod
          imageToBuild: choacrhy6h2vdulfru6.azurecr.io/cho-site:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


