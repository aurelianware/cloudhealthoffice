name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'src/services/**'
      - 'src/portal/**'
      - 'src/site/**'
      - 'containers/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/services/**'
      - 'src/portal/**'
      - 'src/site/**'
      - 'containers/**'
  workflow_dispatch:

env:
  REGISTRY: choacrhy6h2vdulfru6.azurecr.io
  IMAGE_PREFIX: cloudhealthoffice

jobs:
  build-services:
    name: Build Microservices
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false  # Build all services to see all errors
      matrix:
        service:
          - member-service
          - coverage-service
          - claims-service
          - eligibility-service
          - authorization-service
          - attachment-service
          - provider-service
          - benefit-plan-service
          - reference-data-service
          - sponsor-service
          - claims-scrubbing-service
          - tenant-service
          - enrollment-import-service
          - trading-partner-service
          - rfai-service
        include:
          # tenant-service needs repo root as context so it can reach scripts/setup/
          - service: tenant-service
            build_context: '.'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name choacrhy6h2vdulfru6

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.build_context || format('./src/services/{0}', matrix.service) }}
          file: ./src/services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          platforms: linux/amd64

  build-portal:
    name: Build Blazor Portal
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name choacrhy6h2vdulfru6

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-portal
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./src/portal/CloudHealthOffice.Portal
          file: ./src/portal/CloudHealthOffice.Portal/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  build-site:
    name: Build Static Site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name choacrhy6h2vdulfru6

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-site
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./src/site
          file: ./src/site/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64


  deploy-site:
    name: Deploy Static Site to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            RG="${{ vars.AZURE_RG_NAME }}"
            APP_NAME="${{ vars.SITE_CONTAINER_APP_NAME || 'cho-site' }}"
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-site:sha-${GITHUB_SHA::7}"

            echo "==========================================="
            echo "Deploying Static Site Container"
            echo "==========================================="
            echo "Resource Group: $RG"
            echo "Container App:  $APP_NAME"
            echo "Image:          $IMAGE"
            echo ""

            # Update container app with new image
            az containerapp update \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --image "$IMAGE"

            echo ""
            echo "✅ Container App image updated"

            # Fix health probes: nginx-unprivileged listens on 8080, not 80.
            # Probes on port 80 keep the revision stuck in "activating" state.
            bash scripts/deploy/fix-aca-site-probes.sh "$APP_NAME" "$RG"

            echo ""

            # Ensure ACA ingress targetPort is 8080 (infra may default to 80).
            CURRENT_TARGET_PORT=$(az containerapp show \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --query "properties.configuration.ingress.targetPort" -o tsv 2>/dev/null) || {
              echo "⚠️  Could not query ingress targetPort; skipping targetPort check."
              CURRENT_TARGET_PORT=""
            }

            if [ "$CURRENT_TARGET_PORT" != "8080" ]; then
              echo "Ingress targetPort is '${CURRENT_TARGET_PORT:-unknown}', updating to 8080..."
              az containerapp ingress update \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --target-port 8080
              echo "✅ Container App ingress targetPort updated to 8080"
            else
              echo "✅ Container App ingress targetPort already set to 8080; no update needed"
            fi

            echo ""
            echo "✅ Container App updated successfully (image + health probes + ingress)"

            # Get the FQDN for verification
            FQDN=$(az containerapp show \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --query "properties.configuration.ingress.fqdn" -o tsv)

            echo "🌐 Site URL: https://$FQDN"

      - name: Verify Deployment
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            RG="${{ vars.AZURE_RG_NAME }}"
            APP_NAME="${{ vars.SITE_CONTAINER_APP_NAME || 'cho-site' }}"

            FQDN=$(az containerapp show \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --query "properties.configuration.ingress.fqdn" -o tsv)

            echo "Waiting 15 seconds for deployment to propagate..."
            sleep 15

            for i in $(seq 1 5); do
              echo "⏳ Health check attempt $i/5..."
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$FQDN" || echo "000")

              if [ "$HTTP_STATUS" = "200" ]; then
                echo "✅ Site is healthy - HTTP $HTTP_STATUS"

                # Verify sitemap and robots.txt
                SITEMAP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$FQDN/sitemap.xml" || echo "000")
                ROBOTS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$FQDN/robots.txt" || echo "000")
                echo "📄 sitemap.xml: HTTP $SITEMAP_STATUS"
                echo "🤖 robots.txt: HTTP $ROBOTS_STATUS"
                exit 0
              fi

              echo "   HTTP $HTTP_STATUS - retrying in 10s..."
              sleep 10
            done

            echo "⚠️  Site may need more time to stabilize"
            exit 0

  build-containers:
    name: Build Utility Containers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        container:
          - x12-parser
          - x12-276-parser
          - claims-publisher
          - kafka-publisher
          - sftp-fetcher
          - x12-encoder
          - metadata-extractor
          - x12-834-parser

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name choacrhy6h2vdulfru6

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.container }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Check if Dockerfile exists
        id: check
        run: |
          if [ -f "./containers/${{ matrix.container }}/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Dockerfile not found for ${{ matrix.container }}"
          fi

      - name: Build and push
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./containers/${{ matrix.container }}
          file: ./containers/${{ matrix.container }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-services, build-portal, build-site, deploy-site, build-containers]
    if: always()

    steps:
      - name: Check build results
        run: |
          echo "## Docker Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **All images built successfully**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Images pushed to: \`choacrhy6h2vdulfru6.azurecr.io/cloudhealthoffice-*\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services Built:" >> $GITHUB_STEP_SUMMARY
          echo "- member-service" >> $GITHUB_STEP_SUMMARY
          echo "- coverage-service" >> $GITHUB_STEP_SUMMARY
          echo "- claims-service" >> $GITHUB_STEP_SUMMARY
          echo "- eligibility-service" >> $GITHUB_STEP_SUMMARY
          echo "- authorization-service" >> $GITHUB_STEP_SUMMARY
          echo "- provider-service" >> $GITHUB_STEP_SUMMARY
          echo "- benefit-plan-service" >> $GITHUB_STEP_SUMMARY
          echo "- reference-data-service" >> $GITHUB_STEP_SUMMARY
          echo "- sponsor-service" >> $GITHUB_STEP_SUMMARY
          echo "- claims-scrubbing-service" >> $GITHUB_STEP_SUMMARY
          echo "- tenant-service" >> $GITHUB_STEP_SUMMARY
          echo "- enrollment-import-service" >> $GITHUB_STEP_SUMMARY
          echo "- portal (Blazor)" >> $GITHUB_STEP_SUMMARY
          echo "- site (Static)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Utility Containers Built:" >> $GITHUB_STEP_SUMMARY
          echo "- x12-parser (837 claims parsing)" >> $GITHUB_STEP_SUMMARY
          echo "- x12-276-parser (276 claim status inquiry parsing)" >> $GITHUB_STEP_SUMMARY
          echo "- x12-834-parser (834 enrollment parsing)" >> $GITHUB_STEP_SUMMARY
          echo "- claims-publisher (Kafka)" >> $GITHUB_STEP_SUMMARY
          echo "- kafka-publisher" >> $GITHUB_STEP_SUMMARY
          echo "- sftp-fetcher" >> $GITHUB_STEP_SUMMARY
          echo "- x12-encoder" >> $GITHUB_STEP_SUMMARY
          echo "- metadata-extractor" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Deploy Kafka topics: \`kubectl apply -f kafka/topics.yaml\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Deploy Argo workflows: \`kubectl apply -f argo-workflows/\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Deploy Argo Events: \`kubectl apply -f argo-events/\`" >> $GITHUB_STEP_SUMMARY
          echo "4. Deploy services: \`kubectl apply -f services/*/k8s/\`" >> $GITHUB_STEP_SUMMARY
          echo "5. Test 834 pipeline: Upload test-x12-834-enrollment-sample.edi to SFTP" >> $GITHUB_STEP_SUMMARY
