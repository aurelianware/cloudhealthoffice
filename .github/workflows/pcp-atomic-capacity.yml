name: Atomic PCP Capacity
on:
  pull_request:
    paths:
      - 'src/services/coverage-service/**'
      - '.github/workflows/pcp-atomic-capacity.yml'
permissions:
  contents: read
# A newer push to the same pull request replaces a queued or running check
# of the older commit; pushes to main and other events are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  atomic-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Replica-set capacity races and service regressions
        run: >-
          dotnet test src/services/coverage-service/CoverageService.Tests/CoverageService.Tests.csproj
          --filter 'FullyQualifiedName~AtomicPcpCapacityTests|FullyQualifiedName~PcpAssignmentServiceTests|FullyQualifiedName~PcpTransactionPolicyTests|FullyQualifiedName~PcpRosterWriterTests|FullyQualifiedName~PcpCoverageIntervalsTests|FullyQualifiedName~PcpRosterWriteMiddlewareTests'
          --verbosity normal
