# Dependabot configuration for Cloud Health Office
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
 
updates:
  # ─── GitHub Actions ───────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Phoenix"
    labels:
      - "dependencies"
      - "ci/cd"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    reviewers:
      - "aurelianware"
 
  # ─── NuGet (.NET) ────────────────────────────────────────────────
  # Main solution - covers all C# projects (Portal, engines, services)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Phoenix"
    labels:
      - "dependencies"
      - "dotnet"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    reviewers:
      - "aurelianware"
    groups:
      microsoft-packages:
        patterns:
          - "Microsoft.*"
          - "System.*"
        update-types:
          - "minor"
          - "patch"
      azure-packages:
        patterns:
          - "Azure.*"
          - "Microsoft.Azure.*"
        update-types:
          - "minor"
          - "patch"
      aspnetcore:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.Extensions.*"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "xunit*"
          - "Moq*"
          - "FluentAssertions*"
          - "coverlet.*"
          - "Microsoft.NET.Test.*"
          - "NSubstitute*"
        update-types:
          - "minor"
          - "patch"
      mongodb:
        patterns:
          - "MongoDB.*"
 
  # ─── npm (root package.json) ─────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Phoenix"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    reviewers:
      - "aurelianware"
