how do I create labels in github

12:03 PM

Recognized straightforward GitHub labeling question, drew from existing knowledge
Recognized straightforward GitHub labeling question, drew from existing knowledge
There are two ways:

From the UI:

Go to your repo → Issues tab → Labels (button on the right side, next to Milestones)
Click New label
Enter the name (e.g. github-actions), pick a color, optionally add a description
Click Create label
Repeat for dotnet, javascript, docker, python
From the GitHub CLI (faster for multiple labels):

bash
gh label create "github-actions" --repo aurelianware/cloudhealthoffice --color "0075ca" --description "GitHub Actions workflows"
gh label create "dotnet" --repo aurelianware/cloudhealthoffice --color "512bd4" --description ".NET/NuGet dependencies"
gh label create "javascript" --repo aurelianware/cloudhealthoffice --color "f1e05a" --description "JavaScript/npm dependencies"
gh label create "docker" --repo aurelianware/cloudhealthoffice --color "0db7ed" --description "Docker base images"
gh label create "python" --repo aurelianware/cloudhealthoffice --color "3572A5" --description "Python/pip dependencies"
The colors I picked match GitHub's conventional language colors (purple for .NET, yellow for JS, blue for Docker, etc.) but you can change them to whatever you want.

Once github-actions exists, that warning on PR #518 will go away on the next Dependabot run.






