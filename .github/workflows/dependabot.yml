          - "@types/*"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "jest*"
          - "ts-jest*"
          - "@jest/*"
        update-types:
          - "minor"
          - "patch"
 
  # ─── Docker ──────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/containers"
