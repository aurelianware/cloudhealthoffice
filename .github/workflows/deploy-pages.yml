name: Deploy marketing site to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/site/**'
      - 'docs/releases/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID || 'G-H1HCD5EYPN' }}
      FORMSPREE_FOUNDING_PARTNER_ENDPOINT: ${{ secrets.FORMSPREE_FOUNDING_PARTNER_ENDPOINT || vars.FORMSPREE_FOUNDING_PARTNER_ENDPOINT || '' }}
    defaults:
      run:
        working-directory: src/site
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: src/site/scripts/generate-sitemap.mjs derives each page's
          # <lastmod> from the last commit touching it. A shallow checkout would give
          # every URL the build date, and the generator fails rather than emit that.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/site/package-lock.json

      # The marketing site's test-count and coverage figures are generated by
      # test-metrics.yml and injected by scripts/inject-test-metrics.js. That
      # injection used to run only in deploy-static-site.yml (Azure Static Web
      # Apps), which is now dormant — so once GitHub Pages became the live path
      # the site kept serving whatever numbers were committed in src/site/*.html.
      # Inject here so the published figures track CI instead of drifting.
      - name: Download latest test metrics
        uses: dawidd6/action-download-artifact@v27
        with:
          workflow: test-metrics.yml
          name: test-metrics
          path: .
          if_no_artifact_found: warn
          search_artifacts: true
          branch: main
        continue-on-error: true

      - name: Inject test metrics into site
        working-directory: .
        run: |
          if [ -f test-metrics.json ]; then
            echo "Found test-metrics.json, injecting values into src/site..."
            node scripts/inject-test-metrics.js test-metrics.json
          else
            echo "::warning::No test-metrics.json found; site will publish the committed static values."
          fi

      # CI publishes interoperability and acceptance evidence to the
      # ci-evidence branch (scripts/ci/publish-evidence.sh), not to main.
      # Serve the latest published snapshot; the copy committed in src/site
      # is the fallback.
      - name: Overlay published evidence from ci-evidence
        working-directory: .
        run: |
          # No --depth here: a depth-limited fetch marks the whole full-history
          # checkout as shallow, and the sitemap generator (SITEMAP_STRICT=1)
          # then refuses to publish.
          if git fetch --quiet --no-tags origin ci-evidence; then
            for f in davinci-interop-public-evidence.json cms0057-public-evidence.json inferno-conformance-public-evidence.json; do
              if git cat-file -e "FETCH_HEAD:evidence/$f" 2>/dev/null; then
                git show "FETCH_HEAD:evidence/$f" > "src/site/insights/cms-0057-f/$f"
                echo "Using published $f from ci-evidence"
              fi
            done
          else
            echo "::notice::No ci-evidence branch yet; serving the committed evidence snapshots."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build site artifact
        run: npm run build
        env:
          # Publishing a sitemap whose lastmod is uniform is worse than none;
          # fail the deploy instead. See generate-sitemap.mjs.
          SITEMAP_STRICT: '1'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: src/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
