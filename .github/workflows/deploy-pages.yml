name: Deploy marketing site to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/site/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID || 'G-H1HCD5EYPN' }}
      FORMSPREE_FOUNDING_PARTNER_ENDPOINT: ${{ secrets.FORMSPREE_FOUNDING_PARTNER_ENDPOINT || vars.FORMSPREE_FOUNDING_PARTNER_ENDPOINT || '' }}
    defaults:
      run:
        working-directory: src/site
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/site/package-lock.json

      # The marketing site's test-count and coverage figures are generated by
      # test-metrics.yml and injected by scripts/inject-test-metrics.js. That
      # injection used to run only in deploy-static-site.yml (Azure Static Web
      # Apps), which is now dormant — so once GitHub Pages became the live path
      # the site kept serving whatever numbers were committed in src/site/*.html.
      # Inject here so the published figures track CI instead of drifting.
      - name: Download latest test metrics
        uses: dawidd6/action-download-artifact@v24
        with:
          workflow: test-metrics.yml
          name: test-metrics
          path: .
          if_no_artifact_found: warn
          search_artifacts: true
          branch: main
        continue-on-error: true

      - name: Inject test metrics into site
        working-directory: .
        run: |
          if [ -f test-metrics.json ]; then
            echo "Found test-metrics.json, injecting values into src/site..."
            node scripts/inject-test-metrics.js test-metrics.json
          else
            echo "::warning::No test-metrics.json found; site will publish the committed static values."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build site artifact
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: src/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
