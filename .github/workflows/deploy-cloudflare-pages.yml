name: Deploy marketing site to Cloudflare Pages

# Builds src/site exactly as deploy-pages.yml does (sitemap lastmod from git,
# analytics and Formspree injection, test metrics) and uploads it to
# Cloudflare Pages with wrangler. Git integration is not used because the
# build needs full git history and the test-metrics artifact.
#
# This runs alongside the GitHub Pages deploy. Until the DNS cutover in
# CLOUDFLARE_MIGRATION.md, the Cloudflare project is only reachable at its
# *.pages.dev address; cloudhealthoffice.com keeps serving from GitHub Pages.
#
# Requires repository secrets CLOUDFLARE_API_TOKEN (Pages: Edit) and
# CLOUDFLARE_ACCOUNT_ID. Without them the deploy step is skipped with a
# warning rather than failing, so the workflow is safe to merge first.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/site/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  pull_request:
    paths:
      - 'src/site/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'cloudhealthoffice' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID || 'G-H1HCD5EYPN' }}
      FORMSPREE_FOUNDING_PARTNER_ENDPOINT: ${{ secrets.FORMSPREE_FOUNDING_PARTNER_ENDPOINT || vars.FORMSPREE_FOUNDING_PARTNER_ENDPOINT || '' }}
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    defaults:
      run:
        working-directory: src/site
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # generate-sitemap.mjs derives <lastmod> from git history and fails
          # under SITEMAP_STRICT on a shallow clone.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/site/package-lock.json

      - name: Download latest test metrics
        uses: dawidd6/action-download-artifact@v24
        with:
          workflow: test-metrics.yml
          name: test-metrics
          path: .
          if_no_artifact_found: warn
          search_artifacts: true
          branch: main
        continue-on-error: true

      - name: Inject test metrics into site
        working-directory: .
        run: |
          if [ -f test-metrics.json ]; then
            node scripts/inject-test-metrics.js test-metrics.json
          else
            echo "::warning::No test-metrics.json found; site will publish the committed static values."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          SITEMAP_STRICT: '1'

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pull requests get a preview deployment on their own branch alias;
          # main is the production branch of the Pages project.
          DEPLOY_BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
        run: npx --yes wrangler@4 pages deploy dist --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch="$DEPLOY_BRANCH" --commit-dirty=true

      - name: Explain skipped deploy
        if: env.HAS_CLOUDFLARE_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; built the site but skipped the Cloudflare Pages upload."
