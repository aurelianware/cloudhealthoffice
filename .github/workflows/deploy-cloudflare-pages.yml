name: Deploy marketing site to Cloudflare Pages

# Builds src/site exactly as deploy-pages.yml does (sitemap lastmod from git,
# analytics and Formspree injection, test metrics) and uploads it to
# Cloudflare Pages with wrangler. Git integration is not used because the
# build needs full git history and the test-metrics artifact.
#
# This runs alongside the GitHub Pages deploy. Until the DNS cutover in
# CLOUDFLARE_MIGRATION.md, the Cloudflare project is only reachable at its
# *.pages.dev address; cloudhealthoffice.com keeps serving from GitHub Pages.
#
# Requires repository secrets CLOUDFLARE_API_TOKEN (Pages: Edit) and
# CLOUDFLARE_ACCOUNT_ID. Without them the deploy step is skipped with a
# warning rather than failing, so the workflow is safe to merge first.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/site/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  pull_request:
    paths:
      - 'src/site/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'cloudhealthoffice' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID || 'G-H1HCD5EYPN' }}
      FORMSPREE_FOUNDING_PARTNER_ENDPOINT: ${{ secrets.FORMSPREE_FOUNDING_PARTNER_ENDPOINT || vars.FORMSPREE_FOUNDING_PARTNER_ENDPOINT || '' }}
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    defaults:
      run:
        working-directory: src/site
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # generate-sitemap.mjs derives <lastmod> from git history and fails
          # under SITEMAP_STRICT on a shallow clone.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/site/package-lock.json

      - name: Download latest test metrics
        uses: dawidd6/action-download-artifact@v27
        with:
          workflow: test-metrics.yml
          name: test-metrics
          path: .
          if_no_artifact_found: warn
          search_artifacts: true
          branch: main
        continue-on-error: true

      - name: Inject test metrics into site
        working-directory: .
        run: |
          if [ -f test-metrics.json ]; then
            node scripts/inject-test-metrics.js test-metrics.json
          else
            echo "::warning::No test-metrics.json found; site will publish the committed static values."
          fi

      # CI publishes interoperability and acceptance evidence to the
      # ci-evidence branch (scripts/ci/publish-evidence.sh), not to main.
      # Serve the latest published snapshot; the copy committed in src/site
      # is the fallback.
      - name: Overlay published evidence from ci-evidence
        working-directory: .
        run: |
          # No --depth here: a depth-limited fetch marks the whole full-history
          # checkout as shallow, and the sitemap generator (SITEMAP_STRICT=1)
          # then refuses to publish.
          if git fetch --quiet --no-tags origin ci-evidence; then
            for f in davinci-interop-public-evidence.json cms0057-public-evidence.json; do
              if git cat-file -e "FETCH_HEAD:evidence/$f" 2>/dev/null; then
                git show "FETCH_HEAD:evidence/$f" > "src/site/insights/cms-0057-f/$f"
                echo "Using published $f from ci-evidence"
              fi
            done
          else
            echo "::notice::No ci-evidence branch yet; serving the committed evidence snapshots."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          SITEMAP_STRICT: '1'

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pull requests get a preview deployment on their own branch alias;
          # main is the production branch of the Pages project.
          DEPLOY_BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
        run: |
          # First run: create the Pages project if it doesn't exist yet, so no
          # dashboard setup (and no manual upload) is needed. Creating an
          # existing project fails harmlessly; a real auth or permission error
          # still fails the deploy command below.
          if ! npx --yes wrangler@4 pages project list 2>/dev/null | grep -qw "$CLOUDFLARE_PAGES_PROJECT"; then
            npx --yes wrangler@4 pages project create "$CLOUDFLARE_PAGES_PROJECT" --production-branch=main
          fi
          npx --yes wrangler@4 pages deploy dist --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch="$DEPLOY_BRANCH" --commit-dirty=true

      - name: Explain skipped deploy
        if: env.HAS_CLOUDFLARE_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; built the site but skipped the Cloudflare Pages upload."
