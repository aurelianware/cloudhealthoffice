name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --audit=true --audit-level=moderate

      - name: Run npm audit
        run: |
          echo "## NPM Security Audit" >> "$GITHUB_STEP_SUMMARY"
          # Keep the raw report as an artifact for triage.
          npm audit --omit=dev --audit-level=moderate --json > npm-audit.json || true
          # Gate on production moderate+ advisories via audit-ci so we can
          # carve out known-non-exploitable transitives without lowering
          # the bar project-wide. Config: .audit-ci.json at repo root.
          npx --yes audit-ci@^7 --config .audit-ci.json

      - name: Upload audit results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: npm-audit-results
          path: npm-audit.json
          retention-days: 30

  dotnet-scan:
    name: .NET Security Scan
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - src/services/sponsor-service
          - src/services/member-service
          - src/services/coverage-service
          - src/services/provider-service
          - src/services/claims-service
          - src/services/authorization-service
          - src/services/reference-data-service
          - src/services/benefit-plan-service
          - src/services/eligibility-service
          - src/services/payment-service
          - src/services/attachment-service
          - src/services/enrollment-import-service
          - src/services/trading-partner-service
          - src/services/tenant-service
          - src/services/consent-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: |
          CSPROJ=$(find "${{ matrix.service }}" -maxdepth 1 -name '*.csproj' | head -1)
          if [ -n "$CSPROJ" ]; then
            cd "${{ matrix.service }}"
            dotnet restore
          else
            echo "No .csproj found in ${{ matrix.service }}, skipping"
          fi

      - name: Check for vulnerable packages
        run: |
          CSPROJ=$(find "${{ matrix.service }}" -maxdepth 1 -name '*.csproj' | head -1)
          if [ -n "$CSPROJ" ]; then
            cd "${{ matrix.service }}"
            dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln-check.txt

            if grep -q "has the following vulnerable packages" vuln-check.txt; then
              echo "❌ Vulnerable packages found in ${{ matrix.service }}"
              cat vuln-check.txt
              exit 0
            else
              echo "✅ No vulnerable packages in ${{ matrix.service }}"
            fi
          fi

  docker-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate Trivy report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Install the gitleaks OSS CLI directly rather than the
      # gitleaks/gitleaks-action wrapper. The CLI is MIT-licensed; the
      # Action wrapper started enforcing a paid GITLEAKS_LICENSE check
      # (with a fail-closed posture when its account-type lookup HTTP
      # call times out). The CLI runs the same scan with no license
      # gate, no behavior change for legitimate findings.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --redact --verbose --no-banner --exit-code 1 --source .

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, dotnet-scan, docker-scan, secret-scan]
    if: always()

    steps:
      - name: Generate Security Summary
        run: |
          {
            echo "# 🛡️ Security Scan Summary"
            echo ""
            echo "**Scan Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "## Scan Results"
            echo ""
            echo "| Scan Type | Status |"
            echo "|-----------|--------|"
            echo "| Dependency Scan | ${{ needs.dependency-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| .NET Scan | ${{ needs.dotnet-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| Docker Scan | ${{ needs.docker-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| Secret Scan | ${{ needs.secret-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo ""
            echo "**Action Required:** Review failed scans and remediate vulnerabilities"
          } >> "$GITHUB_STEP_SUMMARY"
