name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --audit=true --audit-level=moderate

      - name: Run npm audit
        run: |
          echo "## NPM Security Audit" >> "$GITHUB_STEP_SUMMARY"
          # Keep the raw report as an artifact for triage.
          npm audit --omit=dev --audit-level=moderate --json > npm-audit.json || true
          # Gate on production moderate+ advisories via audit-ci so we can
          # carve out known-non-exploitable transitives without lowering
          # the bar project-wide. Config: .audit-ci.json at repo root.
          npx --yes audit-ci@^7 --config .audit-ci.json

      - name: Upload audit results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: npm-audit-results
          path: npm-audit.json
          retention-days: 30

  dotnet-scan:
    name: .NET Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # Every tracked project, not just the ones in cloudhealthoffice-main.sln
      # (tools, benchmark and some services are outside it): a scratch
      # solution of all of them.
      - name: Restore every project
        run: |
          set -euo pipefail
          dotnet new sln --name vuln-scan --output "$RUNNER_TEMP/vuln-scan" --force
          git ls-files '*.csproj' | xargs dotnet sln "$RUNNER_TEMP/vuln-scan/vuln-scan.sln" add
          dotnet restore "$RUNNER_TEMP/vuln-scan/vuln-scan.sln"

      # Including transitive packages. A High or Critical advisory fails the
      # build; Moderate and Low are reported only.
      - name: Check for vulnerable packages
        run: |
          set -euo pipefail
          dotnet list "$RUNNER_TEMP/vuln-scan/vuln-scan.sln" package --vulnerable --include-transitive 2>&1 | tee vuln-check.txt
          {
            echo "## .NET vulnerable packages"
            echo '```'
            grep -E "has the following vulnerable packages|^\s+>" vuln-check.txt || echo "None"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -E "^\s+>" vuln-check.txt | grep -qE "\s(High|Critical)\s"; then
            echo "::error::High or Critical vulnerable NuGet packages found (see above). Upgrade them in Directory.Packages.props."
            exit 1
          fi

  docker-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner in fs mode
        # Pinned by commit: trivy-action's version tags were force-pushed to
        # malicious commits in March 2026 (CVE-2026-33634).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          # A fixable High or Critical finding fails the build.
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate Trivy report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Install the gitleaks OSS CLI directly rather than the
      # gitleaks/gitleaks-action wrapper. The CLI is MIT-licensed; the
      # Action wrapper started enforcing a paid GITLEAKS_LICENSE check
      # (with a fail-closed posture when its account-type lookup HTTP
      # call times out). The CLI runs the same scan with no license
      # gate, no behavior change for legitimate findings.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Prove the scanner can actually fail before trusting that it passed.
      # .gitleaks.toml previously declared an allowlist but no rules, so
      # gitleaks ran with zero detectors and this job passed unconditionally.
      - name: Verify gitleaks rules are active
        run: ./scripts/ci/verify-gitleaks-rules.sh

      # Gate on the current tree first. This is the check that must never be
      # weakened: nothing secret may be present at HEAD.
      - name: Run gitleaks against the working tree
        run: gitleaks detect --redact --verbose --no-banner --exit-code 1 --no-git --source .

      # On a pull request, scan only the commits the PR itself contributes
      # (merge-base(base, head)..head).
      #
      # A pull request used to be gated on the repository's entire history,
      # which meant one flagged string committed anywhere — on an unrelated
      # branch, by anyone — failed the Secret Scanning check on every open
      # pull request simultaneously, and no PR author could clear it from
      # their own branch. A PR is now answerable for what it adds; the tree
      # at HEAD is still gated unconditionally by the step above, and
      # history coverage lives on the push/schedule runs below.
      - name: Run gitleaks against the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          # The base tip at event time is normally already in the clone
          # (fetch-depth: 0 fetches every branch). A force-push to the base
          # branch can leave it unreachable; fetch it rather than guess.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${BASE_SHA}" \
              || git fetch --no-tags origin "${BASE_REF}" \
              || true
          fi

          # merge-base rather than the raw base SHA: if the author merged the
          # base branch into their own, the base branch's commits are not
          # this PR's to answer for, and base..head would re-include them.
          if MERGE_BASE="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}" 2>/dev/null)"; then
            echo "Scanning ${MERGE_BASE}..${HEAD_SHA} (this pull request's commits)."
            gitleaks detect --redact --verbose --no-banner --exit-code 1 \
              --log-opts "--no-merges ${MERGE_BASE}..${HEAD_SHA}"
          else
            # Fail closed: if the range cannot be resolved, scan everything
            # rather than scan nothing.
            echo "::warning::Could not resolve the PR commit range from ${BASE_SHA}..${HEAD_SHA}; falling back to a full-history scan."
            gitleaks detect --redact --verbose --no-banner --exit-code 1 --source .
          fi

      # Full history on every push to main/develop, on the daily schedule and
      # on manual dispatch — so narrowing the pull-request scan above costs no
      # coverage, it only moves where a historical finding is reported.
      # Known historical leaks are acknowledged by fingerprint in
      # .gitleaksignore, each one recorded in
      # docs/security/CREDENTIAL-ROTATION.md and treated as compromised.
      # History is deliberately not rewritten.
      - name: Run gitleaks against full history
        if: github.event_name != 'pull_request'
        run: gitleaks detect --redact --verbose --no-banner --exit-code 1 --source .

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, dotnet-scan, docker-scan, secret-scan]
    if: always()

    steps:
      - name: Generate Security Summary
        run: |
          {
            echo "# 🛡️ Security Scan Summary"
            echo ""
            echo "**Scan Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "## Scan Results"
            echo ""
            echo "| Scan Type | Status |"
            echo "|-----------|--------|"
            echo "| Dependency Scan | ${{ needs.dependency-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| .NET Scan | ${{ needs.dotnet-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| Docker Scan | ${{ needs.docker-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| Secret Scan | ${{ needs.secret-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo ""
            echo "**Action Required:** Review failed scans and remediate vulnerabilities"
          } >> "$GITHUB_STEP_SUMMARY"
