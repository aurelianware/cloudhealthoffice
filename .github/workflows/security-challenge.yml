name: Open Security Challenge

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/SecurityChallenge/**'
      - 'tools/SecurityChallenge.Tests/**'
      - 'docs/security-challenge/**'
      - 'src/services/authorization-service/**'
      - 'src/services/claims-service/**'
      - 'src/services/appeals-service/**'
      - 'src/services/fhir-service/**'
      - 'src/services/member-service/**'
      - 'src/services/coverage-service/**'
      - 'src/services/consent-service/**'
      - 'src/services/document-service/**'
      - 'src/services/attachment-service/**'
      - 'src/engines/CloudHealthOffice.DocumentStore/**'
      - 'src/services/shared/CloudHealthOffice.Consent.Contracts/**'
      - 'src/engines/CloudHealthOffice.PriorAuthRuleEngine/**'
      - 'tests/CloudHealthOffice.PriorAuthRuleEngine.Tests/**'
      - 'src/services/shared/CloudHealthOffice.Infrastructure/**'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/security-challenge.yml'

permissions:
  contents: read

jobs:
  authorization-lab:
    name: Synthetic authorization security lab (.NET 8)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build actual authorization service
        run: dotnet build src/services/authorization-service --configuration Release --verbosity quiet
      - name: Test evidence policy and build runner
        run: dotnet test tools/SecurityChallenge.Tests --configuration Release --verbosity quiet
      - name: Run disposable loopback lab
        run: >-
          dotnet tools/SecurityChallenge/bin/Release/net8.0/SecurityChallenge.dll
          src/services/authorization-service/bin/Release/net8.0/authorization-service.dll
          "${{ runner.temp }}/cho-security-evidence"
      # Deliberately no artifact upload: failed packets require private triage.
      # Reviewed publication is a separate human-controlled process.

  claims-appeals-lab:
    name: Synthetic claims and appeals security lab (.NET 8)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build real claims and appeals services
        run: |
          dotnet build src/services/claims-service --configuration Release --verbosity quiet
          dotnet build src/services/appeals-service --configuration Release --verbosity quiet
      - name: Test evidence policy and build runner
        run: dotnet test tools/SecurityChallenge.Tests --configuration Release --verbosity quiet
      - name: Run disposable two-service lab
        run: >-
          dotnet tools/SecurityChallenge/bin/Release/net8.0/SecurityChallenge.dll claims-appeals
          src/services/claims-service/bin/Release/net8.0/claims-service.dll
          src/services/appeals-service/bin/Release/net8.0/appeals-service.dll
          "${{ runner.temp }}/cho-claims-appeals-evidence"
      # No automatic upload of finding-bearing evidence; review privately first.

  fhir-smart-lab:
    name: Synthetic FHIR SMART security lab and sensitivity (.NET 8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build real FHIR and member services
        run: |
          dotnet build src/services/fhir-service --configuration Release --verbosity quiet
          dotnet build src/services/member-service --configuration Release --verbosity quiet
      - name: Test evidence policy and build runner
        run: dotnet test tools/SecurityChallenge.Tests --configuration Release --verbosity quiet
      - name: Run disposable FHIR SMART lab
        run: >-
          dotnet tools/SecurityChallenge/bin/Release/net8.0/SecurityChallenge.dll fhir-smart
          src/services/fhir-service/bin/Release/net8.0/fhir-service.dll
          src/services/member-service/bin/Release/net8.0/member-service.dll
          "${{ runner.temp }}/cho-fhir-smart-evidence"
      - name: Prove audience and scope defects are detected
        run: >-
          python3 tools/SecurityChallenge/run-fhir-sensitivity.py
          src/services/member-service/bin/Release/net8.0/member-service.dll
          "${{ runner.temp }}/cho-fhir-smart-sensitivity"
      # No finding-bearing artifact uploads. Review before publishing KB evidence.

  p2p-consent-lab:
    name: Synthetic P2P consent binding lab and sensitivity (.NET 8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build real native P2P services
        run: |
          dotnet build src/services/fhir-service --configuration Release --verbosity quiet
          dotnet build src/services/member-service --configuration Release --verbosity quiet
          dotnet build src/services/coverage-service --configuration Release --verbosity quiet
          dotnet build src/services/claims-service --configuration Release --verbosity quiet
          dotnet build src/services/authorization-service --configuration Release --verbosity quiet
      - name: Test evidence policy and build runner
        run: dotnet test tools/SecurityChallenge.Tests --configuration Release --verbosity quiet
      - name: Verify rule bootstrap concurrency and tenant guards
        run: dotnet test tests/CloudHealthOffice.PriorAuthRuleEngine.Tests --configuration Release --verbosity quiet
      - name: Run native consent binding lab
        run: >-
          dotnet tools/SecurityChallenge/bin/Release/net8.0/SecurityChallenge.dll p2p-consent
          src/services/fhir-service/bin/Release/net8.0/fhir-service.dll
          src/services/member-service/bin/Release/net8.0/member-service.dll
          src/services/coverage-service/bin/Release/net8.0/coverage-service.dll
          src/services/claims-service/bin/Release/net8.0/claims-service.dll
          src/services/authorization-service/bin/Release/net8.0/authorization-service.dll
          "${{ runner.temp }}/cho-p2p-consent-evidence"
      - name: Prove member and cached-consent binding defects are detected
        run: >-
          python3 tools/SecurityChallenge/run-fhir-sensitivity.py p2p-consent
          src/services/member-service/bin/Release/net8.0/member-service.dll
          src/services/coverage-service/bin/Release/net8.0/coverage-service.dll
          src/services/claims-service/bin/Release/net8.0/claims-service.dll
          src/services/authorization-service/bin/Release/net8.0/authorization-service.dll
          "${{ runner.temp }}/cho-p2p-consent-sensitivity"
      # No finding-bearing evidence upload or automatic knowledge-base publication.

  provider-access-lab:
    name: Synthetic provider attribution and live consent lab (.NET 8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build real FHIR, member and consent services
        run: |
          dotnet build src/services/fhir-service --configuration Release --verbosity quiet
          dotnet build src/services/member-service --configuration Release --verbosity quiet
          dotnet build src/services/consent-service --configuration Release --verbosity quiet
      - name: Test evidence policy and build runner
        run: dotnet test tools/SecurityChallenge.Tests --configuration Release --verbosity quiet
      - name: Prove attribution and live consent defects are detected
        run: >-
          python3 tools/SecurityChallenge/run-fhir-sensitivity.py provider-access
          src/services/member-service/bin/Release/net8.0/member-service.dll
          src/services/consent-service/bin/Release/net8.0/consent-service.dll
          "${{ runner.temp }}/cho-provider-access-sensitivity"
      # Baseline and mutants retain finding-bearing evidence locally; no automatic publication.

  document-isolation-lab:
    name: Synthetic document catalog and attachment isolation (.NET 8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build real catalog and attachment services
        run: |
          dotnet build src/services/document-service --configuration Release --verbosity quiet
          dotnet build src/services/attachment-service --configuration Release --verbosity quiet
      - name: Test evidence policy and build runner
        run: dotnet test tools/SecurityChallenge.Tests --configuration Release --verbosity quiet
      - name: Verify catalog and attachment regressions
        run: |
          dotnet test src/services/document-service/DocumentService.Tests --configuration Release --verbosity quiet
          dotnet test src/services/attachment-service/AttachmentService.Tests --configuration Release --verbosity quiet
      - name: Prove sensitivity and gateway permission defects are detected
        run: >-
          python3 tools/SecurityChallenge/run-fhir-sensitivity.py documents
          src/services/attachment-service/bin/Release/net8.0/attachment-service.dll
          "${{ runner.temp }}/cho-document-isolation-sensitivity"
      # No finding-bearing evidence uploads or automatic publication.
