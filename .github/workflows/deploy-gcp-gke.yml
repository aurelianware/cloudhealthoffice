name: Deploy demo to GKE

# Builds every Cloud Health Office image, pushes it to Artifact Registry, and
# deploys the demo to the GKE cluster (infrastructure/gcp) with scripts/deploy-gke.sh.
#
# Runs on every push to main (merged PRs; docs-only changes are skipped) and on
# demand. Set the repository variable GKE_AUTO_DEPLOY=false to pause the
# automatic deploys, e.g. before a live demo; the manual run keeps working.
# Demo-grade: synthetic data, no public ingress. Development signing keys
# unless the production security variables below are set, in which case
# services run with Cloud KMS signing, Kubernetes service identity and
# Cloudflare Access sign-in (docs/deploy/GCP-DEMO.md, "Production security").
# The Azure workflow (deploy-azure-aks.yml) is separate and unaffected.
#
# The AI claims examiner is on for automatic runs, and for manual runs unless
# ai_examiner is unticked. When it is on, a missing ANTHROPIC_API_KEY fails the
# deploy, and after rollout the examiner makes one real call to Claude; the
# deploy fails if that call doesn't succeed (bad key, no credit, retired model).
#
# One-time setup: run infrastructure/gcp (Terraform), then add these settings
# (infrastructure/gcp/README.md maps each to a Terraform output):
#   secrets   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOYER_SERVICE_ACCOUNT
#             ANTHROPIC_API_KEY (optional, enables the advisory AI claims examiner)
#             CLOUDFLARE_TUNNEL_TOKEN (optional, runs the Cloudflare Tunnel connector;
#               see docs/deploy/GCP-PUBLIC-HOSTING-PLAN.md before setting it)
#   variables GCP_PROJECT_ID, GKE_CLUSTER, GKE_LOCATION, GAR_REPOSITORY
#   production security (variables; all five or none, plus DEMO_ADMIN_EMAILS):
#             TOKEN_SIGNING_KEY_VERSION, TOKEN_SERVICE_GOOGLE_ACCOUNT, KUBERNETES_SA_ISSUER
#               (terraform outputs, with enable_token_signing_kms = true)
#             CF_ACCESS_TEAM_DOMAIN, CF_ACCESS_AUD (Cloudflare Zero Trust)
#             DEMO_ADMIN_EMAILS (comma-separated; made TenantAdmin of the demo tenant)

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Deploy an existing image tag and skip the build (blank = build this commit)"
        required: false
        default: ""
      enable_kafka:
        description: "Run Kafka in the cluster (Strimzi)"
        type: boolean
        default: true
      ai_examiner:
        description: "Enable the advisory AI claims examiner (needs the ANTHROPIC_API_KEY secret)"
        type: boolean
        default: true
      resource_profile:
        description: "small fits the single-node Standard cluster; default keeps full CPU requests (Autopilot or a larger cluster)"
        type: choice
        options: [small, default]
        default: small

concurrency:
  group: deploy-gke
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
  GKE_LOCATION: ${{ vars.GKE_LOCATION }}
  IMAGE_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || github.sha }}

jobs:
  plan:
    name: Check settings and list images
    if: ${{ github.event_name == 'workflow_dispatch' || vars.GKE_AUTO_DEPLOY != 'false' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Check required settings
        run: |
          missing=()
          for v in GAR_REPOSITORY GCP_PROJECT_ID GKE_CLUSTER GKE_LOCATION; do
            [[ -n "${!v}" ]] || missing+=("vars.$v")
          done
          [[ -n "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]] || missing+=("secrets.GCP_WORKLOAD_IDENTITY_PROVIDER")
          [[ -n "${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}" ]] || missing+=("secrets.GCP_DEPLOYER_SERVICE_ACCOUNT")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing settings: ${missing[*]}. See infrastructure/gcp/README.md."
            exit 1
          fi

      - name: List images to build
        id: images
        run: |
          pip install --quiet pyyaml
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, subprocess
          lines = subprocess.run(["python3", "deploy/gcp/render_manifests.py", "--list-images"],
                                 check=True, capture_output=True, text=True).stdout.split("\n")
          include = [{"name": n, "dockerfile": f} for n, f in (l.split() for l in lines if l.strip())]
          include.append({"name": "mcc-platform-validator", "dockerfile": "src/tools/mcc-platform-validator/Dockerfile"})
          print("matrix=" + json.dumps({"include": include}))
          EOF

  build:
    name: Build ${{ matrix.name }}
    needs: plan
    if: ${{ (inputs.image_tag || '') == '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GAR_REPOSITORY%%/*}" --quiet

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: REGISTRY=mcr.microsoft.com
          push: true
          tags: ${{ env.GAR_REPOSITORY }}/cloudhealthoffice-${{ matrix.name }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=gke-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=gke-${{ matrix.name }}

  deploy:
    name: Deploy to GKE
    needs: [plan, build]
    if: ${{ always() && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up gcloud
        # Reads the token signing public key when production security is configured.
        uses: google-github-actions/setup-gcloud@v2

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Deploy
        # Manual runs take the form's values. Automatic (push) runs have no
        # inputs, so each setting falls back to the default the form shows.
        env:
          ENABLE_KAFKA: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_kafka || github.event_name != 'workflow_dispatch' }}
          RESOURCE_PROFILE: ${{ inputs.resource_profile || 'small' }}
          # On unless a manual run unticks it; when on, the key must be set and must work.
          REQUIRE_AI_EXAMINER: ${{ github.event_name == 'workflow_dispatch' && inputs.ai_examiner || github.event_name != 'workflow_dispatch' }}
          ANTHROPIC_API_KEY: ${{ (github.event_name != 'workflow_dispatch' || inputs.ai_examiner) && secrets.ANTHROPIC_API_KEY || '' }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          # Document storage (terraform outputs in infrastructure/gcp); optional.
          DOCUMENTS_BUCKET: ${{ vars.DOCUMENTS_BUCKET }}
          DOCUMENTS_SERVICE_ACCOUNT: ${{ vars.DOCUMENTS_SERVICE_ACCOUNT }}
          # Optional versioned appeal encryption key (infrastructure/gcp/appeals-secrets/).
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          SAM_SCREENING_ENABLED: ${{ vars.SAM_SCREENING_ENABLED || (secrets.SAM_API_KEY != '' && 'true') || 'false' }}
          LEIE_SCREENING_ENABLED: ${{ vars.LEIE_SCREENING_ENABLED }}
          APPEALS_SECRETS_PROJECT: ${{ vars.APPEALS_SECRETS_PROJECT }}
          APPEALS_SECRETS_SERVICE_ACCOUNT: ${{ vars.APPEALS_SECRETS_SERVICE_ACCOUNT }}
          # Managed FHIR store -> BigQuery (terraform outputs in infrastructure/gcp/fhir-store.tf); optional.
          MANAGED_FHIR_STORE: ${{ vars.MANAGED_FHIR_STORE }}
          MANAGED_FHIR_STORE_SERVICE_ACCOUNT: ${{ vars.MANAGED_FHIR_STORE_SERVICE_ACCOUNT }}
          MANAGED_FHIR_STORE_TENANT: ${{ vars.MANAGED_FHIR_STORE_TENANT }}
          # Bulk Data $export files (terraform outputs in infrastructure/gcp/bulk-export.tf); optional.
          BULK_EXPORT_BUCKET: ${{ vars.BULK_EXPORT_BUCKET }}
          FHIR_SERVICE_GOOGLE_ACCOUNT: ${{ vars.FHIR_SERVICE_GOOGLE_ACCOUNT }}
          # Public tunnel hostnames for an external conformance suite (docs/deploy/GCP-CONFORMANCE-TESTING.md); optional.
          CONFORMANCE_FHIR_HOST: ${{ vars.CONFORMANCE_FHIR_HOST }}
          CONFORMANCE_AUTH_HOST: ${{ vars.CONFORMANCE_AUTH_HOST }}
          TRUSTED_PROXY_NETWORKS: ${{ vars.TRUSTED_PROXY_NETWORKS }}
          # Production security (all five, or none for the development-key demo).
          TOKEN_SIGNING_KEY_VERSION: ${{ vars.TOKEN_SIGNING_KEY_VERSION }}
          TOKEN_SERVICE_GOOGLE_ACCOUNT: ${{ vars.TOKEN_SERVICE_GOOGLE_ACCOUNT }}
          KUBERNETES_SA_ISSUER: ${{ vars.KUBERNETES_SA_ISSUER }}
          CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}
          DEMO_ADMIN_EMAILS: ${{ vars.DEMO_ADMIN_EMAILS }}
        run: ./scripts/deploy-gke.sh

      - name: Pod status
        if: always()
        run: kubectl get pods -n cloudhealthoffice -o wide; kubectl get pods -n kafka
