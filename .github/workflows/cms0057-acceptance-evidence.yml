name: CMS-0057-F Acceptance Evidence

# Runs the CMS-0057-F acceptance suite and generates versioned, reproducible
# evidence (JSON + Markdown + HTML) tied to the tested commit. The evidence
# separates Cloud Health Office product capability (Replace) from external-core
# integration capability (Augment), derived from the scenario manifest
# (tests/Cms0057Acceptance.Tests/scenarios.json) — the machine-readable source
# of truth — not from prose or test names.
#
# On main, after a fully passing, reconciled run, a SANITIZED public-safe
# snapshot (tools/Cms0057Evidence --public-output) is committed into the site
# tree (src/site/insights/cms-0057-f/cms0057-public-evidence.json). That commit
# touches only src/site/**, so it triggers the Pages deploy but NOT this workflow
# (whose paths never include src/site/**) — no loop, and no [skip ci] that would
# suppress the deploy.

permissions:
  contents: read

on:
  push:
    branches: ["main"]
    paths:
      # Scenario manifest, acceptance suite, and evidence tooling.
      - 'tests/Cms0057Acceptance.Tests/**'
      - 'tools/Cms0057Evidence/**'
      - 'tools/Cms0057Evidence.Tests/**'
      - 'docs/compliance/CMS0057-ACCEPTANCE-INVENTORY.md'
      - '.github/workflows/cms0057-acceptance-evidence.yml'
      # Runtime/domain code that can change CMS-0057-F behavior without touching
      # the acceptance project. Kept to services/engines that materially serve a
      # scenario dimension (CRD/DTR/PAS, Patient/Provider Access, consent/P2P,
      # authorization metrics, SMART security, and the Replace/Augment engine).
      - 'src/services/fhir-service/**'            # PAS + Patient/Provider Access FHIR surface
      - 'src/services/authorization-service/**'   # prior-auth backend + metrics
      - 'src/services/member-service/**'          # Patient Access member data
      - 'src/services/provider-service/**'        # Provider Access attribution
      - 'src/services/claims-service/**'          # Patient Access CARIN EOB
      - 'src/services/benefit-plan-service/**'    # CRD "is auth required" rules
      - 'src/services/consent-service/**'         # consent / opt-in / opt-out (P2P + access)
      - 'src/services/smart-auth-service/**'      # SEC-01 SMART on FHIR / OAuth
      - 'src/engines/CloudHealthOffice.OperatingMode/**'    # Replace vs Augment selection
      - 'src/engines/CloudHealthOffice.PriorAuthRuleEngine/**'  # PAS decision rules
  pull_request:
    branches: ["main"]
    paths:
      - 'tests/Cms0057Acceptance.Tests/**'
      - 'tools/Cms0057Evidence/**'
      - 'tools/Cms0057Evidence.Tests/**'
      - 'docs/compliance/CMS0057-ACCEPTANCE-INVENTORY.md'
      - '.github/workflows/cms0057-acceptance-evidence.yml'
      - 'src/services/fhir-service/**'
      - 'src/services/authorization-service/**'
      - 'src/services/member-service/**'
      - 'src/services/provider-service/**'
      - 'src/services/claims-service/**'
      - 'src/services/benefit-plan-service/**'
      - 'src/services/consent-service/**'
      - 'src/services/smart-auth-service/**'
      - 'src/engines/CloudHealthOffice.OperatingMode/**'
      - 'src/engines/CloudHealthOffice.PriorAuthRuleEngine/**'
  workflow_dispatch:

concurrency:
  group: cms0057-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Validate + generate evidence (raw + sanitized public snapshot) ──────────
  # Runs on both PRs and main. Never writes back to the repo: it only uploads
  # artifacts. The public snapshot is produced only from a fully passing run
  # (the generator refuses to emit it otherwise).
  evidence:
    name: CMS-0057-F Acceptance Evidence
    runs-on: ubuntu-latest
    outputs:
      rc_acceptance: ${{ steps.acceptance.outputs.rc }}
      rc_evidence: ${{ steps.evidence.outputs.rc }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Test the evidence generator
        run: dotnet test tools/Cms0057Evidence.Tests/Cms0057Evidence.Tests.csproj -c Debug

      - name: Build acceptance suite and generator
        run: |
          dotnet build tests/Cms0057Acceptance.Tests/Cms0057Acceptance.Tests.csproj -c Debug
          dotnet build tools/Cms0057Evidence/Cms0057Evidence.csproj -c Debug

      - name: Run acceptance suite (structured TRX)
        id: acceptance
        run: |
          set +e
          dotnet test tests/Cms0057Acceptance.Tests/Cms0057Acceptance.Tests.csproj \
            -c Debug --no-build \
            --logger "trx;LogFileName=cms0057-acceptance.trx" \
            --results-directory artifacts/trx
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Generate evidence (raw + sanitized public snapshot)
        id: evidence
        run: |
          set +e
          TRX=$(find artifacts/trx -name 'cms0057-acceptance.trx' | head -1)
          ASM=tests/Cms0057Acceptance.Tests/bin/Debug/net8.0/Cms0057Acceptance.Tests.dll
          mkdir -p artifacts/cms0057-evidence artifacts/public
          dotnet run --project tools/Cms0057Evidence -c Debug --no-build -- \
            --manifest tests/Cms0057Acceptance.Tests/scenarios.json \
            --results "$TRX" \
            --test-assembly "$ASM" \
            --output artifacts/cms0057-evidence \
            --public-output artifacts/public/cms0057-public-evidence.json \
            --environment CI
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          # Include the raw TRX in the (private) evidence package.
          cp "$TRX" artifacts/cms0057-evidence/ 2>/dev/null || true

      - name: Job summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          path = 'artifacts/cms0057-evidence/cms0057-evidence.json'
          print('## CMS-0057-F Acceptance')
          if not os.path.exists(path):
              print('\n_Evidence was not generated._')
              raise SystemExit(0)
          d = json.load(open(path))
          ts = d['testSummary']
          print(f"\nTests: {ts['passed']} passed / {ts['failed']} failed / {ts['skipped']} skipped\n")
          def counts(backend_pred):
              c = {}
              for s in d['scenarios']:
                  for b in s['backends']:
                      if backend_pred(b['backend']):
                          c[b['declaredStatus']] = c.get(b['declaredStatus'], 0) + 1
              return c
          rep = counts(lambda b: b == 'replace.cloudHealthOffice')
          aug = counts(lambda b: b.startswith('augment.'))
          print("CHO Replace (product capability):")
          for k in ('PASSABLE','PARTIAL','GAP','N/A'):
              if rep.get(k): print(f"  {k}: {rep[k]}")
          print("\nExternal core (Augment integration capability):")
          for k in ('PASSABLE','PARTIAL','GAP','N/A'):
              if aug.get(k): print(f"  {k}: {aug[k]}")
          sha = (d.get('identity') or {}).get('commitSha') or ''
          print(f"\nCommit: `{sha}`")
          pub = 'artifacts/public/cms0057-public-evidence.json'
          print(f"\nSanitized public snapshot generated: {'yes' if os.path.exists(pub) else 'no'}")
          PY

      - name: Upload evidence package (raw, private to CI)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cms0057-acceptance-evidence-${{ github.sha }}
          path: |
            artifacts/cms0057-evidence/cms0057-evidence.json
            artifacts/cms0057-evidence/cms0057-evidence.md
            artifacts/cms0057-evidence/cms0057-evidence.html
            artifacts/cms0057-evidence/cms0057-acceptance.trx
          if-no-files-found: warn

      - name: Upload sanitized public snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cms0057-public-evidence
          path: artifacts/public/cms0057-public-evidence.json
          if-no-files-found: warn

      - name: Fail if acceptance tests or evidence generation failed
        run: |
          ACCEPTANCE_RC="${{ steps.acceptance.outputs.rc }}"
          EVIDENCE_RC="${{ steps.evidence.outputs.rc }}"
          echo "acceptance rc=$ACCEPTANCE_RC, evidence rc=$EVIDENCE_RC"
          if [ "$ACCEPTANCE_RC" != "0" ]; then
            echo "::error::CMS-0057-F acceptance tests failed."
            exit 1
          fi
          if [ "$EVIDENCE_RC" != "0" ]; then
            echo "::error::CMS-0057-F evidence generation or scenario reconciliation failed."
            exit 1
          fi

  # ── Publish the latest validated public snapshot (main only) ────────────────
  # Depends on `evidence` succeeding, so a failed run can never publish. Commits
  # the sanitized snapshot into the site tree; that push deploys via Pages.
  publish:
    name: Publish latest validated evidence
    runs-on: ubuntu-latest
    needs: evidence
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Download sanitized public snapshot
        uses: actions/download-artifact@v8
        with:
          name: cms0057-public-evidence
          path: incoming

      - name: Update committed snapshot if changed
        run: |
          set -euo pipefail
          DEST=src/site/insights/cms-0057-f/cms0057-public-evidence.json
          mkdir -p "$(dirname "$DEST")"
          cp incoming/cms0057-public-evidence.json "$DEST"
          if git diff --quiet -- "$DEST"; then
            echo "Public evidence snapshot unchanged; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          # No [skip ci]: this commit touches only src/site/**, which must trigger
          # the Pages deploy. It does not match this workflow's paths, so it does
          # not re-trigger evidence generation.
          git commit -m "chore: publish latest validated CMS-0057-F acceptance evidence"
          git push origin HEAD:main
