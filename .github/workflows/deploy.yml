name: Deploy Production - Cloud Health Office

on:
  push:
    branches: ["main"]
    paths:
      - 'infra/**'
      - 'site/**'
      - 'logicapps/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  # Secure defaults - use repository variables with fallbacks
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RG_NAME || 'rg-cloudhealthoffice-prod' }}
  BASE_NAME: ${{ vars.BASE_NAME || 'cloudhealthoffice' }}
  LOCATION: ${{ vars.AZURE_LOCATION || 'eastus' }}
  CONNECTOR_LOCATION: ${{ vars.AZURE_CONNECTOR_LOCATION || 'eastus' }}
  IA_NAME: ${{ vars.IA_NAME || 'prod-integration-account' }}
  SERVICE_BUS_NAME: ${{ vars.SERVICE_BUS_NAME || 'cloudhealthoffice-sb' }}
  STORAGE_SKU: ${{ vars.STORAGE_SKU || 'Standard_LRS' }}

jobs:
  # Pre-deployment infrastructure setup
  setup-infrastructure:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      app-id: ${{ steps.ensure-app.outputs.app-id }}
      sp-id: ${{ steps.ensure-sp.outputs.sp-id }}

    steps:
      - uses: actions/checkout@v4

      - name: Set default secrets if not configured
        id: set-defaults
        shell: bash
        run: |
          # Use secure defaults for missing secrets
          # These are placeholders - real secrets should be in GitHub Secrets or Key Vault

          # Azure authentication secrets (required)
          CLIENT_ID="${{ secrets.AZURE_CLIENT_ID }}"
          TENANT_ID="${{ secrets.AZURE_TENANT_ID }}"
          SUBSCRIPTION_ID="${{ secrets.AZURE_SUBSCRIPTION_ID }}"

          # SFTP secrets (can be in Key Vault)
          SFTP_HOST="${{ secrets.SFTP_HOST }}"
          SFTP_USERNAME="${{ secrets.SFTP_USERNAME }}"
          SFTP_PASSWORD="${{ secrets.SFTP_PASSWORD }}"

          # Export to environment
          {
            echo "CLIENT_ID=${CLIENT_ID}"
            echo "TENANT_ID=${TENANT_ID}"
            echo "SUBSCRIPTION_ID=${SUBSCRIPTION_ID}"
            echo "SFTP_HOST=${SFTP_HOST:-sftp.example.com}"
            echo "SFTP_USERNAME=${SFTP_USERNAME:-logicapp}"
            echo "SFTP_PASSWORD=${SFTP_PASSWORD:-changeme}"
            echo "HAS_AZURE_CREDS=$([[ -n \"$CLIENT_ID\" && -n \"$TENANT_ID\" && -n \"$SUBSCRIPTION_ID\" ]] && echo 'true' || echo 'false')"
          } >> "$GITHUB_ENV"

          echo "✅ Defaults configured"

      - name: Azure Login (OIDC) - Optional if secrets exist
        if: env.HAS_AZURE_CREDS == 'true'
        id: azure-login
        uses: azure/login@v2
        with:
          client-id: ${{ env.CLIENT_ID }}
          tenant-id: ${{ env.TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}
        continue-on-error: true

      - name: Ensure App Registration
        if: steps.azure-login.outcome == 'success' || env.HAS_AZURE_CREDS == 'false'
        id: ensure-app
        shell: bash
        run: |
          set -euo pipefail

          # Only run if logged in to Azure
          if ! az account show &>/dev/null; then
            echo "⚠️  Not logged in to Azure - skipping app registration setup"
            echo "Manual setup required: ./scripts/ensure-app-registration.sh"
            echo "app-id=${{ env.CLIENT_ID }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "=========================================="
          echo "Ensuring App Registration"
          echo "=========================================="

          APP_NAME="${{ env.BASE_NAME }}-prod"
          TENANT_ID="${{ env.TENANT_ID }}"
          GITHUB_REPO="${{ github.repository }}"

          # Run app registration script
          APP_ID=$(bash scripts/ensure-app-registration.sh "$APP_NAME" "$TENANT_ID" "$GITHUB_REPO" | tail -1)

          echo "app-id=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "✅ App registration ensured: $APP_ID"

      - name: Ensure Service Principal
        if: steps.azure-login.outcome == 'success' || env.HAS_AZURE_CREDS == 'false'
        id: ensure-sp
        shell: bash
        run: |
          set -euo pipefail

          # Only run if logged in to Azure
          if ! az account show &>/dev/null; then
            echo "⚠️  Not logged in to Azure - skipping service principal setup"
            echo "Manual setup required: ./scripts/ensure-service-principal.sh"
            exit 0
          fi

          echo "=========================================="
          echo "Ensuring Service Principal"
          echo "=========================================="

          APP_ID="${{ steps.ensure-app.outputs.app-id || env.CLIENT_ID }}"
          SUBSCRIPTION_ID="${{ env.SUBSCRIPTION_ID }}"
          RESOURCE_GROUP="${{ env.AZURE_RESOURCE_GROUP }}"
          BASE_NAME="${{ env.BASE_NAME }}"

          # Run service principal script
          SP_ID=$(bash scripts/ensure-service-principal.sh "$APP_ID" "$SUBSCRIPTION_ID" "$RESOURCE_GROUP" "$BASE_NAME" | tail -1)

          echo "sp-id=$SP_ID" >> "$GITHUB_OUTPUT"
          echo "✅ Service principal ensured: $SP_ID"

  # Pre-approval security validation
  pre-approval-checks:
    needs: setup-infrastructure
    permissions:
      contents: read
    uses: ./.github/workflows/pre-approval-checks.yml
    with:
      environment: PROD

  # Manual approval gate before production deployment
  approval-gate:
    needs: pre-approval-checks
    if: false  # Disabled - not deploying Logic Apps, only infrastructure setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: PROD-approval
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Deployment Approval Required
        run: |
          echo "🔒 Manual approval required for PROD deployment"
          echo "⏳ Waiting for approval from configured reviewers..."
          echo "📝 Deployment triggered by: ${{ github.actor }}"
          echo "📝 Ref: ${{ github.ref }}"
          echo "📝 SHA: ${{ github.sha }}"
          echo ""
          echo "✅ Security checks passed - see pre-approval-checks job"
          echo "✅ Infrastructure setup completed - see setup-infrastructure job"
          echo ""
          echo "Reviewers: Please verify the following before approving:"
          echo "1. Review security scan results above"
          echo "2. Verify app registration and service principal created"
          echo "3. Check rollback plan is documented"
          echo "4. Ensure stakeholders are notified"

  deploy:
    needs: [setup-infrastructure, approval-gate]
    if: false  # Disabled - using Argo workflows instead of Logic Apps
    runs-on: ubuntu-latest
    environment: PROD
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set environment variables with secure defaults
        shell: bash
        run: |
          {
            echo "RG_NAME=${{ env.AZURE_RESOURCE_GROUP }}"
            echo "LOCATION=${{ env.LOCATION }}"
            echo "CONNECTOR_LOCATION=${{ env.CONNECTOR_LOCATION }}"
            echo "BASE_NAME=${{ env.BASE_NAME }}"
            echo "IA_NAME=${{ env.IA_NAME }}"
            echo "SERVICE_BUS_NAME=${{ env.SERVICE_BUS_NAME }}"
            echo "STORAGE_SKU=${{ env.STORAGE_SKU }}"
            echo "LOGIC_APP_NAME=${{ env.BASE_NAME }}-la"
          } >> "$GITHUB_ENV"

          echo "✅ Environment variables configured with defaults"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || needs.setup-infrastructure.outputs.app-id }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Retrieve Secrets from Vault (HashiCorp or Azure Key Vault)
        id: get-secrets
        shell: bash
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_ROLE_ID: ${{ vars.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
        run: |
          # Exit codes: 0 = success (using HashiCorp Vault, Azure Key Vault, or GitHub Secrets)

          echo "================================================"
          echo "Secret Retrieval Strategy"
          echo "================================================"
          echo "Priority 1: HashiCorp Vault (multi-cloud)"
          echo "Priority 2: Azure Key Vault (Azure-only)"
          echo "Priority 3: GitHub Secrets"
          echo "Priority 4: Secure defaults (non-production use only)"
          echo ""

          # Try HashiCorp Vault first (if configured)
          if [[ -n "$VAULT_ADDR" && -n "$VAULT_ROLE_ID" && -n "$VAULT_SECRET_ID" ]]; then
            echo "🔐 HashiCorp Vault configured - attempting retrieval..."
            
            # Install Vault CLI
            if ! command -v vault &> /dev/null; then
              echo "Installing Vault CLI..."
              wget -q https://releases.hashicorp.com/vault/1.15.4/vault_1.15.4_linux_amd64.zip
              unzip -q vault_1.15.4_linux_amd64.zip
              sudo mv vault /usr/local/bin/
              rm vault_1.15.4_linux_amd64.zip
            fi
            
            # Login to Vault using AppRole
            echo "Authenticating with HashiCorp Vault..."
            VAULT_TOKEN=$(vault write -field=token auth/approle/login \
              role_id="$VAULT_ROLE_ID" \
              secret_id="$VAULT_SECRET_ID" 2>/dev/null || echo "")
            
            if [ -n "$VAULT_TOKEN" ]; then
              export VAULT_TOKEN
              
              # Retrieve secrets from Vault
              SFTP_HOST=$(vault kv get -field=host secret/cloudhealthoffice/sftp/default 2>/dev/null || echo "")
              SFTP_USERNAME=$(vault kv get -field=username secret/cloudhealthoffice/sftp/default 2>/dev/null || echo "")
              SFTP_PASSWORD=$(vault kv get -field=password secret/cloudhealthoffice/sftp/default 2>/dev/null || echo "")
              
              if [[ -n "$SFTP_HOST" && -n "$SFTP_USERNAME" && -n "$SFTP_PASSWORD" ]]; then
                echo "✓ Secrets retrieved from HashiCorp Vault"
                echo "USING_VAULT=hashicorp" >> "$GITHUB_ENV"
                
                # Mask and export
                echo "::add-mask::$SFTP_HOST"
                echo "::add-mask::$SFTP_USERNAME"
                echo "::add-mask::$SFTP_PASSWORD"
                
                {
                  echo "SFTP_HOST=$SFTP_HOST"
                  echo "SFTP_USERNAME=$SFTP_USERNAME"
                  echo "SFTP_PASSWORD=$SFTP_PASSWORD"
                } >> "$GITHUB_ENV"
                
                echo "✅ Using HashiCorp Vault for secret management"
                exit 0
              else
                echo "⚠️  Vault authentication succeeded but secrets not found"
                echo "   Falling back to Azure Key Vault or GitHub Secrets"
              fi
            else
              echo "⚠️  Failed to authenticate with HashiCorp Vault"
              echo "   Falling back to Azure Key Vault or GitHub Secrets"
            fi
          else
            echo "ℹ️  HashiCorp Vault not configured (missing VAULT_ADDR, VAULT_ROLE_ID, or VAULT_SECRET_ID)"
          fi

          # Try Azure Key Vault (Azure-only fallback)
          # Deployment Key Vault naming pattern: {baseName}-deploy-kv
          KV_NAME="${{ env.BASE_NAME }}-deploy-kv"
          
          echo ""
          echo "🔑 Checking Azure Key Vault: $KV_NAME"

          # Check if Key Vault exists
          if ! az keyvault show --name "$KV_NAME" &>/dev/null; then
            echo "⚠️  Azure Key Vault '$KV_NAME' not found"
            echo "   Using GitHub Secrets or secure defaults"
            echo "USING_VAULT=none" >> "$GITHUB_ENV"

            # Use GitHub Secrets if available, otherwise defaults
            SFTP_HOST="${{ secrets.SFTP_HOST }}"
            SFTP_USERNAME="${{ secrets.SFTP_USERNAME }}"
            SFTP_PASSWORD="${{ secrets.SFTP_PASSWORD }}"

            # Apply defaults if GitHub Secrets are empty
            if [ -z "$SFTP_HOST" ]; then
              echo "ℹ️  Using default SFTP_HOST (placeholder)"
              SFTP_HOST="sftp.example.com"
            fi
            if [ -z "$SFTP_USERNAME" ]; then
              echo "ℹ️  Using default SFTP_USERNAME (placeholder)"
              SFTP_USERNAME="logicapp"
            fi
            if [ -z "$SFTP_PASSWORD" ]; then
              echo "ℹ️  Using default SFTP_PASSWORD (placeholder)"
              SFTP_PASSWORD="changeme-replace-with-real-password"
            fi

            # Mask and export
            echo "::add-mask::$SFTP_HOST"
            echo "::add-mask::$SFTP_USERNAME"
            echo "::add-mask::$SFTP_PASSWORD"

            {
              echo "SFTP_HOST=$SFTP_HOST"
              echo "SFTP_USERNAME=$SFTP_USERNAME"
              echo "SFTP_PASSWORD=$SFTP_PASSWORD"
            } >> "$GITHUB_ENV"

            echo ""
            echo "✅ Using GitHub Secrets with secure defaults"
            exit 0
          fi

          echo "✓ Azure Key Vault found: $KV_NAME"
          echo ""

          # Retrieve SFTP secrets from Azure Key Vault
          echo "Retrieving SFTP credentials from Azure Key Vault..."

          # Try to retrieve all secrets
          SFTP_HOST=$(az keyvault secret show --vault-name "$KV_NAME" --name sftp-host --query value -o tsv 2>/dev/null || echo "")
          SFTP_USERNAME=$(az keyvault secret show --vault-name "$KV_NAME" --name sftp-username --query value -o tsv 2>/dev/null || echo "")
          SFTP_PASSWORD=$(az keyvault secret show --vault-name "$KV_NAME" --name sftp-password --query value -o tsv 2>/dev/null || echo "")

          # Check if all secrets were retrieved
          if [[ -z "$SFTP_HOST" || -z "$SFTP_USERNAME" || -z "$SFTP_PASSWORD" ]]; then
            echo "⚠️  Not all secrets found in Azure Key Vault - using GitHub Secrets fallback"
            echo "USING_VAULT=none" >> "$GITHUB_ENV"

            # Fallback to GitHub Secrets
            SFTP_HOST="${{ secrets.SFTP_HOST }}"
            SFTP_USERNAME="${{ secrets.SFTP_USERNAME }}"
            SFTP_PASSWORD="${{ secrets.SFTP_PASSWORD }}"

            # Apply defaults if still empty
            SFTP_HOST="${SFTP_HOST:-sftp.example.com}"
            SFTP_USERNAME="${SFTP_USERNAME:-logicapp}"
            SFTP_PASSWORD="${SFTP_PASSWORD:-changeme-replace-with-real-password}"
          else
            echo "USING_VAULT=azure" >> "$GITHUB_ENV"
          fi

          # Mask secrets in logs
          echo "::add-mask::$SFTP_HOST"
          echo "::add-mask::$SFTP_USERNAME"
          echo "::add-mask::$SFTP_PASSWORD"

          # Export as environment variables
          {
            echo "SFTP_HOST=$SFTP_HOST"
            echo "SFTP_USERNAME=$SFTP_USERNAME"
            echo "SFTP_PASSWORD=$SFTP_PASSWORD"
          } >> "$GITHUB_ENV"

          echo ""
          echo "✓ Secrets retrieved successfully"
          echo "✓ Secrets masked in workflow logs"
          echo ""

      - name: Egress / DNS check
        id: egress-check
        run: |
          set -euo pipefail
          echo "=== /etc/resolv.conf ==="
          cat /etc/resolv.conf || true
          echo "=== Resolve downloads.bicep.azure.com ==="
          dig +short downloads.bicep.azure.com || nslookup downloads.bicep.azure.com || host downloads.bicep.azure.com || true
          echo "=== HTTP HEAD to releases/latest ==="
          curl -fsS --max-time 10 -I https://downloads.bicep.azure.com/releases/latest || true
          echo "=== External IP ==="
          curl -fsS --max-time 10 https://ifconfig.co || curl -fsS --max-time 10 https://ipinfo.io/ip || true
          echo "=== TCP 443 check (prefer IPv4) ==="

          # Prefer an IPv4 address explicitly, fall back to other methods if needed
          addr=$(dig +short A downloads.bicep.azure.com | head -n1)
          if [ -z "$addr" ]; then
            # try getent but ensure we pick an IPv4 address (grep for dotted-decimal)
            addr=$(getent hosts downloads.bicep.azure.com | awk '{print $1}' | grep -E '^[0-9]+\.' | head -n1 || true)
          fi

          if [ -n "$addr" ]; then
            echo "Using IPv4 address: $addr"
            if timeout 5 bash -c "</dev/tcp/$addr/443" 2>/dev/null; then
              echo "TCP 443 OK (IPv4 $addr)"
            else
              echo "TCP probe failed for $addr; trying HTTPS via curl forcing IPv4..."
              if curl -fsS --ipv4 --max-time 10 https://downloads.bicep.azure.com/releases/latest >/dev/null; then
                echo "HTTPS OK via IPv4 using curl"
              else
                echo "TCP 443 FAILED (and curl --ipv4 failed)"
                exit 2
              fi
            fi
          else
            echo "Could not resolve IPv4 address for downloads.bicep.azure.com; trying HTTPS via curl..."
            if curl -fsS --max-time 10 https://downloads.bicep.azure.com/releases/latest >/dev/null; then
              echo "HTTPS OK"
            else
              echo "Could not resolve address for downloads.bicep.azure.com and curl failed"
              exit 2
            fi
          fi

      - name: Install Bicep CLI
        run: az bicep install

      - name: Sanity check who we are
        run: az account show

      # (Optional) one-time provider registration is safe to keep
      - name: Ensure providers registered
        run: |
          az provider register --namespace Microsoft.Web
          az provider register --namespace Microsoft.Logic
          az provider register --namespace Microsoft.Storage
          az provider register --namespace Microsoft.ServiceBus

      - name: Ensure resource group
        run: az group create -n "${{ vars.AZURE_RG_NAME }}" -l "${{ vars.AZURE_LOCATION }}"

      - name: Validate Bicep template
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "Installing Bicep CLI..."
            az bicep install
            echo "Validating Bicep template: infra/main.bicep"
            az bicep version
            az bicep build --file infra/main.bicep --outfile /tmp/arm.json
            if [ ! -s /tmp/arm.json ]; then
              echo "::error::Bicep compilation failed - ARM template is empty"
              exit 1
            fi
            echo "✓ Bicep template compiled successfully"

      - name: ARM What-If Analysis
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "Running ARM What-If analysis"
            az deployment group what-if \
              --resource-group "${{ vars.AZURE_RG_NAME }}" \
              --template-file infra/main.bicep \
              --parameters \
                location="${{ vars.AZURE_LOCATION }}" \
                baseName="${{ vars.BASE_NAME }}" \
                iaName="${{ vars.IA_NAME }}" \
                serviceBusName="${{ vars.SERVICE_BUS_NAME }}" \
                sftpHost="${{ env.SFTP_HOST }}" \
                sftpUsername="${{ env.SFTP_USERNAME }}" \
                sftpPassword="${{ env.SFTP_PASSWORD }}" \
                storageSku="${{ vars.STORAGE_SKU }}" \
                connectorLocation="${{ vars.AZURE_CONNECTOR_LOCATION }}" \
                enableB2B=true \
                useExistingIa=false \
              --no-pretty-print || true

      - name: Deploy Infrastructure
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ env.RG_NAME }}
          template: infra/main.bicep
          parameters: location="${{ env.LOCATION }}" baseName="${{ env.BASE_NAME }}" iaName="${{ env.IA_NAME }}" serviceBusName="${{ env.SERVICE_BUS_NAME }}" sftpHost="${{ env.SFTP_HOST }}" sftpUsername="${{ env.SFTP_USERNAME }}" sftpPassword="${{ env.SFTP_PASSWORD }}" connectorLocation="${{ env.CONNECTOR_LOCATION }}" enableB2B=true useExistingIa=false storageSku="${{ env.STORAGE_SKU }}"
          deploymentName: hipaa-logic-infra-${{ github.run_number }}
          failOnStdErr: true

      - name: Show failing operation (full)
        if: failure()
        uses: azure/cli@v2
        with:
          inlineScript: |
            DEPLOY_NAME="hipaa-logic-infra-${{ github.run_number }}"
            echo "Listing failed ops..."
            az deployment operation group list \
              --resource-group "$RG_NAME" \
              --name "$DEPLOY_NAME" \
              --query "[?properties.provisioningState=='Failed']" -o jsonc

            echo "Showing full statusMessage for each failed op..."
            for OP in $(az deployment operation group list \
              --resource-group "$RG_NAME" \
              --name "$DEPLOY_NAME" \
              --query "[?properties.provisioningState=='Failed'].name" -o tsv); do
              az deployment operation group show \
                --resource-group "$RG_NAME" \
                --name "$DEPLOY_NAME" \
                --operation-ids "$OP" -o jsonc
            done

      - name: Allow az preview extension installs & ensure logic extension
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "Configuring az to allow preview extension install (helpful for 'logic' extension)..."
            az config set extension.dynamic_install_allow_preview=true
            echo "Attempting to add 'logic' extension..."
            az extension add --name logic --yes || true

      - name: Ensure all required X12 schema files are present in repo root
        shell: bash
        run: |
          set -euo pipefail
          # List of required schema files
          SCHEMAS=("Companion_275AttachmentEnvelope.xsd" "X12_005010X212_277.xsd" "X12_005010X217_278.xsd")
          # Try to find schemas in known locations and copy to repo root if missing
          for schema in "${SCHEMAS[@]}"; do
            if [ ! -f "./$schema" ]; then
              # Try to find in common subdirectories
              found=""
              for dir in "schemas" "infra/schemas" "logicapps/schemas" "logicapps/workflows/schemas"; do
                if [ -f "$dir/$schema" ]; then
                  echo "Copying $dir/$schema to repo root"
                  cp "$dir/$schema" "./$schema"
                  found="yes"
                  break
                fi
              done
              if [ -z "$found" ]; then
                echo "::error::Required schema file $schema not found in repo root or known locations"
                exit 1
              fi
            else
              echo "Found $schema in repo root"
            fi
          done
      - name: Configure Integration Account (trading partners, schemas, agreements)
        run: pwsh ./scripts/setup-integration-account-complete.ps1 -ResourceGroup "$RG_NAME" -IntegrationAccountName prod-integration-account -Location ${{ vars.AZURE_LOCATION }} -SchemaFolder "./"

      - name: Package Logic App workflows
        shell: bash
        run: |
          set -euo pipefail
          WF_PATH="logicapps/workflows"
          PARENT_DIR="$(dirname "$WF_PATH")"
          BASE_NAME="$(basename "$WF_PATH")"

          echo "Packaging workflows from: $WF_PATH"
          if [ ! -d "$WF_PATH" ]; then
            echo "::error::Workflows path '$WF_PATH' not found"; exit 1
          fi

          pushd "$PARENT_DIR" > /dev/null
          zip -r ../workflows.zip "$BASE_NAME"
          popd > /dev/null

          echo "Workflow package created: $(pwd)/workflows.zip"
          ls -lh workflows.zip
          echo "Package contents:"
          unzip -l workflows.zip | head -40

      - name: Deploy Logic App workflows
        uses: azure/cli@v2
        with:
          inlineScript: |
            APP_NAME="${{ env.LOGIC_APP_NAME }}"
            RG="${{ vars.AZURE_RG_NAME }}"
            ZIP_PATH="workflows.zip"

            echo "Deploying workflows to Logic App: $APP_NAME"
            if [ ! -f "$ZIP_PATH" ]; then
              echo "::error::Workflow package $ZIP_PATH not found"; exit 1
            fi

            # Deploy the ZIP package
            az webapp deploy \
              --resource-group "$RG" \
              --name "$APP_NAME" \
              --src-path "$ZIP_PATH" \
              --type zip

            echo "✓ Workflows deployed successfully"

      - name: Restart Logic App
        uses: azure/cli@v2
        with:
          inlineScript: |
            APP_NAME="${{ env.LOGIC_APP_NAME }}"
            RG="${{ vars.AZURE_RG_NAME }}"

            echo "Restarting Logic App: $APP_NAME"
            az webapp restart -g "$RG" -n "$APP_NAME"
            echo "✓ Logic App restarted"
            echo "🌐 https://$APP_NAME.azurewebsites.net"

      - name: Post-Deployment Health Check
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            APP_NAME="${{ env.LOGIC_APP_NAME }}"
            RG="${{ vars.AZURE_RG_NAME }}"

            echo "=== Post-Deployment Health Check ==="
            echo "Waiting 30 seconds for Logic App to stabilize..."
            sleep 30

            # Check Logic App status
            echo "Checking Logic App status..."
            STATUS=$(az webapp show -g "$RG" -n "$APP_NAME" --query "state" -o tsv)
            echo "Logic App State: $STATUS"

            if [ "$STATUS" != "Running" ]; then
              echo "::error::Logic App is not in Running state: $STATUS"
              exit 1
            fi
            echo "✓ Logic App is running"

            # Check workflows
            echo "Checking deployed workflows..."
            WORKFLOW_COUNT=$(az rest --method GET \
              --uri "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$RG/providers/Microsoft.Web/sites/$APP_NAME/workflows?api-version=2022-03-01" \
              --query "value | length(@)" -o tsv 2>/dev/null || echo "0")

            echo "Found $WORKFLOW_COUNT workflows"
            if [ "$WORKFLOW_COUNT" -lt 4 ]; then
              echo "::warning::Expected 4 workflows (ingest275, ingest278, replay278, rfai277), found $WORKFLOW_COUNT"
            fi

            az rest --method GET \
              --uri "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$RG/providers/Microsoft.Web/sites/$APP_NAME/workflows?api-version=2022-03-01" \
              --query "value[].{Name:name, State:properties.state}" -o table || echo "Unable to list workflows (may need permissions)"

            # Check Application Insights
            echo "Checking Application Insights connection..."
            AI_KEY=$(az webapp config appsettings list -g "$RG" -n "$APP_NAME" \
              --query "[?name=='APPINSIGHTS_INSTRUMENTATIONKEY'].value" -o tsv)
            if [ -n "$AI_KEY" ]; then
              echo "✓ Application Insights configured"
            else
              echo "::warning::Application Insights not configured"
            fi

            # Check Storage Account
            echo "Checking Storage Account..."
            STORAGE_NAME="${{ vars.BASE_NAME }}stg"
            STORAGE_STATUS=$(az storage account show -g "$RG" -n "$STORAGE_NAME" \
              --query "provisioningState" -o tsv 2>/dev/null || echo "NotFound")
            echo "Storage Account Status: $STORAGE_STATUS"

            # Check Service Bus
            echo "Checking Service Bus..."
            SB_STATUS=$(az servicebus namespace show -g "$RG" -n "${{ env.SERVICE_BUS_NAME }}" \
              --query "provisioningState" -o tsv 2>/dev/null || echo "NotFound")
            echo "Service Bus Status: $SB_STATUS"

            echo ""
            echo "=== Health Check Summary ==="
            echo "✓ Logic App: $APP_NAME ($STATUS)"
            echo "✓ Storage: $STORAGE_NAME ($STORAGE_STATUS)"
            echo "✓ Service Bus: ${{ env.SERVICE_BUS_NAME }} ($SB_STATUS)"
            echo "✓ Application Insights: Configured"
            echo ""
            echo "🎉 Deployment health check passed!"

      - name: Rollback on Failure
        if: failure()
        uses: azure/cli@v2
        with:
          inlineScript: |
            set +e  # Continue on error during rollback
            APP_NAME="${{ env.LOGIC_APP_NAME }}"
            RG="${{ vars.AZURE_RG_NAME }}"
            DEPLOY_NAME="hipaa-logic-infra-${{ github.run_number }}"

            echo "=== Deployment Failed - Initiating Rollback ==="
            echo "⚠️  Deployment failed. Attempting to gather diagnostic information..."

            # Show failed operations
            echo "Listing failed deployment operations..."
            az deployment operation group list \
              --resource-group "$RG" \
              --name "$DEPLOY_NAME" \
              --query "[?properties.provisioningState=='Failed'].{Operation:properties.targetResource.resourceName, Error:properties.statusMessage.error.message}" \
              -o table || echo "Unable to list operations"

            # Check Logic App logs
            echo "Fetching Logic App logs..."
            az webapp log download -g "$RG" -n "$APP_NAME" --log-file "/tmp/logicapp-logs.zip" 2>/dev/null || echo "Unable to download logs"

            # Show recent errors in Application Insights
            echo "Checking Application Insights for errors..."
            AI_NAME="${{ vars.BASE_NAME }}-ai"
            az monitor app-insights query -a "$AI_NAME" -g "$RG" \
              --analytics-query "traces | where timestamp > ago(1h) and severityLevel >= 3 | top 10 by timestamp desc" \
              -o table 2>/dev/null || echo "Unable to query Application Insights"

            echo ""
            echo "=== Rollback Summary ==="
            echo "❌ Deployment failed. Please review the errors above."
            echo "📋 Diagnostic information has been collected."
            echo ""
            echo "🔧 Automated Rollback Options:"
            echo "   Option 1: Re-run a previous successful deployment"
            echo "   - Go to Actions tab → Select successful run → Re-run jobs"
            echo ""
            echo "   Option 2: Revert to last known good commit"
            echo "   - git revert <bad-commit>"
            echo "   - git push origin main"
            echo "   Or use workflow_dispatch to redeploy a specific commit"
            echo ""
            echo "🔍 Manual Investigation Steps:"
            echo "   1. Review the deployment errors above"
            echo "   2. Check Logic App configuration in Azure Portal"
            echo "   3. Verify API connections are properly configured"
            echo "   4. Review Application Insights for runtime errors"
            echo "   5. Check Service Bus topic message queues"
            echo "   6. Verify Storage Account blob containers"
            echo ""
            echo "⚠️  IMPORTANT: The infrastructure may be partially deployed."
            echo "   Please verify resource state before retrying deployment."
            echo ""
            echo "📞 Escalation: If rollback is required, contact:"
            echo "   - DevOps team for infrastructure issues"
            echo "   - Application team for workflow issues"

      - name: Deployment Success Summary
        if: success()
        run: |
          echo "🎉 ====================================="
          echo "🎉  PROD Deployment Completed Successfully!"
          echo "🎉 ====================================="
          echo ""
          echo "**Deployed Resources:**"
          echo "- Resource Group: ${{ vars.AZURE_RG_NAME }}"
          echo "- Logic App: ${{ env.LOGIC_APP_NAME }}"
          echo "- Service Bus: ${{ env.SERVICE_BUS_NAME }}"
          echo "- Storage Account: ${{ vars.BASE_NAME }}stg"
          echo "- Application Insights: ${{ vars.BASE_NAME }}-ai"
          echo "- Integration Account: ${{ vars.IA_NAME }}"
          echo ""
          echo "**Deployed Workflows:**"
          echo "- ingest275: HIPAA 275 Attachment Ingestion"
          echo "- ingest278: HIPAA 278 Health Care Services Review"
          echo "- replay278: HTTP endpoint for 278 replay"
          echo "- rfai277: HIPAA 277 RFAI Outbound"
          echo ""
          echo "**Next Steps:**"
          echo "1. Verify API connections in Azure Portal"
          echo "2. Test workflows with sample data"
          echo "3. Monitor Application Insights for any issues"
          echo "4. Configure alerts and monitoring"
          echo ""
          echo "🌐 Logic App URL: https://${{ env.LOGIC_APP_NAME }}.azurewebsites.net"
