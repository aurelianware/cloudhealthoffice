name: Record demo walkthrough

# Records a captioned video and per-step screenshots of the demo portal, for
# prospect follow-ups. Run `cho_demo.py seed-story` against the demo first so
# the prior-auth steps have their records; for `texas`, `cms0057-prior-auth`
# and `shadow-adjudication`, run the Texas Medicaid demo workflow's `seed` the
# same day (the prior auth video submits a new request on the Texas tenant).
#
# connect: port-forward (default) reaches the GKE demo's portal from the
# runner with kubectl, as the Texas demo workflow does (Workload Identity
# secrets, GCP_PROJECT_ID / GKE_CLUSTER / GKE_LOCATION variables); the demo
# must be on. cloudflare-access goes through base_url and needs an Access
# service token the demo application allows (Service Auth), stored as the
# DEMO_CF_ACCESS_CLIENT_ID and DEMO_CF_ACCESS_CLIENT_SECRET secrets.

on:
  workflow_dispatch:
    inputs:
      walkthrough:
        description: "Which walkthrough to record"
        type: choice
        options:
          - prior-auth
          - full-tour
          - texas
          - cms0057-prior-auth
          - shadow-adjudication
        default: prior-auth
      connect:
        description: "How the runner reaches the portal"
        type: choice
        options:
          - port-forward
          - cloudflare-access
        default: port-forward
      base_url:
        description: "Portal URL (cloudflare-access only)"
        required: true
        default: "https://demo.cloudhealthoffice.com"

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
  GKE_LOCATION: ${{ vars.GKE_LOCATION }}

concurrency:
  group: record-demo-walkthrough
  cancel-in-progress: false

jobs:
  record:
    name: Record ${{ inputs.walkthrough }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scripts/demo/walkthrough
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: ${{ inputs.connect == 'port-forward' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: ${{ inputs.connect == 'port-forward' }}
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Port-forward the portal and CRD
        if: ${{ inputs.connect == 'port-forward' }}
        env:
          WALKTHROUGH: ${{ inputs.walkthrough }}
        run: |
          set -euo pipefail
          gcloud container clusters get-credentials "${GKE_CLUSTER:-cho-demo}" \
            --location "${GKE_LOCATION:-us-west1-a}" --project "$GCP_PROJECT_ID"
          kubectl rollout status deploy/portal -n cloudhealthoffice --timeout=300s
          ( while true; do kubectl port-forward -n cloudhealthoffice svc/portal 8080:80 >/dev/null 2>&1 || true; sleep 1; done ) &
          for _ in $(seq 1 30); do curl -s -o /dev/null http://localhost:8080/ && break; sleep 2; done
          curl -s -o /dev/null -w "Portal answered HTTP %{http_code}\n" http://localhost:8080/
          if [ "$WALKTHROUGH" = cms0057-prior-auth ]; then
            # This walkthrough calls CRD the way an EHR does, so it also needs
            # fhir-service and a CHO token (the demo trusts the public
            # development signing key; the token is masked in the log).
            ( while true; do kubectl port-forward -n cloudhealthoffice svc/fhir-service 5023:80 >/dev/null 2>&1 || true; sleep 1; done ) &
            for _ in $(seq 1 30); do curl -s -o /dev/null http://localhost:5023/health/live && break; sleep 2; done
            token="$(python3 ../gcp/cho_demo.py token)"
            echo "::add-mask::$token"
            { echo "CRD_URL=http://localhost:5023"; echo "CHO_TOKEN=$token"; } >> "$GITHUB_ENV"
          fi

      - name: Record
        env:
          BASE_URL: ${{ inputs.connect == 'port-forward' && 'http://localhost:8080' || inputs.base_url }}
          WALKTHROUGH: ${{ inputs.walkthrough }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.DEMO_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.DEMO_CF_ACCESS_CLIENT_SECRET }}
        run: node record.js

      - name: Upload video and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-walkthrough-${{ inputs.walkthrough }}
          path: scripts/demo/walkthrough/out/
          if-no-files-found: warn
          retention-days: 30
