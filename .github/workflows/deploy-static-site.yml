name: Deploy Marketing Website (Azure Static Web Apps)

# =============================================================================
# Marketing Website Deployment - Azure Static Web Apps
# =============================================================================
# Purpose: Deploy Cloud Health Office marketing website (/site folder)
# Status: ACTIVE - Separate from portal (which deploys to AKS)
#
# Architecture:
#   - Marketing site (/site) → Azure Static Web Apps (this workflow)
#   - Portal (/portal) → AKS via Docker (docker-build.yml workflow)
#
# Required Secrets:
#   - AZURE_CLIENT_ID: Service Principal for OIDC authentication
#   - AZURE_TENANT_ID: Azure AD Tenant ID
#   - AZURE_SUBSCRIPTION_ID: Azure Subscription ID
#   - AZURE_STATIC_WEB_APPS_API_TOKEN_*: Auto-generated deployment token
# =============================================================================

# Re-enabled for marketing site deployment
on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: ["main"]
    paths:
      - 'src/site/**'
      - '.github/workflows/deploy-static-site.yml'
      - 'infrastructure/azure/main.bicep'

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || 'cloudhealthoffice.com' }}

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    env:
      GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID || 'G-H1HCD5EYPN' }}
      FORMSPREE_FOUNDING_PARTNER_ENDPOINT: ${{ secrets.FORMSPREE_FOUNDING_PARTNER_ENDPOINT || vars.FORMSPREE_FOUNDING_PARTNER_ENDPOINT || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/site/package-lock.json

      - name: Validate Required Secrets
        shell: bash
        run: |
          set -euo pipefail
          echo "=========================================="
          echo "Validating Required Secrets"
          echo "=========================================="
          echo ""

          FAILED=0

          REQUIRED_SECRETS=(
            "AZURE_CLIENT_ID:${{ secrets.AZURE_CLIENT_ID }}"
            "AZURE_TENANT_ID:${{ secrets.AZURE_TENANT_ID }}"
            "AZURE_SUBSCRIPTION_ID:${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          )

          for item in "${REQUIRED_SECRETS[@]}"; do
            SECRET_NAME="${item%%:*}"
            SECRET_VALUE="${item#*:}"
            if [ -z "$SECRET_VALUE" ]; then
              echo "❌ $SECRET_NAME is not set or empty"
              FAILED=1
            else
              echo "✅ $SECRET_NAME is configured"
            fi
          done

          REQUIRED_VARS=(
            "AZURE_RG_NAME:${{ vars.AZURE_RG_NAME }}"
            "BASE_NAME:${{ vars.BASE_NAME }}"
          )

          for item in "${REQUIRED_VARS[@]}"; do
            VAR_NAME="${item%%:*}"
            VAR_VALUE="${item#*:}"
            if [ -z "$VAR_VALUE" ]; then
              echo "❌ $VAR_NAME is not set or empty"
              FAILED=1
            else
              echo "✅ $VAR_NAME = $VAR_VALUE"
            fi
          done

          echo ""
          if [ $FAILED -eq 1 ]; then
            echo "=========================================="
            echo "❌ Validation FAILED"
            echo "=========================================="
            echo ""
            echo "Required GitHub secrets and/or variables are not configured."
            echo ""
            echo "📚 Setup Instructions:"
            echo "   See: docs/FEDERATED-CREDENTIALS-SETUP.md"
            echo "   ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/FEDERATED-CREDENTIALS-SETUP.md"
            echo ""
            echo "🔧 Quick Fix:"
            echo "   1. Go to Settings → Secrets and variables → Actions"
            echo "   2. Add missing Repository secrets:"
            echo "      - AZURE_CLIENT_ID (Application ID from Azure AD)"
            echo "      - AZURE_TENANT_ID (Directory ID from Azure AD)"
            echo "      - AZURE_SUBSCRIPTION_ID (Azure Subscription ID)"
            echo "   3. Add missing Repository variables:"
            echo "      - AZURE_RG_NAME (Resource group name)"
            echo "      - BASE_NAME (Resource naming prefix)"
            echo ""
            exit 1
          else
            echo "✅ Validation PASSED"
          fi

      - name: Azure Login (OIDC)
        id: azure-login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        continue-on-error: true

      - name: Azure Login Error Handler
        if: steps.azure-login.outcome == 'failure'
        shell: bash
        run: |
          echo "=========================================="
          echo "❌ Azure Authentication Failed"
          echo "=========================================="
          echo ""
          echo "The Azure OIDC login failed. This is typically caused by:"
          echo ""
          echo "1. ❌ Federated credential not configured or incorrect"
          echo "2. ❌ Application (Client) ID is wrong or doesn't exist"
          echo "3. ❌ Service principal doesn't exist for the application"
          echo "4. ❌ Workflow permissions missing 'id-token: write'"
          echo ""
          echo "📚 Complete Setup Guide:"
          echo "   docs/FEDERATED-CREDENTIALS-SETUP.md"
          echo "   ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/FEDERATED-CREDENTIALS-SETUP.md"
          echo ""
          echo "🔍 Troubleshooting Steps:"
          echo ""
          echo "Step 1: Verify federated credential is configured"
          echo "   Expected subject: repo:${{ github.repository }}:ref:refs/heads/main"
          echo "   Run: az ad app federated-credential list --id \$AZURE_CLIENT_ID"
          echo ""
          echo "Step 2: Verify application exists"
          echo "   Run: az ad app show --id \$AZURE_CLIENT_ID"
          echo ""
          echo "Step 3: Verify service principal exists"
          echo "   Run: az ad sp show --id \$AZURE_CLIENT_ID"
          echo "   If not found, create: az ad sp create --id \$AZURE_CLIENT_ID"
          echo ""
          echo "Step 4: Check workflow has correct permissions"
          echo "   File: .github/workflows/deploy-static-site.yml"
          echo "   Required: permissions.id-token = write"
          echo ""
          echo "🛠️  Validation Tool:"
          echo "   Run locally: ./scripts/validate-deployment-auth.sh --app-id \$AZURE_CLIENT_ID"
          echo ""
          echo "📖 Common Issues & Solutions:"
          echo "   ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/FEDERATED-CREDENTIALS-SETUP.md#troubleshooting-common-issues"
          echo ""
          exit 1

      - name: Get Static Web App Details
        id: get-swa
        shell: bash
        run: |
          set -euo pipefail
          RG_NAME="${{ vars.AZURE_RG_NAME }}"
          SWA_NAME="${{ vars.BASE_NAME }}-swa"

          echo "Checking for Static Web App: $SWA_NAME"

          # Check if Static Web App exists
          if ! az staticwebapp show --name "$SWA_NAME" --resource-group "$RG_NAME" &>/dev/null; then
            echo "::warning::Static Web App $SWA_NAME not found. It will be created by infrastructure deployment."
            echo "swa_exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Get Static Web App details
          SWA_HOSTNAME=$(az staticwebapp show \
            --name "$SWA_NAME" \
            --resource-group "$RG_NAME" \
            --query "defaultHostname" -o tsv)

          SWA_ID=$(az staticwebapp show \
            --name "$SWA_NAME" \
            --resource-group "$RG_NAME" \
            --query "id" -o tsv)

          {
            echo "swa_exists=true"
            echo "swa_hostname=$SWA_HOSTNAME"
            echo "swa_id=$SWA_ID"
            echo "swa_name=$SWA_NAME"
          } >> "$GITHUB_OUTPUT"

          echo "✅ Static Web App found: $SWA_HOSTNAME"

      - name: Get Static Web App Deployment Token
        if: steps.get-swa.outputs.swa_exists == 'true'
        id: get-token
        shell: bash
        run: |
          set -euo pipefail
          RG_NAME="${{ vars.AZURE_RG_NAME }}"
          SWA_NAME="${{ steps.get-swa.outputs.swa_name }}"

          echo "Retrieving deployment token..."

          # Get deployment token
          DEPLOYMENT_TOKEN=$(az staticwebapp secrets list \
            --name "$SWA_NAME" \
            --resource-group "$RG_NAME" \
            --query "properties.apiKey" -o tsv)

          if [ -z "$DEPLOYMENT_TOKEN" ]; then
            echo "::error::Failed to retrieve deployment token"
            exit 1
          fi

          echo "::add-mask::$DEPLOYMENT_TOKEN"
          echo "deployment_token=$DEPLOYMENT_TOKEN" >> "$GITHUB_OUTPUT"
          echo "✅ Deployment token retrieved"

      - name: Clean up old staging environments
        if: steps.get-swa.outputs.swa_exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RG_NAME="${{ vars.AZURE_RG_NAME }}"
          SWA_NAME="${{ steps.get-swa.outputs.swa_name }}"

          echo "Checking for old staging environments..."

          # List all environments except 'default' and the most recent 2
          OLD_ENVS=$(az staticwebapp environment list \
            --name "$SWA_NAME" \
            --resource-group "$RG_NAME" \
            --query "[?name!='default'] | sort_by(@, &name) | [0:-2].name" \
            -o tsv || true)

          if [ -n "$OLD_ENVS" ]; then
            echo "Deleting old staging environments:"
            for env in $OLD_ENVS; do
              echo "  - Deleting environment: $env"
              az staticwebapp environment delete \
                --name "$SWA_NAME" \
                --resource-group "$RG_NAME" \
                --environment-name "$env" \
                --yes || echo "  ⚠️  Failed to delete $env (may already be deleted)"
            done
            echo "✅ Cleanup complete"
          else
            echo "✅ No old environments to clean up"
          fi

      - name: Resolve deployment token
        id: resolve-token
        shell: bash
        run: |
          if [ -n "${{ steps.get-token.outputs.deployment_token }}" ]; then
            echo "token=${{ steps.get-token.outputs.deployment_token }}" >> "$GITHUB_OUTPUT"
            echo "✅ Using dynamically fetched deployment token"
          elif [ -n "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}" ]; then
            echo "token=${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}" >> "$GITHUB_OUTPUT"
            echo "✅ Using AZURE_STATIC_WEB_APPS_API_TOKEN secret"
          else
            echo "::error::No deployment token available. Set AZURE_STATIC_WEB_APPS_API_TOKEN secret or configure OIDC."
            exit 1
          fi

      - name: Download latest test metrics
        uses: dawidd6/action-download-artifact@v23
        with:
          workflow: test-metrics.yml
          name: test-metrics
          path: .
          if_no_artifact_found: warn
          search_artifacts: true
          branch: main
        continue-on-error: true

      - name: Inject test metrics into site
        run: |
          if [ -f test-metrics.json ]; then
            echo "Found test-metrics.json, injecting values into site..."
            node scripts/inject-test-metrics.js test-metrics.json
          else
            echo "No test-metrics.json found; site will use existing static values"
          fi

      - name: Install site dependencies
        working-directory: src/site
        run: npm ci

      - name: Build site artifact
        working-directory: src/site
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.resolve-token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/src/site/dist"
          skip_app_build: true
          skip_api_build: true
          production_branch: "main"

      - name: Configure Custom Domain
        if: steps.get-swa.outputs.swa_exists == 'true'
        id: custom-domain
        shell: bash
        run: |
          set -euo pipefail
          RG_NAME="${{ vars.AZURE_RG_NAME }}"
          SWA_NAME="${{ steps.get-swa.outputs.swa_name }}"
          CUSTOM_DOMAIN="${{ env.CUSTOM_DOMAIN }}"

          echo "=========================================="
          echo "Configuring Custom Domain"
          echo "=========================================="
          echo ""
          echo "Static Web App: $SWA_NAME"
          echo "Custom Domain: $CUSTOM_DOMAIN"
          echo ""

          # Check if custom domain already exists (idempotent)
          EXISTING_DOMAINS=$(az staticwebapp hostname list \
            --name "$SWA_NAME" \
            --resource-group "$RG_NAME" \
            --query "[].name" -o tsv)

          if echo "$EXISTING_DOMAINS" | grep -q "^${CUSTOM_DOMAIN}$"; then
            echo "✅ Custom domain $CUSTOM_DOMAIN already configured"
            echo "domain_already_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "Adding custom domain $CUSTOM_DOMAIN..."

            # Add custom domain (this will require DNS verification)
            if az staticwebapp hostname set \
              --name "$SWA_NAME" \
              --resource-group "$RG_NAME" \
              --hostname "$CUSTOM_DOMAIN"; then
              echo "✅ Custom domain addition initiated successfully"
            else
              echo "::warning::Custom domain addition failed or requires DNS verification"
            fi

            echo "domain_requires_verification=true" >> "$GITHUB_OUTPUT"
          fi

          # Get the CNAME target for DNS configuration
          SWA_DEFAULT_HOSTNAME="${{ steps.get-swa.outputs.swa_hostname }}"

          echo ""
          echo "=========================================="
          echo "DNS Configuration Required"
          echo "=========================================="
          echo ""
          echo "For ROOT DOMAIN ($CUSTOM_DOMAIN):"
          echo "  Record Type: ALIAS or ANAME (required for root domains)"
          echo "  Host/Name: @ (or leave blank)"
          echo "  Points to: $SWA_DEFAULT_HOSTNAME"
          echo "  TTL: 3600"
          echo ""
          echo "Note: ALIAS/ANAME records are required for root domains."
          echo "Standard CNAME records do NOT work for root domains (@)."
          echo ""
          echo "If your DNS provider does not support ALIAS/ANAME records,"
          echo "use 'www.$CUSTOM_DOMAIN' instead:"
          echo "  Record Type: CNAME"
          echo "  Host/Name: www"
          echo "  Points to: $SWA_DEFAULT_HOSTNAME"
          echo "  TTL: 3600"
          echo ""
          echo "=========================================="
          echo ""

          # Save DNS instructions for artifact
          {
            echo "# DNS Configuration for $CUSTOM_DOMAIN"
            echo ""
            echo "**Static Web App:** $SWA_NAME"
            echo "**Default Hostname:** $SWA_DEFAULT_HOSTNAME"
            echo "**Custom Domain:** $CUSTOM_DOMAIN"
            echo ""
            echo "## DNS Records to Add"
            echo ""
            echo "### For Root Domain ($CUSTOM_DOMAIN) - REQUIRED"
            echo ""
            echo "**IMPORTANT:** Root domains require ALIAS or ANAME records. Standard CNAME records do NOT work for root domains (@)."
            echo ""
            echo '```'
            echo "Record Type: ALIAS or ANAME"
            echo "Host/Name: @ (or leave blank for root domain)"
            echo "Points to: $SWA_DEFAULT_HOSTNAME"
            echo "TTL: 3600"
            echo '```'
            echo ""
            echo "### Alternative: Use www Subdomain (if ALIAS/ANAME not supported)"
            echo ""
            echo "If your DNS provider does not support ALIAS or ANAME records, use the www subdomain instead:"
            echo ""
            echo '```'
            echo "Record Type: CNAME"
            echo "Host/Name: www"
            echo "Points to: $SWA_DEFAULT_HOSTNAME"
            echo "TTL: 3600"
            echo '```'
            echo ""
            echo "## Verification"
            echo ""
            echo "After adding the DNS record:"
            echo "1. Wait for DNS propagation (up to 48 hours, typically 5-10 minutes)"
            echo "2. Verify with: \`dig $CUSTOM_DOMAIN\` or \`nslookup $CUSTOM_DOMAIN\`"
            echo "3. Azure will automatically validate and enable HTTPS once DNS is verified"
            echo ""
            echo "## Additional Information"
            echo ""
            echo "- Azure Static Web Apps automatically provisions SSL/TLS certificates via Azure Managed Certificates"
            echo "- Certificate provisioning happens automatically after DNS verification"
            echo "- No manual certificate configuration required"
            echo ""
            echo "## Status Check"
            echo ""
            echo "To check custom domain status:"
            echo '```bash'
            echo "az staticwebapp hostname list \\"
            echo "  --name $SWA_NAME \\"
            echo "  --resource-group $RG_NAME"
            echo '```'
          } > /tmp/dns-instructions.md

          echo "dns_instructions_file=/tmp/dns-instructions.md" >> "$GITHUB_OUTPUT"

      - name: Upload DNS Instructions
        if: steps.get-swa.outputs.swa_exists == 'true' && steps.custom-domain.outputs.dns_instructions_file != ''
        uses: actions/upload-artifact@v7
        with:
          name: dns-configuration-instructions
          path: ${{ steps.custom-domain.outputs.dns_instructions_file }}
          retention-days: 90

      - name: Post DNS Instructions as PR Comment
        if: steps.get-swa.outputs.swa_exists == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const dnsInstructions = fs.readFileSync('${{ steps.custom-domain.outputs.dns_instructions_file }}', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: dnsInstructions
            });

      - name: Verify Deployment with Retry
        if: steps.get-swa.outputs.swa_exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SWA_HOSTNAME="${{ steps.get-swa.outputs.swa_hostname }}"

          echo "=========================================="
          echo "Verifying Deployment"
          echo "=========================================="
          echo ""
          echo "Testing Static Web App endpoint..."
          echo "URL: https://$SWA_HOSTNAME"
          echo ""

          # Wait for deployment to propagate
          echo "Waiting 15 seconds for deployment to propagate..."
          sleep 15

          MAX_RETRIES=10
          RETRY_DELAY=10

          for i in $(seq 1 "$MAX_RETRIES"); do
            echo "⏳ Verification attempt $i/$MAX_RETRIES..."

            # Test the endpoint
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$SWA_HOSTNAME" || echo "000")

            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "301" ] || [ "$HTTP_STATUS" = "302" ]; then
              echo "✅ Deployment verified - HTTP $HTTP_STATUS"
              echo ""
              echo "🌐 Your site is accessible at: https://$SWA_HOSTNAME"
              exit 0
            fi

            if [ "$i" -lt "$MAX_RETRIES" ]; then
              echo "   HTTP $HTTP_STATUS - waiting ${RETRY_DELAY}s before retry..."
              sleep "$RETRY_DELAY"
            fi
          done

          echo "⚠️  Deployment may need more time - HTTP $HTTP_STATUS"
          echo "   This is normal for new deployments. The site will be available shortly."
          echo ""
          echo "🌐 Check your site at: https://$SWA_HOSTNAME"

          # Don't fail - deployment may be successful but propagating
          exit 0

      - name: Deployment Success Summary
        if: success()
        run: |
          echo "🎉 ====================================="
          echo "🎉  Static Site Deployment Successful!"
          echo "🎉 ====================================="
          echo ""
          echo "**Deployed Resources:**"
          echo "- Static Web App: ${{ steps.get-swa.outputs.swa_name }}"
          echo "- Default URL: https://${{ steps.get-swa.outputs.swa_hostname }}"
          echo "- Custom Domain: ${{ env.CUSTOM_DOMAIN }} (pending DNS verification)"
          echo ""
          echo "**Next Steps:**"
          echo "1. Download the 'dns-configuration-instructions' artifact from this workflow run"
          echo "2. Add the CNAME record to your DNS provider"
          echo "3. Wait for DNS propagation (5-10 minutes typically)"
          echo "4. Azure will automatically enable HTTPS once DNS is verified"
          echo ""
          echo "**Important Notes:**"
          echo "- For root domain (@), use ALIAS or ANAME record if supported by your DNS provider"
          echo "- If ALIAS/ANAME is not available, use 'www.${{ env.CUSTOM_DOMAIN }}' instead"
          echo "- SSL/TLS certificate will be automatically provisioned by Azure"

      - name: Rollback on Failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo "=========================================="
          echo "❌ Deployment Failed"
          echo "=========================================="
          echo ""
          echo "**Troubleshooting Steps:**"
          echo "1. Verify Static Web App exists in Azure Portal"
          echo "2. Check deployment logs above for specific errors"
          echo "3. Ensure AZURE_CLIENT_ID has 'Website Contributor' role"
          echo "4. Verify resource group ${{ vars.AZURE_RG_NAME }} exists"
          echo ""
          echo "**Authentication Issues:**"
          echo "If you see OIDC or federated credential errors, see:"
          echo "  docs/FEDERATED-CREDENTIALS-SETUP.md"
          echo "  ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/FEDERATED-CREDENTIALS-SETUP.md"
          echo ""
          echo "**Validation Tool:**"
          echo "Run the validation script to diagnose issues:"
          echo "  ./scripts/validate-deployment-auth.sh"
          echo ""
          echo "**To Retry:**"
          echo "- Fix any configuration issues"
          echo "- Re-run this workflow from Actions tab"
          echo "- Or push a new commit to trigger deployment"
          echo ""
          echo "**Manual Deployment:**"
          echo "If automated deployment continues to fail:"
          echo "1. Go to Azure Portal > Static Web Apps"
          echo "2. Select ${{ vars.BASE_NAME }}-swa"
          echo "3. Use 'Deployment token' for manual deployment"
          echo "4. Use Azure CLI:"
          echo "   az staticwebapp deploy --name ${{ vars.BASE_NAME }}-swa \\"
          echo "     --resource-group ${{ vars.AZURE_RG_NAME }} \\"
          echo "     --source ./site"
          echo ""
          echo "**Debug Information:**"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "SHA: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo ""
