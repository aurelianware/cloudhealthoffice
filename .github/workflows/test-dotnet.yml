name: Test .NET Projects
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: ["main"]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/ArLegacyPostingReconciliation/**'
      - 'tools/AccumulatorReversalKindBackfill/**'
      - '.github/workflows/test-dotnet.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/ArLegacyPostingReconciliation/**'
      - 'tools/AccumulatorReversalKindBackfill/**'
      - '.github/workflows/test-dotnet.yml'
  workflow_dispatch:

jobs:
  test-dotnet:
    name: .NET Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: referencedata_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d referencedata_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # RedisAccumulatorService (benefit-plan-service's accumulator store)
      # commit / fence tests: tests/CloudHealthOffice.BenefitEngine.Tests.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REFERENCE_DATA_TEST_POSTGRES: Host=localhost;Port=5432;Database=referencedata_tests;Username=postgres;Password=postgres
      CHO_TEST_REDIS: localhost:6379

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # EphemeralMongo 3.x downloads mongod (MongoDB 7) from downloads.mongodb.org
      # on first use and keeps it in ~/.local/share/ephemeral-mongo. Cache it so
      # Mongo-backed test projects don't re-download it on every run.
      - name: Cache EphemeralMongo binaries
        uses: actions/cache@v6
        with:
          path: ~/.local/share/ephemeral-mongo
          key: ephemeral-mongo-${{ runner.os }}-${{ runner.arch }}-mongo7-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ephemeral-mongo-${{ runner.os }}-${{ runner.arch }}-mongo7-

      - name: Discover and run all test projects
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Discovering .NET test projects"
          echo "=========================================="

          # Discover unit/integration test projects. Keep E2E and load tests
          # out of this job; they require a different runtime/dependency shape
          # and are covered by dedicated Quality Gate jobs.
          mapfile -t TEST_PROJECTS < <(
            find src tests -name '*.Tests.csproj' \
              ! -name '*E2ETests.csproj' \
              ! -name '*LoadTests.csproj' \
              | sort
          )
          PROJECT_COUNT=${#TEST_PROJECTS[@]}

          if [ "$PROJECT_COUNT" -eq 0 ]; then
            echo "No .NET test projects (*.Tests.csproj) found in src or tests; failing workflow." >&2
            exit 1
          fi

          echo "Found $PROJECT_COUNT test projects:"
          printf '%s\n' "${TEST_PROJECTS[@]}"
          echo ""

          FAILED=0
          PASSED=0
          SKIPPED=0

          for PROJECT in "${TEST_PROJECTS[@]}"; do
            PROJECT_NAME=$(basename "$PROJECT" .csproj)
            echo ""
            echo "=========================================="
            echo "Testing: $PROJECT_NAME"
            echo "=========================================="

            # Restore and build
            if ! dotnet restore "$PROJECT" 2>&1; then
              echo "::error::Restore failed for $PROJECT_NAME. Tests were not run for this project."
              FAILED=$((FAILED + 1))
              continue
            fi

            if ! dotnet build "$PROJECT" --no-restore 2>&1; then
              echo "❌ Build failed for $PROJECT_NAME"
              FAILED=$((FAILED + 1))
              continue
            fi

            # Run tests
            if dotnet test "$PROJECT" --no-build --verbosity normal \
                --logger "trx;LogFileName=${PROJECT_NAME}-results.trx" \
                --collect:"XPlat Code Coverage" 2>&1; then
              echo "✅ $PROJECT_NAME passed"
              PASSED=$((PASSED + 1))
            else
              echo "❌ $PROJECT_NAME failed"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "=========================================="
          echo "Test Summary"
          echo "=========================================="
          echo "  Passed:  $PASSED"
          echo "  Failed:  $FAILED"
          echo "  Skipped: $SKIPPED"
          echo "  Total:   $PROJECT_COUNT"
          echo "=========================================="

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED test project(s) failed"
            exit 1
          fi

      - name: Surface failed test names in annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          ns = {'m': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          for trx in glob.glob('**/TestResults/**/*.trx', recursive=True) + glob.glob('**/*.trx', recursive=True):
              try:
                  tree = ET.parse(trx)
              except Exception as ex:
                  print(f'::warning::Could not parse {trx}: {ex}')
                  continue
              for res in tree.iter('{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}UnitTestResult'):
                  if res.get('outcome') == 'Failed':
                      name = res.get('testName', '?')
                      msg_el = res.find('.//m:Output/m:ErrorInfo/m:Message', ns)
                      msg = (msg_el.text or '').strip() if msg_el is not None else '(no message)'
                      msg = msg.replace('\r', ' ').replace('\n', ' ')[:500]
                      print(f'::error title=Test failed::{name}: {msg}')
          PY

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dotnet-test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml

  # Cosmos DB repository paths (conditional patch FilterPredicate, ETag-pinned
  # replace/delete, create-conflict de-dup, cross-partition sweep queries)
  # against the Linux "vnext" emulator. The tests are [Trait("Category",
  # "Cosmos")] in the regular test projects and skip when no emulator is
  # reachable; COSMOS_EMULATOR_REQUIRED=true turns that skip into a failure
  # here so this job can never pass by skipping. See tests/Shared/CosmosEmulator.
  test-dotnet-cosmos:
    name: .NET Cosmos DB Emulator Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      cosmos:
        # Pinned build of the vnext emulator (same tag as the local how-to in
        # tests/Shared/CosmosEmulator/CosmosEmulatorFixture.cs). Gateway/HTTP
        # only on 8081; readiness probe on 8080 inside the container.
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-EN20261008
        env:
          ENABLE_EXPLORER: 'false'
          ENABLE_TELEMETRY: 'false'
        ports:
          - 8081:8081
        options: >-
          --health-cmd "curl -fsS http://localhost:8080/ready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 36
    env:
      COSMOS_EMULATOR_ENDPOINT: http://localhost:8081/
      COSMOS_EMULATOR_REQUIRED: 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Run Category=Cosmos tests
        run: |
          set -euo pipefail

          # Every test project that links the shared emulator fixture.
          mapfile -t COSMOS_PROJECTS < <(
            grep -rlE --include='*.Tests.csproj' 'Shared\\CosmosEmulator|Shared/CosmosEmulator' src tests | sort
          )
          if [ "${#COSMOS_PROJECTS[@]}" -eq 0 ]; then
            echo "::error::No test project links tests/Shared/CosmosEmulator; nothing exercises the Cosmos paths."
            exit 1
          fi
          printf 'Cosmos test projects:\n'; printf '  %s\n' "${COSMOS_PROJECTS[@]}"

          FAILED=0
          for PROJECT in "${COSMOS_PROJECTS[@]}"; do
            PROJECT_NAME=$(basename "$PROJECT" .csproj)
            echo "=========================================="
            echo "Cosmos: $PROJECT_NAME"
            echo "=========================================="
            if ! dotnet test "$PROJECT" --filter "Category=Cosmos" --verbosity normal \
                --logger "trx;LogFileName=${PROJECT_NAME}-cosmos-results.trx" \
                --collect:"XPlat Code Coverage" 2>&1; then
              echo "::error::Cosmos tests failed in $PROJECT_NAME"
              FAILED=$((FAILED + 1))
            fi
          done

          if [ "$FAILED" -gt 0 ]; then
            exit 1
          fi

      # Belt and braces for "never pass by skipping": every project must have
      # run Cosmos tests, and each skip (a documented emulator gap) is surfaced.
      - name: Check Cosmos tests actually ran
        if: success()
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          ns = '{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}'
          files = glob.glob('**/TestResults/**/*-cosmos-results.trx', recursive=True) + glob.glob('**/TestResults/*-cosmos-results.trx', recursive=True)
          files = sorted(set(files))
          if not files:
              print('::error::No Cosmos test results were produced.')
              sys.exit(1)
          bad = False
          for trx in files:
              root = ET.parse(trx).getroot()
              counters = root.find(f'.//{ns}Counters')
              passed = int(counters.get('passed', '0'))
              skipped = 0
              for res in root.iter(f'{ns}UnitTestResult'):
                  if res.get('outcome') == 'NotExecuted':
                      skipped += 1
                      print(f"::warning title=Cosmos test skipped::{res.get('testName')}")
              print(f'{trx}: {passed} passed, {skipped} skipped')
              if passed == 0:
                  print(f'::error::{trx}: no Cosmos test passed')
                  bad = True
          sys.exit(1 if bad else 0)
          PY

      - name: Upload Cosmos test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dotnet-cosmos-test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml

  test-typescript:
    name: TypeScript/Jest Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests with coverage
        run: npm test -- --coverage --passWithNoTests

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: typescript
          name: typescript-coverage

  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: [test-dotnet, test-typescript]
    if: always()

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Download test results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: dotnet-test-results
          path: ./TestResults

      - name: Skip missing coverage inputs
        if: ${{ hashFiles('TestResults/**/coverage.cobertura.xml') == '' }}
        run: |
          echo "::warning::No .NET coverage reports were produced by the test job; skipping coverage summary."

      - name: Merge coverage reports
        if: ${{ hashFiles('TestResults/**/coverage.cobertura.xml') != '' }}
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.4.9
          reportgenerator \
            "-reports:./TestResults/**/coverage.cobertura.xml" \
            "-targetdir:./MergedCoverage" \
            "-reporttypes:Cobertura" \
            "-filefilters:-*Tests*"

      - name: Code Coverage Summary
        if: ${{ hashFiles('MergedCoverage/Cobertura.xml') != '' }}
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: 'MergedCoverage/Cobertura.xml'
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'

      - name: Add Coverage PR Comment
        if: ${{ github.event_name == 'pull_request' && hashFiles('code-coverage-results.md') != '' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          recreate: true
          path: code-coverage-results.md
