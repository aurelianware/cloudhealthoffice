name: Test .NET Projects
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: ["main"]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/test-dotnet.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/test-dotnet.yml'
  workflow_dispatch:

jobs:
  test-dotnet:
    name: .NET Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Discover and run all test projects
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Discovering .NET test projects"
          echo "=========================================="

          # Discover unit/integration test projects. Keep E2E and load tests
          # out of this job; they require a different runtime/dependency shape
          # and are covered by dedicated Quality Gate jobs.
          mapfile -t TEST_PROJECTS < <(
            find src tests -name '*.Tests.csproj' \
              ! -name '*E2ETests.csproj' \
              ! -name '*LoadTests.csproj' \
              | sort
          )
          PROJECT_COUNT=${#TEST_PROJECTS[@]}

          if [ "$PROJECT_COUNT" -eq 0 ]; then
            echo "No .NET test projects (*.Tests.csproj) found in src or tests; failing workflow." >&2
            exit 1
          fi

          echo "Found $PROJECT_COUNT test projects:"
          printf '%s\n' "${TEST_PROJECTS[@]}"
          echo ""

          FAILED=0
          PASSED=0
          SKIPPED=0

          for PROJECT in "${TEST_PROJECTS[@]}"; do
            PROJECT_NAME=$(basename "$PROJECT" .csproj)
            echo ""
            echo "=========================================="
            echo "Testing: $PROJECT_NAME"
            echo "=========================================="

            # Restore and build
            if ! dotnet restore "$PROJECT" 2>&1; then
              echo "::error::Restore failed for $PROJECT_NAME. Tests were not run for this project."
              FAILED=$((FAILED + 1))
              continue
            fi

            if ! dotnet build "$PROJECT" --no-restore 2>&1; then
              echo "❌ Build failed for $PROJECT_NAME"
              FAILED=$((FAILED + 1))
              continue
            fi

            # Run tests
            if dotnet test "$PROJECT" --no-build --verbosity normal \
                --logger "trx;LogFileName=${PROJECT_NAME}-results.trx" \
                --collect:"XPlat Code Coverage" 2>&1; then
              echo "✅ $PROJECT_NAME passed"
              PASSED=$((PASSED + 1))
            else
              echo "❌ $PROJECT_NAME failed"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "=========================================="
          echo "Test Summary"
          echo "=========================================="
          echo "  Passed:  $PASSED"
          echo "  Failed:  $FAILED"
          echo "  Skipped: $SKIPPED"
          echo "  Total:   $PROJECT_COUNT"
          echo "=========================================="

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED test project(s) failed"
            exit 1
          fi

      - name: Surface failed test names in annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          ns = {'m': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          for trx in glob.glob('**/TestResults/**/*.trx', recursive=True) + glob.glob('**/*.trx', recursive=True):
              try:
                  tree = ET.parse(trx)
              except Exception as ex:
                  print(f'::warning::Could not parse {trx}: {ex}')
                  continue
              for res in tree.iter('{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}UnitTestResult'):
                  if res.get('outcome') == 'Failed':
                      name = res.get('testName', '?')
                      msg_el = res.find('.//m:Output/m:ErrorInfo/m:Message', ns)
                      msg = (msg_el.text or '').strip() if msg_el is not None else '(no message)'
                      msg = msg.replace('\r', ' ').replace('\n', ' ')[:500]
                      print(f'::error title=Test failed::{name}: {msg}')
          PY

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dotnet-test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml

  test-typescript:
    name: TypeScript/Jest Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests with coverage
        run: npm test -- --coverage --passWithNoTests

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: typescript
          name: typescript-coverage

  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: [test-dotnet, test-typescript]
    if: always()

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Download test results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: dotnet-test-results
          path: ./TestResults

      - name: Skip missing coverage inputs
        if: ${{ hashFiles('TestResults/**/coverage.cobertura.xml') == '' }}
        run: |
          echo "::warning::No .NET coverage reports were produced by the test job; skipping coverage summary."

      - name: Merge coverage reports
        if: ${{ hashFiles('TestResults/**/coverage.cobertura.xml') != '' }}
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.4.9
          reportgenerator \
            "-reports:./TestResults/**/coverage.cobertura.xml" \
            "-targetdir:./MergedCoverage" \
            "-reporttypes:Cobertura" \
            "-filefilters:-*Tests*"

      - name: Code Coverage Summary
        if: ${{ hashFiles('MergedCoverage/Cobertura.xml') != '' }}
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: 'MergedCoverage/Cobertura.xml'
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'

      - name: Add Coverage PR Comment
        if: ${{ github.event_name == 'pull_request' && hashFiles('code-coverage-results.md') != '' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          recreate: true
          path: code-coverage-results.md
