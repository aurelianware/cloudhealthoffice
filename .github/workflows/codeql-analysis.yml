name: CodeQL Analysis

on:
  push:
    branches: [main, develop, 'release/*']
  pull_request:
    branches: [main]
  schedule:
    # Run CodeQL analysis every day at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        # 'javascript' and 'typescript' are the same CodeQL language — only list one.
        # Use 'typescript' (preferred alias); it covers all JS/TS/JSX/TSX files.
        language: ['typescript', 'csharp']
        # CodeQL supports: 'cpp', 'csharp', 'go', 'java', 'javascript'/'typescript', 'python', 'ruby', 'swift'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore .NET (solution)
        if: matrix.language == 'csharp'
        run: |
          dotnet restore ./cloudhealthoffice-main.sln

      - name: Build .NET (solution)
        if: matrix.language == 'csharp'
        run: |
          dotnet build ./cloudhealthoffice-main.sln --configuration Release --no-restore

      - name: Setup Node.js
        if: matrix.language == 'javascript' || matrix.language == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node.js dependencies
        if: matrix.language == 'javascript' || matrix.language == 'typescript'
        run: |
          npm ci
          # Install dependencies for microservices
          for pkg in $(find . -name "package.json" -not -path "*/node_modules/*" 2>/dev/null); do
            dir=$(dirname "$pkg")
            if [ "$dir" != "." ]; then
              echo "Installing dependencies in $dir..."
              (cd "$dir" && npm ci --ignore-scripts) || echo "Warning: Failed to install in $dir"
            fi
          done

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  results-summary:
    name: CodeQL Results Summary
    runs-on: ubuntu-latest
    needs: [analyze]
    if: always()

    steps:
      - name: Generate Summary
        run: |
          echo "# 🔍 CodeQL Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Analysis Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Language | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript/JavaScript | ${{ needs.analyze.result == 'success' && '✅ Completed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| C# | ${{ needs.analyze.result == 'success' && '✅ Completed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Review security alerts in the [Security tab](../../security/code-scanning)" >> $GITHUB_STEP_SUMMARY
