name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/azure-static-web-apps-kind-wave-053ff9e1e.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/azure-static-web-apps-kind-wave-053ff9e1e.yml'

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
          
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
        
      - name: Get Id Token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string
      
      - name: Azure Login (OIDC)
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          
      - name: Get Deployment Token with Retry
        id: get-token
        shell: bash
        run: |
          set -euo pipefail
          
          echo "Retrieving Static Web App deployment token..."
          
          # Use secret if available, otherwise will be retrieved from Azure
          DEPLOYMENT_TOKEN="${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_WAVE_053FF9E1E }}"
          
          if [ -z "$DEPLOYMENT_TOKEN" ]; then
            echo "⚠️  Deployment token not found in secrets"
            echo "   Will attempt to retrieve from Azure using OIDC"
            
            # Only try to get from Azure if we have OIDC credentials
            if [ -n "${{ secrets.AZURE_CLIENT_ID }}" ]; then
              echo "Using OIDC authentication to retrieve token..."
              
              # The azure/login action should already be invoked in the workflow
              # Get deployment token from Azure
              BASE_NAME="${{ vars.BASE_NAME || 'cloudhealthoffice' }}"
              RG_NAME="${{ vars.AZURE_RG_NAME || 'rg-cloudhealthoffice-prod' }}"
              SWA_NAME="${BASE_NAME}-swa"
              
              DEPLOYMENT_TOKEN=$(az staticwebapp secrets list \
                --name "${SWA_NAME}" \
                --resource-group "${RG_NAME}" \
                --query "properties.apiKey" -o tsv 2>/dev/null || echo "")
            fi
            
            if [ -z "$DEPLOYMENT_TOKEN" ]; then
              echo "❌ Unable to retrieve deployment token"
              echo "Please ensure:"
              echo "1. Secret AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_WAVE_053FF9E1E is set, OR"
              echo "2. Azure OIDC credentials are configured and Static Web App exists, OR"
              echo "3. azure/login action has been called prior to this step"
              exit 1
            fi
          fi
          
          echo "::add-mask::$DEPLOYMENT_TOKEN"
          echo "deployment-token=$DEPLOYMENT_TOKEN" >> "$GITHUB_OUTPUT"
          echo "✅ Deployment token retrieved"
          
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.get-token.outputs.deployment-token }}
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "/site"
          api_location: ""
          output_location: "/"
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######
        continue-on-error: false
        
      - name: Verify Deployment with Retry
        shell: bash
        run: |
          set -euo pipefail
          
          # Get hostname from static web app
          HOSTNAME="kind-wave-053ff9e1e.azurestaticapps.net"
          
          echo "=========================================="
          echo "Verifying Deployment"
          echo "=========================================="
          echo "URL: https://$HOSTNAME"
          echo ""
          
          MAX_RETRIES=10
          RETRY_DELAY=15
          
          for i in $(seq 1 "$MAX_RETRIES"); do
            echo "⏳ Attempt $i/$MAX_RETRIES..."
            
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$HOSTNAME" || echo "000")
            
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "✅ Deployment verified (HTTP $HTTP_CODE)"
              exit 0
            fi
            
            if [ $i -lt $MAX_RETRIES ]; then
              echo "   HTTP $HTTP_CODE - waiting ${RETRY_DELAY}s before retry..."
              sleep $RETRY_DELAY
            fi
          done
          
          echo "⚠️  Deployment may need more time to propagate (HTTP $HTTP_CODE)"
          echo "   This is normal for new deployments. The site will be available shortly."
          echo "   Check: https://$HOSTNAME"
          
          # Don't fail the workflow - deployment may be successful but propagating
          exit 0

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions:
      contents: read
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_WAVE_053FF9E1E }}
          action: "close"
