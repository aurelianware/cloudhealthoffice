# .gitleaks.toml - Gitleaks configuration for Cloud Health Office
# Suppresses known false positives from documentation examples,
# Cosmos DB Emulator keys, test fixtures, and placeholder values.

title = "Cloud Health Office Gitleaks Config"

# ---------------------------------------------------------------
# Inherit gitleaks' built-in rule set.
#
# This is load-bearing. A config that declares an [allowlist] but no
# [[rules]] and no [extend] leaves gitleaks with ZERO detection rules:
# it loads, scans, reports "no leaks found", and exits 0 no matter what
# the tree contains. The CI secret-scan job passed that way and could
# never have failed.
#
# Regression test: scripts/ci/verify-gitleaks-rules.sh plants a
# known-detectable canary and asserts gitleaks finds it.
# ---------------------------------------------------------------
[extend]
useDefault = true

[allowlist]

  # ---------------------------------------------------------------
  # Files that contain only placeholder/example credentials
  # ---------------------------------------------------------------
  paths = [
    # Documentation & compliance reference docs
    '''docs/CMS-0057-F-COMPLIANCE\.md''',
    '''docs/SECRETS-INVENTORY\.md''',
    '''api/quickstarts/.*\.md''',
    '''\.github/\.copilot-instructions''',
    # SECURITY.md intentionally shows credential format examples
    '''SECURITY\.md''',
    # README curl examples with Bearer token placeholders
    '''README\.md''',
    '''src/portal/CloudHealthOffice\.Portal/Pages/Apis\.razor''',
    # Portal app settings has empty placeholder credentials + Stripe price IDs (not secrets)
    '''src/portal/CloudHealthOffice\.Portal/appsettings\.json''',
    # TypeScript FHIR mapping tests (export names flagged as API keys)
    '''src/fhir/mapping/__tests__/.*\.test\.ts''',
    '''src/fhir/__tests__/.*\.test\.ts''',
    # Cosmos DB Emulator key in dev config and test fixtures
    '''services/.*/appsettings\.Development\.json''',
    '''services/.*/appsettings\.json''',
    '''services/shared/.*Tests/.*\.cs''',
    '''services/tenant-service/README\.md''',
    # Argo workflow uses Stripe *test* keys (not live)
    '''argo-workflows/tenant-onboarding\.yaml''',
    # Test scripts use placeholder credentials
    '''docs/testing/test-attachment-oauth\.sh''',
  ]

  # ---------------------------------------------------------------
  # NOTE ON K8S MANIFESTS
  #
  # A blanket 'k8s/.*\.yaml' / 'infra/k8s/.*\.yaml' allowlist used to sit
  # here. Because gitleaks matches these path patterns unanchored, it also
  # covered infrastructure/k8s/**, and it hid a real, high-entropy SFTP
  # password that lived at HEAD in three X12 job manifests for seven months.
  #
  # Manifests are now scanned like everything else. Placeholders in them must
  # be recognisable as placeholders — REPLACE_WITH_*, <angle-brackets>, or an
  # obvious local-dev marker — rather than exempted by path.
  # ---------------------------------------------------------------

  # ---------------------------------------------------------------
  # Known safe patterns (Cosmos DB Emulator key, placeholder tokens)
  # ---------------------------------------------------------------
  regexes = [
    # Azure Cosmos DB Emulator well-known public key
    '''C2y6yDjf5/R\+ob0N8A7Cgv30VRDJIWEHLM\+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==''',
    # Common placeholder patterns that are never real credentials
    '''your-client-id''',
    '''your-secret''',
    '''your-api-key''',
    '''changeme''',
    '''UPDATE THIS IN P(RODUCTION)?''',
    # SECURITY.md example key names (not values)
    '''qnxt_api_key''',
    '''claims_backend_api_key''',
    # Documentation placeholders for a bearer token the reader supplies
    '''YOUR_JWT_TOKEN''',
    '''YOUR_TOKEN''',
    '''invalid\.token\.here''',
    # Azure built-in role-definition GUID for "Key Vault Secrets User".
    # A public, documented Azure constant, identical in every tenant.
    '''4633458b-17de-408a-b874-0445c86b69e6''',
    # Key Vault secret *names*, not values
    '''x12-receiver-qualifier''',
    # Azure AD application (client) IDs shown on the admin-consent error
    # page. A client ID is a public identifier by design — it is sent to the
    # browser in every auth request — and is not a credential.
    '''^cfada1ac-f251-48ea-9330-39212aa4c862$''',
    '''^31f76844-b2cb-47b1-aede-f5b2b6dc59c8$''',
    # Synthetic identifiers in tests: prior-auth numbers, rule-set keys and
    # payer-to-payer transition keys. None is a credential.
    # NOTE: gitleaks matches these against the captured secret value, not the
    # surrounding line — so each pattern must describe the value itself.
    '''PAS-\d{8}-[A-Z0-9]{8}''',
    '''^[a-z0-9]+/[A-Z]{2}/Medicaid/any$''',
    '''transition-\d{4}-\d{2}''',
    # TypeScript named imports/exports flagged as API keys
    '''mapX12\d+To\w+''',
    # Stripe price IDs are public identifiers, not secrets
    '''price_[a-zA-Z0-9]+''',
  ]
