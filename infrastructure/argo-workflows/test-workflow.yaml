apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: test-claims-workflow
  namespace: cho-workflows
spec:
  entrypoint: simple-test
  serviceAccountName: argo-workflow
  
  templates:
  - name: simple-test
    steps:
    - - name: test-mock-service
        template: call-mock-service
  
  - name: call-mock-service
    container:
      image: curlimages/curl:8.5.0
      command: [sh, -c]
      args:
      - |
        set -euo pipefail
        echo "Probing service liveness (/health/live needs no token)..."
        
        echo "1. Coverage Service:"
        curl --fail --show-error --silent --max-time 10 http://coverage-service.cloudhealthoffice/health/live
        echo ""
        
        echo "2. Provider Service:"
        curl --fail --show-error --silent --max-time 10 http://provider-service.cloudhealthoffice/health/live
        echo ""
        
        echo "3. Claims Service:"
        curl --fail --show-error --silent --max-time 10 http://claims-service.cloudhealthoffice/health/live
        echo ""
        
        echo "4. Authorization Service:"
        curl --fail --show-error --silent --max-time 10 http://authorization-service.cloudhealthoffice/health/live
        echo ""
        
        echo "5. Benefit Plan Service:"
        curl --fail --show-error --silent --max-time 10 http://benefit-plan-service.cloudhealthoffice/health/live
        echo ""
        
        echo "All services responding (each probe returned 2xx)."
