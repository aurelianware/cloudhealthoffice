apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: claims-adjudication-
  namespace: cho-workflows
spec:
  entrypoint: adjudicate-claim

  # Workflow arguments
  arguments:
    parameters:
    - name: claim-id
      value: ""
    - name: tenant-id
      value: ""

  # Service account with RBAC to call microservices
  serviceAccountName: argo-workflow

  # Workflow templates
  templates:

  # ── Main DAG ────────────────────────────────────────────────────────
  #
  # Steps 1-5: unchanged pre-adjudication checks (coverage, provider,
  #            codes, prior auth) run in parallel where possible.
  #
  # Step 6: adjudicate — single call to benefit-plan-service
  #   POST /api/v1/adjudication/adjudicate
  #   Runs NCCI/MUE edits, fee schedule pricing, and benefit cost-sharing
  #   waterfall in one C# request. Returns 200 (paid) or 422 (NCCI edit
  #   failure) or propagates denial from upstream steps.
  #
  # Step 7: update-claim — writes final adjudication result to claim record.
  #
  # Old steps 6 (get-benefits), 7 (get-rates), 8 (calculate-allowed),
  # 9 (calculate-cost-sharing) are removed — all replaced by adjudicate.
  # ─────────────────────────────────────────────────────────────────────

  - name: adjudicate-claim
    dag:
      tasks:
      # Step 1: Get claim details
      - name: get-claim
        template: http-request
        arguments:
          parameters:
          - name: url
            value: "http://claims-service.cloudhealthoffice/api/claims/{{workflow.parameters.claim-id}}"
          - name: method
            value: "GET"
          - name: headers
            value: |
              X-Tenant-ID: {{workflow.parameters.tenant-id}}

      # Step 2: Verify coverage (depends on get-claim)
      - name: verify-coverage
        dependencies: [get-claim]
        template: verify-coverage-step
        arguments:
          parameters:
          - name: claim-data
            value: "{{tasks.get-claim.outputs.result}}"
          - name: tenant-id
            value: "{{workflow.parameters.tenant-id}}"

      # Step 3: Validate provider (parallel with coverage)
      - name: validate-provider
        dependencies: [get-claim]
        template: validate-provider-step
        arguments:
          parameters:
          - name: claim-data
            value: "{{tasks.get-claim.outputs.result}}"
          - name: tenant-id
            value: "{{workflow.parameters.tenant-id}}"

      # Step 4: Validate codes (parallel with coverage/provider)
      - name: validate-codes
        dependencies: [get-claim]
        template: validate-codes-step
        arguments:
          parameters:
          - name: claim-data
            value: "{{tasks.get-claim.outputs.result}}"

      # Step 5: Check prior authorization (depends on code validation + coverage)
      - name: check-prior-auth
        dependencies: [validate-codes, verify-coverage]
        template: check-prior-auth-step
        arguments:
          parameters:
          - name: claim-data
            value: "{{tasks.get-claim.outputs.result}}"
          - name: codes-result
            value: "{{tasks.validate-codes.outputs.result}}"
          - name: tenant-id
            value: "{{workflow.parameters.tenant-id}}"

      # Step 6: Full adjudication — NCCI edits + pricing + cost-sharing
      # Replaces old steps 6 (get-benefits), 7 (get-rates),
      # 8 (calculate-allowed), 9 (calculate-cost-sharing).
      - name: adjudicate
        dependencies: [verify-coverage, validate-provider, check-prior-auth]
        template: adjudicate-step
        arguments:
          parameters:
          - name: claim-data
            value: "{{tasks.get-claim.outputs.result}}"
          - name: coverage-result
            value: "{{tasks.verify-coverage.outputs.result}}"
          - name: provider-result
            value: "{{tasks.validate-provider.outputs.result}}"
          - name: prior-auth-result
            value: "{{tasks.check-prior-auth.outputs.result}}"
          - name: tenant-id
            value: "{{workflow.parameters.tenant-id}}"

      # Step 7: Update claim with adjudication result
      - name: update-claim
        dependencies: [adjudicate]
        template: update-claim-step
        arguments:
          parameters:
          - name: claim-id
            value: "{{workflow.parameters.claim-id}}"
          - name: adjudication-result
            value: "{{tasks.adjudicate.outputs.result}}"
          - name: tenant-id
            value: "{{workflow.parameters.tenant-id}}"

  # ── HTTP request template (generic GET/POST helper) ──────────────────
  - name: http-request
    inputs:
      parameters:
      - name: url
      - name: method
      - name: headers
        value: ""
      - name: body
        value: ""
    container:
      image: curlimages/curl:8.5.0
      command: [sh, -c]
      args:
      - |
        curl -X {{inputs.parameters.method}} \
          -H "Content-Type: application/json" \
          {{inputs.parameters.headers}} \
          {{inputs.parameters.body}} \
          {{inputs.parameters.url}}

  # ── Step 2: Verify Coverage ──────────────────────────────────────────
  - name: verify-coverage-step
    inputs:
      parameters:
      - name: claim-data
      - name: tenant-id
    script:
      image: python:3.11-alpine
      command: [python]
      source: |
        import json
        import urllib.request
        import sys

        claim = json.loads('''{{inputs.parameters.claim-data}}''')
        tenant_id = "{{inputs.parameters.tenant-id}}"

        member_id = claim.get('memberId')
        service_date = claim.get('serviceDateFrom')

        url = f"http://coverage-service.cloudhealthoffice/api/coverage/member/{member_id}/active?serviceDate={service_date}"
        req = urllib.request.Request(url)
        req.add_header('X-Tenant-ID', tenant_id)
        req.add_header('Content-Type', 'application/json')

        try:
            with urllib.request.urlopen(req, timeout=5) as response:
                coverage = json.loads(response.read().decode())

                if not coverage:
                    result = {
                        "status": "DENIED",
                        "reason": "No active coverage for service date",
                        "carc": "26"
                    }
                else:
                    result = {
                        "status": "APPROVED",
                        "planId": coverage.get('planId'),
                        "groupNumber": coverage.get('groupNumber'),
                        "coverageLevel": coverage.get('coverageLevel'),
                        "lineOfBusiness": coverage.get('lineOfBusiness'),
                        "subscriberId": coverage.get('subscriberId'),
                        "networkTier": coverage.get('networkTier', 'InNetwork')
                    }

                print(json.dumps(result))
        except Exception as e:
            print(json.dumps({
                "status": "ERROR",
                "reason": f"Coverage verification failed: {str(e)}"
            }), file=sys.stderr)
            sys.exit(1)

  # ── Step 3: Validate Provider ────────────────────────────────────────
  - name: validate-provider-step
    inputs:
      parameters:
      - name: claim-data
      - name: tenant-id
    script:
      image: python:3.11-alpine
      command: [python]
      source: |
        import json
        import urllib.request
        import sys

        claim = json.loads('''{{inputs.parameters.claim-data}}''')
        tenant_id = "{{inputs.parameters.tenant-id}}"

        billing_npi = claim.get('billingProviderNPI')

        url = f"http://provider-service.cloudhealthoffice/api/providers/{billing_npi}"
        req = urllib.request.Request(url)
        req.add_header('X-Tenant-ID', tenant_id)

        try:
            with urllib.request.urlopen(req, timeout=5) as response:
                provider = json.loads(response.read().decode())

                if provider.get('credentialingStatus') != 'Approved':
                    result = {
                        "status": "DENIED",
                        "reason": "Provider not credentialed",
                        "carc": "185"
                    }
                elif provider.get('providerStatus') != 'Active':
                    result = {
                        "status": "DENIED",
                        "reason": "Provider not active",
                        "carc": "185"
                    }
                else:
                    result = {
                        "status": "APPROVED",
                        "npi": billing_npi,
                        "providerName": provider.get('organizationName') or f"{provider.get('firstName')} {provider.get('lastName')}",
                        "specialty": provider.get('primarySpecialty')
                    }

                print(json.dumps(result))
        except urllib.error.HTTPError as e:
            if e.code == 404:
                print(json.dumps({
                    "status": "DENIED",
                    "reason": "Provider not found",
                    "carc": "185"
                }))
            else:
                print(json.dumps({
                    "status": "ERROR",
                    "reason": f"Provider validation failed: {e}"
                }), file=sys.stderr)
                sys.exit(1)
        except Exception as e:
            print(json.dumps({
                "status": "ERROR",
                "reason": f"Provider validation failed: {str(e)}"
            }), file=sys.stderr)
            sys.exit(1)

  # ── Step 4: Validate Codes ───────────────────────────────────────────
  - name: validate-codes-step
    inputs:
      parameters:
      - name: claim-data
    script:
      image: python:3.11-alpine
      command: [python]
      source: |
        import json
        import urllib.request
        import sys

        claim = json.loads('''{{inputs.parameters.claim-data}}''')

        diagnosis_codes = claim.get('diagnosisCodes', [])
        invalid_dx = []
        non_billable_dx = []
        requires_auth = False

        for dx in diagnosis_codes:
            code = dx.get('code')
            url = f"http://reference-data-service.cloudhealthoffice/api/referencedata/icd10/{code}/validate"
            try:
                with urllib.request.urlopen(url, timeout=3) as response:
                    result = json.loads(response.read().decode())
                    if not result.get('isValid'):
                        invalid_dx.append(code)
                    elif not result.get('isBillable'):
                        non_billable_dx.append(code)
            except:
                invalid_dx.append(code)

        claim_lines = claim.get('claimLines', [])
        invalid_cpt = []

        for line in claim_lines:
            code = line.get('procedureCode')
            url = f"http://reference-data-service.cloudhealthoffice/api/referencedata/cpt/{code}/validate"
            try:
                with urllib.request.urlopen(url, timeout=3) as response:
                    result = json.loads(response.read().decode())
                    if not result.get('isValid'):
                        invalid_cpt.append(code)
                    elif result.get('requiresPriorAuth'):
                        requires_auth = True
            except:
                invalid_cpt.append(code)

        if invalid_dx or non_billable_dx or invalid_cpt:
            result = {
                "status": "DENIED",
                "reason": "Invalid or non-billable codes",
                "invalidDiagnosis": invalid_dx,
                "nonBillableDiagnosis": non_billable_dx,
                "invalidProcedure": invalid_cpt,
                "carc": "11"
            }
        else:
            result = {
                "status": "APPROVED",
                "requiresPriorAuth": requires_auth
            }

        print(json.dumps(result))

  # ── Step 5: Check Prior Authorization ───────────────────────────────
  - name: check-prior-auth-step
    inputs:
      parameters:
      - name: claim-data
      - name: codes-result
      - name: tenant-id
    script:
      image: python:3.11-alpine
      command: [python]
      source: |
        import json
        import urllib.request
        import sys

        claim = json.loads('''{{inputs.parameters.claim-data}}''')
        codes_result = json.loads('''{{inputs.parameters.codes-result}}''')
        tenant_id = "{{inputs.parameters.tenant-id}}"

        requires_auth = codes_result.get('requiresPriorAuth', False)
        auth_number = claim.get('priorAuthorizationNumber')

        if not requires_auth:
            result = {"status": "NOT_REQUIRED"}
            print(json.dumps(result))
            sys.exit(0)

        if not auth_number:
            result = {
                "status": "DENIED",
                "reason": "Prior authorization required but not provided",
                "carc": "197"
            }
            print(json.dumps(result))
            sys.exit(0)

        service_date = claim.get('serviceDateFrom')
        claim_lines = claim.get('claimLines', [])
        cpt_code = claim_lines[0].get('procedureCode') if claim_lines else ''

        url = f"http://authorization-service.cloudhealthoffice/api/authorizations/{auth_number}/validate?procedureCode={cpt_code}&serviceDate={service_date}"
        req = urllib.request.Request(url)
        req.add_header('X-Tenant-ID', tenant_id)

        try:
            with urllib.request.urlopen(req, timeout=5) as response:
                auth_result = json.loads(response.read().decode())

                if not auth_result.get('isValid'):
                    result = {
                        "status": "DENIED",
                        "reason": auth_result.get('message', 'Authorization invalid'),
                        "carc": "197"
                    }
                else:
                    result = {
                        "status": "APPROVED",
                        "authorizationNumber": auth_number,
                        "approvedUnits": auth_result.get('approvedUnits')
                    }

                print(json.dumps(result))
        except Exception as e:
            result = {
                "status": "DENIED",
                "reason": f"Authorization validation failed: {str(e)}",
                "carc": "197"
            }
            print(json.dumps(result))

  # ── Step 6: Adjudicate ───────────────────────────────────────────────
  #
  # Replaces old steps 6-9 (get-benefits, get-rates, calculate-allowed,
  # calculate-cost-sharing). Calls the CHO benefit-plan-service which runs:
  #   1. NCCI/MUE edit check      (NcciEngine)
  #   2. Fee schedule pricing     (FeeScheduleEngine)
  #   3. Benefit cost-sharing     (BenefitEngine — deductible/copay/coins/OOP)
  #
  # Short-circuits to denial if any upstream step (coverage, provider,
  # prior auth) already produced a DENIED status — no point pricing a
  # claim that will be denied.
  #
  # HTTP 200 → adjudication succeeded (claim may still be denied for
  #            clinical reasons — check result.success)
  # HTTP 422 → NCCI/MUE edit failure; routes to ncci-work-queue
  # other    → system error; fails workflow step
  # ─────────────────────────────────────────────────────────────────────
  - name: adjudicate-step
    inputs:
      parameters:
      - name: claim-data
      - name: coverage-result
      - name: provider-result
      - name: prior-auth-result
      - name: tenant-id
    script:
      image: python:3.11-alpine
      command: [python]
      source: |
        import json
        import urllib.request
        import urllib.error
        import sys

        claim         = json.loads('''{{inputs.parameters.claim-data}}''')
        coverage      = json.loads('''{{inputs.parameters.coverage-result}}''')
        provider      = json.loads('''{{inputs.parameters.provider-result}}''')
        prior_auth    = json.loads('''{{inputs.parameters.prior-auth-result}}''')
        tenant_id     = "{{inputs.parameters.tenant-id}}"

        # ── Short-circuit: upstream denial ──────────────────────────────
        for check_name, check in [('coverage', coverage), ('provider', provider)]:
            if check.get('status') == 'DENIED':
                print(json.dumps({
                    "adjudicationStatus": "DENIED",
                    "deniedBy": check_name,
                    "carc": check.get('carc'),
                    "reason": check.get('reason'),
                    "totals": {
                        "billedAmount": claim.get('totalChargeAmount', 0),
                        "allowedAmount": 0,
                        "planPayment": 0,
                        "memberResponsibility": 0
                    }
                }))
                sys.exit(0)

        if prior_auth.get('status') == 'DENIED':
            print(json.dumps({
                "adjudicationStatus": "DENIED",
                "deniedBy": "prior-auth",
                "carc": prior_auth.get('carc'),
                "reason": prior_auth.get('reason'),
                "totals": {
                    "billedAmount": claim.get('totalChargeAmount', 0),
                    "allowedAmount": 0,
                    "planPayment": 0,
                    "memberResponsibility": 0
                }
            }))
            sys.exit(0)

        # ── Build adjudication request ──────────────────────────────────
        claim_lines = claim.get('claimLines', [])
        service_date = claim.get('serviceDateFrom', '')
        # Normalize date: YYYYMMDD → YYYY-MM-DD
        if len(service_date) == 8 and '-' not in service_date:
            service_date = f"{service_date[:4]}-{service_date[4:6]}-{service_date[6:]}"

        # Resolve claim type: Professional (837P) or Institutional (837I)
        raw_claim_type = claim.get('claimType', 'Professional')
        claim_type = raw_claim_type if raw_claim_type in ('Professional', 'Institutional', 'Dental') else 'Professional'

        lines = []
        for i, line in enumerate(claim_lines):
            lines.append({
                "lineNumber": line.get('lineNumber', i + 1),
                "procedureCode": line.get('procedureCode', ''),
                "codeType": line.get('procedureCodeQualifier', 'CPT'),
                "modifiers": line.get('modifiers', []),
                "revenueCode": line.get('revenueCode'),
                "placeOfService": line.get('placeOfServiceCode') or claim.get('placeOfServiceCode', '11'),
                "billedAmount": float(line.get('chargeAmount', 0)),
                "units": float(line.get('units', 1)),
                "diagnosisCodes": [
                    claim.get('diagnosisCodes', [{}])[ptr - 1].get('code', '')
                    for ptr in line.get('diagnosisPointers', [1])
                    if ptr <= len(claim.get('diagnosisCodes', []))
                ]
            })

        adjudication_request = {
            "claimId": claim.get('claimId') or claim.get('id'),
            "memberId": claim.get('memberId'),
            "subscriberId": coverage.get('subscriberId') or claim.get('subscriberId'),
            "benefitPlanId": coverage.get('planId'),
            "serviceDate": service_date,
            "providerNpi": provider.get('npi') or claim.get('billingProviderNPI'),
            "networkTier": coverage.get('networkTier', 'InNetwork'),
            "lineOfBusiness": coverage.get('lineOfBusiness'),
            "claimType": claim_type,
            "stateCode": claim.get('stateCode') or coverage.get('stateCode', 'TX'),
            "providerTaxonomy": provider.get('specialty'),
            "priorAuthorizationNumber": claim.get('priorAuthorizationNumber'),
            "lines": lines
        }

        # ── Call adjudicate endpoint ────────────────────────────────────
        url = "http://benefit-plan-service.cloudhealthoffice/api/v1/adjudication/adjudicate"
        data = json.dumps(adjudication_request).encode('utf-8')
        req = urllib.request.Request(url, data=data, method='POST')
        req.add_header('X-Tenant-ID', tenant_id)
        req.add_header('Content-Type', 'application/json')

        try:
            with urllib.request.urlopen(req, timeout=30) as response:
                adj = json.loads(response.read().decode())

                print(json.dumps({
                    "adjudicationStatus": "APPROVED" if adj.get('success') else "DENIED",
                    "claimId": adj.get('claimId'),
                    "carc": adj.get('denialReasonCode'),
                    "reason": adj.get('denialReasonDescription'),
                    "totals": adj.get('totals', {}),
                    "lines": adj.get('lines', []),
                    "accumulators": adj.get('accumulators', [])
                }))

        except urllib.error.HTTPError as e:
            if e.code == 422:
                # NCCI/MUE edit failure — read the response body for details
                body = json.loads(e.read().decode())
                print(json.dumps({
                    "adjudicationStatus": "NCCI_EDIT_FAILURE",
                    "claimId": body.get('claimId'),
                    "carc": body.get('editFailures', [{}])[0].get('suggestedCarc', '97') if body.get('editFailures') else '97',
                    "reason": body.get('message', 'NCCI/MUE edit failure'),
                    "editFailures": body.get('editFailures', []),
                    "totals": {
                        "billedAmount": claim.get('totalChargeAmount', 0),
                        "allowedAmount": 0,
                        "planPayment": 0,
                        "memberResponsibility": 0
                    }
                }))
            else:
                print(json.dumps({
                    "status": "ERROR",
                    "reason": f"Adjudication service error: HTTP {e.code}"
                }), file=sys.stderr)
                sys.exit(1)
        except Exception as e:
            print(json.dumps({
                "status": "ERROR",
                "reason": f"Adjudication failed: {str(e)}"
            }), file=sys.stderr)
            sys.exit(1)

  # ── Step 7: Update Claim ─────────────────────────────────────────────
  - name: update-claim-step
    inputs:
      parameters:
      - name: claim-id
      - name: adjudication-result
      - name: tenant-id
    script:
      image: python:3.11-alpine
      command: [python]
      source: |
        import json
        import sys
        import urllib.request

        claim_id = "{{inputs.parameters.claim-id}}"
        adj      = json.loads('''{{inputs.parameters.adjudication-result}}''')
        tenant_id = "{{inputs.parameters.tenant-id}}"

        adj_status = adj.get('adjudicationStatus', 'DENIED')
        totals     = adj.get('totals', {})

        # ── NCCI/MUE edit failure path: pend the claim, do not deny ──
        # The deterministic NCCI engine produced edit failures. We pend the
        # claim with structured PendDetails so the AI Claims Examiner service
        # can pick it up via the claims.pended.v1 Kafka event and produce an
        # advisory recommendation for human review.
        if adj_status == 'NCCI_EDIT_FAILURE':
            # Normalize editType from int to string (NcciEditType enum may
            # serialize as integer over the wire).
            normalized_edits = []
            for ef in adj.get('editFailures', []):
                ef = dict(ef)  # shallow copy so we don't mutate the source
                et = ef.get('editType')
                if et == 0:
                    ef['editType'] = 'NcciPair'
                elif et == 1:
                    ef['editType'] = 'Mue'
                normalized_edits.append(ef)

            pend_payload = {
                "pendCode": "NCCI",
                "pendReason": adj.get('reason', 'NCCI/MUE edit failure'),
                "editFailures": normalized_edits
            }
            pend_url = f"http://claims-service.cloudhealthoffice/api/claims/{claim_id}/pend"
            pend_data = json.dumps(pend_payload).encode('utf-8')
            pend_req = urllib.request.Request(pend_url, data=pend_data, method='PUT')
            pend_req.add_header('X-Tenant-ID', tenant_id)
            pend_req.add_header('Content-Type', 'application/json')

            with urllib.request.urlopen(pend_req, timeout=5) as response:
                print(json.dumps({
                    "claimId": claim_id,
                    "status": "Pended",
                    "adjudicationStatus": adj_status,
                    "editFailureCount": len(normalized_edits)
                }))
            sys.exit(0)

        if adj_status == 'DENIED':
            claim_status = "Denied"
            adjudication_payload = {
                "allowedAmount": 0,
                "patientResponsibility": 0,
                "payerPayment": 0,
                "denialReasonCode": adj.get('carc'),
                "denialReason": adj.get('reason'),
                "claimAdjustmentReasons": [{
                    "groupCode": "CO",
                    "reasonCode": adj.get('carc', '97'),
                    "amount": totals.get('billedAmount', 0),
                    "description": adj.get('reason', '')
                }]
            }
        else:
            claim_status = "Approved"
            adjudication_payload = {
                "allowedAmount": totals.get('allowedAmount', 0),
                "contractualAdjustment": totals.get('contractualAdjustment', 0),
                "deductibleAmount": totals.get('deductibleAmount', 0),
                "copayAmount": totals.get('copayAmount', 0),
                "coinsuranceAmount": totals.get('coinsuranceAmount', 0),
                "patientResponsibility": totals.get('memberResponsibility', 0),
                "payerPayment": totals.get('planPayment', 0),
                "lineResults": adj.get('lines', []),
                "accumulators": adj.get('accumulators', []),
                "claimAdjustmentReasons": []
            }

        # Write adjudication result
        url = f"http://claims-service.cloudhealthoffice/api/claims/{claim_id}/adjudication"
        data = json.dumps(adjudication_payload).encode('utf-8')
        req = urllib.request.Request(url, data=data, method='PUT')
        req.add_header('X-Tenant-ID', tenant_id)
        req.add_header('Content-Type', 'application/json')

        with urllib.request.urlopen(req, timeout=5) as response:
            # Update claim status
            status_url = f"http://claims-service.cloudhealthoffice/api/claims/{claim_id}/status"
            status_data = json.dumps({"status": claim_status}).encode('utf-8')
            status_req = urllib.request.Request(status_url, data=status_data, method='PUT')
            status_req.add_header('X-Tenant-ID', tenant_id)
            status_req.add_header('Content-Type', 'application/json')

            with urllib.request.urlopen(status_req, timeout=5) as status_response:
                print(json.dumps({
                    "claimId": claim_id,
                    "status": claim_status,
                    "adjudicationStatus": adj_status,
                    "payerPayment": adjudication_payload.get('payerPayment', 0),
                    "memberResponsibility": adjudication_payload.get('patientResponsibility', 0)
                }))
