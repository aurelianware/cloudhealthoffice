apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: x12-834-enrollment-import
  namespace: cho-workflows
spec:
  schedule: "*/10 * * * *"  # Every 10 minutes
  timezone: "America/Los_Angeles"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  workflowSpec:
    entrypoint: enrollment-import-pipeline
    # CHO workload identity: token-service registration wf-enrollment-import
    # (see cho-workload-identity.yaml and docs/security/argo-service-tokens.md).
    serviceAccountName: wf-enrollment-import
    arguments:
      parameters:
      - name: sftp-host
        value: "sftp.employer.com"
      - name: sftp-path
        value: "/outbound/834"
      - name: tenant-id
        value: "blueshield-ca-12345"
      - name: kafka-topic
        value: "enrollment-import"
    
    templates:
    - name: enrollment-import-pipeline
      steps:
      - - name: fetch-from-sftp
          template: sftp-fetch
      # Raw files go to the same endpoint as uploads (edi-operations.md §4):
      # envelope and duplicate check, TA1, the EDI file record, then the import.
      - - name: import-enrollments
          template: import-raw-834
      - - name: archive-to-sftp
          template: sftp-archive
    
    - name: sftp-fetch
      container:
        image: ghcr.io/aurelianware/cloudhealthoffice-sftp-fetcher:latest
        env:
        - name: SFTP_HOST
          value: "{{workflow.parameters.sftp-host}}"
        - name: SFTP_PATH
          value: "{{workflow.parameters.sftp-path}}"
        - name: SFTP_USERNAME
          valueFrom:
            secretKeyRef:
              name: sftp-creds
              key: username
        - name: SFTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sftp-creds
              key: password
        - name: OUTPUT_DIR
          value: "/work/input"
        volumeMounts:
        - name: workdir
          mountPath: /work
    
    - name: import-raw-834
      container:
        env:
          - name: WF_PARAM_TENANT_ID
            value: "{{workflow.parameters.tenant-id}}"
          - name: WF_PARAM_SFTP_PATH
            value: "{{workflow.parameters.sftp-path}}"
        image: alpine:3.18
        command: [sh, -c]
        args:
          - |
            apk add --no-cache curl jq
            # CHO workload token for the tenant (Authorization + X-Tenant-ID).
            . /opt/cho/cho-workload.sh
            TENANT_ID="${WF_PARAM_TENANT_ID}"
            mkdir -p /work/results
            FAILED=0

            for file in /work/input/*; do
              [ -f "$file" ] || continue
              name=$(basename "$file")
              echo "Importing $name..."
              # Obtain or refresh the token in this shell, so the $(...) below reuses it.
              cho_token "$TENANT_ID" || exit 1

              # The raw X12 goes through the upload path: envelope check,
              # duplicate ISA13 check, TA1 and the EDI file record (source Sftp).
              CODE=$(cho_curl "$TENANT_ID" POST http://enrollment-import-service.cloudhealthoffice/api/v1/enrollment/import/raw834 \
                -F "file=@$file;filename=$name" \
                -F "source=Sftp" \
                -F "sourcePath=${WF_PARAM_SFTP_PATH%/}/$name" \
                -o "/work/results/$name.result.json" \
                -w '%{http_code}')

              if [ "$CODE" = "200" ]; then
                echo "✓ Imported $name (file record $(jq -r '.ediFileId // "n/a"' "/work/results/$name.result.json"))"
              else
                # Rejected envelopes and duplicates are recorded on the EDI file
                # record; the TA1 is in the result body.
                echo "✗ $name was not imported (HTTP $CODE)"
                FAILED=$((FAILED + 1))
              fi
            done

            echo "Import complete; $FAILED file(s) not imported."
        volumeMounts:
        - name: workdir
          mountPath: /work
        - name: cho-workload-token
          mountPath: /var/run/secrets/cho
          readOnly: true
        - name: cho-workload-lib
          mountPath: /opt/cho
          readOnly: true
    
    - name: sftp-archive
      container:
        image: ghcr.io/aurelianware/cloudhealthoffice-sftp-publisher:latest
        env:
        - name: SFTP_HOST
          value: "{{workflow.parameters.sftp-host}}"
        - name: SFTP_PATH
          value: "/archive/834"
        - name: SFTP_USERNAME
          valueFrom:
            secretKeyRef:
              name: sftp-creds
              key: username
        - name: SFTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sftp-creds
              key: password
        - name: INPUT_DIR
          value: "/work/input"
        volumeMounts:
        - name: workdir
          mountPath: /work
    
    volumes:
    - name: workdir
      emptyDir: {}
    - name: cho-workload-token
      projected:
        sources:
        - serviceAccountToken:
            audience: cho-token-service
            expirationSeconds: 600
            path: token
    - name: cho-workload-lib
      configMap:
        name: cho-workload-lib
