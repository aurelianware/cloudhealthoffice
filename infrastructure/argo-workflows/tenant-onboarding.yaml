apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: tenant-onboarding-
  namespace: cho-workflows
  labels:
    workflow-type: tenant-onboarding
spec:
  entrypoint: onboard-tenant
  # CHO workload identity: token-service registration wf-tenant-onboarding
  # (any tenant; settings:manage), and the only caller tenant-service admits on
  # POST /internal/v1/tenants/{id}/onboarding-complete. See
  # cho-workload-identity.yaml and docs/security/argo-service-tokens.md.
  serviceAccountName: wf-tenant-onboarding
  onExit: cleanup-on-failure

  # Workflow arguments
  arguments:
    parameters:
      - name: tenant-id
        value: ""
      - name: tenant-name
        value: ""
      - name: organization-name
        value: ""
      - name: admin-email
        value: ""
      - name: admin-name
        value: ""
      - name: subscription-tier
        value: "starter" # starter, professional, enterprise
      - name: enabled-modules
        value: "claims,eligibility" # comma-separated list
      - name: phone
        value: ""
      - name: payment-method-id
        value: "" # Stripe payment method ID from signup
      - name: billing-name
        value: ""
  
  # Shared volumes
  volumes:
    - name: work
      emptyDir: {}
    - name: azure-credentials
      secret:
        secretName: azure-service-principal
    - name: cosmos-credentials
      secret:
        secretName: cosmos-db-credentials
    - name: stripe-credentials
      secret:
        secretName: stripe-api-keys
    - name: cho-workload-token
      projected:
        sources:
          - serviceAccountToken:
              audience: cho-token-service
              expirationSeconds: 600
              path: token
    - name: cho-workload-lib
      configMap:
        name: cho-workload-lib

  templates:
    # Main orchestration workflow
    - name: onboard-tenant
      steps:
        # Step 1: Validate tenant doesn't already exist
        - - name: validate-tenant
            template: validate-tenant-exists
        
        # Step 2: Provision Cosmos DB containers (parallel)
        - - name: provision-cosmos-members
            template: provision-cosmos-container
            arguments:
              parameters:
                - name: container-name
                  value: "Members"
                - name: partition-key
                  value: "/tenantId"
          
          - name: provision-cosmos-coverage
            template: provision-cosmos-container
            arguments:
              parameters:
                - name: container-name
                  value: "Coverage"
                - name: partition-key
                  value: "/tenantId"
          
          - name: provision-cosmos-claims
            template: provision-cosmos-container
            arguments:
              parameters:
                - name: container-name
                  value: "Claims"
                - name: partition-key
                  value: "/tenantId"
          
          - name: provision-cosmos-benefitplans
            template: provision-cosmos-container
            arguments:
              parameters:
                - name: container-name
                  value: "BenefitPlans"
                - name: partition-key
                  value: "/tenantId"
          
          - name: provision-cosmos-authorizations
            template: provision-cosmos-container
            arguments:
              parameters:
                - name: container-name
                  value: "Authorizations"
                - name: partition-key
                  value: "/tenantId"
        
        # Step 3: Create SFTP directory structure
        - - name: create-sftp-folders
            template: create-sftp-structure
        
        # Step 4: Create Stripe customer and subscription
        - - name: setup-stripe-billing
            template: create-stripe-subscription
        
        # Step 5: Create Azure AD B2C user for admin
        - - name: create-admin-user
            template: create-azure-ad-user
        
        # Step 6: Generate SFTP credentials
        - - name: create-sftp-credentials
            template: generate-sftp-credentials
        
        # Step 7: Seed default data (benefit plans, reference data)
        - - name: seed-default-benefitplans
            template: seed-benefit-plans
            when: "{{workflow.parameters.enabled-modules}} contains 'claims'"
        
        # TODO(onboarding-notification): API keys and the welcome notification.
        # Removed because neither existed: `send-welcome-notification` was
        # never defined, and `create-api-keys` created no keys -- it had two
        # `args` keys, both a stub that printed a welcome "email" (temporary
        # admin password, SFTP password, API key) to the pod log. There is no
        # notification capability in the platform yet (no email service;
        # tenant-service invitations return a code and send nothing). When one
        # exists, add a step that calls it with `cho_curl` and passes no
        # secret through logs or parameters. API keys: tenant-service has
        # POST /api/v1/tenants/{tenantId}/api-keys; calling it from here needs
        # a permission on the wf-tenant-onboarding registration and a delivery
        # path for the key other than the log.

        # Step 9: Create dedicated namespace for enterprise tier
        - - name: create-enterprise-namespace
            template: create-k8s-namespace
            when: "{{workflow.parameters.subscription-tier}} == 'enterprise'"
        
        # Step 10: Activate tenant (pending → active; the workflow's own
        # tenant-service route, not the platform:tenants status change)
        - - name: activate-tenant
            template: complete-onboarding

    # Template: Validate tenant doesn't exist
    - name: validate-tenant-exists
      container:
        image: alpine:3.18
        command: [sh, -c]
        args:
          - |
            apk add --no-cache curl jq
            . /opt/cho/cho-workload.sh

            TENANT_ID="{{workflow.parameters.tenant-id}}"
            TENANT_SERVICE="http://tenant-service.cloudhealthoffice/api/v1/tenants"

            echo "Validating tenant $TENANT_ID..."

            cho_token "$TENANT_ID" || exit 1
            HTTP_CODE=$(cho_curl "$TENANT_ID" GET "$TENANT_SERVICE/$TENANT_ID" -o /dev/null -w "%{http_code}")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "ERROR: Tenant $TENANT_ID already exists and is active"
              exit 0  # Continue anyway, update existing
            else
              echo "Tenant $TENANT_ID ready for provisioning"
            fi
        volumeMounts:
          - name: cho-workload-token
            mountPath: /var/run/secrets/cho
            readOnly: true
          - name: cho-workload-lib
            mountPath: /opt/cho
            readOnly: true

    # Template: Provision Cosmos DB container
    - name: provision-cosmos-container
      inputs:
        parameters:
          - name: container-name
          - name: partition-key
      container:
        image: mcr.microsoft.com/azure-cli:latest
        command: [sh, -c]
        args:
          - |
            CONTAINER_NAME="{{inputs.parameters.container-name}}"
            PARTITION_KEY="{{inputs.parameters.partition-key}}"
            COSMOS_ACCOUNT="${COSMOS_ACCOUNT_NAME}"
            RESOURCE_GROUP="${COSMOS_RESOURCE_GROUP}"
            DATABASE="CloudHealthOffice"
            
            echo "Checking if container $CONTAINER_NAME exists..."
            
            az cosmosdb sql container show \
              --account-name "$COSMOS_ACCOUNT" \
              --resource-group "$RESOURCE_GROUP" \
              --database-name "$DATABASE" \
              --name "$CONTAINER_NAME" >/dev/null 2>&1
            
            if [ $? -eq 0 ]; then
              echo "Container $CONTAINER_NAME already exists, skipping creation"
            else
              echo "Creating container $CONTAINER_NAME with partition key $PARTITION_KEY..."
              
              az cosmosdb sql container create \
                --account-name "$COSMOS_ACCOUNT" \
                --resource-group "$RESOURCE_GROUP" \
                --database-name "$DATABASE" \
                --name "$CONTAINER_NAME" \
                --partition-key-path "$PARTITION_KEY" \
                --throughput 400
              
              echo "Container $CONTAINER_NAME created successfully"
            fi
        env:
          - name: COSMOS_ACCOUNT_NAME
            valueFrom:
              secretKeyRef:
                name: cosmos-db-credentials
                key: account-name
          - name: COSMOS_RESOURCE_GROUP
            valueFrom:
              secretKeyRef:
                name: cosmos-db-credentials
                key: resource-group
        volumeMounts:
          - name: azure-credentials
            mountPath: /secrets
    
    # Template: Create SFTP folder structure
    - name: create-sftp-structure
      container:
        image: alpine:3.18
        command: [sh, -c]
        args:
          - |
            apk add --no-cache openssh-client
            
            TENANT_ID="{{workflow.parameters.tenant-id}}"
            SFTP_HOST="${SFTP_SERVER_HOST}"
            SFTP_USER="${SFTP_SERVER_USER}"
            
            echo "Creating SFTP folder structure for tenant $TENANT_ID..."
            
            # Create directory structure
            # /tenants/{tenant-id}/inbound/{837,835,270,271,276,277,278,275,834}
            # /tenants/{tenant-id}/outbound/{837,835,270,271,276,277,278,275,834}
            # /tenants/{tenant-id}/archive/
            # /tenants/{tenant-id}/errors/
            
            TRANSACTIONS="837 835 270 271 276 277 278 275 834"
            
            for TXN in $TRANSACTIONS; do
              echo "Creating /tenants/$TENANT_ID/inbound/$TXN"
              echo "Creating /tenants/$TENANT_ID/outbound/$TXN"
            done
            
            echo "mkdir -p /tenants/$TENANT_ID/archive" 
            echo "mkdir -p /tenants/$TENANT_ID/errors"
            
            echo "SFTP folder structure created (stub - implement with actual SFTP)"
        env:
          - name: SFTP_SERVER_HOST
            value: "sftp.cloudhealthoffice.com"
          - name: SFTP_SERVER_USER
            value: "cho-admin"
    
    # Template: Create Stripe subscription
    - name: create-stripe-subscription
      container:
        image: alpine:3.18
        command: [sh, -c]
        args:
          - |
            apk add --no-cache curl jq
            
            TENANT_ID="{{workflow.parameters.tenant-id}}"
            ORG_NAME="{{workflow.parameters.organization-name}}"
            EMAIL="{{workflow.parameters.admin-email}}"
            BILLING_NAME="{{workflow.parameters.billing-name}}"
            TIER="{{workflow.parameters.subscription-tier}}"
            PAYMENT_METHOD_ID="{{workflow.parameters.payment-method-id}}"
            
            echo "Creating Stripe subscription for $ORG_NAME ($TIER tier)..."
            
            # Determine price ID based on tier
            case "$TIER" in
              starter)
                PRICE_ID="price_1SyhLMJu0wSGGF9n9zqtS7Kh"
                ;;
              professional)
                PRICE_ID="price_1SyhMmJu0wSGGF9no72J2xY9"
                ;;
              enterprise)
                echo "Enterprise tier requires manual subscription setup"
                exit 0
                ;;
              *)
                echo "Invalid tier: $TIER"
                exit 1
                ;;
            esac
            
            # Create Stripe customer
            echo "Creating Stripe customer..."
            CUSTOMER_RESPONSE=$(curl -s -X POST https://api.stripe.com/v1/customers \
              -u "${STRIPE_SECRET_KEY}:" \
              -d "email=$EMAIL" \
              -d "name=$BILLING_NAME" \
              -d "metadata[tenant_id]=$TENANT_ID" \
              -d "metadata[organization]=$ORG_NAME" \
              -d "metadata[tier]=$TIER")
            
            CUSTOMER_ID=$(echo "$CUSTOMER_RESPONSE" | jq -r '.id')
            if [ -z "$CUSTOMER_ID" ] || [ "$CUSTOMER_ID" = "null" ]; then
              echo "Failed to create Stripe customer:"
              echo "$CUSTOMER_RESPONSE" | jq .
              exit 1
            fi
            
            echo "Stripe customer created: $CUSTOMER_ID"
            
            # Attach payment method to customer
            echo "Attaching payment method $PAYMENT_METHOD_ID to customer..."
            curl -s -X POST "https://api.stripe.com/v1/payment_methods/$PAYMENT_METHOD_ID/attach" \
              -u "${STRIPE_SECRET_KEY}:" \
              -d "customer=$CUSTOMER_ID" > /dev/null
            
            # Set as default payment method
            curl -s -X POST "https://api.stripe.com/v1/customers/$CUSTOMER_ID" \
              -u "${STRIPE_SECRET_KEY}:" \
              -d "invoice_settings[default_payment_method]=$PAYMENT_METHOD_ID" > /dev/null
            
            # Create subscription with 14-day trial
            echo "Creating subscription with $PRICE_ID (14-day trial)..."
            SUBSCRIPTION_RESPONSE=$(curl -s -X POST https://api.stripe.com/v1/subscriptions \
              -u "${STRIPE_SECRET_KEY}:" \
              -d "customer=$CUSTOMER_ID" \
              -d "items[0][price]=$PRICE_ID" \
              -d "trial_period_days=14" \
              -d "metadata[tenant_id]=$TENANT_ID" \
              -d "metadata[tier]=$TIER")
            
            SUBSCRIPTION_ID=$(echo "$SUBSCRIPTION_RESPONSE" | jq -r '.id')
            SUBSCRIPTION_STATUS=$(echo "$SUBSCRIPTION_RESPONSE" | jq -r '.status')
            
            if [ -z "$SUBSCRIPTION_ID" ] || [ "$SUBSCRIPTION_ID" = "null" ]; then
              echo "Failed to create subscription:"
              echo "$SUBSCRIPTION_RESPONSE" | jq .
              exit 1
            fi
            
            echo "✅ Subscription created successfully!"
            echo "  Customer ID: $CUSTOMER_ID"
            echo "  Subscription ID: $SUBSCRIPTION_ID"
            echo "  Status: $SUBSCRIPTION_STATUS"
            echo "  Price: $PRICE_ID"
            echo "  Trial: 14 days"
        env:
          - name: STRIPE_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: stripe-api-keys
                key: secret-key
    
    # Template: Create Azure AD B2C user
    - name: create-azure-ad-user
      container:
        image: mcr.microsoft.com/azure-cli:latest
        command: [sh, -c]
        args:
          - |
            EMAIL="{{workflow.parameters.admin-email}}"
            NAME="{{workflow.parameters.admin-name}}"
            TENANT_ID="{{workflow.parameters.tenant-id}}"
            
            echo "Creating Azure AD B2C user for $EMAIL..."
            
            # Generate random password
            PASSWORD=$(openssl rand -base64 16)
            
            # TODO: Implement actual Azure AD B2C user creation
            # az ad user create --display-name "$NAME" --user-principal-name "$EMAIL" --password "$PASSWORD"
            
            echo "User created: $EMAIL"
            echo "Temporary password: $PASSWORD (will be sent via email)"
            
            # Store password for email step
            echo "$PASSWORD" > /work/admin-password.txt
        volumeMounts:
          - name: work
            mountPath: /work
          - name: azure-credentials
            mountPath: /secrets
    
    # Template: Generate SFTP credentials
    - name: generate-sftp-credentials
      container:
        image: alpine:3.18
        command: [sh, -c]
        args:
          - |
            apk add --no-cache openssh-keygen
            
            TENANT_ID="{{workflow.parameters.tenant-id}}"
            
            echo "Generating SFTP credentials for $TENANT_ID..."
            
            # Generate SSH key pair for SFTP access
            ssh-keygen -t ed25519 -f /work/sftp-key -N "" -C "cho-$TENANT_ID"
            
            # Generate password for fallback authentication
            SFTP_PASSWORD=$(openssl rand -base64 24)
            echo "$SFTP_PASSWORD" > /work/sftp-password.txt
            
            # SFTP connection details
            cat > /work/sftp-config.txt <<EOF
            SFTP Host: sftp.cloudhealthoffice.com
            Port: 22
            Username: cho-$TENANT_ID
            
            Authentication Methods:
            1. SSH Key (recommended):
               - Download private key from portal
               - Use with sftp -i /path/to/key cho-$TENANT_ID@sftp.cloudhealthoffice.com
            
            2. Password:
               Password: $SFTP_PASSWORD
            
            Directory Structure:
            /tenants/$TENANT_ID/
            ├── inbound/837/   (drop professional claims here)
            ├── inbound/835/   (ERA files will arrive here)
            ├── inbound/270/   (drop eligibility inquiries)
            ├── inbound/834/   (drop enrollment files)
            ├── outbound/271/  (eligibility responses)
            ├── outbound/277/  (claim status responses)
            └── archive/       (processed files after 7 days)
            
            File Naming Convention:
            - {transaction-type}_{payer-id}_{YYYYMMDD}_{sequence}.edi
            - Example: 837_BCBSCA_20260208_001.edi
            EOF
            
            echo "SFTP credentials generated successfully"
            
            # TODO: Store SSH public key in SFTP server authorized_keys
            # TODO: Create SFTP user account with chroot jail
            # TODO: Store credentials in Azure Key Vault
        volumeMounts:
          - name: work
            mountPath: /work
    
    # Template: Seed benefit plans
    - name: seed-benefit-plans
      container:
        image: alpine:3.18
        command: [sh, -c]
        args:
          - |
            apk add --no-cache curl jq
            . /opt/cho/cho-workload.sh

            TENANT_ID="{{workflow.parameters.tenant-id}}"
            BENEFIT_PLAN_SERVICE="http://benefit-plan-service.cloudhealthoffice/api/v1/benefitplans"

            echo "Seeding default benefit plans for $TENANT_ID..."

            # Create default PPO plan (settings:manage, CHO workload token)
            cho_curl "$TENANT_ID" POST "$BENEFIT_PLAN_SERVICE" --fail \
              -H "Content-Type: application/json" \
              -d '{
                "planName": "Default PPO Plan",
                "planType": "PPO",
                "coverageType": "medical",
                "deductibleIndividual": 1500,
                "deductibleFamily": 3000,
                "oopMaxIndividual": 5000,
                "oopMaxFamily": 10000,
                "copayPrimaryCare": 25,
                "copaySpecialist": 50,
                "coinsuranceInNetwork": 0.8,
                "coinsuranceOutOfNetwork": 0.6
              }' || exit 1

            echo "Default benefit plans seeded"
        volumeMounts:
          - name: cho-workload-token
            mountPath: /var/run/secrets/cho
            readOnly: true
          - name: cho-workload-lib
            mountPath: /opt/cho
            readOnly: true

    # Template: Create Kubernetes namespace for enterprise tier
    - name: create-k8s-namespace
      resource:
        action: create
        manifest: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: cho-tenant-{{workflow.parameters.tenant-id}}
            labels:
              tenant-id: {{workflow.parameters.tenant-id}}
              subscription-tier: enterprise
    
    # Template: Activate the tenant. A status change otherwise needs
    # platform:tenants, which no workflow token carries; tenant-service admits
    # only wf-tenant-onboarding here, only for the tenant its token names, and
    # only pending → active (an active tenant is left alone, a suspended or
    # terminated one is refused with 409). Audited by tenant-service.
    - name: complete-onboarding
      container:
        image: alpine:3.18
        command: [sh, -c]
        args:
          - |
            apk add --no-cache curl
            . /opt/cho/cho-workload.sh

            TENANT_ID="{{workflow.parameters.tenant-id}}"

            echo "Activating tenant $TENANT_ID..."
            cho_token "$TENANT_ID" || exit 1
            CODE=$(cho_curl "$TENANT_ID" POST \
              "http://tenant-service.cloudhealthoffice/internal/v1/tenants/$TENANT_ID/onboarding-complete" \
              -o /tmp/activate.json -w '%{http_code}')
            cat /tmp/activate.json 2>/dev/null; echo
            if [ "$CODE" != "200" ]; then
              echo "Tenant activation refused (HTTP $CODE)"
              exit 1
            fi
            echo "Tenant $TENANT_ID is active"
        volumeMounts:
          - name: cho-workload-token
            mountPath: /var/run/secrets/cho
            readOnly: true
          - name: cho-workload-lib
            mountPath: /opt/cho
            readOnly: true

    # Cleanup on failure (spec.onExit)
    - name: cleanup-on-failure
      container:
        image: alpine:3.18
        command: [sh, -c]
        args:
          - |
            if [ "{{workflow.status}}" != "Succeeded" ]; then
              echo "Workflow failed - cleaning up resources..."
              TENANT_ID="{{workflow.parameters.tenant-id}}"
              
              # TODO: Implement cleanup logic
              # - Delete Cosmos containers
              # - Delete SFTP folders
              # - Cancel Stripe subscription
              # - Delete Azure AD user
              # - Mark tenant as failed
              
              echo "Cleanup completed"
            else
              echo "Workflow succeeded - no cleanup needed"
            fi
