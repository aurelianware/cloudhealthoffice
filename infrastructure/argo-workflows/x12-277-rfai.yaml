# X12 277 RFAI Response Workflow
# Replaces Azure Logic Apps rfai277 workflow with Kubernetes-native orchestration
#
# HIPAA Transaction: 005010X212 (277) - Health Care Claim Status Notification
#
# Workflow Steps:
#   1. consume-kafka - Listen to 'rfai-requests' topic (triggered by Argo Events)
#   2. fetch-claim-data - Retrieve the claim from claims-service
#      (GET /api/claims/number/{claimNumber}, claims:read) with a CHO workload
#      token for wf-277-rfai. The tenant comes from the request's tenantId, or
#      the tenant-id parameter.
#   3. generate-277 - Build X12 277 RFAI response
#   4. encode-x12 - Encode to EDI format
#   5. sftp-upload - Send to Clearinghouse SFTP
#   6. publish-kafka - Confirm to 'edi-277-outbound' topic
#
# Trading Partners:
#   - Sender: Health Plan ({config.payerId})
#   - Receiver: Clearinghouse (030240928)

apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: x12-277-rfai
  namespace: cho-workflows
  labels:
    app.kubernetes.io/name: x12-277-rfai
    app.kubernetes.io/component: edi-processing
    app.kubernetes.io/part-of: cloudhealthoffice
    hipaa.compliance: "required"
  annotations:
    description: "X12 277 RFAI response generation workflow - HIPAA compliant"
    workflows.argoproj.io/version: ">= 3.0"
spec:
  entrypoint: generate-277-rfai
  # CHO workload identity: token-service registration wf-277-rfai
  # (see cho-workload-identity.yaml and docs/security/argo-service-tokens.md).
  serviceAccountName: wf-277-rfai
  
  # Workflow-level TTL
  ttlStrategy:
    secondsAfterCompletion: 86400
    secondsAfterSuccess: 43200
    secondsAfterFailure: 604800
  
  archiveLogs: true
  activeDeadlineSeconds: 1200  # 20 minutes
  
  # Retry strategy
  retryStrategy:
    limit: 3
    retryPolicy: OnFailure
    backoff:
      duration: "30s"
      factor: 2
      maxDuration: "5m"
  
  arguments:
    parameters:
      # RFAI request payload (passed from Argo Events)
      - name: rfai-request
        value: "{}"
      # Trading partner configuration
      - name: sender-id
        value: ""  # Health Plan ID - set via ConfigMap
      - name: receiver-id
        value: "030240928"  # Clearinghouse
      - name: sftp-host
        value: "sftp.clearinghouse.example.com"
      - name: sftp-outbound-folder
        value: "/outbound/277"
      - name: kafka-topic-outbound
        value: "edi-277-outbound"
      # CHO tenant of the claim. Empty: taken from the request's tenantId.
      - name: tenant-id
        value: ""
      - name: claims-service-url
        value: "http://claims-service.cloudhealthoffice"
  
  volumes:
    - name: work-volume
      emptyDir:
        sizeLimit: "1Gi"
    - name: sftp-credentials
      secret:
        secretName: clearinghouse-sftp-secret
    - name: kafka-credentials
      secret:
        secretName: kafka-sasl-secret
    - name: cho-workload-token
      projected:
        sources:
          - serviceAccountToken:
              audience: cho-token-service
              expirationSeconds: 600
              path: token
    - name: cho-workload-lib
      configMap:
        name: cho-workload-lib

  onExit: exit-handler

  templates:
    # Main orchestration template
    - name: generate-277-rfai
      dag:
        tasks:
          # Step 1: Parse RFAI request from Kafka message
          - name: parse-rfai-request
            template: parse-request-template
            arguments:
              parameters:
                - name: rfai-payload
                  value: "{{workflow.parameters.rfai-request}}"
          
          # Step 2: Fetch claim data from claims-service
          - name: fetch-claim-data
            dependencies: [parse-rfai-request]
            template: fetch-claim-template
            arguments:
              parameters:
                - name: tenant-id
                  value: "{{tasks.parse-rfai-request.outputs.parameters.tenant-id}}"
                - name: claim-number
                  value: "{{tasks.parse-rfai-request.outputs.parameters.claim-number}}"
                - name: member-id
                  value: "{{tasks.parse-rfai-request.outputs.parameters.member-id}}"
          
          # Step 3: Generate X12 277 EDI
          - name: generate-277
            dependencies: [fetch-claim-data]
            template: generate-277-template
            arguments:
              artifacts:
                - name: claim-data
                  from: "{{tasks.fetch-claim-data.outputs.artifacts.claim-info}}"
              parameters:
                - name: sender-id
                  value: "{{workflow.parameters.sender-id}}"
                - name: receiver-id
                  value: "{{workflow.parameters.receiver-id}}"
                - name: rfai-reason-code
                  value: "{{tasks.parse-rfai-request.outputs.parameters.rfai-reason-code}}"
                - name: rfai-reference
                  value: "{{tasks.parse-rfai-request.outputs.parameters.rfai-reference}}"
          
          # Step 4: Upload to SFTP
          - name: sftp-upload
            dependencies: [generate-277]
            template: sftp-upload-template
            arguments:
              artifacts:
                - name: edi-file
                  from: "{{tasks.generate-277.outputs.artifacts.edi-output}}"
              parameters:
                - name: sftp-host
                  value: "{{workflow.parameters.sftp-host}}"
                - name: sftp-folder
                  value: "{{workflow.parameters.sftp-outbound-folder}}"
          
          # Step 5: Archive to Data Lake
          - name: archive-277
            dependencies: [generate-277]
            template: store-s3-template
            arguments:
              artifacts:
                - name: edi-file
                  from: "{{tasks.generate-277.outputs.artifacts.edi-output}}"
              parameters:
                - name: s3-bucket
                  value: "hipaa-attachments"
                - name: s3-prefix
                  value: "outbound/277/{{workflow.creationTimestamp.Y}}/{{workflow.creationTimestamp.m}}/{{workflow.creationTimestamp.d}}"
          
          # Step 6: Publish confirmation to Kafka
          - name: publish-confirmation
            dependencies: [sftp-upload, archive-277]
            template: kafka-confirm-template
            arguments:
              parameters:
                - name: topic
                  value: "{{workflow.parameters.kafka-topic-outbound}}"
                - name: claim-number
                  value: "{{tasks.parse-rfai-request.outputs.parameters.claim-number}}"
                - name: rfai-reference
                  value: "{{tasks.parse-rfai-request.outputs.parameters.rfai-reference}}"

    # Parse RFAI Request Template
    - name: parse-request-template
      inputs:
        parameters:
          - name: rfai-payload
      outputs:
        parameters:
          - name: claim-number
            valueFrom:
              path: /data/output/claim-number
          - name: member-id
            valueFrom:
              path: /data/output/member-id
          - name: rfai-reason-code
            valueFrom:
              path: /data/output/rfai-reason-code
          - name: rfai-reference
            valueFrom:
              path: /data/output/rfai-reference
          - name: tenant-id
            valueFrom:
              path: /data/output/tenant-id
      container:
        env:
          - name: PARAM_RFAI_PAYLOAD
            value: "{{inputs.parameters.rfai-payload}}"
          - name: WF_PARAM_TENANT_ID
            value: "{{workflow.parameters.tenant-id}}"
        image: python:3.11-slim
        command: ["python", "-c"]
        args:
          - |
            import json
            import os
            
            payload = json.loads(os.environ["PARAM_RFAI_PAYLOAD"])
            
            os.makedirs('/data/output', exist_ok=True)
            
            with open('/data/output/claim-number', 'w') as f:
                f.write(payload.get('claimNumber', ''))
            
            with open('/data/output/member-id', 'w') as f:
                f.write(payload.get('memberId', ''))
            
            with open('/data/output/rfai-reason-code', 'w') as f:
                f.write(payload.get('rfaiReasonCode', 'A1'))
            
            with open('/data/output/rfai-reference', 'w') as f:
                f.write(payload.get('rfaiReference', ''))

            # The CHO tenant: the workflow parameter if set, else the request's.
            # token-service only issues a token for wf-277-rfai's allowed tenants.
            with open('/data/output/tenant-id', 'w') as f:
                f.write(os.environ["WF_PARAM_TENANT_ID"] or payload.get('tenantId', ''))

            print(f"Parsed RFAI request for claim: {payload.get('claimNumber')}")
        volumeMounts:
          - name: work-volume
            mountPath: /data
        resources:
          requests:
            memory: "64Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "100m"

    # Fetch Claim Data Template
    - name: fetch-claim-template
      inputs:
        parameters:
          - name: tenant-id
          - name: claim-number
          - name: member-id
      outputs:
        artifacts:
          - name: claim-info
            path: /data/output/claim-info.json
      container:
        image: curlimages/curl:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            # Fetch the claim from claims-service with a CHO workload token
            # (wf-277-rfai, claims:read) for the claim's tenant.
            . /opt/cho/cho-workload.sh
            TENANT_ID="${PARAM_TENANT_ID}"
            CLAIM_NUMBER="${PARAM_CLAIM_NUMBER}"
            if [ -z "$TENANT_ID" ]; then
              echo "No tenant: set the tenant-id parameter or tenantId in the RFAI request"
              exit 1
            fi
            cho_token "$TENANT_ID" || exit 1
            RESPONSE=$(cho_curl "$TENANT_ID" GET \
              "$CLAIMS_SERVICE_URL/api/claims/number/$(printf '%s' "$CLAIM_NUMBER" | sed 's/[^A-Za-z0-9._-]//g')" \
              -H "Accept: application/json" --fail)

            # If API call fails or returns empty, create minimal claim info
            if [ -z "$RESPONSE" ] || [ "$RESPONSE" = "null" ]; then
              RESPONSE='{
                "claimNumber": "${PARAM_CLAIM_NUMBER}",
                "memberId": "${PARAM_MEMBER_ID}",
                "memberFirstName": "",
                "memberLastName": "",
                "providerNpi": "",
                "payerId": "",
                "payerName": "HEALTH PLAN"
              }'
            fi
            
            mkdir -p /data/output
            echo "$RESPONSE" > /data/output/claim-info.json
            echo "Fetched claim data for: ${PARAM_CLAIM_NUMBER}"
        env:
          - name: PARAM_CLAIM_NUMBER
            value: "{{inputs.parameters.claim-number}}"
          - name: PARAM_MEMBER_ID
            value: "{{inputs.parameters.member-id}}"
          - name: PARAM_TENANT_ID
            value: "{{inputs.parameters.tenant-id}}"
          - name: CLAIMS_SERVICE_URL
            value: "{{workflow.parameters.claims-service-url}}"
        volumeMounts:
          - name: work-volume
            mountPath: /data
          - name: cho-workload-token
            mountPath: /var/run/secrets/cho
            readOnly: true
          - name: cho-workload-lib
            mountPath: /opt/cho
            readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "100m"

    # Generate X12 277 Template
    - name: generate-277-template
      inputs:
        parameters:
          - name: sender-id
          - name: receiver-id
          - name: rfai-reason-code
          - name: rfai-reference
        artifacts:
          - name: claim-data
            path: /data/input/claim-info.json
      outputs:
        artifacts:
          - name: edi-output
            path: /data/output/277_rfai.edi
      container:
        env:
          - name: PARAM_RECEIVER_ID
            value: "{{inputs.parameters.receiver-id}}"
          - name: PARAM_RFAI_REASON_CODE
            value: "{{inputs.parameters.rfai-reason-code}}"
          - name: PARAM_RFAI_REFERENCE
            value: "{{inputs.parameters.rfai-reference}}"
          - name: PARAM_SENDER_ID
            value: "{{inputs.parameters.sender-id}}"
        image: cloudhealthoffice/x12-encoder:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            # Read claim data
            CLAIM_DATA=$(cat /data/input/claim-info.json)
            
            # Create input JSON for 277 generator
            cat > /data/input/277-request.json << EOF
            {
              "claimNumber": $(echo "$CLAIM_DATA" | jq -r '.claimNumber // ""' | jq -Rs .),
              "memberId": $(echo "$CLAIM_DATA" | jq -r '.memberId // ""' | jq -Rs .),
              "memberFirstName": $(echo "$CLAIM_DATA" | jq -r '.memberFirstName // ""' | jq -Rs .),
              "memberLastName": $(echo "$CLAIM_DATA" | jq -r '.memberLastName // ""' | jq -Rs .),
              "providerNpi": $(echo "$CLAIM_DATA" | jq -r '.providerNpi // ""' | jq -Rs .),
              "payerId": "${PARAM_SENDER_ID}",
              "payerName": $(echo "$CLAIM_DATA" | jq -r '.payerName // "HEALTH PLAN"' | jq -Rs .),
              "rfaiReference": "${PARAM_RFAI_REFERENCE}",
              "rfaiReasonCode": "${PARAM_RFAI_REASON_CODE}",
              "statusCategoryCode": "A1",
              "statusCode": "20",
              "envelope": {
                "sender": {
                  "qualifier": "ZZ",
                  "identifier": "${PARAM_SENDER_ID}"
                },
                "receiver": {
                  "qualifier": "ZZ",
                  "identifier": "${PARAM_RECEIVER_ID}"
                },
                "usageIndicator": "P"
              }
            }
            EOF
            
            mkdir -p /data/output
            
            # Generate 277 EDI
            python /app/generate_277.py \
              --input /data/input/277-request.json \
              --output /data/output/277_rfai.edi
            
            echo "Generated 277 RFAI EDI file"
        volumeMounts:
          - name: work-volume
            mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"

    # SFTP Upload Template
    - name: sftp-upload-template
      inputs:
        parameters:
          - name: sftp-host
          - name: sftp-folder
        artifacts:
          - name: edi-file
            path: /data/input
      outputs:
        parameters:
          - name: upload-status
            valueFrom:
              path: /data/output/upload-status.json
      container:
        image: cloudhealthoffice/sftp-fetcher:latest
        command: ["python", "-c"]
        args:
          - |
            import json
            import os
            import paramiko
            from datetime import datetime
            
            host = os.environ["PARAM_SFTP_HOST"]
            folder = os.environ["PARAM_SFTP_FOLDER"]
            username = os.environ.get('SFTP_USERNAME')
            password = os.environ.get('SFTP_PASSWORD')
            
            os.makedirs('/data/output', exist_ok=True)
            
            try:
                transport = paramiko.Transport((host, 22))
                transport.connect(username=username, password=password)
                sftp = paramiko.SFTPClient.from_transport(transport)
                
                uploaded = []
                for filename in os.listdir('/data/input'):
                    if filename.endswith('.edi'):
                        local_path = f'/data/input/{filename}'
                        timestamp = datetime.utcnow().strftime('%Y%m%d%H%M%S')
                        remote_filename = f'277_RFAI_{timestamp}.edi'
                        remote_path = f'{folder}/{remote_filename}'
                        
                        sftp.put(local_path, remote_path)
                        uploaded.append(remote_path)
                        print(f'Uploaded: {remote_path}')
                
                sftp.close()
                transport.close()
                
                result = {'success': True, 'uploaded': uploaded}
            except Exception as e:
                result = {'success': False, 'error': str(e)}
            
            with open('/data/output/upload-status.json', 'w') as f:
                json.dump(result, f)
        env:
          - name: PARAM_SFTP_FOLDER
            value: "{{inputs.parameters.sftp-folder}}"
          - name: PARAM_SFTP_HOST
            value: "{{inputs.parameters.sftp-host}}"
          - name: SFTP_USERNAME
            valueFrom:
              secretKeyRef:
                name: clearinghouse-sftp-secret
                key: username
          - name: SFTP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: clearinghouse-sftp-secret
                key: password
                optional: true
        volumeMounts:
          - name: work-volume
            mountPath: /data
          - name: sftp-credentials
            mountPath: /secrets
            readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"

    # Store to S3/MinIO Template
    - name: store-s3-template
      inputs:
        parameters:
          - name: s3-bucket
          - name: s3-prefix
        artifacts:
          - name: edi-file
            path: /data/input
      container:
        image: amazon/aws-cli:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            for file in /data/input/*.edi; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                timestamp=$(date +%Y%m%d%H%M%S)
                s3_path="s3://${PARAM_S3_BUCKET}/${PARAM_S3_PREFIX}/${filename%.edi}-${timestamp}.edi"
                aws s3 cp "$file" "$s3_path" --sse AES256
                echo "Archived: $s3_path"
              fi
            done
        env:
          - name: PARAM_S3_BUCKET
            value: "{{inputs.parameters.s3-bucket}}"
          - name: PARAM_S3_PREFIX
            value: "{{inputs.parameters.s3-prefix}}"
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: s3-credentials-secret
                key: access-key-id
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: s3-credentials-secret
                key: secret-access-key
          - name: AWS_DEFAULT_REGION
            valueFrom:
              configMapKeyRef:
                name: s3-config
                key: region
                optional: true
          - name: AWS_ENDPOINT_URL
            valueFrom:
              configMapKeyRef:
                name: s3-config
                key: endpoint-url
                optional: true
        volumeMounts:
          - name: work-volume
            mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"

    # Kafka Confirmation Template
    - name: kafka-confirm-template
      inputs:
        parameters:
          - name: topic
          - name: claim-number
          - name: rfai-reference
      container:
        image: cloudhealthoffice/kafka-publisher:latest
        args:
          - "--topic"
          - "{{inputs.parameters.topic}}"
          - "--message"
          - '{"event": "277_RFAI_SENT", "claimNumber": "{{inputs.parameters.claim-number}}", "rfaiReference": "{{inputs.parameters.rfai-reference}}", "sentAt": "{{workflow.creationTimestamp}}", "workflow": "{{workflow.name}}"}'
        env:
          - name: KAFKA_BOOTSTRAP_SERVERS
            valueFrom:
              configMapKeyRef:
                name: kafka-config
                key: bootstrap-servers
          - name: KAFKA_SECURITY_PROTOCOL
            valueFrom:
              configMapKeyRef:
                name: kafka-config
                key: security-protocol
                optional: true
          - name: KAFKA_SASL_MECHANISM
            valueFrom:
              secretKeyRef:
                name: kafka-sasl-secret
                key: mechanism
                optional: true
          - name: KAFKA_SASL_USERNAME
            valueFrom:
              secretKeyRef:
                name: kafka-sasl-secret
                key: username
                optional: true
          - name: KAFKA_SASL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: kafka-sasl-secret
                key: password
                optional: true
        volumeMounts:
          - name: work-volume
            mountPath: /data
        resources:
          requests:
            memory: "64Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "100m"

    # Error Handler
    - name: error-handler
      inputs:
        parameters:
          - name: error-message
      container:
        image: cloudhealthoffice/kafka-publisher:latest
        args:
          - "--topic"
          - "dead-letter-queue"
          - "--message"
          - '{"workflow": "x12-277-rfai", "error": "{{inputs.parameters.error-message}}", "timestamp": "{{workflow.creationTimestamp}}"}'
        env:
          - name: KAFKA_BOOTSTRAP_SERVERS
            valueFrom:
              configMapKeyRef:
                name: kafka-config
                key: bootstrap-servers
        resources:
          requests:
            memory: "64Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "100m"


    - name: exit-handler
      steps:
        - - name: log-success
            template: log-template
            when: "{{workflow.status}} == Succeeded"
        - - name: handle-failure
            template: error-handler
            when: "{{workflow.status}} != Succeeded"
            arguments:
              parameters:
                - name: error-message
                  value: "277 RFAI workflow failed"

    - name: log-template
      container:
        image: busybox
        command: ["echo"]
        args: ["X12 277 RFAI workflow completed successfully"]
