# X12 837 Claims Ingestion Workflow
# End-to-end 837 EDI file processing pipeline
#
# HIPAA Transactions:
#   - 837P (005010X222A1) - Professional Claims
#   - 837I (005010X223A2) - Institutional Claims
#   - 837D (005010X224A2) - Dental Claims
#
# Workflow Steps:
#   1. fetch-claims - Fetch 837 files from SFTP
#   2. submit-raw-837 - POST each raw file to claims-service's raw 837 import
#   3. archive-files - Move the files to the SFTP archive folder
#
# Flow:
#   SFTP /inbound/claims/*.edi → POST /api/v1/claims/import/raw837 (source=Sftp)
#   Every SFTP file takes the same path as an upload (edi-operations.md §4):
#   envelope and duplicate ISA13 check, TA1, WEDI SNIP edits and 999, the
#   EDI file record, then claim submission (claims-service adjudicates on
#   submission). The workflow no longer parses 837s itself or posts JSON, and
#   no longer publishes to the retired claims-adjudication Kafka topic.
#
# Authentication: runs as service account wf-837-ingest; the submit step
# exchanges its projected token at token-service for a CHO token (claims:work).
#
# Trigger:
#   - Manual: argo submit -n cloudhealthoffice --from workflowtemplate/x12-837-ingest
#   - Event-driven: Argo Events watching SFTP folder
#   - Cron: Every 5 minutes

apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: x12-837-ingest
  namespace: cho-workflows
  labels:
    app.kubernetes.io/name: x12-837-ingest
    app.kubernetes.io/component: claims-ingestion
    app.kubernetes.io/part-of: cloudhealthoffice
    hipaa.compliance: "required"
  annotations:
    description: "X12 837 claims ingestion - SFTP to Claims Service to Adjudication"
    workflows.argoproj.io/version: ">= 3.0"
spec:
  entrypoint: ingest-837-claims
  # CHO workload identity: token-service registration wf-837-ingest
  # (see cho-workload-identity.yaml and docs/security/argo-service-tokens.md).
  serviceAccountName: wf-837-ingest
  
  # Workflow-level TTL
  ttlStrategy:
    secondsAfterCompletion: 86400  # 24 hours
    secondsAfterSuccess: 43200     # 12 hours
    secondsAfterFailure: 604800    # 7 days
  
  archiveLogs: true
  activeDeadlineSeconds: 3600  # 1 hour
  
  # Retry strategy
  retryStrategy:
    limit: 3
    retryPolicy: OnFailure
    backoff:
      duration: "30s"
      factor: 2
      maxDuration: "5m"
  
  # Arguments
  arguments:
    parameters:
      - name: sftp-host
        value: "sftp-server.cloudhealthoffice.svc.cluster.local"
      - name: sftp-port
        value: "22"
      - name: sftp-folder
        value: "/inbound/claims"
      - name: file-pattern
        value: "*.edi"
      - name: claims-service-url
        value: "http://claims-service.cloudhealthoffice.svc.cluster.local:8080"
      - name: tenant-id
        value: "default-payer"
      - name: archive-folder
        value: "/archive/claims"
  
  # Volumes
  volumes:
    - name: work-volume
      emptyDir:
        sizeLimit: "5Gi"
    - name: sftp-credentials
      secret:
        secretName: claims-sftp-secret
    - name: cho-workload-token
      projected:
        sources:
          - serviceAccountToken:
              audience: cho-token-service
              expirationSeconds: 600
              path: token
    - name: cho-workload-lib
      configMap:
        name: cho-workload-lib

  templates:
    # Main entrypoint
    - name: ingest-837-claims
      steps:
        - - name: fetch-claims
            template: fetch-from-sftp
        - - name: submit-raw-837
            template: submit-raw-837-files
            arguments:
              artifacts:
                - name: edi-files
                  from: "{{steps.fetch-claims.outputs.artifacts.edi-files}}"
        - - name: archive-files
            template: archive-to-sftp
            arguments:
              artifacts:
                - name: edi-files
                  from: "{{steps.fetch-claims.outputs.artifacts.edi-files}}"
    
    # Step 1: Fetch 837 files from SFTP
    - name: fetch-from-sftp
      container:
        env:
          - name: WF_PARAM_FILE_PATTERN
            value: "{{workflow.parameters.file-pattern}}"
          - name: WF_PARAM_SFTP_FOLDER
            value: "{{workflow.parameters.sftp-folder}}"
          - name: WF_PARAM_SFTP_HOST
            value: "{{workflow.parameters.sftp-host}}"
          - name: WF_PARAM_SFTP_PORT
            value: "{{workflow.parameters.sftp-port}}"
        image: cloudhealthoffice/sftp-client:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            echo "Fetching 837 files from SFTP..."
            
            # Setup SSH key
            mkdir -p ~/.ssh
            cp /secrets/sftp-key ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            
            # Fetch files
            # Parameters go into the sftp batch below: one printable line each,
            # so a value cannot add sftp commands (e.g. '!cmd' runs a local shell).
            for v in "${WF_PARAM_SFTP_FOLDER}" "${WF_PARAM_FILE_PATTERN}"; do case "$v" in *[![:print:]]*) echo "Refusing a parameter with control characters"; exit 1;; esac; done
            sftp -o StrictHostKeyChecking=no -P "${WF_PARAM_SFTP_PORT}" \
              -i ~/.ssh/id_rsa sftp-user@"${WF_PARAM_SFTP_HOST}" <<EOF
            cd ${WF_PARAM_SFTP_FOLDER}
            lcd /work
            mget ${WF_PARAM_FILE_PATTERN}
            bye
            EOF
            
            # Count files
            FILE_COUNT=$(ls -1 /work/*.edi 2>/dev/null | wc -l)
            echo "Fetched $FILE_COUNT files"
            echo "$FILE_COUNT" > /work/file-count.txt
            
            if [ "$FILE_COUNT" -eq 0 ]; then
              echo "No files to process"
              exit 0
            fi
        volumeMounts:
          - name: work-volume
            mountPath: /work
          - name: sftp-credentials
            mountPath: /secrets
            readOnly: true
      outputs:
        artifacts:
          - name: edi-files
            path: /work
            archive:
              none: {}
    
    # Step 2: Submit each raw 837 through the upload path
    - name: submit-raw-837-files
      inputs:
        artifacts:
          - name: edi-files
            path: /work/input
      container:
        image: alpine:3.18
        command: [sh, -c]
        env:
          - name: WF_PARAM_TENANT_ID
            value: "{{workflow.parameters.tenant-id}}"
          - name: WF_PARAM_CLAIMS_SERVICE_URL
            value: "{{workflow.parameters.claims-service-url}}"
          - name: WF_PARAM_SFTP_FOLDER
            value: "{{workflow.parameters.sftp-folder}}"
        args:
          - |
            apk add --no-cache curl jq
            # CHO workload token for the tenant (Authorization + X-Tenant-ID).
            . /opt/cho/cho-workload.sh
            TENANT_ID="${WF_PARAM_TENANT_ID}"
            mkdir -p /work/results
            FAILED=0

            for file in /work/input/*.edi; do
              [ -f "$file" ] || continue
              name=$(basename "$file")
              # Obtain or refresh the token in this shell, so the $(...) below reuses it.
              cho_token "$TENANT_ID" || exit 1

              CODE=$(cho_curl "$TENANT_ID" POST "${WF_PARAM_CLAIMS_SERVICE_URL%/}/api/v1/claims/import/raw837" \
                -F "file=@$file;filename=$name" \
                -F "source=Sftp" \
                -F "sourcePath=${WF_PARAM_SFTP_FOLDER%/}/$name" \
                -o "/work/results/$name.result.json" \
                -w '%{http_code}')

              if [ "$CODE" = "200" ]; then
                echo "✓ $name: $(jq -r '"\(.succeededCount)/\(.totalClaims) claims accepted, file record \(.ediFileId // "n/a")"' "/work/results/$name.result.json")"
              else
                # A rejected envelope, a duplicate ISA13 or an unreadable file is
                # recorded on the EDI file record; the TA1/999 are in the body.
                echo "✗ $name was not imported (HTTP $CODE)"
                FAILED=$((FAILED + 1))
              fi
            done
            echo "$FAILED file(s) not imported"
        volumeMounts:
          - name: work-volume
            mountPath: /work
          - name: cho-workload-token
            mountPath: /var/run/secrets/cho
            readOnly: true
          - name: cho-workload-lib
            mountPath: /opt/cho
            readOnly: true

    # Step 3: Archive processed files to SFTP
    - name: archive-to-sftp
      inputs:
        artifacts:
          - name: edi-files
            path: /work/files
      container:
        env:
          - name: WF_PARAM_ARCHIVE_FOLDER
            value: "{{workflow.parameters.archive-folder}}"
          - name: WF_PARAM_SFTP_HOST
            value: "{{workflow.parameters.sftp-host}}"
          - name: WF_PARAM_SFTP_PORT
            value: "{{workflow.parameters.sftp-port}}"
        image: cloudhealthoffice/sftp-client:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            echo "Archiving processed files to SFTP..."
            
            # Setup SSH key
            mkdir -p ~/.ssh
            cp /secrets/sftp-key ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            
            # Create archive folder with timestamp
            ARCHIVE_FOLDER="${WF_PARAM_ARCHIVE_FOLDER}/$(date +%Y-%m-%d)"
            
            # Move files to archive
            # Parameters go into the sftp batch below: one printable line each,
            # so a value cannot add sftp commands (e.g. '!cmd' runs a local shell).
            for v in "${ARCHIVE_FOLDER}"; do case "$v" in *[![:print:]]*) echo "Refusing a parameter with control characters"; exit 1;; esac; done
            sftp -o StrictHostKeyChecking=no -P "${WF_PARAM_SFTP_PORT}" \
              -i ~/.ssh/id_rsa sftp-user@"${WF_PARAM_SFTP_HOST}" <<EOF
            mkdir -p $ARCHIVE_FOLDER
            cd $ARCHIVE_FOLDER
            lcd /work/files
            mput *.edi
            bye
            EOF
            
            echo "Files archived successfully"
        volumeMounts:
          - name: work-volume
            mountPath: /work
          - name: sftp-credentials
            mountPath: /secrets
            readOnly: true

---
# CronWorkflow to run every 5 minutes
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: x12-837-ingest-cron
  namespace: cho-workflows
  labels:
    app.kubernetes.io/name: x12-837-ingest-cron
    app.kubernetes.io/component: claims-ingestion
    app.kubernetes.io/part-of: cloudhealthoffice
spec:
  schedule: "*/5 * * * *"  # Every 5 minutes
  timezone: "America/Chicago"
  concurrencyPolicy: "Forbid"  # Don't run concurrent instances
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  workflowSpec:
    workflowTemplateRef:
      name: x12-837-ingest
