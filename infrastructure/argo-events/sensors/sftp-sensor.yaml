# SFTP Sensor - Triggers workflows on SFTP polling events
#
# Listens to: sftp-polling EventSource
# Triggers: x12-275-ingest, x12-276-ingest, x12-278-ingest WorkflowTemplates
#
# The Sensor runs in `cloudhealthoffice` next to its EventSources, but submits
# Workflows into `cho-workflows`, where the WorkflowTemplates, the workload
# service accounts and their token-service registrations live
# (docs/security/argo-service-tokens.md). Its service account
# `cho-workflow-sensor` may only create Workflows there
# (infrastructure/argo-events/sensor-rbac.yaml).

apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: sftp-sensor
  namespace: cloudhealthoffice
  labels:
    app.kubernetes.io/name: sftp-sensor
    app.kubernetes.io/component: sensor
    app.kubernetes.io/part-of: cloudhealthoffice
spec:
  template:
    serviceAccountName: cho-workflow-sensor
    container:
      resources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "100m"
  
  dependencies:
    - name: sftp-275-poll
      eventSourceName: sftp-polling
      eventName: sftp-poll-275
    
    - name: sftp-276-poll
      eventSourceName: sftp-polling
      eventName: sftp-poll-276
    
    - name: sftp-278-poll
      eventSourceName: sftp-polling
      eventName: sftp-poll-278
  
  triggers:
    # Trigger X12 275 Ingest Workflow
    - template:
        name: trigger-275-ingest
        conditions: "sftp-275-poll"
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: x12-275-ingest-
                namespace: cho-workflows
              spec:
                serviceAccountName: argo-workflow-sa
                workflowTemplateRef:
                  name: x12-275-ingest
                arguments:
                  parameters:
                    - name: sftp-host
                      value: "sftp.clearinghouse.example.com"
                    - name: sftp-folder
                      value: "/inbound/attachments"
                    - name: file-pattern
                      value: "*.edi"
          parameters:
            # Folder and pattern come from the calendar event's metadata.
            - src:
                dependencyName: sftp-275-poll
                dataKey: metadata.sftp-folder
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: sftp-275-poll
                dataKey: metadata.file-pattern
              dest: spec.arguments.parameters.2.value
      retryStrategy:
        steps: 3
        duration: "30s"
    
    # Trigger X12 276 Ingest Workflow (Claim Status Inquiry)
    - template:
        name: trigger-276-ingest
        conditions: "sftp-276-poll"
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: x12-276-ingest-
                namespace: cho-workflows
              spec:
                serviceAccountName: argo-workflow-sa
                workflowTemplateRef:
                  name: x12-276-ingest
                arguments:
                  parameters:
                    - name: tenant-id
                      value: "bcbs-florida"
                    - name: trading-partner-id
                      value: "availity"
                    - name: environment
                      value: "prod"
                    - name: sftp-inbound-folder
                      value: "/inbound/276"
                    - name: file-pattern
                      value: "*.edi"
          parameters:
            - src:
                dependencyName: sftp-276-poll
                dataKey: metadata.sftp-folder
              dest: spec.arguments.parameters.3.value
            - src:
                dependencyName: sftp-276-poll
                dataKey: metadata.file-pattern
              dest: spec.arguments.parameters.4.value
      retryStrategy:
        steps: 3
        duration: "30s"
    
    # Trigger X12 278 Ingest Workflow
    - template:
        name: trigger-278-ingest
        conditions: "sftp-278-poll"
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: x12-278-ingest-
                namespace: cho-workflows
              spec:
                serviceAccountName: wf-278-ingest
                workflowTemplateRef:
                  name: x12-278-ingest
                arguments:
                  parameters:
                    - name: sftp-host
                      value: "sftp.clearinghouse.example.com"
                    - name: sftp-folder
                      value: "/inbound/278"
                    - name: file-pattern
                      value: "*.edi"
          parameters:
            - src:
                dependencyName: sftp-278-poll
                dataKey: metadata.sftp-folder
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: sftp-278-poll
                dataKey: metadata.file-pattern
              dest: spec.arguments.parameters.2.value
      retryStrategy:
        steps: 3
        duration: "30s"
