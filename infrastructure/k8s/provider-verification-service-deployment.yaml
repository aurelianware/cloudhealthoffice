# Workload identity for provider-verification-service: its user-assigned managed identity, federated to
# system:serviceaccount:cloudhealthoffice:provider-verification-service-sa. token-service issues this service's
# CHO service tokens to that identity only (ServiceTokens:ServiceClients); the service holds
# no signing key. See docs/security/portal-token-service.md ("Service tokens").
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provider-verification-service-sa
  namespace: cloudhealthoffice
  annotations:
    azure.workload.identity/client-id: "<PROVIDER_VERIFICATION_SERVICE_MANAGED_IDENTITY_CLIENT_ID>"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: provider-verification-service-config
  namespace: cloudhealthoffice
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ProviderVerification__NppesApiBaseUrl: "https://npiregistry.cms.hhs.gov/api/"
  ProviderVerification__DefaultTier: "Standard"
  # Exclusion screening (docs/architecture/integrity-score-consumption.md).
  # Until enabled, every provider is reported NOT screened and claims pend.
  ProviderVerification__ExclusionScreening__Leie__Enabled: "false"
  ProviderVerification__ExclusionScreening__Sam__Enabled: "false"
  ProviderVerification__ExclusionScreening__Sam__Mode: "Extract"
---
apiVersion: v1
kind: Secret
metadata:
  name: provider-verification-service-secrets
  namespace: cloudhealthoffice
type: Opaque
stringData:
  # SAM.gov API key (expires every 90 days). Used by the SAM exclusions
  # extract download and the optional live API mode.
  ProviderVerification__SamGovApiKey: ""
  # Shared store for the synced LEIE / SAM exclusion lists. Without it each
  # replica holds its own in-memory copy.
  MongoDb__ConnectionString: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-verification-service
  namespace: cloudhealthoffice
  labels:
    app: provider-verification-service
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provider-verification-service
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
        app: provider-verification-service
        version: v1
    spec:
      serviceAccountName: provider-verification-service-sa
      containers:
      - name: provider-verification-service
        image: ghcr.io/aurelianware/cloudhealthoffice-provider-verification-service:latest
        imagePullPolicy: Always
        envFrom:
        # Source=TokenService, token-service URL and Entra scope (shared by all services).
        - configMapRef:
            name: cho-service-tokens
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ChoAuth__ServiceToken__ClientId
          value: "provider-verification-service"
        - name: ProviderVerification__NppesApiBaseUrl
          valueFrom:
            configMapKeyRef:
              name: provider-verification-service-config
              key: ProviderVerification__NppesApiBaseUrl
        - name: ProviderVerification__DefaultTier
          valueFrom:
            configMapKeyRef:
              name: provider-verification-service-config
              key: ProviderVerification__DefaultTier
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: provider-verification-service-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ProviderVerification__SamGovApiKey
          valueFrom:
            secretKeyRef:
              name: provider-verification-service-secrets
              key: ProviderVerification__SamGovApiKey
        - name: MongoDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: provider-verification-service-secrets
              key: MongoDb__ConnectionString
        - name: ProviderVerification__ExclusionScreening__Leie__Enabled
          valueFrom:
            configMapKeyRef:
              name: provider-verification-service-config
              key: ProviderVerification__ExclusionScreening__Leie__Enabled
        - name: ProviderVerification__ExclusionScreening__Sam__Enabled
          valueFrom:
            configMapKeyRef:
              name: provider-verification-service-config
              key: ProviderVerification__ExclusionScreening__Sam__Enabled
        - name: ProviderVerification__ExclusionScreening__Sam__Mode
          valueFrom:
            configMapKeyRef:
              name: provider-verification-service-config
              key: ProviderVerification__ExclusionScreening__Sam__Mode
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: provider-verification-service
  namespace: cloudhealthoffice
  labels:
    app: provider-verification-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: provider-verification-service
