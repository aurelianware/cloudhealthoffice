# =============================================================================
# SecretProviderClass — Azure Key Vault CSI Driver
# =============================================================================
# This CRD tells the Azure Key Vault CSI driver how to fetch secrets from
# Key Vault and mount them into pods as files or sync them to K8s Secrets.
#
# Prerequisites:
#   1. AKS CSI driver add-on enabled (az aks enable-addons --addons azure-keyvault-secrets-provider)
#   2. Workload Identity configured (federated credential on the managed identity)
#   3. Key Vault Secrets User RBAC role assigned to the workload identity
#
# Usage:
#   Reference this SecretProviderClass in a pod spec:
#     volumes:
#       - name: secrets-store
#         csi:
#           driver: secrets-store.csi.k8s.io
#           readOnly: true
#           volumeAttributes:
#             secretProviderClass: azure-kv-secrets
#
# To add secrets:
#   Append entries to the secretObjects array below and to the "objects" string
#   in spec.parameters. Each secret name uses "--" as the hierarchy delimiter
#   (e.g. CosmosDb--ConnectionString maps to CosmosDb:ConnectionString in .NET).
# =============================================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-secrets
  namespace: cho          # adjust per environment / namespace
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "<WORKLOAD_IDENTITY_CLIENT_ID>"   # managed identity client ID
    keyvaultName: "<KEY_VAULT_NAME>"            # e.g. cho-app-kv
    tenantId: "<AZURE_TENANT_ID>"               # Azure AD tenant ID
    cloudName: ""                                # empty = AzurePublicCloud

    # List each secret to be fetched from Key Vault.
    # objectName must match the Key Vault secret name exactly.
    objects: |
      array:
        - |
          objectName: CosmosDb--ConnectionString
          objectType: secret
        - |
          objectName: Stripe--SecretKey
          objectType: secret

  # NOTE: secretObjects syncs secrets into a K8s Secret (etcd). For Phase B
  # (zero secrets in etcd), remove this block and use CSI volume mounts only.
  # Optionally sync fetched secrets into a Kubernetes Secret object
  # so they can be used as environment variables (envFrom / env.valueFrom).
  secretObjects:
    - secretName: cho-app-secrets
      type: Opaque
      data:
        - objectName: CosmosDb--ConnectionString
          key: CosmosDb__ConnectionString
        - objectName: Stripe--SecretKey
          key: Stripe__SecretKey
