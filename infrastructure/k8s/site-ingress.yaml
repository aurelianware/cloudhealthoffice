---
# Marketing site ingress – serves cloudhealthoffice.com and www from the static site container
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: site-ingress
  namespace: cloudhealthoffice
  labels:
    app: site
    component: marketing
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - cloudhealthoffice.com
    - www.cloudhealthoffice.com
    secretName: site-tls-secret
  rules:
  - host: cloudhealthoffice.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: site
            port:
              number: 80
  - host: www.cloudhealthoffice.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: site
            port:
              number: 80
