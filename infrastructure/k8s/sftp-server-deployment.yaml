---
# SFTP Server Deployment for EDI File Exchange
# Used for clearinghouse integration testing and development
apiVersion: v1
kind: Namespace
metadata:
  name: cho-sftp
  labels:
    app: cloudhealthoffice
    component: sftp
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sftp-data-pvc
  namespace: cho-sftp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: managed-csi # Azure managed disk (was: do-block-storage)
---
apiVersion: v1
kind: Secret
metadata:
  name: sftp-users
  namespace: cho-sftp
type: Opaque
stringData:
  # Format: username:password:uid:gid:directory
  # Password should be changed for production!
  users.conf: |
    cho-edi:changeme123:1000:1000:upload
    clearinghouse:changeme456:1001:1001:edi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sftp-config
  namespace: cho-sftp
data:
  sshd_config: |
    # SFTP-only configuration
    Port 22
    Protocol 2
    HostKey /etc/ssh/ssh_host_rsa_key
    HostKey /etc/ssh/ssh_host_ed25519_key
    
    # Authentication
    PasswordAuthentication yes
    PubkeyAuthentication yes
    PermitRootLogin no
    
    # SFTP subsystem
    Subsystem sftp internal-sftp
    
    # Security
    X11Forwarding no
    AllowTcpForwarding no
    PermitTunnel no
    
    # Logging
    SyslogFacility AUTH
    LogLevel INFO
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sftp-server
  namespace: cho-sftp
  labels:
    app: sftp-server
    component: edi-integration
spec:
  replicas: 1
  strategy:
    type: Recreate # Important for PVC
  selector:
    matchLabels:
      app: sftp-server
  template:
    metadata:
      labels:
        app: sftp-server
        component: edi-integration
    spec:
      containers:
      - name: sftp
        image: atmoz/sftp:latest
        ports:
        - containerPort: 22
          name: ssh
          protocol: TCP
        env:
        - name: SFTP_USERS
          valueFrom:
            secretKeyRef:
              name: sftp-users
              key: users.conf
        volumeMounts:
        - name: sftp-data
          mountPath: /home
        - name: ssh-host-keys
          mountPath: /etc/ssh/ssh_host_rsa_key
          subPath: ssh_host_rsa_key
          readOnly: true
        - name: ssh-host-keys
          mountPath: /etc/ssh/ssh_host_ed25519_key
          subPath: ssh_host_ed25519_key
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          tcpSocket:
            port: 22
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          tcpSocket:
            port: 22
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          capabilities:
            add:
            - SYS_CHROOT
      volumes:
      - name: sftp-data
        persistentVolumeClaim:
          claimName: sftp-data-pvc
      - name: ssh-host-keys
        secret:
          secretName: ssh-host-keys
          defaultMode: 0600
---
apiVersion: v1
kind: Service
metadata:
  name: sftp-service
  namespace: cho-sftp
  labels:
    app: sftp-server
  # Uncomment to place LoadBalancer IP in custom resource group (requires permissions)
  # annotations:
  #   service.beta.kubernetes.io/azure-load-balancer-resource-group: "rg-hipaa-logic-apps"
spec:
  type: LoadBalancer # Change to NodePort or ClusterIP if you don't need external access
  # Uncomment and configure IP whitelisting for production
  # See docs/SFTP-DNS-SETUP.md for instructions on getting IP addresses
  # loadBalancerSourceRanges:
  #   # Allowed client source IPs to the public SFTP endpoint
  #   - 13.88.3.11/32
  #   - 13.88.3.12/32
  #   # Clearinghouse IPs (Availity example)
  #   - 50.207.21.0/24
  #   - 50.207.22.0/24
  #   # Change Healthcare example
  #   - 52.20.0.0/16
  #   # Admin access (remove for production)
  #   # - YOUR_IP/32
  ports:
  - port: 22
    targetPort: 22
    protocol: TCP
    name: ssh
  selector:
    app: sftp-server
---
# Generate SSH host keys (run once before deployment)
# This is a Job to generate persistent SSH host keys
apiVersion: batch/v1
kind: Job
metadata:
  name: generate-ssh-keys
  namespace: cho-sftp
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: keygen
        image: alpine:latest
        command:
        - /bin/sh
        - -c
        - |
          # Install deps including kubectl via curl
          apk add --no-cache openssh-keygen curl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

          # Clean old keys if any
          rm -f /keys/ssh_host_*

          # Generate new keys
          ssh-keygen -t rsa -b 4096 -f /keys/ssh_host_rsa_key -N ""
          ssh-keygen -t ed25519 -f /keys/ssh_host_ed25519_key -N ""
          
          # Create secret with the keys
          kubectl create secret generic ssh-host-keys \
            --from-file=ssh_host_rsa_key=/keys/ssh_host_rsa_key \
            --from-file=ssh_host_ed25519_key=/keys/ssh_host_ed25519_key \
            --namespace=cho-sftp \
            --dry-run=client -o yaml | kubectl apply -f -
        volumeMounts:
        - name: temp-keys
          mountPath: /keys
      volumes:
      - name: temp-keys
        emptyDir: {}
      serviceAccountName: sftp-key-generator
---
# ServiceAccount for the key generation job
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sftp-key-generator
  namespace: cho-sftp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-creator
  namespace: cho-sftp
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sftp-key-generator-binding
  namespace: cho-sftp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-creator
subjects:
- kind: ServiceAccount
  name: sftp-key-generator
  namespace: cho-sftp
