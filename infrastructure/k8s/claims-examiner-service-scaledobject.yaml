---
# KEDA ScaledObject for claims-examiner-service.
#
# Scales the examiner deployment from 0 to N based on consumer-group lag on
# claims.pended.v1. The pod is a pure background Kafka consumer with no
# synchronous callers, so scale-to-zero has no cold-start UX cost — the worst
# case is one event waits ~pod-startup seconds before being processed.
#
# IMPORTANT: scale-to-zero only saves money if the pod is scheduled onto a
# nodepool that can also scale to zero (mode: User, min-count: 0). On the
# system pool (min=2) the pod terminates but the node stays up. Add a user
# spot pool first and put a nodeSelector + spot toleration on the deployment,
# then this scaler does what you want.
#
# AUTH: the trigger uses TriggerAuthentication against the existing
# kafka-secret. The secret must contain keys: bootstrapServers, sasl,
# username, password, tls. If the cluster is running PLAINTEXT (no SASL),
# delete the TriggerAuthentication block, the authenticationRef on the
# trigger, and add `bootstrapServers: <list>` directly under metadata.
apiVersion: v1
kind: Secret
metadata:
  name: keda-kafka-auth
  namespace: cloudhealthoffice
  labels:
    app: claims-examiner-service
type: Opaque
stringData:
  # SASL mechanism. Match the producer in claims-service (scram_sha512).
  # Other valid values: plaintext, scram_sha256, gssapi, oauthbearer.
  sasl: "scram_sha512"
  # TLS toggle. "enable" turns on TLS to the broker (matches SaslSsl in
  # the claims-service producer). Set to "disable" for plaintext clusters.
  tls: "enable"
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-kafka-auth
  namespace: cloudhealthoffice
spec:
  secretTargetRef:
    - parameter: sasl
      name: keda-kafka-auth
      key: sasl
    - parameter: tls
      name: keda-kafka-auth
      key: tls
    - parameter: bootstrapServers
      name: kafka-secret
      key: bootstrapServers
    - parameter: username
      name: kafka-secret
      key: saslUsername
    - parameter: password
      name: kafka-secret
      key: saslPassword
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: claims-examiner-service
  namespace: cloudhealthoffice
  labels:
    app: claims-examiner-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: claims-examiner-service
  # Scale to zero when the consumer group has caught up. The cooldown period
  # gates how quickly we tear down after lag drops to zero — 5 minutes is a
  # reasonable balance between thrash and savings.
  minReplicaCount: 0
  maxReplicaCount: 5
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: kafka
      metadata:
        consumerGroup: claims-examiner-service
        topic: claims.pended.v1
        # Scale up when any partition has at least this much lag. Tune based
        # on observed throughput; 10 is conservative for a low-volume topic.
        lagThreshold: "10"
        offsetResetPolicy: latest
      authenticationRef:
        name: keda-kafka-auth
