apiVersion: v1
kind: ConfigMap
metadata:
  name: member-service-config
  namespace: cloudhealthoffice
data:
  ASPNETCORE_ENVIRONMENT: "Production"
---
apiVersion: v1
kind: Secret
metadata:
  name: member-service-secrets
  namespace: cloudhealthoffice
type: Opaque
stringData:
  MongoDb__ConnectionString: "mongodb://admin:securepassword123@mongodb:27017"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-service
  namespace: cloudhealthoffice
  labels:
    app: member-service
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: member-service
  template:
    metadata:
      labels:
        app: member-service
        version: v1
    spec:
      containers:
      - name: member-service
        image: ghcr.io/aurelianware/cloudhealthoffice-member-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: MongoDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: member-service-secrets
              key: MongoDb__ConnectionString
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: member-service-config
              key: ASPNETCORE_ENVIRONMENT
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: member-service
  namespace: cloudhealthoffice
  labels:
    app: member-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: member-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: member-service-hpa
  namespace: cloudhealthoffice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: member-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
