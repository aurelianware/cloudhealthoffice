---
apiVersion: v1
kind: Namespace
metadata:
  name: cloudhealthoffice
  labels:
    name: cloudhealthoffice
    app: cloudhealthoffice
    component: backend-services
---
# Resource Quotas to prevent runaway costs
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-resources
  namespace: cloudhealthoffice
spec:
  hard:
    requests.cpu: "12"
    requests.memory: 24Gi
    limits.cpu: "40"
    limits.memory: 64Gi
    pods: "80"
---
# Network Policies (optional - for production security)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-portal
  namespace: cloudhealthoffice
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: cho-portal
        - namespaceSelector:
            matchLabels:
              name: cho-workflows
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 3002
        - protocol: TCP
          port: 3003
        - protocol: TCP
          port: 3004
        - protocol: TCP
          port: 3005
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8089
