---
# Ingress for API Documentation (Swagger UI + OpenAPI specs)
# Serves api.cloudhealthoffice.com and sandbox.cloudhealthoffice.com
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-docs-ingress
  namespace: cloudhealthoffice
  labels:
    app: api-docs
    component: documentation
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-preload: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.cloudhealthoffice.com
    - sandbox.cloudhealthoffice.com
    secretName: api-docs-tls-secret
  rules:
  - host: api.cloudhealthoffice.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-docs
            port:
              number: 80
  - host: sandbox.cloudhealthoffice.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-docs
            port:
              number: 80
