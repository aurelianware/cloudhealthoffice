---
# KEDA HTTP ScaledObject for api-docs
# Scales to zero after 5 minutes of no HTTP traffic.
# Requires: KEDA HTTP add-on installed on the cluster.
# Install: helm install http-add-on kedacore/keda-add-ons-http --namespace keda
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: api-docs
  namespace: cloudhealthoffice
  labels:
    app: api-docs
    component: documentation
spec:
  hosts:
  - api.cloudhealthoffice.com
  - sandbox.cloudhealthoffice.com
  pathPrefixes:
  - /
  scaleTargetRef:
    name: api-docs
    kind: Deployment
    apiVersion: apps/v1
    service: api-docs
    port: 80
  replicas:
    min: 0
    max: 3
  scalingMetric:
    requestRate:
      targetValue: 100
      granularity: 1s
      window: 1m
  scaledownPeriod: 300
