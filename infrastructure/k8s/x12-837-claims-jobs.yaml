        spec:
          restartPolicy: OnFailure
          volumes:
            - name: work-volume
              emptyDir: {}
          containers:
          - name: upload-837i
            image: alpine:latest
            env:
              - name: SFTP_HOST
                value: "sftp-service.cho-sftp.svc.cluster.local"
              - name: SFTP_USER
                value: "cho-edi"
              - name: SFTP_PASS
                valueFrom:
                  secretKeyRef:
                    name: sftp-credentials
                    key: password
              - name: BACKEND_API_URL
                value: "http://backend-api.cloudhealthoffice.svc.cluster.local/api/v1"
            command: ["/bin/sh", "-c", "echo 'X12 837I Institutional Claims - Similar to 837P but for facilities'; exit 0"]
            volumeMounts:
              - name: work-volume
                mountPath: /work
