apiVersion: v1
kind: Secret
metadata:
  name: database-secret
  namespace: cloudhealthoffice
  labels:
    app.kubernetes.io/name: database-secret
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: cloudhealthoffice
    hipaa.compliance: "required"
  annotations:
    description: "Consolidated database credentials — supports MongoDB or CosmosDB"
    security.policy: "rotate-90-days"
type: Opaque
stringData:
  # Connection string: set to either a MongoDB URI or CosmosDB connection string
  connectionString: "REPLACE_WITH_CONNECTION_STRING"
  # CosmosDB endpoint + key: only required when using CosmosDB native SDK
  endpoint: ""
  key: ""
