apiVersion: v1
kind: Secret
metadata:
  name: database-secret
  namespace: cloudhealthoffice
  labels:
    app.kubernetes.io/name: database-secret
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: cloudhealthoffice
    hipaa.compliance: "required"
  annotations:
    description: "Consolidated database credentials — MongoDB / Azure DocumentDB connection string"
    security.policy: "rotate-90-days"
type: Opaque
stringData:
  # MongoDB URI (in Azure: the Azure DocumentDB connection string, which must
  # include retrywrites=false). Every Mongo-backed service requires it.
  connectionString: "REPLACE_WITH_CONNECTION_STRING"
