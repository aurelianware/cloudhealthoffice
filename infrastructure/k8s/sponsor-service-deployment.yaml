# Workload identity for sponsor-service: its user-assigned managed identity, federated to
# system:serviceaccount:cloudhealthoffice:sponsor-service-sa. token-service issues this service's
# CHO service tokens to that identity only (ServiceTokens:ServiceClients); the service holds
# no signing key. See docs/security/portal-token-service.md ("Service tokens").
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sponsor-service-sa
  namespace: cloudhealthoffice
  annotations:
    azure.workload.identity/client-id: "<SPONSOR_SERVICE_MANAGED_IDENTITY_CLIENT_ID>"
---
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sponsor-service-config
  namespace: cloudhealthoffice
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  MongoDb__DatabaseName: "CloudHealthOffice"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sponsor-service
  namespace: cloudhealthoffice
  labels:
    app: sponsor-service
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sponsor-service
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
        app: sponsor-service
        version: v1
    spec:
      serviceAccountName: sponsor-service-sa
      containers:
      - name: sponsor-service
        image: ghcr.io/aurelianware/cloudhealthoffice-sponsor-service:latest
        imagePullPolicy: Always
        envFrom:
        # Source=TokenService, token-service URL and Entra scope (shared by all services).
        - configMapRef:
            name: cho-service-tokens
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ChoAuth__ServiceToken__ClientId
          value: "sponsor-service"
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: sponsor-service-config
              key: ASPNETCORE_ENVIRONMENT
        - name: MongoDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: connectionString
        - name: MongoDb__DatabaseName
          valueFrom:
            configMapKeyRef:
              name: sponsor-service-config
              key: MongoDb__DatabaseName
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sponsor-service
  namespace: cloudhealthoffice
  labels:
    app: sponsor-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: sponsor-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sponsor-service-hpa
  namespace: cloudhealthoffice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sponsor-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
