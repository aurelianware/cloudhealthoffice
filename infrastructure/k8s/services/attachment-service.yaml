---
apiVersion: v1
kind: ConfigMap
metadata:
  name: attachment-service-config
  namespace: cloudhealthoffice
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  # Attachment files live in the document catalog (document-service);
  # this service holds no storage credentials.
  Services__DocumentService: "http://document-service.cloudhealthoffice"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attachment-service
  namespace: cloudhealthoffice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attachment-service
  template:
    metadata:
      labels:
        app: attachment-service
    spec:
      containers:
      - name: attachment-service
        image: ghcr.io/aurelianware/cloudhealthoffice-attachment-service:latest
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: attachment-service-config
              key: ASPNETCORE_ENVIRONMENT
        - name: MongoDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: connectionString
        - name: Services__DocumentService
          valueFrom:
            configMapKeyRef:
              name: attachment-service-config
              key: Services__DocumentService
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: attachment-service
  namespace: cloudhealthoffice
spec:
  selector:
    app: attachment-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
