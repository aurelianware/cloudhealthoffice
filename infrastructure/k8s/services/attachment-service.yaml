apiVersion: v1
kind: ConfigMap
metadata:
  name: attachment-service-config
  namespace: cloudhealthoffice
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  BlobStorage__ContainerName: "attachments"
---
apiVersion: v1
kind: Secret
metadata:
  name: attachment-service-secret
  namespace: cloudhealthoffice
type: Opaque
stringData:
  MongoDb__ConnectionString: "mongodb://admin:securepassword123@mongodb:27017"
  BlobStorage__ConnectionString: "UseDevelopmentStorage=true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attachment-service
  namespace: cloudhealthoffice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attachment-service
  template:
    metadata:
      labels:
        app: attachment-service
    spec:
      containers:
      - name: attachment-service
        image: ghcr.io/aurelianware/cloudhealthoffice-attachment-service:latest
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: attachment-service-config
              key: ASPNETCORE_ENVIRONMENT
        - name: MongoDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: attachment-service-secret
              key: MongoDb__ConnectionString
        - name: BlobStorage__ContainerName
          valueFrom:
            configMapKeyRef:
              name: attachment-service-config
              key: BlobStorage__ContainerName
        - name: BlobStorage__ConnectionString
          valueFrom:
            secretKeyRef:
              name: attachment-service-secret
              key: BlobStorage__ConnectionString
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: attachment-service
  namespace: cloudhealthoffice
spec:
  selector:
    app: attachment-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
