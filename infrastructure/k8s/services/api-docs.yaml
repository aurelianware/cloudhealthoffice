---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-docs
  namespace: cloudhealthoffice
  labels:
    app: api-docs
    component: documentation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-docs
  template:
    metadata:
      labels:
        app: api-docs
    spec:
      containers:
      - name: api-docs
        image: ghcr.io/aurelianware/cloudhealthoffice-api-docs:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-docs
  namespace: cloudhealthoffice
spec:
  selector:
    app: api-docs
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
