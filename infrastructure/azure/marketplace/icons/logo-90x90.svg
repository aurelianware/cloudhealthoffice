<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90">
  <defs>
    <linearGradient id="circuitGlow90" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow90" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="90" height="90" fill="#000000"/>
  <!-- Shield/Monolith Shape -->
  <path d="M45 8 L75 22 L75 52 C75 68 60 82 45 82 C30 82 15 68 15 52 L15 22 Z" 
        fill="none" 
        stroke="url(#circuitGlow90)" 
        stroke-width="2.5"
        filter="url(#glow90)"/>
  <!-- All-Seeing Eye -->
  <ellipse cx="45" cy="40" rx="15" ry="11" fill="none" stroke="#00ffff" stroke-width="2"/>
  <circle cx="45" cy="40" r="5.5" fill="#00ff88"/>
  <circle cx="45" cy="40" r="2" fill="#000000"/>
  <!-- Circuit Lines -->
  <line x1="20" y1="32" x2="30" y2="32" stroke="#00ffff" stroke-width="1.5" opacity="0.7"/>
  <line x1="60" y1="32" x2="70" y2="32" stroke="#00ffff" stroke-width="1.5" opacity="0.7"/>
  <line x1="45" y1="58" x2="45" y2="70" stroke="#00ffff" stroke-width="1.5" opacity="0.7"/>
  <!-- Connection Nodes -->
  <circle cx="20" cy="32" r="2" fill="#00ff88"/>
  <circle cx="70" cy="32" r="2" fill="#00ff88"/>
  <circle cx="45" cy="70" r="2" fill="#00ff88"/>
</svg>
