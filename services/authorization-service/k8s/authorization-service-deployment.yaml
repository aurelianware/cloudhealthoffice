apiVersion: v1
kind: ConfigMap
metadata:
  name: authorization-service-config
  namespace: cho-svcs
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  CosmosDb__DatabaseName: "CloudHealthOffice"
  CosmosDb__ContainerName: "Authorizations"
---
# Secret is created separately via kubectl with actual Cosmos DB credentials
# kubectl create secret generic authorization-service-secret \
#   --from-literal=CosmosDb__Endpoint='...' \
#   --from-literal=CosmosDb__Key='...'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authorization-service
  namespace: cho-svcs
  labels:
    app: authorization-service
    tier: backend
    component: prior-authorization
spec:
  replicas: 2
  selector:
    matchLabels:
      app: authorization-service
  template:
    metadata:
      labels:
        app: authorization-service
        tier: backend
        component: prior-authorization
    spec:
      containers:
      - name: authorization-service
        image: ghcr.io/aurelianware/cloudhealthoffice-authorization-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: authorization-service-config
              key: ASPNETCORE_ENVIRONMENT
        - name: CosmosDb__DatabaseName
          valueFrom:
            configMapKeyRef:
              name: authorization-service-config
              key: CosmosDb__DatabaseName
        - name: CosmosDb__ContainerName
          valueFrom:
            configMapKeyRef:
              name: authorization-service-config
              key: CosmosDb__ContainerName
        - name: CosmosDb__Endpoint
          valueFrom:
            secretKeyRef:
              name: authorization-service-secret
              key: CosmosDb__Endpoint
        - name: CosmosDb__Key
          valueFrom:
            secretKeyRef:
              name: authorization-service-secret
              key: CosmosDb__Key
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: authorization-service
  namespace: cho-svcs
  labels:
    app: authorization-service
spec:
  type: ClusterIP
  selector:
    app: authorization-service
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: authorization-service-hpa
  namespace: cho-svcs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: authorization-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
