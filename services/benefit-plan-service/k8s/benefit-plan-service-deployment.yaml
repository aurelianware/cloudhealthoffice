---
apiVersion: v1
kind: ConfigMap
metadata:
  name: benefit-plan-service-config
  namespace: cloudhealthoffice
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
---
apiVersion: v1
kind: Secret
metadata:
  name: benefit-plan-service-secret
  namespace: cloudhealthoffice
type: Opaque
stringData:
  COSMOS_ENDPOINT: "https://your-cosmos-account.documents.azure.com:443/"
  COSMOS_KEY: "your-cosmos-key-here"
  MONGODB_CONNECTIONSTRING: "mongodb://mongodb-service:27017"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benefit-plan-service
  namespace: cloudhealthoffice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: benefit-plan-service
  template:
    metadata:
      labels:
        app: benefit-plan-service
    spec:
      containers:
      - name: benefit-plan-service
        image: ghcr.io/aurelianware/cloudhealthoffice-benefit-plan-service:latest
        ports:
        - containerPort: 8080
        env:
          - name: CosmosDb__Endpoint
            valueFrom:
              secretKeyRef:
                name: benefit-plan-service-secret
                key: COSMOS_ENDPOINT
          - name: CosmosDb__Key
            valueFrom:
              secretKeyRef:
                name: benefit-plan-service-secret
                key: COSMOS_KEY
          - name: MongoDb__ConnectionString
            valueFrom:
              secretKeyRef:
                name: benefit-plan-service-secret
                key: MONGODB_CONNECTIONSTRING
          - name: MongoDb__DatabaseName
            value: "CloudHealthOffice"
        envFrom:
        - configMapRef:
            name: benefit-plan-service-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: benefit-plan-service
  namespace: cloudhealthoffice
spec:
  selector:
    app: benefit-plan-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: benefit-plan-service-hpa
  namespace: cloudhealthoffice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: benefit-plan-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
