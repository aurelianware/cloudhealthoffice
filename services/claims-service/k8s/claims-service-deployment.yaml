apiVersion: v1
kind: ConfigMap
metadata:
  name: claims-service-config
  namespace: cloudhealthoffice
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  CosmosDb__DatabaseName: "CloudHealthOffice"
  CosmosDb__ContainerName: "Claims"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-service
  namespace: cloudhealthoffice
  labels:
    app: claims-service
    tier: backend
    component: claims-processing
spec:
  replicas: 3
  selector:
    matchLabels:
      app: claims-service
  template:
    metadata:
      labels:
        app: claims-service
        tier: backend
        component: claims-processing
    spec:
      containers:
      - name: claims-service
        image: ghcr.io/aurelianware/cloudhealthoffice-claims-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: claims-service-config
              key: ASPNETCORE_ENVIRONMENT
        - name: CosmosDb__DatabaseName
          valueFrom:
            configMapKeyRef:
              name: claims-service-config
              key: CosmosDb__DatabaseName
        - name: CosmosDb__ContainerName
          valueFrom:
            configMapKeyRef:
              name: claims-service-config
              key: CosmosDb__ContainerName
        - name: CosmosDb__Endpoint
          valueFrom:
            secretKeyRef:
              name: cosmos-db-secret
              key: endpoint
        - name: CosmosDb__Key
          valueFrom:
            secretKeyRef:
              name: cosmos-db-secret
              key: key
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: claims-service
  namespace: cloudhealthoffice
  labels:
    app: claims-service
spec:
  type: ClusterIP
  selector:
    app: claims-service
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: claims-service-hpa
  namespace: cloudhealthoffice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: claims-service
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
