apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-service
  namespace: cho-svcs
  labels:
    app: tenant-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tenant-service
  template:
    metadata:
      labels:
        app: tenant-service
        version: v1
    spec:
      containers:
      - name: tenant-service
        image: ghcr.io/aurelianware/cloudhealthoffice-tenant-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: CosmosDb__Endpoint
          valueFrom:
            secretKeyRef:
              name: cosmos-db-secret
              key: endpoint
        - name: CosmosDb__Key
          valueFrom:
            secretKeyRef:
              name: cosmos-db-secret
              key: key
        - name: CosmosDb__DatabaseName
          value: "CloudHealthOffice"
        - name: CosmosDb__TenantContainerName
          value: "Tenants"
        - name: Stripe__SecretKey
          valueFrom:
            secretKeyRef:
              name: stripe-secret
              key: secret-key
              optional: true
        - name: Stripe__WebhookSecret
          valueFrom:
            secretKeyRef:
              name: stripe-secret
              key: webhook-secret
              optional: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-service
  namespace: cho-svcs
  labels:
    app: tenant-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: tenant-service
