# Clearinghouse SFTP Secret Template
# 
# IMPORTANT: Do not commit actual credentials. This is a template.
# Create the actual secret using kubectl or external secrets operator.
#
# kubectl create secret generic clearinghouse-sftp-secret \
#   --from-literal=username=your-username \
#   --from-literal=password=your-password \
#   --from-file=ssh-key=/path/to/private/key \
#   -n cloudhealthoffice

apiVersion: v1
kind: Secret
metadata:
  name: clearinghouse-sftp-secret
  namespace: cloudhealthoffice
  labels:
    app.kubernetes.io/name: clearinghouse-sftp-secret
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: cloudhealthoffice
    hipaa.compliance: "required"
  annotations:
    description: "SFTP credentials for Clearinghouse trading partner connection"
    security.policy: "rotate-90-days"
type: Opaque
stringData:
  # PLACEHOLDER VALUES - REPLACE IN PRODUCTION
  username: "REPLACE_WITH_SFTP_USERNAME"
  password: "REPLACE_WITH_SFTP_PASSWORD"
  # Optional SSH key (base64 encoded)
  # ssh-key: |
  #   -----BEGIN OPENSSH PRIVATE KEY-----
  #   ...
  #   -----END OPENSSH PRIVATE KEY-----
