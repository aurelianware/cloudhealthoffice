---
# ConfigMap with Vault configuration (non-sensitive)
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: cho-svcs
data:
  vault-address: "https://vault.vault.svc.cluster.local:8200"
  vault-role: "cho-microservices"
  vault-auth-method: "kubernetes"
  vault-mount-path: "secret/data/cloudhealthoffice"
