# Kubernetes ServiceAccount for Cloud Health Office microservices to authenticate with Vault
# This allows microservices to use Kubernetes auth method to retrieve secrets

apiVersion: v1
kind: ServiceAccount
metadata:
  name: cho-service-account
  namespace: cho-svcs
  labels:
    app: cloudhealthoffice
    component: microservices
  annotations:
    description: "Service account for Cloud Health Office microservices to access HashiCorp Vault"

---
# ClusterRoleBinding for token review (required for Vault Kubernetes auth)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cho-tokenreview-binding
  labels:
    app: cloudhealthoffice
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: cho-service-account
  namespace: cho-svcs

---
# ServiceAccount for individual services (example: member-service)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: member-service-sa
  namespace: cho-svcs
  labels:
    app: cloudhealthoffice
    service: member-service
  annotations:
    description: "Service account for member-service with least-privilege Vault access"

