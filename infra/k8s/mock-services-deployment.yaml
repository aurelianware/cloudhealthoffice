---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-microservices
  namespace: cloudhealthoffice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-microservices
  template:
    metadata:
      labels:
        app: mock-microservices
    spec:
      containers:
      - name: mock-server
        image: hashicorp/http-echo:latest
        ports:
        - containerPort: 8080
        args:
        - "-text={\"status\":\"ok\",\"message\":\"Mock service running\"}"
        - "-listen=:8080"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
---
# Services for each microservice
apiVersion: v1
kind: Service
metadata:
  name: coverage-service
  namespace: cloudhealthoffice
spec:
  selector:
    app: mock-microservices
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: provider-service
  namespace: cloudhealthoffice
spec:
  selector:
    app: mock-microservices
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: claims-service
  namespace: cloudhealthoffice
spec:
  selector:
    app: mock-microservices
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: authorization-service
  namespace: cloudhealthoffice
spec:
  selector:
    app: mock-microservices
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: benefit-plan-service
  namespace: cloudhealthoffice
spec:
  selector:
    app: mock-microservices
  ports:
  - port: 80
    targetPort: 8080
