<svg xmlns="http://www.w3.org/2000/svg" width="255" height="115" viewBox="0 0 255 115">
  <defs>
    <linearGradient id="circuitGlowWide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1"/>
    </linearGradient>
    <filter id="glowWide" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="255" height="115" fill="#000000"/>
  <!-- Circuit Lines Background -->
  <g opacity="0.1">
    <line x1="0" y1="57" x2="255" y2="57" stroke="#00ffff" stroke-width="0.5"/>
    <line x1="50" y1="0" x2="50" y2="115" stroke="#00ffff" stroke-width="0.5"/>
  </g>
  <!-- Shield Icon (Left Side) -->
  <g transform="translate(10, 10)">
    <path d="M40 5 L70 17 L70 47 C70 63 55 77 40 77 C25 77 10 63 10 47 L10 17 Z" 
          fill="none" 
          stroke="url(#circuitGlowWide)" 
          stroke-width="2"
          filter="url(#glowWide)"/>
    <!-- Eye -->
    <ellipse cx="40" cy="38" rx="12" ry="8" fill="none" stroke="#00ffff" stroke-width="1.5"/>
    <circle cx="40" cy="38" r="4" fill="#00ff88"/>
    <circle cx="40" cy="38" r="1.5" fill="#000000"/>
  </g>
  <!-- Text: Cloud Health Office -->
  <text x="95" y="45" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="18" fill="#00ffff">
    CLOUD HEALTH OFFICE
  </text>
  <!-- Tagline -->
  <text x="95" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#b0b0b0">
    Azure-Native HIPAA EDI Platform
  </text>
  <!-- Circuit Line Accent -->
  <line x1="95" y1="78" x2="235" y2="78" stroke="#00ffff" stroke-width="1" opacity="0.5"/>
  <circle cx="95" cy="78" r="2" fill="#00ff88"/>
  <circle cx="235" cy="78" r="2" fill="#00ff88"/>
  <!-- Version/Badge -->
  <rect x="95" y="85" width="50" height="18" rx="3" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.7"/>
  <text x="120" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#00ff88" text-anchor="middle">
    CMS-0057-F
  </text>
</svg>
