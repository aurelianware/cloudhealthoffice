# Kafka Topics Configuration for Cloud Health Office EDI Processing
#
# This file defines all Kafka topics required for the X12 EDI processing pipeline.
# Deploy using Strimzi Kafka Operator or apply manually.
#
# Topics:
#   - edi-raw-files: Raw EDI file events
#   - attachments-in: Processed 275 attachments
#   - edi-278: Processed 278 authorizations
#   - rfai-requests: 277 generation requests
#   - edi-277-outbound: Generated 277 responses
#   - edi-278-replay-requests: 278 replay requests
#   - edi-278-replays: Completed replay audit log
#   - dead-letter-queue: Failed messages

apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: edi-raw-files
  namespace: kafka
  labels:
    app.kubernetes.io/name: edi-raw-files
    app.kubernetes.io/component: kafka-topic
    app.kubernetes.io/part-of: cloudhealthoffice
    strimzi.io/cluster: cloudhealthoffice-kafka
spec:
  topicName: edi-raw-files
  partitions: 3
  replicas: 3
  config:
    retention.ms: "604800000"  # 7 days
    cleanup.policy: "delete"
    compression.type: "lz4"
    min.insync.replicas: "2"
    segment.bytes: "1073741824"  # 1 GB

