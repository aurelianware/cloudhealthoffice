# Bitnami Kafka Helm Chart Values for Cloud Health Office
#
# This configuration provides a production-ready Kafka cluster with:
# - SASL/SCRAM authentication
# - TLS encryption in transit
# - Persistent storage
# - Resource limits for Kubernetes
#
# Deploy: helm install cloudhealthoffice-kafka bitnami/kafka -f values.yaml -n kafka

# Kafka cluster configuration
replicaCount: 3

# Image configuration
image:
  registry: docker.io
  repository: bitnami/kafka
  tag: 3.6.0-debian-11-r0
  pullPolicy: IfNotPresent

# Kraft mode (KRaft replaces ZooKeeper in Kafka 3.x)
kraft:
  enabled: true
  clusterId: "cloudhealthoffice-kafka-cluster"

# ZooKeeper (disabled when using KRaft)
zookeeper:
  enabled: false

# Listeners configuration
listeners:
  client:
    protocol: SASL_PLAINTEXT
    sslClientAuth: "none"
  controller:
    protocol: SASL_PLAINTEXT
    sslClientAuth: "none"
  interbroker:
    protocol: SASL_PLAINTEXT
    sslClientAuth: "none"
  external:
    protocol: SASL_SSL

# SASL/SCRAM authentication
auth:
  clientProtocol: sasl_ssl
  interBrokerProtocol: sasl_plaintext
  sasl:
    mechanism: SCRAM-SHA-512
    interbrokerMechanism: SCRAM-SHA-512
    jaas:
      clientUsers:
        - cloudhealthoffice
        - argo-workflows
        - monitoring
      clientPasswords: []  # Auto-generated if empty, or use existingSecret
    existingSecret: "kafka-sasl-credentials"
  tls:
    enabled: true
    autoGenerated: true
    existingSecret: ""
    password: ""
    endpointIdentificationAlgorithm: ""

# Broker configuration
broker:
  replicaCount: 3
  persistence:
    enabled: true
    storageClass: ""
    size: 50Gi
    mountPath: /bitnami/kafka
  logPersistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      memory: "2Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: kafka
            topologyKey: kubernetes.io/hostname
  nodeSelector: {}
  tolerations: []

# Controller configuration (KRaft mode)
controller:
  replicaCount: 3
  persistence:
    enabled: true
    storageClass: ""
    size: 10Gi
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# Kafka configuration overrides
extraConfig: |
  auto.create.topics.enable=false
  default.replication.factor=3
  min.insync.replicas=2
  num.partitions=3
  offsets.topic.replication.factor=3
  transaction.state.log.replication.factor=3
  transaction.state.log.min.isr=2
  log.retention.hours=168
  log.retention.bytes=10737418240
  log.segment.bytes=1073741824
  log.cleanup.policy=delete
  compression.type=lz4
  message.max.bytes=10485760
  replica.fetch.max.bytes=10485760
  fetch.max.bytes=52428800
  max.partition.fetch.bytes=10485760

# JVM options
heapOpts: "-Xmx2048m -Xms2048m"

# Metrics (Prometheus)
metrics:
  kafka:
    enabled: true
    image:
      registry: docker.io
      repository: bitnami/kafka-exporter
      tag: 1.7.0-debian-11-r0
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
  jmx:
    enabled: true
    kafkaJmxPort: 9999
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "200m"
  serviceMonitor:
    enabled: true
    namespace: monitoring
    labels:
      release: prometheus

# Service configuration
service:
  type: ClusterIP
  ports:
    client: 9092
    controller: 9093
    interbroker: 9094
    external: 9095
  annotations: {}

# External access (LoadBalancer for production)
externalAccess:
  enabled: false
  service:
    type: LoadBalancer
    port: 9095
    loadBalancerIPs: []
    loadBalancerAnnotations: {}

# Pod security context
podSecurityContext:
  fsGroup: 1001

# Container security context
containerSecurityContext:
  runAsUser: 1001
  runAsNonRoot: true

# Network policies
networkPolicy:
  enabled: true
  allowExternal: false
  allowExternalEgress: false
  egressRules:
    customRules: []

# Pod disruption budget
pdb:
  create: true
  minAvailable: 2

# Service Account
serviceAccount:
  create: true
  name: kafka-sa
  automountServiceAccountToken: false
  annotations: {}

# Volume permissions init container
volumePermissions:
  enabled: false

# Log4j configuration
log4j: |
  log4j.rootLogger=INFO, stdout
  log4j.appender.stdout=org.apache.log4j.ConsoleAppender
  log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
  log4j.appender.stdout.layout.ConversionPattern=[%d] %p %m (%c)%n
  log4j.logger.kafka=INFO
  log4j.logger.org.apache.kafka=INFO
