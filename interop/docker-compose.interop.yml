# Cloud Health Office — Da Vinci external interoperability stack
#
# Separate from the repository's development stack (docker-compose.yml) on
# purpose: these are third-party reference implementations, they are pinned by
# digest, and no ordinary development or unit-test workflow should start them.
#
# Nothing starts without an explicit profile:
#
#   docker compose -f interop/docker-compose.interop.yml --profile interop-br up -d
#   docker compose -f interop/docker-compose.interop.yml --profile interop-cho up -d
#
# Profiles:
#   interop-br           HL7 br-payer                  (CRD/DTR/PAS payer RI)
#   interop-br-provider  HL7 br-provider               (provider-side RI)
#   interop-cho          CHO native stack + mongo      (CHO as the server under test)
#   interop-pdex         Inferno PDex test kit         (seam only — see docs/interop/davinci.md)
#   interop-dtr-inferno  Inferno DTR test kit          (seam only — see docs/interop/davinci.md)
#   interop-c4bb         Inferno CARIN BB test kit     (seam only — judges Provider Access EOBs)
#   interop-us-core      Inferno US Core test kit      (seam only — see docs/interop/davinci.md)
#
# Normally you do not run this file by hand — `scripts/interop/run.sh` and the
# harness (InteropEnvironment) bring up exactly the services a scenario needs.
#
# Security posture:
#   * No secrets, no repository credentials and no Docker socket are mounted.
#   * External containers sit on their own bridge network, isolated from the
#     development stack's network.
#   * Host ports are bound to 127.0.0.1 so nothing is published off-box.
#   * Every byte of data these services see is synthetic (SyntheticInteropData).
#
# Egress: br-payer and br-provider download Da Vinci IG packages from
# packages2.fhir.org at startup and do not boot without it. No VSAC or other
# licensed terminology credential is required for the scenarios in this file.

name: cho-interop

networks:
  interop:
    name: cho-interop
    driver: bridge

volumes:
  interop_mongo_data:

services:

  # ── HL7 Da Vinci Burden Reduction payer reference implementation ──────────
  # Pinned by digest (interop/versions.json → targets[br-payer]).
  # Upstream: https://github.com/HL7-DaVinci/br-payer (Apache-2.0)
  br-payer:
    image: hlseven/davinci-br-payer@sha256:6074aebc39929a00cf93c1efa28c227eb46aab2418afa208eb293133cb150d8c
    # IG registry retrieval can fail during boot. Retry error exits at most twice;
    # the harness still requires ApplicationReady within its original deadline.
    restart: on-failure:2
    profiles: [interop-br]
    networks: [interop]
    ports:
      - "127.0.0.1:${INTEROP_BR_PAYER_PORT:-18081}:8081"
    environment:
      # Advertise the address the harness reaches the server on, so the RI's
      # self-referential URLs (fullUrl, next-question-url) match reality.
      - HAPI_FHIR_SERVER_ADDRESS=http://localhost:${INTEROP_BR_PAYER_PORT:-18081}/fhir
    security_opt:
      - no-new-privileges:true

  # ── HL7 Da Vinci Burden Reduction provider reference implementation ───────
  # Upstream: https://github.com/HL7-DaVinci/br-provider (MIT)
  # Defined for the provider-side role; no scenario drives it yet.
  br-provider:
    image: hlseven/davinci-br-provider@sha256:6ddcea188bfc38cb8a2bf3e5bbda7f290970a659d2be3b85182d305565e9b74a
    profiles: [interop-br-provider]
    networks: [interop]
    ports:
      - "127.0.0.1:${INTEROP_BR_PROVIDER_PORT:-18080}:8080"
    security_opt:
      - no-new-privileges:true

  # ── Cloud Health Office under test ────────────────────────────────────────
  # Only needed by scenarios where CHO is the *server* (the Inferno suites).
  # Kept behind its own profile so the br-payer smoke path stays light.
  #
  # This profile serves CHO's real path, not the synthetic mock: fhir-service
  # binds Patient, Coverage, Encounter and Claim to ChoNative
  # (FhirAdapters:Sources, ADR 018/024), so every resource an Inferno suite
  # reads is projected by the service that owns it. A mock-backed profile would
  # certify the mock. The data is still synthetic — it is seeded into these
  # services' own stores, which is what DataClassification=synthetic records.
  #
  # Mode is Hybrid rather than Demo because that is what the bindings make true:
  # Demo is the honest label only while the mock serves these resources.
  interop-mongo:
    image: mongo:7
    profiles: [interop-cho]
    networks: [interop]
    volumes:
      - interop_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 24

  # ── CHO domain services behind the FHIR projection ────────────────────────
  # One mongod, one database per service, exactly as docker-compose.yml splits
  # them, so a service cannot read another's collections by accident.
  #
  # Each runs ASPNETCORE_ENVIRONMENT=Development, which loads its own
  # appsettings.Development.json: the development issuers (cho-portal-dev,
  # cho-internal-dev) and this service's own ChoAuth:ServiceToken. That is what
  # lets fhir-service authenticate its calls here. The keys are the public
  # development symmetric key, refused on any host that is not Development or
  # Testing (ChoAuthOptions.Validate), so this is a test configuration and not
  # an authentication bypass — the same posture section 10 of
  # docs/interop/davinci.md states for the FHIR server itself.
  cho-member-service:
    build:
      context: ..
      dockerfile: src/services/member-service/Dockerfile
      args:
        REGISTRY: ${CHO_IMAGE_REGISTRY:-mcr.microsoft.com}
    profiles: [interop-cho]
    networks: [interop]
    ports:
      - "127.0.0.1:${INTEROP_CHO_MEMBER_PORT:-18025}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDb__ConnectionString: mongodb://interop-mongo:27017
      MongoDb__DatabaseName: InteropMemberDB
    depends_on:
      interop-mongo:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  cho-coverage-service:
    build:
      context: ..
      dockerfile: src/services/coverage-service/Dockerfile
      args:
        REGISTRY: ${CHO_IMAGE_REGISTRY:-mcr.microsoft.com}
    profiles: [interop-cho]
    networks: [interop]
    ports:
      - "127.0.0.1:${INTEROP_CHO_COVERAGE_PORT:-18026}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDb__ConnectionString: mongodb://interop-mongo:27017
      MongoDb__DatabaseName: InteropCoverageDB
    depends_on:
      interop-mongo:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  cho-claims-service:
    build:
      context: ..
      dockerfile: src/services/claims-service/Dockerfile
      args:
        REGISTRY: ${CHO_IMAGE_REGISTRY:-mcr.microsoft.com}
    profiles: [interop-cho]
    networks: [interop]
    ports:
      - "127.0.0.1:${INTEROP_CHO_CLAIMS_PORT:-18027}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDb__ConnectionString: mongodb://interop-mongo:27017
      MongoDb__DatabaseName: InteropClaimsDB
    depends_on:
      interop-mongo:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  cho-encounter-service:
    build:
      context: ..
      dockerfile: src/services/encounter-service/Dockerfile
      args:
        REGISTRY: ${CHO_IMAGE_REGISTRY:-mcr.microsoft.com}
    profiles: [interop-cho]
    networks: [interop]
    ports:
      - "127.0.0.1:${INTEROP_CHO_ENCOUNTER_PORT:-18028}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDb__ConnectionString: mongodb://interop-mongo:27017
      MongoDb__DatabaseName: InteropEncounterDB
    depends_on:
      interop-mongo:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  # Practitioner / PractitionerRole / Organization are Hybrid in
  # FhirAdapters:Resources, which means fhir-service proxies them here rather
  # than inventing them (see cho-practitioner-directory). US Core requires
  # resolvable Practitioner references from the EOBs the CARIN BB suites read,
  # so this is not optional for those suites.
  cho-provider-service:
    build:
      context: ..
      dockerfile: src/services/provider-service/Dockerfile
      args:
        REGISTRY: ${CHO_IMAGE_REGISTRY:-mcr.microsoft.com}
    profiles: [interop-cho]
    networks: [interop]
    ports:
      - "127.0.0.1:${INTEROP_CHO_PROVIDER_PORT:-18029}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDb__ConnectionString: mongodb://interop-mongo:27017
      MongoDb__DatabaseName: InteropProviderDB
    depends_on:
      interop-mongo:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  # ── SMART authorization server ────────────────────────────────────────────
  # Previously absent: SmartAuth__Issuer defaulted to http://localhost:18024,
  # where nothing listened, so discovery and JWKS retrieval could not succeed
  # and no Inferno SMART suite could obtain a token. The issuer is the in-network
  # name because that is the address both fhir-service and an Inferno container
  # reach it on; it must be byte-identical on both services, since tokens,
  # discovery and JWKS all name it whatever Host a request arrives with.
  cho-smart-auth-service:
    build:
      context: ..
      dockerfile: src/services/smart-auth-service/Dockerfile
      args:
        REGISTRY: ${CHO_IMAGE_REGISTRY:-mcr.microsoft.com}
    profiles: [interop-cho]
    networks: [interop]
    ports:
      - "127.0.0.1:${INTEROP_SMART_AUTH_PORT:-18024}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDb__ConnectionString: mongodb://interop-mongo:27017
      MongoDb__DatabaseName: InteropSmartAuthDB
      SmartAuth__Issuer: ${INTEROP_SMART_ISSUER:-http://cho-smart-auth-service:8080}
    depends_on:
      interop-mongo:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  cho-fhir-service:
    build:
      context: ..
      dockerfile: src/services/fhir-service/Dockerfile
      args:
        REGISTRY: ${CHO_IMAGE_REGISTRY:-mcr.microsoft.com}
    profiles: [interop-cho]
    networks: [interop]
    ports:
      - "127.0.0.1:${INTEROP_CHO_FHIR_PORT:-18023}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDb__ConnectionString: mongodb://interop-mongo:27017
      MongoDb__DatabaseName: FhirInteropDB
      # Synthetic interoperability identity mode. This is a test-environment
      # configuration value, not a switch that disables authentication: CHO's
      # SMART middleware stays in place and still validates tokens.
      FhirAdapters__Mode: Hybrid
      FhirAdapters__DataClassification: synthetic
      FhirAdapters__TenantId: interop-tenant
      # The bindings that make this the real path. Each needs the matching
      # Services:*Url below; fhir-service refuses to start if one is missing
      # rather than quietly serving the mock.
      FhirAdapters__Sources__Patient: ChoNative
      FhirAdapters__Sources__Coverage: ChoNative
      FhirAdapters__Sources__Encounter: ChoNative
      FhirAdapters__Sources__Claim: ChoNative
      Services__MemberServiceUrl: http://cho-member-service:8080/
      Services__CoverageServiceUrl: http://cho-coverage-service:8080/
      Services__EncounterServiceUrl: http://cho-encounter-service:8080/
      Services__ClaimsServiceUrl: http://cho-claims-service:8080/
      Services__ProviderServiceUrl: http://cho-provider-service:8080/
      # Provider Access attribution from claims history rather than from a
      # configured panel (ADR 028, docs/architecture/provider-access-attribution.md).
      # The Inferno Provider Access suites exercise the attribution decision, so
      # the profile has to make the decision the real way.
      Cms0057__ProviderAttribution__ClaimsHistory__Enabled: "true"
      SmartAuth__Issuer: ${INTEROP_SMART_ISSUER:-http://cho-smart-auth-service:8080}
      SmartAuth__RequireHttpsMetadata: "false"
      Appeals__UseMockAdapter: "true"
    depends_on:
      interop-mongo:
        condition: service_healthy
      cho-member-service:
        condition: service_healthy
      cho-coverage-service:
        condition: service_healthy
      cho-claims-service:
        condition: service_healthy
      cho-encounter-service:
        condition: service_healthy
      cho-provider-service:
        condition: service_healthy
      cho-smart-auth-service:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  # ── Inferno conformance runners ───────────────────────────────────────────
  # Upstream publishes no image for these kits: they are built from a checkout
  # at the pinned tag during explicit setup (scripts/interop/fetch-inferno.sh).
  # The service definitions below describe the shape the runner expects; they
  # are inert until that checkout exists, and no scenario starts them yet.
  inferno-pdex:
    profiles: [interop-pdex]
    networks: [interop]
    build:
      context: ${INTEROP_INFERNO_PDEX_DIR:-./.external/davinci-pdex-test-kit}
    ports:
      - "127.0.0.1:${INTEROP_INFERNO_PDEX_PORT:-14567}:4567"

  inferno-dtr:
    profiles: [interop-dtr-inferno]
    networks: [interop]
    build:
      context: ${INTEROP_INFERNO_DTR_DIR:-./.external/davinci-dtr-test-kit}
    ports:
      - "127.0.0.1:${INTEROP_INFERNO_DTR_PORT:-14568}:4567"

  # The kit that judges Provider Access EOB conformance (gap-matrix G-14).
  # Neither the PDex nor the DTR kit covers CARIN BB. See the knownMismatches
  # entry for this target in interop/versions.json before reading a result from
  # its non-financial suite.
  inferno-c4bb:
    profiles: [interop-c4bb]
    networks: [interop]
    build:
      context: ${INTEROP_INFERNO_C4BB_DIR:-./.external/carin-for-blue-button-test-kit}
    ports:
      - "127.0.0.1:${INTEROP_INFERNO_C4BB_PORT:-14569}:4567"

  inferno-us-core:
    profiles: [interop-us-core]
    networks: [interop]
    build:
      context: ${INTEROP_INFERNO_US_CORE_DIR:-./.external/us-core-test-kit}
    ports:
      - "127.0.0.1:${INTEROP_INFERNO_US_CORE_PORT:-14570}:4567"
