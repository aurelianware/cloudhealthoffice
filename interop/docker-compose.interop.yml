    volumes:
      - inferno_c4bb_data:/opt/inferno/data
    security_opt:
      - no-new-privileges:true

  # The C4BB suites name their IGs by file (`igs 'igs/carin4bb-200.tgz'`), not
  # by package id, because they pin builds the registry does not serve. The
  # validator resolves that path against its own working directory, /app, so
  # the file has to be in the validator's /app/igs. Upstream gets it there with
  # a bind mount; here the kit is built from a checkout, so this one-shot copies
  # the packages the kit ships into the validator's IG volume before the app and
  # worker start. Without it every validation answers 500 "Unable to
  # find/resolve/read -ig igs/carin4bb-200.tgz", which Inferno reports as
  # "Unable to connect to validator" (every C4BB validation test errored that
  # way in run 40937514337).
  inferno-c4bb-igs:
    profiles: [interop-c4bb]
    networks: [interop]
    image: cho-interop/inferno-c4bb:local
    build:
      context: ${INTEROP_INFERNO_C4BB_DIR:-./.external/carin-for-blue-button-test-kit}
    command: ["sh", "-c", "cp lib/carin_for_blue_button_test_kit/igs/*.tgz /validator-igs/ && ls -l /validator-igs"]
    volumes:
      - inferno_validator_igs:/validator-igs
    security_opt:
      - no-new-privileges:true

