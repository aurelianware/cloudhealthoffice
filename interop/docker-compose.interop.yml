# Cloud Health Office — Da Vinci external interoperability stack
#
# Separate from the repository's development stack (docker-compose.yml) on
# purpose: these are third-party reference implementations, they are pinned by
# digest, and no ordinary development or unit-test workflow should start them.
#
# Nothing starts without an explicit profile:
#
#   docker compose -f interop/docker-compose.interop.yml --profile interop-br up -d
#   docker compose -f interop/docker-compose.interop.yml --profile interop-cho up -d
#
# Profiles:
#   interop-br           HL7 br-payer                  (CRD/DTR/PAS payer RI)
#   interop-br-provider  HL7 br-provider               (provider-side RI)
#   interop-cho          CHO native stack + mongo      (CHO as the server under test)
#   interop-pdex         Inferno PDex test kit         (no scenario yet — see docs/interop/davinci.md)
#   interop-dtr-inferno  Inferno DTR test kit          (no scenario yet — see docs/interop/davinci.md)
#   interop-c4bb         Inferno CARIN BB test kit     (INFERNO-C4BB-SERVER-001; judges Provider Access EOBs)
#   interop-us-core      Inferno US Core test kit      (INFERNO-USCORE-SERVER-001; the US Core floor)
#   interop-plan-net     Inferno Plan-Net test kit     (INFERNO-PLANNET-SERVER-001; judges the public Provider Directory)
#   interop-bulk-data    Inferno Bulk Data test kit    (INFERNO-BULK-SERVER-001; judges SMART Backend Services, Group and Patient export)
#
# Normally you do not run this file by hand — `scripts/interop/run.sh` and the
# harness (InteropEnvironment) bring up exactly the services a scenario needs.
#
# Security posture:
#   * No secrets, no repository credentials and no Docker socket are mounted.
#   * External containers sit on their own bridge network, isolated from the
#     development stack's network.
#   * Host ports are bound to 127.0.0.1 so nothing is published off-box.
#   * Every byte of data these services see is synthetic (SyntheticInteropData).
#
# Egress: br-payer and br-provider download Da Vinci IG packages from
# packages2.fhir.org at startup and do not boot without it. No VSAC or other
# licensed terminology credential is required for the scenarios in this file.

name: cho-interop

# Every Inferno kit app and worker waits for the shared sidecars to be healthy.
# Each also waits for its own kit's migrate service; see the Inferno section.
x-inferno-depends: &inferno-depends
  inferno-redis:
    condition: service_healthy
  inferno-validator:
    condition: service_healthy

networks:
  interop:
    name: cho-interop
    driver: bridge

volumes:
  interop_mongo_data:
  # One per kit: the app and its worker share a SQLite database, and each kit
  # has its own schema and migrations.
  inferno_pdex_data:
  inferno_dtr_data:
  inferno_c4bb_data:
  inferno_us_core_data:
  inferno_plan_net_data:
  inferno_bulk_data_data:
  inferno_redis_data:
  inferno_validator_igs:

services:

  # ── HL7 Da Vinci Burden Reduction payer reference implementation ──────────
  # Pinned by digest (interop/versions.json → targets[br-payer]).
  # Upstream: https://github.com/HL7-DaVinci/br-payer (Apache-2.0)
  br-payer:
    image: hlseven/davinci-br-payer@sha256:6074aebc39929a00cf93c1efa28c227eb46aab2418afa208eb293133cb150d8c
    # IG registry retrieval can fail during boot. Retry error exits at most twice;
    # the harness still requires ApplicationReady within its original deadline.
    restart: on-failure:2
    profiles: [interop-br]
    networks: [interop]
    ports:
      - "127.0.0.1:${INTEROP_BR_PAYER_PORT:-18081}:8081"
    environment:
      # Advertise the address the harness reaches the server on, so the RI's
      # self-referential URLs (fullUrl, next-question-url) match reality.
      - HAPI_FHIR_SERVER_ADDRESS=http://localhost:${INTEROP_BR_PAYER_PORT:-18081}/fhir
    security_opt:
      - no-new-privileges:true

  # ── HL7 Da Vinci Burden Reduction provider reference implementation ───────
  # Upstream: https://github.com/HL7-DaVinci/br-provider (MIT)
  # Defined for the provider-side role; no scenario drives it yet.
  br-provider:
    image: hlseven/davinci-br-provider@sha256:6ddcea188bfc38cb8a2bf3e5bbda7f290970a659d2be3b85182d305565e9b74a
    profiles: [interop-br-provider]
    networks: [interop]
    ports:
      - "127.0.0.1:${INTEROP_BR_PROVIDER_PORT:-18080}:8080"
    security_opt:
      - no-new-privileges:true

  # ── Cloud Health Office under test ────────────────────────────────────────
  # Only needed by scenarios where CHO is the *server* (the Inferno suites).
  # Kept behind its own profile so the br-payer smoke path stays light.
  #
  # This profile serves CHO's real path, not the synthetic mock: fhir-service
  # binds Patient, Coverage, Encounter and Claim to ChoNative
  # (FhirAdapters:Sources, ADR 018/024), so every resource an Inferno suite
  # reads is projected by the service that owns it. A mock-backed profile would
  # certify the mock. The data is still synthetic — it is seeded into these
  # services' own stores, which is what DataClassification=synthetic records.
  #
  # Mode is Hybrid rather than Demo because that is what the bindings make true:
  # Demo is the honest label only while the mock serves these resources.
  # A single-node replica set, not a standalone mongod: coverage-service writes
  # every coverage change inside a Mongo transaction (the PCP roster fence,
  # #1547) and answers 503 PCP_PANEL_UNAVAILABLE when transactions are not
  # supported, which a standalone server never does. The healthcheck initiates
  # the set on first run and reports healthy only once this node is primary,
  # so no CHO service connects before transactions work. The connection strings
  # below need no replicaSet parameter: the driver discovers the set from the
  # one seed.
  interop-mongo:
    image: mongo:7
    profiles: [interop-cho]
    networks: [interop]
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - interop_mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'interop-mongo:27017' }] }) };
          if (!db.hello().isWritablePrimary) { quit(1) }
      interval: 5s
      timeout: 5s
      retries: 24

  # ── CHO domain services behind the FHIR projection ────────────────────────
  # One mongod, one database per service, exactly as docker-compose.yml splits
  # them, so a service cannot read another's collections by accident.
  #
  # Each runs ASPNETCORE_ENVIRONMENT=Development, which loads its own
  # appsettings.Development.json: the development issuers (cho-portal-dev,
  # cho-internal-dev) and this service's own ChoAuth:ServiceToken. That is what
  # lets fhir-service authenticate its calls here. The keys are the public
  # development symmetric key, refused on any host that is not Development or
  # Testing (ChoAuthOptions.Validate), so this is a test configuration and not
  # an authentication bypass — the same posture section 10 of
  # docs/interop/davinci.md states for the FHIR server itself.
  cho-member-service:
    build:
      context: ..
      dockerfile: src/services/member-service/Dockerfile
      args:
        REGISTRY: ${CHO_IMAGE_REGISTRY:-mcr.microsoft.com}
    profiles: [interop-cho]
    networks: [interop]
    ports:
      - "127.0.0.1:${INTEROP_CHO_MEMBER_PORT:-18025}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDb__ConnectionString: mongodb://interop-mongo:27017
      MongoDb__DatabaseName: InteropMemberDB
    depends_on:
      interop-mongo:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  cho-coverage-service:
    build:
      context: ..
      dockerfile: src/services/coverage-service/Dockerfile
      args:
        REGISTRY: ${CHO_IMAGE_REGISTRY:-mcr.microsoft.com}
    profiles: [interop-cho]
    networks: [interop]
    ports:
      - "127.0.0.1:${INTEROP_CHO_COVERAGE_PORT:-18026}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDb__ConnectionString: mongodb://interop-mongo:27017
      MongoDb__DatabaseName: InteropCoverageDB
    depends_on:
      interop-mongo:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  cho-claims-service:
    build:
      context: ..
      dockerfile: src/services/claims-service/Dockerfile
      args:
        REGISTRY: ${CHO_IMAGE_REGISTRY:-mcr.microsoft.com}
    profiles: [interop-cho]
    networks: [interop]
    ports:
      - "127.0.0.1:${INTEROP_CHO_CLAIMS_PORT:-18027}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDb__ConnectionString: mongodb://interop-mongo:27017
      MongoDb__DatabaseName: InteropClaimsDB
    depends_on:
      interop-mongo:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  cho-encounter-service:
    build:
      context: ..
      dockerfile: src/services/encounter-service/Dockerfile
      args:
        REGISTRY: ${CHO_IMAGE_REGISTRY:-mcr.microsoft.com}
    profiles: [interop-cho]
    networks: [interop]
    ports:
      - "127.0.0.1:${INTEROP_CHO_ENCOUNTER_PORT:-18028}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDb__ConnectionString: mongodb://interop-mongo:27017
      MongoDb__DatabaseName: InteropEncounterDB
    depends_on:
      interop-mongo:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  # fhir-service reads the prior-authorization ExplanationOfBenefit projection
  # (G-31) from here, and Bulk Data $export writes it into every
  # ExplanationOfBenefit file. Without it the export worker's call failed on
  # DNS (fhir-service's default URL names the cluster service), every export
  # job ended in error, and the Bulk Data kit's status polls got 500
  # (run 40970129547). No port is published: only fhir-service calls it.
  cho-authorization-service:
    build:
      context: ..
      dockerfile: src/services/authorization-service/Dockerfile
      args:
        REGISTRY: ${CHO_IMAGE_REGISTRY:-mcr.microsoft.com}
    profiles: [interop-cho]
    networks: [interop]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDb__ConnectionString: mongodb://interop-mongo:27017
      MongoDb__DatabaseName: InteropAuthorizationDB
    depends_on:
      interop-mongo:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  # Practitioner / PractitionerRole / Organization are Hybrid in
  # FhirAdapters:Resources, which means fhir-service proxies them here rather
  # than inventing them (see cho-practitioner-directory). US Core requires
  # resolvable Practitioner references from the EOBs the CARIN BB suites read,
  # so this is not optional for those suites.
  cho-provider-service:
    build:
      context: ..
      dockerfile: src/services/provider-service/Dockerfile
      args:
        REGISTRY: ${CHO_IMAGE_REGISTRY:-mcr.microsoft.com}
    profiles: [interop-cho]
    networks: [interop]
    ports:
      - "127.0.0.1:${INTEROP_CHO_PROVIDER_PORT:-18029}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDb__ConnectionString: mongodb://interop-mongo:27017
      MongoDb__DatabaseName: InteropProviderDB
    depends_on:
      interop-mongo:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  # InsurancePlan and Endpoint for the public Provider Directory (G-36): the
  # Plan-Net directory fhir-service publishes reads them here, alongside the
  # networks and providers it reads from cho-provider-service. benefit-plan-
  # service needs Redis, so the profile carries its own rather than borrowing
  # the kits' queue.
  interop-redis:
    profiles: [interop-cho]
    networks: [interop]
    # redis:7-alpine, the digest inferno-redis pins.
    image: redis@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  cho-benefit-plan-service:
    build:
      context: ..
      dockerfile: src/services/benefit-plan-service/Dockerfile
      args:
        REGISTRY: ${CHO_IMAGE_REGISTRY:-mcr.microsoft.com}
    profiles: [interop-cho]
    networks: [interop]
    ports:
      - "127.0.0.1:${INTEROP_CHO_BENEFIT_PLAN_PORT:-18030}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDb__ConnectionString: mongodb://interop-mongo:27017
      MongoDb__DatabaseName: InteropBenefitPlanDB
      Redis__ConnectionString: interop-redis:6379
      Services__ClaimsServiceUrl: http://cho-claims-service:8080/
      Services__ProviderServiceUrl: http://cho-provider-service:8080/
      # The seeded plan's document link (published as a Plan-Net Endpoint) is
      # an https URL on this host; nothing ever fetches it. A reserved .invalid
      # host rather than example.org, which the HL7 validator refuses in an
      # Endpoint address. Must match the location in interop/cho-seed.json.
      BenefitPlan__AllowedDocumentHosts__0: plan-documents.invalid
    depends_on:
      interop-mongo:
        condition: service_healthy
      interop-redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  # ── SMART authorization server ────────────────────────────────────────────
  # Previously absent: SmartAuth__Issuer defaulted to http://localhost:18024,
  # where nothing listened, so discovery and JWKS retrieval could not succeed
  # and no Inferno SMART suite could obtain a token. The issuer is the in-network
  # name because that is the address both fhir-service and an Inferno container
  # reach it on; it must be byte-identical on both services, since tokens,
  # discovery and JWKS all name it whatever Host a request arrives with.
  cho-smart-auth-service:
    build:
      context: ..
      dockerfile: src/services/smart-auth-service/Dockerfile
      args:
        REGISTRY: ${CHO_IMAGE_REGISTRY:-mcr.microsoft.com}
    profiles: [interop-cho]
    networks: [interop]
    ports:
      - "127.0.0.1:${INTEROP_SMART_AUTH_PORT:-18024}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDb__ConnectionString: mongodb://interop-mongo:27017
      MongoDb__DatabaseName: InteropSmartAuthDB
      SmartAuth__Issuer: ${INTEROP_SMART_ISSUER:-http://cho-smart-auth-service:8080}
      # No SmartAuth:SigningCertificates here, so OpenIddict makes development
      # signing and encryption certificates and saves them to the current
      # user's X509 store under $HOME. The image's appuser is a system account
      # with no home directory, so that save failed with "Access to the path
      # '/home/appuser' is denied" and every token request answered 500. /tmp
      # is writable and dies with the container, which is all a development
      # certificate needs.
      HOME: /tmp
    depends_on:
      interop-mongo:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  cho-fhir-service:
    build:
      context: ..
      dockerfile: src/services/fhir-service/Dockerfile
      args:
        REGISTRY: ${CHO_IMAGE_REGISTRY:-mcr.microsoft.com}
    profiles: [interop-cho]
    networks: [interop]
    ports:
      - "127.0.0.1:${INTEROP_CHO_FHIR_PORT:-18023}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDb__ConnectionString: mongodb://interop-mongo:27017
      MongoDb__DatabaseName: FhirInteropDB
      # Synthetic interoperability identity mode. This is a test-environment
      # configuration value, not a switch that disables authentication: CHO's
      # SMART middleware stays in place and still validates tokens.
      FhirAdapters__Mode: Hybrid
      FhirAdapters__DataClassification: synthetic
      FhirAdapters__TenantId: interop-tenant
      # The bindings that make this the real path. Each needs the matching
      # Services:*Url below; fhir-service refuses to start if one is missing
      # rather than quietly serving the mock.
      FhirAdapters__Sources__Patient: ChoNative
      FhirAdapters__Sources__Coverage: ChoNative
      FhirAdapters__Sources__Encounter: ChoNative
      FhirAdapters__Sources__Claim: ChoNative
      Services__MemberServiceUrl: http://cho-member-service:8080/
      Services__CoverageServiceUrl: http://cho-coverage-service:8080/
      Services__EncounterServiceUrl: http://cho-encounter-service:8080/
      Services__ClaimsServiceUrl: http://cho-claims-service:8080/
      Services__ProviderServiceUrl: http://cho-provider-service:8080/
      Services__BenefitPlanServiceUrl: http://cho-benefit-plan-service:8080/
      Services__AuthorizationServiceUrl: http://cho-authorization-service:8080/
      # The public Plan-Net Provider Directory (G-36) INFERNO-PLANNET-SERVER-001
      # judges, at /fhir/r4/directory/interop. The id must match
      # ChoUnderTest.PublicDirectoryId. The payer is the plan's own synthetic
      # Organization; Plan-Net requires it to carry an address.
      PublicProviderDirectory__Directories__interop: interop-tenant
      PublicProviderDirectory__Payers__interop__Name: Interop Health Plan (synthetic)
      PublicProviderDirectory__Payers__interop__Phone: 555-0199
      PublicProviderDirectory__Payers__interop__Website: https://example.org/interop-health-plan
      PublicProviderDirectory__Payers__interop__AddressLine: 1 Synthetic Way
      PublicProviderDirectory__Payers__interop__City: Springfield
      PublicProviderDirectory__Payers__interop__State: FL
      PublicProviderDirectory__Payers__interop__PostalCode: "32401"
      # The kit issues several hundred searches from one address in a few
      # minutes; the production default (300 a minute) would throttle the
      # conformance run rather than test it.
      PublicProviderDirectory__PermitPerMinute: "100000"
      # Provider Access attribution from claims history rather than from a
      # configured panel (ADR 028, docs/architecture/provider-access-attribution.md).
      # The Inferno Provider Access suites exercise the attribution decision, so
      # the profile has to make the decision the real way.
      Cms0057__ProviderAttribution__ClaimsHistory__Enabled: "true"
      SmartAuth__Issuer: ${INTEROP_SMART_ISSUER:-http://cho-smart-auth-service:8080}
      SmartAuth__RequireHttpsMetadata: "false"
      # The bundled issuer serves this tenant. appsettings.Development.json
      # confines it to demo-tenant, which would refuse every SMART token here.
      SmartAuth__Tenants__0: interop-tenant
      # Bulk export (G-60) for INFERNO-BULK-SERVER-001: Group and Patient
      # $export, with the export files held in memory. Production keeps them in
      # a document store; the files a kit downloads are the same either way.
      BulkExport__Enabled: "true"
      BulkExport__DocumentStore__Provider: InMemory
      Appeals__UseMockAdapter: "true"
    depends_on:
      interop-mongo:
        condition: service_healthy
      cho-member-service:
        condition: service_healthy
      cho-coverage-service:
        condition: service_healthy
      cho-claims-service:
        condition: service_healthy
      cho-encounter-service:
        condition: service_healthy
      cho-provider-service:
        condition: service_healthy
      cho-benefit-plan-service:
        condition: service_healthy
      cho-authorization-service:
        condition: service_healthy
      cho-smart-auth-service:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  # ── Inferno conformance runners ───────────────────────────────────────────
  # Upstream publishes no image for these kits: they are built from a checkout
  # at the pinned tag during explicit setup (scripts/interop/fetch-inferno.sh).
  #
  # A kit is not one container. Upstream's own docker-compose.yml at each pinned
  # tag runs five services, and four of them are load-bearing:
  #
  #   inferno                the web app and JSON API the harness drives
  #   worker                 `bundle exec sidekiq -r ./worker.rb`; Inferno queues
  #                          every test run through it, so without the worker a
  #                          run is accepted and never executes
  #   redis                  the queue itself
  #   hl7_validator_service  the FHIR validator; the suite's verdict IS its output
  #   nginx                  a browser-side proxy only (`location /` forwards to
  #                          inferno:4567, `/hl7validatorapi/` to the validator).
  #                          The harness talks to the app directly, so it is the
  #                          one upstream service deliberately not reproduced.
  #
  # Each app also needs a writable data directory: config/database.yml at every
  # pinned tag puts the SQLite database at `data/inferno_production.db`, relative
  # to the image's WORKDIR of /opt/inferno. The app and the worker must see the
  # same file, which is what the shared named volume below is for. Without it
  # both containers die on boot with SQLite3::CantOpenException, which is how
  # these profiles behaved before this wiring existed.
  #
  # A writable file is not yet a usable database. Inferno does not create its
  # schema on boot: upstream's setup.sh runs `bundle exec inferno migrate` once
  # before `docker compose up`, and without it both containers die on their
  # first query with `SQLite3::SQLException: no such table: headers`. That is
  # how every nightly run from 2026-10-24 to 2026-10-28 failed. Each kit
  # therefore has a one-shot `<kit>-migrate` service on the same volume, and
  # its app and worker start only after it exits 0
  # (service_completed_successfully), so they never race each other to create
  # the schema. The migration is idempotent, so a reused volume is harmless.
  #
  # The app and the worker reach redis and the validator by the addresses in
  # each kit's own .env.production (REDIS_URL, FHIR_RESOURCE_VALIDATOR_URL).
  # Inferno loads that file with Dotenv.load, which does not overwrite a variable
  # already set in the environment, so the `environment:` blocks below redirect
  # both to the shared sidecars rather than to upstream's `redis` and
  # `hl7_validator_service` hostnames. Nothing is guessed: the variable names and
  # the port were read out of the kits at their pinned tags.
  #
  # One redis and one validator serve every kit profile. Exactly one kit
  # profile is ever started at a time — a scenario names a single external
  # target — and teardown is `down --volumes`, so no state crosses between kits.

  inferno-pdex-migrate:
    profiles: [interop-pdex]
    networks: [interop]
    image: cho-interop/inferno-pdex:local
    build:
      context: ${INTEROP_INFERNO_PDEX_DIR:-./.external/davinci-pdex-test-kit}
    command: ["bundle", "exec", "inferno", "migrate"]
    volumes:
      - inferno_pdex_data:/opt/inferno/data
    security_opt:
      - no-new-privileges:true

  inferno-pdex:
    profiles: [interop-pdex]
    networks: [interop]
    image: cho-interop/inferno-pdex:local
    build:
      context: ${INTEROP_INFERNO_PDEX_DIR:-./.external/davinci-pdex-test-kit}
    environment: &inferno-sidecars
      REDIS_URL: redis://inferno-redis:6379/0
      FHIR_RESOURCE_VALIDATOR_URL: http://inferno-validator:3500
      # The kits' own switch for their TLS version tests (tls-test-kit 1.0.2 in
      # every kit pinned here): they report "omit" instead of failing. The
      # interop network is plain HTTP, so they could only fail here, and a
      # failure would say nothing about CHO; in a deployment TLS ends at the
      # ingress. Hosted Inferno passed them against the GKE demo on 2026-10-29
      # (docs/deploy/GCP-CONFORMANCE-TESTING.md, G-60).
      INFERNO_DISABLE_TLS_TEST: "true"
    volumes:
      - inferno_pdex_data:/opt/inferno/data
    ports:
      - "127.0.0.1:${INTEROP_INFERNO_PDEX_PORT:-14567}:4567"
    depends_on:
      <<: *inferno-depends
      inferno-pdex-migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  inferno-pdex-worker:
    profiles: [interop-pdex]
    networks: [interop]
    image: cho-interop/inferno-pdex:local
    build:
      context: ${INTEROP_INFERNO_PDEX_DIR:-./.external/davinci-pdex-test-kit}
    command: ["bundle", "exec", "sidekiq", "-r", "./worker.rb"]
    environment: *inferno-sidecars
    volumes:
      - inferno_pdex_data:/opt/inferno/data
    depends_on:
      <<: *inferno-depends
      inferno-pdex-migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  inferno-dtr-migrate:
    profiles: [interop-dtr-inferno]
    networks: [interop]
    image: cho-interop/inferno-dtr:local
    build:
      context: ${INTEROP_INFERNO_DTR_DIR:-./.external/davinci-dtr-test-kit}
    command: ["bundle", "exec", "inferno", "migrate"]
    volumes:
      - inferno_dtr_data:/opt/inferno/data
    security_opt:
      - no-new-privileges:true

  inferno-dtr:
    profiles: [interop-dtr-inferno]
