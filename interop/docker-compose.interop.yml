  # ── Shared sidecars for the kit profiles ──────────────────────────────────
  # Both carry every kit profile, so starting a kit starts them and nothing
  # else does. Pinned by digest for the same reason the reference
  # implementations are: the validator's output IS the conformance verdict, so a
  # floating tag would mean the verdict could change without a reviewable diff.
  inferno-redis:
    profiles: [interop-pdex, interop-dtr-inferno, interop-c4bb, interop-us-core, interop-plan-net, interop-bulk-data]
    networks: [interop]
    # redis:7-alpine, resolved on 2026-10-23. Upstream's own compose uses a
    # floating `redis`; the queue's exact version does not affect a verdict, but
    # an unpinned image in this file would still be a reproducibility hole.
    image: redis@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - inferno_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  inferno-validator:
    profiles: [interop-pdex, interop-dtr-inferno, interop-c4bb, interop-us-core, interop-plan-net, interop-bulk-data]
    networks: [interop]
    # infernocommunity/inferno-resource-validator:latest, resolved on
    # 2026-10-23. This is the service each suite's `fhir_resource_validator`
    # block calls, so its version is part of any result read from these kits.
    image: infernocommunity/inferno-resource-validator@sha256:92ec7a22e3c6f4cdf5eed9db210150a93531034e100c7521e4930c975b3c9058
    environment:
      # Upstream's value: negative means a validator session never expires, so a
      # long suite run does not lose its loaded IG packages halfway through.
      SESSION_CACHE_DURATION: "-1"
    volumes:
      # The IG packages each suite asks for are downloaded here at first use.
      # The volume is removed at teardown, so every run starts from a clean
      # package cache rather than one a previous run left behind.
      - inferno_validator_igs:/app/igs
    # Upstream ships no healthcheck for this image, and a kit that starts before
    # the validator answers reports errors against CHO that are not CHO's. The
    # image carries curl, and the service answers `GET /validator/version` with
    # 200 and a JSON body once it is serving, so `depends_on: service_healthy`
    # can hold the kit back until it does. What this does NOT prove is that the
    # IG packages a suite needs are cached: those are fetched per validator
    # session at first use. That fetch is synchronous, so it makes the first
    # validation of a run slow rather than wrong.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3500/validator/version"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    security_opt:
      - no-new-privileges:true
